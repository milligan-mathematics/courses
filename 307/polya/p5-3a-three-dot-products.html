<script>window.POLYA = {"slug": "p5-3a-three-dot-products", "title": "5.3 Problem A: Three dot products, no system", "statement": "Let \\(\\mathbf f_1=\\begin{bmatrix}1\\\\1\\\\1\\end{bmatrix}\\), \\(\\mathbf f_2=\\begin{bmatrix}1\\\\-2\\\\1\\end{bmatrix}\\), \\(\\mathbf f_3=\\begin{bmatrix}1\\\\0\\\\-1\\end{bmatrix}\\), and \\(\\mathbf x=\\begin{bmatrix}1\\\\3\\\\0\\end{bmatrix}\\) in \\(\\mathbb R^3\\). Find \\(c_1\\), \\(c_2\\), and \\(c_3\\) so that \\(\\mathbf x=c_1\\mathbf f_1+c_2\\mathbf f_2+c_3\\mathbf f_3\\).", "questions": [{"phase": "Understand", "type": "write", "text": "In your own words, what is this problem asking for?", "model": "<p>It asks for the three numbers \\(c_1\\), \\(c_2\\), and \\(c_3\\) that make \\(\\mathbf x\\) equal to \\(c_1\\mathbf f_1+c_2\\mathbf f_2+c_3\\mathbf f_3\\). Written out, that is three equations in three unknowns. Row reduction would solve it, but the vectors might be special in a way that makes the work easier.<\/p>"}, {"phase": "Understand", "type": "mc", "text": "Before you compute anything: what does it mean for \\(\\mathbf f_1\\), \\(\\mathbf f_2\\), and \\(\\mathbf f_3\\) to be an orthogonal set?", "answers": [{"html": "Every pair of different vectors has dot product \\(0\\), and none of the vectors is the zero vector.", "ok": true, "comment": "Right. That is the definition, so every pair counts, and no vector can be zero. The vectors do not need length \\(1\\); unit length is the extra condition that makes a set orthonormal."}, {"html": "Every vector has length \\(1\\).", "ok": false, "comment": "Not quite. That describes an orthonormal set. Orthogonal asks only for dot products of \\(0\\) between different vectors, so the lengths can be any positive numbers."}, {"html": "Every dot product is \\(0\\), including each vector with itself.", "ok": false, "comment": "Not quite. A vector’s dot product with itself is its squared length, which is positive for a nonzero vector. Only dot products between different vectors have to be \\(0\\)."}, {"html": "Only the neighboring pairs in the list have dot product \\(0\\): \\(\\mathbf f_1\\) with \\(\\mathbf f_2\\), and \\(\\mathbf f_2\\) with \\(\\mathbf f_3\\).", "ok": false, "comment": "Not quite. Checking two of the three pairs is not enough. The definition needs every pair of different vectors, including \\(\\mathbf f_1\\) and \\(\\mathbf f_3\\), which are not neighbors in the list."}]}, {"phase": "Plan", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> We want the three numbers \\(c_1\\), \\(c_2\\), and \\(c_3\\) with \\(\\mathbf x=c_1\\mathbf f_1+c_2\\mathbf f_2+c_3\\mathbf f_3\\), and we have pinned down what an orthogonal set means.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 2: Plan."}, {"phase": "Plan", "type": "write", "text": "Before you start, write your plan in 1–3 sentences: which method, and which step needs care?", "model": "<p>Confirm that the set is orthogonal by checking all three pairs of dot products: \\(\\mathbf f_1\\) with \\(\\mathbf f_2\\), \\(\\mathbf f_1\\) with \\(\\mathbf f_3\\), and \\(\\mathbf f_2\\) with \\(\\mathbf f_3\\). Then use the Expansion Theorem: each \\(c_i\\) is \\(\\mathbf x\\cdot\\mathbf f_i\\) divided by \\(\\|\\mathbf f_i\\|^2\\). The step that needs care is the squared length, since dividing by \\(\\|\\mathbf f_i\\|\\) is an easy slip.<\/p>"}, {"phase": "Carry out", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: check that all three pairs of vectors have dot product \\(0\\). Then use the Expansion Theorem. Its coefficients, the Fourier coefficients, are \\(c_i=\\dfrac{\\mathbf x\\cdot\\mathbf f_i}{\\|\\mathbf f_i\\|^2}\\), where \\(\\|\\mathbf f_i\\|^2=\\mathbf f_i\\cdot\\mathbf f_i\\).<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 3: Carry out."}, {"phase": "Carry out", "type": "mc", "text": "Confirm that the set is orthogonal. What is \\(\\mathbf f_1\\cdot\\mathbf f_3\\)?", "answers": [{"html": "\\(0\\)", "ok": true, "comment": "Right: \\(1\\cdot 1+1\\cdot 0+1\\cdot(-1)=0\\). So \\(\\mathbf f_1\\) and \\(\\mathbf f_3\\) are orthogonal. The other two pairs get the same check."}, {"html": "\\(1\\)", "ok": false, "comment": "Not quite. That leaves out the last product, \\(1\\cdot(-1)\\). A dot product has one product for each entry, and all three count."}, {"html": "\\(2\\)", "ok": false, "comment": "Not quite. Check the last entry of \\(\\mathbf f_3\\). It is \\(-1\\), so the last product is \\(-1\\), not \\(+1\\)."}, {"html": "\\(3\\)", "ok": false, "comment": "Not quite. That adds the entries of \\(\\mathbf f_1\\) and ignores \\(\\mathbf f_3\\). A dot product multiplies matching entries in pairs, then adds."}]}, {"phase": "Carry out", "type": "mc", "text": "Now find the coefficients. Which triple is \\((c_1,c_2,c_3)\\)?", "answers": [{"html": "\\(\\left(\\tfrac43,\\ \\tfrac56,\\ \\tfrac12\\right)\\)", "ok": false, "comment": "Not quite. Check the sign of \\(\\mathbf x\\cdot\\mathbf f_2\\). It is \\(1-6+0=-5\\), so \\(c_2\\) is negative, and the minus sign has to stay."}, {"html": "\\(\\left(\\dfrac{4}{\\sqrt3},\\ -\\dfrac{5}{\\sqrt6},\\ \\dfrac{1}{\\sqrt2}\\right)\\)", "ok": false, "comment": "Not quite. You divided by the length \\(\\|\\mathbf f_i\\|\\). The expansion divides by the squared length \\(\\|\\mathbf f_i\\|^2\\), which is a whole number here: \\(3\\), \\(6\\), and \\(2\\)."}, {"html": "\\(\\left(4,\\ -5,\\ 1\\right)\\)", "ok": false, "comment": "Not quite. You used the dot products without dividing. That only works when every vector has length \\(1\\), and these vectors don’t."}, {"html": "\\(\\left(\\tfrac43,\\ -\\tfrac56,\\ \\tfrac12\\right)\\)", "ok": true, "comment": "Right. \\(\\mathbf x\\cdot\\mathbf f_1=4\\) and \\(\\|\\mathbf f_1\\|^2=3\\), so \\(c_1=\\tfrac43\\). Likewise \\(\\mathbf x\\cdot\\mathbf f_2=-5\\) and \\(\\|\\mathbf f_2\\|^2=6\\) give \\(c_2=-\\tfrac56\\), and \\(\\mathbf x\\cdot\\mathbf f_3=1\\) with \\(\\|\\mathbf f_3\\|^2=2\\) gives \\(c_3=\\tfrac12\\)."}]}, {"phase": "Look back", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The answer is \\(c_1=\\tfrac43\\), \\(c_2=-\\tfrac56\\), and \\(c_3=\\tfrac12\\).<\/p><p>Last phase: <strong>look back<\/strong>. Check the answer your own way, then think about what changes when the basis does.<\/p>", "cta": "Got it. On to Phase 4: Look back."}, {"phase": "Look back", "type": "write", "text": "Choose a check of your own and carry it out. What did you check, and did it pass?", "model": "<p>I multiplied the answer back out: \\(\\tfrac43\\mathbf f_1-\\tfrac56\\mathbf f_2+\\tfrac12\\mathbf f_3\\) should equal \\(\\mathbf x\\). Adding the three scaled vectors entry by entry gives \\((1,3,0)\\), which is \\(\\mathbf x\\), so the check passed.<\/p>"}, {"phase": "Look back", "type": "mc", "text": "Now change the basis. Replace \\(\\mathbf f_1\\) by \\(2\\mathbf f_1\\), and keep \\(\\mathbf x\\), \\(\\mathbf f_2\\), and \\(\\mathbf f_3\\) the same. What happens to the coefficients?", "answers": [{"html": "Only \\(c_1\\) changes. It is divided by \\(4\\).", "ok": false, "comment": "Not quite. The dot product doubles too. Only the squared length grows by \\(4\\), so the net change is a factor of \\(\\tfrac12\\)."}, {"html": "Only \\(c_1\\) changes. It is halved, to \\(\\tfrac23\\), and \\(c_2\\) and \\(c_3\\) stay the same.", "ok": true, "comment": "Right. The dot product \\(\\mathbf x\\cdot 2\\mathbf f_1\\) doubles, but \\(\\|2\\mathbf f_1\\|^2\\) is four times \\(\\|\\mathbf f_1\\|^2\\), so \\(c_1\\) is halved. The formulas for \\(c_2\\) and \\(c_3\\) use only their own vectors, and those did not change."}, {"html": "Only \\(c_1\\) changes. It is doubled.", "ok": false, "comment": "Not quite. The dot product doubles, but the squared length grows by \\(4\\), so the coefficient gets smaller, not larger."}, {"html": "All three change, because the basis changed.", "ok": false, "comment": "Not quite. Orthogonality keeps the coefficients apart: \\(c_2\\) comes only from \\(\\mathbf x\\cdot\\mathbf f_2\\) and \\(\\|\\mathbf f_2\\|^2\\), and neither changed, so \\(c_2\\) stays \\(-\\tfrac56\\)."}]}, {"phase": "Look back", "type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate wrote \\(\\mathbf x=4\\mathbf f_1-5\\mathbf f_2+\\mathbf f_3\\) for this problem, using the three dot products as the coefficients. What step did they skip? Then name one habit from this problem you want to use on the next one.<\/p>"}]};</script>
