<script>window.POLYA = {"slug": "p3-3a-stretch-directions", "title": "3.3 Problem A: Directions that only stretch", "statement": "Let \\(\\begin{bmatrix}1&3\\\\2&2\\end{bmatrix}\\). Find all eigenvalues of \\(A\\), and a basic eigenvector for each one. (Any nonzero multiple of a basic eigenvector is also an eigenvector for the same eigenvalue.)", "questions": [{"type": "write", "text": "In your own words, what is this problem asking for?", "phase": "Understand", "model": "<p>It asks for every number \\(\\lambda\\) for which \\(A\\mathbf x=\\lambda\\mathbf x\\) has a solution with \\(\\mathbf x\\neq\\mathbf 0\\). Then, for each such \\(\\lambda\\), it asks for one nonzero \\(\\mathbf x\\), a basic eigenvector. So there are two parts: the eigenvalues first, then one eigenvector for each.<\/p>"}, {"type": "mc", "text": "What would a finished answer to this problem look like?", "phase": "Understand", "answers": [{"html": "The determinant \\(\\det A\\), since that is the eigenvalue.", "ok": false, "comment": "The determinant is one number, and it isn’t an eigenvalue of this matrix. An eigenvalue needs \\(A\\mathbf x=\\lambda\\mathbf x\\) with \\(\\mathbf x\\neq\\mathbf 0\\), and \\(A\\mathbf x=-4\\mathbf x\\) has only the zero solution."}, {"html": "All the eigenvalues of \\(A\\), and for each one the zero vector, since \\(A\\mathbf 0=\\lambda\\mathbf 0\\) is always true.", "ok": false, "comment": "The zero vector does satisfy \\(A\\mathbf x=\\lambda\\mathbf x\\) every time, but eigenvectors have to be nonzero. If \\(\\mathbf 0\\) counted, every number would be an eigenvalue."}, {"html": "The one number \\(\\lambda\\) with \\(A\\mathbf x=\\lambda\\mathbf x\\), together with its eigenvector.", "ok": false, "comment": "A matrix can have more than one eigenvalue, and each one has its own eigenvector. Looking for just one number misses the others."}, {"html": "All the eigenvalues of \\(A\\), and for each one a basic eigenvector: a nonzero \\(\\mathbf x\\) with \\(A\\mathbf x=\\lambda\\mathbf x\\).", "ok": true, "comment": "Each eigenvalue gets its own eigenvector, and that eigenvector has to be nonzero. The condition \\(A\\mathbf x=\\lambda\\mathbf x\\) is what links the two parts."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> We need two things: every eigenvalue of \\(A\\), and a basic eigenvector for each one. Each eigenvector belongs to one of those eigenvalues.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "phase": "Plan", "cta": "Got it. On to Phase 2: Plan."}, {"type": "write", "text": "Before you start, write your plan in 1–3 sentences: which method, and which step needs care?", "phase": "Plan", "model": "<p>Find \\(\\det(xI-A)\\), factor it, and read the roots as the eigenvalues. For each eigenvalue \\(\\lambda\\), row-reduce \\((\\lambda I-A)\\mathbf x=\\mathbf 0\\) and take a nonzero solution as the basic eigenvector. The step that needs care is the signs in \\(\\lambda I-A\\): a sign slip gives a vector that isn’t an eigenvector.<\/p>"}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: find \\(\\det(xI-A)\\), factor it, and read off the eigenvalues. Then, for each eigenvalue, solve \\((\\lambda I-A)\\mathbf x=\\mathbf 0\\) for a nonzero \\(\\mathbf x\\). We start with the characteristic polynomial.<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "mc", "text": "What is the characteristic polynomial \\(c_A(x)=\\det(xI-A)\\) of \\(A\\)?", "phase": "Carry out", "answers": [{"html": "\\(-x-4\\)", "ok": false, "comment": "You computed \\(\\det A-x\\), which is \\(-4-x\\). The \\(x\\) belongs inside the determinant, on the diagonal of \\(xI-A\\)."}, {"html": "\\(x^2+3x-4\\)", "ok": false, "comment": "You used \\(xI+A\\) instead of \\(xI-A\\). Adding \\(A\\) flips the sign of the middle term, so the roots come out wrong."}, {"html": "\\(x^2-3x-4\\)", "ok": true, "comment": "Here \\(xI-A=\\begin{bmatrix}x-1&-3\\\\-2&x-2\\end{bmatrix}\\), so \\(\\det(xI-A)=(x-1)(x-2)-(-3)(-2)=x^2-3x+2-6=x^2-3x-4\\)."}, {"html": "\\(x^2-3x+2\\)", "ok": false, "comment": "You left out the off-diagonal product. The determinant subtracts \\((-3)(-2)=6\\), which turns the constant \\(2\\) into \\(-4\\)."}]}, {"type": "mc", "text": "Which numbers are the eigenvalues of \\(A\\)?", "phase": "Carry out", "answers": [{"html": "\\(4\\) only", "ok": false, "comment": "You stopped after the factor \\(x-4\\). The factor \\(x+1\\) gives a second root, \\(-1\\), and that is also an eigenvalue."}, {"html": "\\(-1\\) and \\(4\\)", "ok": true, "comment": "\\(x^2-3x-4=(x-4)(x+1)\\), so the roots are \\(x=4\\) and \\(x=-1\\). The eigenvalues are the roots of the characteristic polynomial."}, {"html": "\\(1\\) and \\(-4\\)", "ok": false, "comment": "You flipped the signs of the roots. From \\(x-4=0\\) and \\(x+1=0\\) the roots are \\(4\\) and \\(-1\\), not \\(-4\\) and \\(1\\)."}, {"html": "\\(1\\) and \\(2\\)", "ok": false, "comment": "Those are the diagonal entries of \\(A\\). The eigenvalues come from the roots of \\(c_A(x)\\), and the off-diagonal entries \\(3\\) and \\(2\\) change the answer."}]}, {"type": "mc", "text": "Which choice gives the complete answer: each eigenvalue, with a basic eigenvector for it?", "phase": "Carry out", "answers": [{"html": "\\(\\lambda=-1\\) with \\(\\begin{bmatrix}3\\\\-2\\end{bmatrix}\\), and \\(\\lambda=4\\) with \\(\\begin{bmatrix}1\\\\1\\end{bmatrix}\\).", "ok": true, "comment": "Check each pair: \\(A\\begin{bmatrix}3\\\\-2\\end{bmatrix}=\\begin{bmatrix}-3\\\\2\\end{bmatrix}=-1\\cdot\\begin{bmatrix}3\\\\-2\\end{bmatrix}\\), and \\(A\\begin{bmatrix}1\\\\1\\end{bmatrix}=\\begin{bmatrix}4\\\\4\\end{bmatrix}=4\\cdot\\begin{bmatrix}1\\\\1\\end{bmatrix}\\). Any nonzero multiple of either vector works too, so each eigenspace is a line through the origin."}, {"html": "\\(\\lambda=-1\\) with \\(\\begin{bmatrix}2\\\\3\\end{bmatrix}\\), and \\(\\lambda=4\\) with \\(\\begin{bmatrix}1\\\\1\\end{bmatrix}\\).", "ok": false, "comment": "You copied the coefficients from a row of \\(\\lambda I-A\\) straight into the vector. Check it: \\(A\\begin{bmatrix}2\\\\3\\end{bmatrix}=\\begin{bmatrix}11\\\\10\\end{bmatrix}\\), which is not a multiple of \\(\\begin{bmatrix}2\\\\3\\end{bmatrix}\\)."}, {"html": "\\(\\lambda=-1\\) with \\(\\begin{bmatrix}1\\\\1\\end{bmatrix}\\), and \\(\\lambda=4\\) with \\(\\begin{bmatrix}3\\\\-2\\end{bmatrix}\\).", "ok": false, "comment": "The two eigenvectors are swapped. Each vector has to go with its own eigenvalue, so \\(\\begin{bmatrix}1\\\\1\\end{bmatrix}\\) belongs with \\(\\lambda=4\\)."}, {"html": "\\(\\lambda=-1\\) with \\(\\begin{bmatrix}3\\\\2\\end{bmatrix}\\), and \\(\\lambda=4\\) with \\(\\begin{bmatrix}1\\\\1\\end{bmatrix}\\).", "ok": false, "comment": "You dropped a minus sign. Check it: \\(A\\begin{bmatrix}3\\\\2\\end{bmatrix}=\\begin{bmatrix}9\\\\10\\end{bmatrix}\\), which is not a multiple of \\(\\begin{bmatrix}3\\\\2\\end{bmatrix}\\)."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The eigenvalues are \\(-1\\) and \\(4\\), with basic eigenvectors \\(\\begin{bmatrix}3\\\\-2\\end{bmatrix}\\) and \\(\\begin{bmatrix}1\\\\1\\end{bmatrix}\\).<\/p><p>Last phase: <strong>look back<\/strong>. Check the answer another way before you trust it.<\/p>", "phase": "Look back", "cta": "Got it. On to Phase 4: Look back."}, {"type": "mc", "text": "Which computation confirms that \\(\\begin{bmatrix}3\\\\-2\\end{bmatrix}\\) is an eigenvector for \\(\\lambda=-1\\)?", "phase": "Look back", "answers": [{"html": "Since \\(-1\\) is an eigenvalue, every vector is an eigenvector for \\(-1\\), so no multiplication is needed.", "ok": false, "comment": "An eigenvalue doesn’t make every vector an eigenvector. Only the vectors with \\(A\\mathbf x=-\\mathbf x\\) qualify, and you have to check that."}, {"html": "\\(A\\begin{bmatrix}3\\\\-2\\end{bmatrix}=\\begin{bmatrix}-3\\\\2\\end{bmatrix}\\), which is \\(-1\\) times \\(\\begin{bmatrix}3\\\\-2\\end{bmatrix}\\).", "ok": true, "comment": "The product is a multiple of the vector, and the multiple is \\(\\lambda=-1\\). Both entries have to match, and here they do."}, {"html": "\\(A\\begin{bmatrix}3\\\\-2\\end{bmatrix}=\\begin{bmatrix}-3\\\\2\\end{bmatrix}\\), so \\(\\lambda=-3\\), read from the first entry.", "ok": false, "comment": "You read the eigenvalue off the first entry of \\(A\\mathbf x\\). Both entries have to be the same multiple of \\(\\mathbf x\\), and that multiple is \\(-1\\)."}]}, {"type": "mc", "text": "The eigenvalues of \\(A\\) are \\(-1\\) and \\(4\\). Which statement connects them to \\(A\\)?", "phase": "Look back", "answers": [{"html": "Their sum, \\(3\\), is the trace of \\(A\\), and their product, \\(4\\), is \\(\\det A\\).", "ok": false, "comment": "You dropped a minus sign. The product is \\((-1)(4)=-4\\), and \\(\\det A=-4\\), not \\(4\\)."}, {"html": "Their sum, \\(3\\), is \\(\\det A\\), and their product, \\(-4\\), is the trace of \\(A\\).", "ok": false, "comment": "The trace and the determinant are swapped. The trace is the sum of the diagonal entries, \\(1+2=3\\), and \\(\\det A=-4\\)."}, {"html": "Their sum, \\(3\\), is the trace \\(1+2\\) of \\(A\\), and their product, \\(-4\\), is \\(\\det A\\).", "ok": true, "comment": "\\(\\det A=1\\cdot2-3\\cdot2=-4\\), and \\(-1+4=3\\) is the trace. Both match the characteristic polynomial \\(x^2-3x-4\\): its \\(-3\\) is minus the trace, and its \\(-4\\) is \\(\\det A\\)."}]}, {"type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate wrote \\(\\begin{bmatrix}3\\\\2\\end{bmatrix}\\) as the eigenvector for \\(\\lambda=-1\\). Which step did they get wrong, and why does that one sign matter?<\/p>", "phase": "Look back"}]};</script>
