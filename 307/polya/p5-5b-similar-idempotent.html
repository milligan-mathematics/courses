<script>window.POLYA = {"slug": "p5-5b-similar-idempotent", "title": "5.5 Problem B: What similar matrices share", "statement": "Suppose \\(A\\) and \\(B\\) are similar: \\(B = P^{-1}AP\\) for some invertible matrix \\(P\\). Show that if \\(A^{2} = A\\), then \\(B^{2} = B\\).", "questions": [{"type": "write", "text": "In your own words, what does the claim say, and what would a proof have to show?", "phase": "Understand", "model": "<p>A matrix with \\(A^{2} = A\\) is called idempotent: doing it twice is the same as doing it once. The claim says this property carries over to every matrix similar to \\(A\\). We are given \\(B = P^{-1}AP\\) with \\(P\\) invertible, and \\(A^{2} = A\\); we have to show \\(B^{2} = B\\), for every such \\(A\\), \\(P\\) and \\(B\\).<\/p>", "checklist": ["name what is given: \\(B = P^{-1}AP\\) with \\(P\\) invertible, and \\(A^{2} = A\\)", "name what to show: \\(B^{2} = B\\)", "say the proof must work for every such \\(A\\) and \\(P\\)"]}, {"type": "mc", "text": "What does it mean for \\(B\\) to be similar to \\(A\\)?", "phase": "Understand", "answers": [{"html": "\\(B = A\\).", "ok": false, "comment": "Similar matrices can look quite different. Equal matrices are similar (with \\(P = I\\)), but similar is much more general."}, {"html": "\\(B = P^{-1}AP\\) for some invertible matrix \\(P\\).", "ok": true, "comment": "Right. \\(B\\) is \\(A\\) seen through a change of coordinates."}, {"html": "\\(B = PA\\) for some invertible matrix \\(P\\).", "ok": false, "comment": "Similarity puts \\(P\\) on both sides: \\(B = P^{-1}AP\\). Multiplying on one side only changes the transformation."}, {"html": "\\(B\\) has the same entries as \\(A\\), in a different order.", "ok": false, "comment": "Similarity isn’t about entries. Similar matrices share the trace, determinant and eigenvalues, not the entries."}]}, {"type": "matrix", "text": "Try a case. \\(A = \\begin{bmatrix}1&0\\\\0&0\\end{bmatrix}\\) has \\(A^{2} = A\\). With \\(P = \\begin{bmatrix}1&1\\\\1&2\\end{bmatrix}\\), enter \\(B = P^{-1}AP\\).", "phase": "Understand", "comment": "Right. \\(B = \\begin{bmatrix}2&2\\\\-1&-1\\end{bmatrix}\\). It doesn’t look like \\(A\\), but check it: \\(B^{2} = \\begin{bmatrix}2&2\\\\-1&-1\\end{bmatrix}\\), which is \\(B\\) again.", "label": "B =", "hints": ["First find \\(P^{-1}\\). Since \\(\\det P = 1\\), it is \\(\\begin{bmatrix}2&-1\\\\-1&1\\end{bmatrix}\\).", "Multiply \\(P^{-1}A\\) first, then multiply that by \\(P\\) on the right."], "shape": [2, 2], "values": [2.0, 2.0, -1.0, -1.0], "answer_tex": "\\begin{bmatrix}2&2\\\\-1&-1\\end{bmatrix}", "typed_answer": ["2", "2", "-1", "-1"], "wrong": [{"values": [2.0, -1.0, 2.0, -1.0], "comment": "That is \\(PAP^{-1}\\): the \\(P\\) and \\(P^{-1}\\) are swapped. Start with \\(P^{-1}\\) on the left."}, {"values": [1.0, 1.0, 0.0, 0.0], "comment": "That is \\(AP\\). Multiply by \\(P^{-1}\\) on the left as well."}]}, {"type": "mc", "text": "For that \\(B\\), how does \\(B^{2}\\) compare with \\(B\\)?", "phase": "Understand", "answers": [{"html": "\\(B^{2} = A\\).", "ok": false, "comment": "Compute \\(B^{2}\\) row by column: it comes out to \\(B\\), not \\(A\\)."}, {"html": "\\(B^{2} = 2B\\).", "ok": false, "comment": "Compute \\(B^{2}\\): its \\((1,1)\\) entry is \\(2\\), the same as in \\(B\\), not \\(4\\)."}, {"html": "\\(B^{2} = B\\), just as \\(A^{2} = A\\).", "ok": true, "comment": "Right. The property survived the change of coordinates, and the proof will show it always does."}, {"html": "\\(B^{2} = 0\\).", "ok": false, "comment": "Compute \\(B^{2}\\): its top row is \\((2, 2)\\), not zero."}]}, {"type": "multi", "text": "Which facts will the proof need? Select all that apply.", "phase": "Plan", "answers": [{"html": "\\(P^{-1}AP = A\\)", "ok": false, "comment": "That is only true when \\(P\\) commutes with \\(A\\). The case above has \\(B \\ne A\\)."}, {"html": "\\(PP^{-1} = I\\)", "ok": true, "comment": "Yes: it cancels the \\(P\\) and \\(P^{-1}\\) that meet in the middle of \\(B\\cdot B\\)."}, {"html": "\\((P^{-1}AP)^{2} = P^{-2}A^{2}P^{2}\\)", "ok": false, "comment": "Matrix products can’t be rearranged like that, because matrices don’t commute. Write \\(B\\cdot B\\) out and look at the middle."}, {"html": "\\(A^{2} = A\\)", "ok": true, "comment": "Yes: it is given, and it is the property we are passing on."}]}, {"type": "mc", "text": "The key step: what is \\(B^{2} = (P^{-1}AP)(P^{-1}AP)\\)?", "phase": "Plan", "answers": [{"html": "\\(P^{-1}AP\\), since squaring does nothing to a similarity.", "ok": false, "comment": "Squaring does something: \\(B^{2}\\) is \\(B\\cdot B\\). Write it out and cancel what you can."}, {"html": "\\(P^{-2}A^{2}P^{2}\\)", "ok": false, "comment": "That moves \\(P^{-1}\\) past \\(A\\), which isn’t allowed. Look at the two matrices that meet in the middle."}, {"html": "\\(A^{2}\\), since the \\(P\\)s all cancel.", "ok": false, "comment": "Only the inner pair \\(PP^{-1}\\) meets and cancels. The outer \\(P^{-1}\\) and \\(P\\) stay."}, {"html": "\\(P^{-1}A^{2}P\\), because the \\(P\\,P^{-1}\\) in the middle is \\(I\\).", "ok": true, "comment": "Right. Then \\(A^{2} = A\\) finishes it."}]}, {"type": "order", "text": "Arrange the lines into a proof.", "phase": "Carry out", "lines": [{"html": "Since \\(PP^{-1} = I\\), this is \\(P^{-1}AAP = P^{-1}A^{2}P\\).", "pos": 2}, {"html": "Then \\(B^{2} = P^{-2}A^{2}P^{2}\\), and \\(P^{-2}P^{2} = I\\), so \\(B^{2} = A^{2}\\).", "pos": -1, "comment": "This regroups the factors as if matrices commuted. \\(P^{-1}\\) can’t move past \\(A\\); only the inner \\(PP^{-1}\\) cancels."}, {"html": "So \\(B^{2} = B\\): every matrix similar to an idempotent matrix is idempotent.", "pos": 4}, {"html": "Let \\(B = P^{-1}AP\\) with \\(P\\) invertible, and suppose \\(A^{2} = A\\).", "pos": 0}, {"html": "Since \\(A\\) and \\(B\\) are similar, \\(B = A\\), so \\(B^{2} = A^{2} = A = B\\).", "pos": -1, "comment": "Similar doesn’t mean equal: in Understand, \\(B \\ne A\\). The proof has to work through \\(P\\)."}, {"html": "Then \\(B^{2} = (P^{-1}AP)(P^{-1}AP) = P^{-1}A(PP^{-1})AP\\).", "pos": 1}, {"html": "Since \\(A^{2} = A\\), we get \\(B^{2} = P^{-1}AP = B\\).", "pos": 3}], "groups": [], "comment": "Right. Only the inner \\(PP^{-1}\\) cancels, which leaves \\(P^{-1}A^{2}P\\), and the given \\(A^{2} = A\\) turns that back into \\(B\\).", "model": "<ol class=\"pl-model-proof\"><li>Let \\(B = P^{-1}AP\\) with \\(P\\) invertible, and suppose \\(A^{2} = A\\).<\/li><li>Then \\(B^{2} = (P^{-1}AP)(P^{-1}AP) = P^{-1}A(PP^{-1})AP\\).<\/li><li>Since \\(PP^{-1} = I\\), this is \\(P^{-1}AAP = P^{-1}A^{2}P\\).<\/li><li>Since \\(A^{2} = A\\), we get \\(B^{2} = P^{-1}AP = B\\).<\/li><li>So \\(B^{2} = B\\): every matrix similar to an idempotent matrix is idempotent.<\/li><\/ol>", "hints": ["Start with what is given. Then write \\(B^{2}\\) as \\(B\\cdot B\\) with \\(B = P^{-1}AP\\) in both places.", "After the middle \\(PP^{-1}\\) cancels, use the given equation \\(A^{2} = A\\)."]}, {"type": "mc", "text": "Where did the proof use that \\(P\\) is invertible?", "phase": "Look back", "answers": [{"html": "In writing \\(P^{-1}\\) at all, and in \\(PP^{-1} = I\\), which cancels the middle of \\(B\\cdot B\\).", "ok": true, "comment": "Right. Without an inverse there is no \\(B = P^{-1}AP\\), and nothing to cancel."}, {"html": "Only to show \\(A^{2} = A\\).", "ok": false, "comment": "\\(A^{2} = A\\) is given. \\(P\\) is used in \\(B\\) and in the cancelling."}, {"html": "Nowhere: the proof works for any matrix \\(P\\).", "ok": false, "comment": "The proof writes \\(P^{-1}\\) and cancels \\(PP^{-1}\\). Both need \\(P\\) to be invertible."}, {"html": "Only in the last line.", "ok": false, "comment": "The last line only names the conclusion. The cancelling in the middle is where \\(PP^{-1} = I\\) does its work."}]}, {"type": "write", "text": "Now you: with \\(B = P^{-1}AP\\) as before, prove that if \\(A\\) is invertible, then \\(B\\) is invertible, with \\(B^{-1} = P^{-1}A^{-1}P\\).", "phase": "Look back", "model": "<p>Let \\(C = P^{-1}A^{-1}P\\). Then \\(BC = P^{-1}AP\\,P^{-1}A^{-1}P = P^{-1}A\\,A^{-1}P = P^{-1}P = I\\), and in the other order \\(CB = P^{-1}A^{-1}P\\,P^{-1}AP = P^{-1}A^{-1}AP = P^{-1}P = I\\). So \\(B\\) is invertible and \\(B^{-1} = C = P^{-1}A^{-1}P\\).<\/p>", "checklist": ["name the candidate inverse \\(P^{-1}A^{-1}P\\)", "multiply it by \\(B\\) and cancel the inner \\(PP^{-1}\\)", "use \\(AA^{-1} = I\\), then \\(P^{-1}P = I\\)", "check the other order as well (or say why one order is enough)", "conclude that \\(B\\) is invertible, with the inverse named"]}, {"type": "essay", "text": "Reflection: the special case showed \\(B^{2} = B\\) before you proved it. What did the proof explain that the example could not?", "phase": "Look back"}], "goal": "Prove that a property defined by an equation in \\(A\\) passes to every matrix similar to \\(A\\).", "connects": "Builds on similarity, \\(B = P^{-1}AP\\), from this section and on \\(A^{k} = PD^{k}P^{-1}\\) from 3.3. Leads to the idea behind every invariant: similar matrices are the same transformation seen in different coordinates.", "discuss": "The same three-line computation shows \\(B^{k} = P^{-1}A^{k}P\\) for every \\(k\\). Which properties of \\(A\\) does that carry over to \\(B\\), and which (like having a zero entry) does it not?"};</script>
