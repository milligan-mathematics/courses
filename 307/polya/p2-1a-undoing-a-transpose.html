<script>window.POLYA = {"slug": "p2-1a-undoing-a-transpose", "title": "2.1 Problem A: Undoing a transpose", "statement": "Let \\(B = \\begin{bmatrix}2&-1\\\\1&3\\end{bmatrix}\\) and \\(C = \\begin{bmatrix}4&1\\\\0&2\\end{bmatrix}\\). Solve for the \\(2\\times 2\\) matrix \\(A\\) if<br>\\[\\left(2A^{T} - 3B\\right)^{T} = C.\\]", "questions": [{"type": "write", "text": "In your own words, what is this problem asking for?", "phase": "Understand", "model": "<p>We need the matrix \\(A\\) itself, not \\(A^{T}\\). The equation says: double the transpose of \\(A\\), subtract \\(3B\\), then transpose the whole thing, and you get \\(C\\). Our job is to undo those steps. The answer is a \\(2\\times 2\\) matrix with four entries to find.<\/p>", "checklist": ["name the unknown as \\(A\\) itself, not \\(A^{T}\\)", "say that \\(A\\) is \\(2\\times 2\\), so it has four entries", "list the steps to undo, in order: transpose, subtract \\(3B\\), transpose back", "notice that \\(C\\) is the given right side"]}, {"type": "mc", "text": "Before computing: what exactly is the unknown, and what size is it?", "phase": "Understand", "answers": [{"html": "The number \\(3\\), since it is multiplying \\(B\\).", "ok": false, "comment": "Scalars like \\(2\\) and \\(3\\) are known constants. The unknown is a matrix, so we need all four of its entries."}, {"html": "The matrix \\(A^{T}\\), since that is what is inside the parentheses.", "ok": false, "comment": "The question asks for \\(A\\). Solving for \\(A^{T}\\) is a step on the way; transposing at the end gets you back to \\(A\\)."}, {"html": "The matrix \\(C\\), since it is the answer we are given.", "ok": false, "comment": "\\(C\\) is the given right side. It is data, not the unknown."}, {"html": "The matrix \\(A\\) itself, which must be \\(2\\times 2\\) so that \\(2A^{T}\\) can be subtracted from \\(3B\\).", "ok": true, "comment": "Right. \\(2A^{T}\\) has to be the same size as \\(3B\\), which is \\(2\\times 2\\), so \\(A\\) is \\(2\\times 2\\) too."}]}, {"type": "mc", "text": "Try a special case to test the idea: let \\(B\\) be the zero matrix. Then the equation is \\(\\left(2A^{T}\\right)^{T} = C\\). What is \\(A\\)?", "phase": "Understand", "answers": [{"html": "\\(A = \\tfrac12 C\\)", "ok": true, "comment": "Right. Transposing twice gives back \\(2A\\), so \\(2A = C\\), and dividing by 2 gives \\(\\tfrac12 C\\)."}, {"html": "\\(A = \\tfrac12 C^{T}\\)", "ok": false, "comment": "The two transposes cancel: \\(\\left(A^{T}\\right)^{T} = A\\). No transpose is left over on \\(C\\)."}, {"html": "\\(A = 2C\\)", "ok": false, "comment": "The 2 multiplies \\(A\\) on the left side, so it moves across as a division, not a multiplication."}, {"html": "\\(A = C\\)", "ok": false, "comment": "Careful: \\(\\left(2A^{T}\\right)^{T} = 2A\\), and the 2 is still there. It has to be divided out."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The unknown is the \\(2\\times 2\\) matrix \\(A\\). The transposes are the hard part: when \\(B = 0\\) they cancel and \\(A = \\tfrac12 C\\), but with \\(B \\neq 0\\) the transposes do not simply vanish.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "phase": "Plan", "cta": "Got it. On to Phase 2: Plan."}, {"type": "multi", "text": "Which of these plans would solve for \\(A\\)? Select all that apply.", "phase": "Plan", "answers": [{"html": "Ignore the outer transpose and solve \\(2A^{T} - 3B = C\\) directly.", "ok": false, "comment": "Dropping the transpose changes the equation. With \\(B = 0\\) this would give \\(A = \\tfrac12 C^{T}\\), not \\(\\tfrac12 C\\)."}, {"html": "Use the transpose rules to spread the outer transpose across the sum and the scalar: \\(\\left(2A^{T} - 3B\\right)^{T} = 2A - 3B^{T}\\). Then solve \\(2A - 3B^{T} = C\\) for \\(A\\).", "ok": true, "comment": "Also correct. This is the transpose rules at work: the transpose of a sum is the sum of the transposes, and \\(\\left(kX\\right)^{T} = kX^{T}\\)."}, {"html": "Try a few \\(2\\times 2\\) matrices until one works.", "ok": false, "comment": "Trial can show that one matrix works, but it can’t show that it is the only one, and it may never find it."}, {"html": "Transpose both sides. Since \\(\\left(X^{T}\\right)^{T} = X\\), the left side becomes \\(2A^{T} - 3B\\) and the right side becomes \\(C^{T}\\). Solve for \\(A^{T}\\), then transpose back.", "ok": true, "comment": "This works, and it is a clean move. Transposing an equation is allowed as long as you do it to both sides."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> Use the plan you chose. Whichever way you go, the transposes on \\(A\\) and \\(B\\) have to be handled correctly, and then \\(A\\) has to stand alone.<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "mc", "text": "After spreading the outer transpose across the sum and the scalar, which equation do we get?", "phase": "Carry out", "answers": [{"html": "\\(2A^{T} - 3B^{T} = C\\)", "ok": false, "comment": "The transpose reached \\(B\\) but not \\(A^{T}\\). Transposing \\(A^{T}\\) gives \\(A\\), so the \\(A^{T}\\) has to flip too."}, {"html": "\\(2A - 3B^{T} = C\\)", "ok": true, "comment": "Right. \\(\\left(2A^{T}\\right)^{T} = 2A\\), and \\(\\left(3B\\right)^{T} = 3B^{T}\\), so the left side is \\(2A - 3B^{T}\\)."}, {"html": "\\(2A - 3B = C\\)", "ok": false, "comment": "Dropping the outer transpose changes the equation. Every piece inside the parentheses still gets flipped."}, {"html": "\\(2A - 3B = C^{T}\\)", "ok": false, "comment": "That moves the transpose onto the right side, where it doesn’t belong, and leaves \\(B\\) unflipped. Transposing the left side is what turns \\(B\\) into \\(B^{T}\\)."}]}, {"type": "matrix", "text": "Solve \\(2A-3B^{T}=C\\) for \\(2A\\). Enter the matrix \\(2A\\).", "phase": "Carry out", "comment": "Right. \\(3B^{T}=\\begin{bmatrix}6&3\\\\-3&9\\end{bmatrix}\\), and adding \\(C\\) entry by entry gives \\(2A\\).", "label": "2A =", "hints": ["Find \\(B^{T}\\) first: swap the rows and columns of \\(B\\).", "Move \\(-3B^{T}\\) to the other side of the equals sign. What happens to its sign?", "Then add \\(C\\) and \\(3B^{T}\\), entry by entry."], "shape": [2, 2], "values": [10.0, 4.0, -3.0, 11.0], "answer_tex": "\\begin{bmatrix}10&4\\\\-3&11\\end{bmatrix}", "typed_answer": ["10", "4", "-3", "11"], "wrong": [{"values": [10.0, -2.0, 3.0, 11.0], "comment": "That is \\(C+3B\\). Use \\(B^{T}\\): swap the rows and columns of \\(B\\) first."}, {"values": [-2.0, -2.0, 3.0, -7.0], "comment": "That is \\(C-3B^{T}\\). It keeps the minus sign, but moving \\(-3B^{T}\\) to the other side makes it \\(+3B^{T}\\)."}, {"values": [6.0, 2.0, -1.0, 5.0], "comment": "That is \\(C+B^{T}\\). The 3 multiplies every entry of \\(B^{T}\\), so you need \\(3B^{T}\\)."}]}, {"type": "matrix", "text": "Last step: solve for \\(A\\). Enter its four entries.", "phase": "Carry out", "comment": "Right. Halving every entry of \\(2A\\) gives \\(A=\\begin{bmatrix}5&2\\\\-\\tfrac32&\\tfrac{11}2\\end{bmatrix}\\).", "label": "A =", "hints": ["\\(A\\) is half of \\(2A\\). Divide every entry of your matrix from the last step by 2.", "Halve every entry, including the negative one. Half of an odd number is a fraction.", "If the entries look off, check the transpose step for \\(2A\\). The transpose belongs on \\(B\\), and \\(C\\) stays as it is."], "syntax": "Fill in every entry. Fractions are fine: type them with a slash, such as 7/3.", "shape": [2, 2], "values": [5.0, 2.0, -1.5, 5.5], "answer_tex": "\\begin{bmatrix}5&2\\\\- \\frac{3}{2}&\\frac{11}{2}\\end{bmatrix}", "typed_answer": ["5", "2", "-3/2", "11/2"], "wrong": [{"values": [5.0, -1.5, 2.0, 5.5], "comment": "The numbers are right, but they are flipped. That is \\(A^{T}\\), and the question asks for \\(A\\)."}, {"values": [5.0, -1.0, 1.5, 5.5], "comment": "That came from \\(C+3B\\), which left \\(B\\) untransposed. Start from \\(C+3B^{T}\\), then halve it."}, {"values": [10.0, 4.0, -3.0, 11.0], "comment": "That is \\(2A\\). The 2 has to be divided out to get \\(A\\)."}, {"values": [-1.0, -1.0, 1.5, -3.5], "comment": "That is \\(\\tfrac12\\left(C-3B^{T}\\right)\\). The sign on \\(3B^{T}\\) flipped when it moved across the equals sign, so it should be \\(+3B^{T}\\)."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> You should have one \\(2\\times 2\\) matrix \\(A\\).<\/p><p>Last phase: <strong>look back<\/strong>. Check the answer in the original equation, look at a classmate’s work, then test the idea on a new example.<\/p>", "phase": "Look back", "cta": "Got it. On to Phase 4: Look back."}, {"type": "mc", "text": "Check your answer. Which check confirms it?", "phase": "Look back", "answers": [{"html": "Check that \\(A = A^{T}\\), since the equation looks symmetric.", "ok": false, "comment": "The equation doesn’t say \\(A\\) is symmetric. Here \\(A\\) and \\(A^{T}\\) are different matrices, so this check cannot pass."}, {"html": "Check that every entry of \\(A\\) is a whole number.", "ok": false, "comment": "Solutions don’t have to be whole numbers. Fractions are fine, so this doesn’t test the answer."}, {"html": "Compute \\(2A^{T} - 3B\\), transpose the result, and confirm you get \\(C\\).", "ok": true, "comment": "Right. That plugs \\(A\\) back into the original equation, which is the most direct check."}, {"html": "Compute \\(A + B\\) and check that it equals \\(C\\).", "ok": false, "comment": "That is a different equation. The original one has \\(2A^{T}\\), \\(3B\\), and a transpose on the outside."}]}, {"type": "error", "text": "A classmate solved this problem and wrote the lines below.", "phase": "Look back", "lines": [{"html": "\\((2A^{T}-3B)^{T}=C\\)", "wrong": false, "comment": "That is the equation we start from."}, {"html": "\\((2A^{T}-3B)^{T}=2A-3B\\)", "wrong": true, "comment": "Right. The transpose has to reach every term, including \\(3B\\). The classmate turned \\(2A^{T}\\) into \\(2A\\) but left \\(B\\) alone. It should be \\(B^{T}\\)."}, {"html": "\\(2A-3B=C\\)", "wrong": false, "comment": "It follows from the line above it, so it isn’t the first mistake. The slip is in the line above."}, {"html": "\\(2A=C+3B\\)", "wrong": false, "comment": "Adding \\(3B\\) to both sides is correct, given the line above."}, {"html": "\\(A=\\tfrac{1}{2}(C+3B)\\)", "wrong": false, "comment": "The arithmetic is right. The answer is wrong only because it inherits the mistake from line 2."}]}, {"type": "example", "text": "A classmate guesses that \\(A\\) must be symmetric, since the equation is full of transposes. Show them otherwise. Give a \\(2\\times 2\\) matrix \\(A\\) that is <strong>not<\/strong> symmetric, but with \\(A+A^{T}=\\begin{bmatrix}2&3\\\\3&4\\end{bmatrix}\\).", "phase": "Look back", "shape": [2, 2], "conditions": [{"js": "eq(add(M, transpose(M)), [[2,3],[3,4]])", "comment": "Check the sum. Add \\(A\\) and \\(A^{T}\\) entry by entry. The result should be \\(\\begin{bmatrix}2&3\\\\3&4\\end{bmatrix}\\)."}, {"js": "!isSymmetric(M)", "comment": "That matrix is symmetric, so it equals its transpose. The question asks for one that isn’t. Keep the sum, and change the two off-diagonal entries so they differ."}], "comment": "Right. \\(A+A^{T}\\) is always symmetric, but \\(A\\) doesn’t have to be. So the transposes in our equation don’t tell you that \\(A=A^{T}\\).", "model": "\\(\\begin{bmatrix}1&0\\\\3&2\\end{bmatrix}\\): its transpose is \\(\\begin{bmatrix}1&3\\\\0&2\\end{bmatrix}\\), and the sum is \\(\\begin{bmatrix}2&3\\\\3&4\\end{bmatrix}\\). It isn’t symmetric, because \\(0\\neq 3\\).", "label": "A =", "hints": ["Each diagonal entry of \\(A+A^{T}\\) is twice the matching diagonal entry of \\(A\\). What must the diagonal of \\(A\\) be?", "An off-diagonal entry of \\(A+A^{T}\\) is the two off-diagonal entries of \\(A\\) added together. So they must add to 3, and they must be different numbers."]}, {"type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). Why is there only one matrix \\(A\\) that works? Then name one habit from this problem you want to use on the next one.<\/p>", "phase": "Look back"}], "goal": "Solve a matrix equation in which a transpose sits outside the expression, undoing the steps in the right order.", "connects": "Builds on the transpose rules in this section (the transpose of a sum, and of a multiple) and on solving \\(3A+B=C\\) for \\(A\\). Leads to 2.4, where the inverse has to go on the correct side of the matrix.", "discuss": "Suppose \\(B\\) were symmetric. Would the classmate’s method then give the right answer? Why, and what would that say about checking a method on a symmetric example?", "cold": [8], "twins": [{"statement": "Let \\(B = \\begin{bmatrix}3&-2\\\\4&-1\\end{bmatrix}\\) and \\(C = \\begin{bmatrix}3&2\\\\4&3\\end{bmatrix}\\). Solve for the \\(2\\times 2\\) matrix \\(A\\) if<br>\\[\\left(2A^{T} - B\\right)^{T} = C.\\]", "steps": [{"type": "matrix", "text": "Enter the matrix \\(A\\).", "comment": "Right. Spread the transpose to get \\(2A-B^{T}=C\\), then solve for \\(A\\).", "label": "A =", "syntax": "Fill in every entry.", "shape": [2, 2], "values": [3.0, 3.0, 1.0, 1.0], "answer_tex": "\\begin{bmatrix}3&3\\\\1&1\\end{bmatrix}", "typed_answer": ["3", "3", "1", "1"], "wrong": [{"values": [3.0, 0.0, 4.0, 1.0], "comment": "You left \\(B\\) untransposed. The transpose has to reach \\(B\\) too, so that term is \\(B^{T}\\), not \\(B\\)."}, {"values": [3.0, 4.0, 0.0, 1.0], "comment": "You moved a transpose onto \\(C\\). But \\(C\\) is the right side, and it stays as it is."}, {"values": [0.0, -1.0, 3.0, 2.0], "comment": "You kept the minus sign on \\(B^{T}\\) when you moved it across the equals sign. A term flips its sign as it crosses, so the answer needs \\(+B^{T}\\)."}]}]}, {"statement": "Let \\(B = \\begin{bmatrix}4&4\\\\3&0\\end{bmatrix}\\) and \\(C = \\begin{bmatrix}-2&-3\\\\-2&-2\\end{bmatrix}\\). Solve for the \\(2\\times 2\
