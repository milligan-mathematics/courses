<script>window.POLYA = {"slug": "p5-2a-one-vector-too-many", "title": "5.2 Problem A: One vector too many", "statement": "Let \\(U\\) be the span of \\(\\mathbf v_1=(1,0,2,1)\\), \\(\\mathbf v_2=(2,1,0,1)\\), \\(\\mathbf v_3=(3,1,2,2)\\), and \\(\\mathbf v_4=(0,1,2,1)\\) in \\(\\mathbb{R}^4\\). Find a basis of \\(U\\) and \\(\\dim U\\), the number of vectors in a basis. Then say which of the four vectors is <strong>redundant<\/strong>: a vector is redundant if it is a combination of the vectors listed before it.", "questions": [{"type": "write", "text": "In your own words, what is this problem asking for?", "phase": "Understand", "model": "<p>It asks for a basis of \\(U\\), which is a set of vectors that spans \\(U\\) and is independent, so that no vector in it is redundant. It also asks for \\(\\dim U\\), the number of vectors in any basis. Last, it asks me to say which of the four given vectors is redundant.<\/p>"}, {"type": "mc", "text": "Recall that a set of vectors is independent when the only combination of them that equals \\(\\mathbf 0\\) is the one with every coefficient equal to \\(0\\). For a set to be a basis of \\(U\\), what two things must it do?", "phase": "Understand", "answers": [{"html": "Span \\(U\\), and be independent.", "ok": true, "comment": "Right. Spanning means every vector in \\(U\\) is a combination of the basis. Independence means no vector in the basis is redundant, so each vector in \\(U\\) has only one such combination."}, {"html": "Be independent. Spanning \\(U\\) isn’t needed, because any independent set is fine.", "ok": false, "comment": "Independence is only half the job. The pair \\(\\mathbf v_1,\\mathbf v_2\\) is independent, but it does not span \\(U\\), because \\(\\mathbf v_4\\) is not a combination of them."}, {"html": "Span \\(U\\). Independence doesn’t matter, because spanning is enough.", "ok": false, "comment": "Spanning is only half the job. The four given vectors span \\(U\\), but they are not a basis, since they are dependent: a spanning set can contain a redundant vector."}, {"html": "Have the same number of vectors as the list it came from.", "ok": false, "comment": "Not necessarily. A basis leaves out any redundant vectors, so it can have fewer vectors than the list."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> We want a set that spans \\(U\\) and is independent, and the number of vectors in it. The four given vectors span \\(U\\), but they may not be independent, so we need to find out which of them to keep.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "phase": "Plan", "cta": "Got it. On to Phase 2: Plan."}, {"type": "write", "text": "Before you start, write your plan in 1–3 sentences. How will you get a basis of \\(U\\) and its dimension from the four vectors?", "phase": "Plan", "model": "<p>Put the four vectors in the columns of a matrix and row-reduce it. The pivot columns show which vectors are not combinations of the ones before them, so the basis will be the <em>original<\/em> vectors in the pivot positions, not the columns of the reduced matrix. The number of pivots is the dimension.<\/p>"}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: row-reduce the matrix whose columns are \\(\\mathbf v_1,\\mathbf v_2,\\mathbf v_3,\\mathbf v_4\\). Keep the original vectors in the pivot positions, and count the pivots for the dimension.<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "mc", "text": "After row-reducing the matrix whose columns are \\(\\mathbf v_1,\\mathbf v_2,\\mathbf v_3,\\mathbf v_4\\), which set is a basis of \\(U\\)?", "phase": "Carry out", "answers": [{"html": "\\(\\{\\mathbf v_1,\\mathbf v_2,\\mathbf v_3,\\mathbf v_4\\}\\)", "ok": false, "comment": "Keeping all four assumes that nonzero vectors are automatically independent. They span \\(U\\), but \\(\\mathbf v_1+\\mathbf v_2-\\mathbf v_3=\\mathbf 0\\) is a combination equal to zero whose coefficients are not all zero."}, {"html": "\\(\\{\\mathbf v_1,\\mathbf v_2,\\mathbf v_4\\}\\)", "ok": true, "comment": "Right. Columns 1, 2, and 4 have pivots, so we keep the original \\(\\mathbf v_1,\\mathbf v_2,\\mathbf v_4\\). The vector left out, \\(\\mathbf v_3\\), is the redundant one: \\(\\mathbf v_3=\\mathbf v_1+\\mathbf v_2\\). (A subspace has many bases; \\(\\{\\mathbf v_2,\\mathbf v_3,\\mathbf v_4\\}\\) would work too. Pivot columns give one reliable choice.)"}, {"html": "\\(\\{\\mathbf v_1,\\mathbf v_2,\\mathbf v_3\\}\\)", "ok": false, "comment": "Those are the first three vectors, taken without checking the pivots. Here \\(\\mathbf v_1+\\mathbf v_2-\\mathbf v_3=\\mathbf 0\\), so these three are dependent."}, {"html": "\\(\\{\\mathbf e_1,\\mathbf e_2,\\mathbf e_3\\}\\)", "ok": false, "comment": "Those are the pivot columns of the reduced matrix, but they are not the original vectors. Use the original vectors in the pivot positions."}]}, {"type": "num", "text": "What is \\(\\dim U\\)?", "phase": "Carry out", "comment": "The dimension is the number of vectors in a basis. Four vectors were given, but one of them is a combination of the others, so a basis has three.", "shape": [1, 1], "values": [3.0], "answer_tex": "3", "typed_answer": ["3"], "wrong": []}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The basis is \\(\\{\\mathbf v_1,\\mathbf v_2,\\mathbf v_4\\}\\), and \\(\\dim U=3\\).<\/p><p>Last phase: <strong>look back<\/strong>. Check the answer another way, then see what happens when you change the problem.<\/p>", "phase": "Look back", "cta": "Got it. On to Phase 4: Look back."}, {"type": "write", "text": "Choose a check of your own and carry it out. What did you check, and did it pass?", "phase": "Look back", "model": "<p>I checked that the redundant vector is a combination of the basis vectors: \\(\\mathbf v_1+\\mathbf v_2=(1,0,2,1)+(2,1,0,1)=(3,1,2,2)=\\mathbf v_3\\). So \\(\\mathbf v_3\\) adds nothing new to the span, and \\(\\{\\mathbf v_1,\\mathbf v_2,\\mathbf v_4\\}\\) still spans \\(U\\). The check passed.<\/p>"}, {"type": "mc", "text": "Now change the problem. Replace \\(\\mathbf v_4\\) by \\(\\mathbf w=(0,-1,4,1)\\), and keep \\(\\mathbf v_1,\\mathbf v_2,\\mathbf v_3\\). What is the dimension of the span of \\(\\mathbf v_1,\\mathbf v_2,\\mathbf v_3,\\mathbf w\\)?", "phase": "Look back", "answers": [{"html": "1", "ok": false, "comment": "That would happen if every vector were a multiple of \\(\\mathbf v_1\\). But a combination is more than a multiple: \\(\\mathbf v_2\\) is not a multiple of \\(\\mathbf v_1\\), so the span is bigger than a line."}, {"html": "2", "ok": true, "comment": "Right. \\(\\mathbf v_3=\\mathbf v_1+\\mathbf v_2\\) and \\(\\mathbf w=2\\mathbf v_1-\\mathbf v_2\\), so every vector in the span is a combination of \\(\\mathbf v_1\\) and \\(\\mathbf v_2\\). The dimension is \\(2\\)."}, {"html": "3", "ok": false, "comment": "That was the answer to the original problem. With \\(\\mathbf w\\) in place of \\(\\mathbf v_4\\), the span drops to two dimensions, because \\(\\mathbf w\\) adds no new direction."}, {"html": "4", "ok": false, "comment": "That counts the vectors in the list. The dimension counts the vectors in a basis, and here both \\(\\mathbf v_3\\) and \\(\\mathbf w\\) are redundant."}]}, {"type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate says \\(\\{\\mathbf v_1,\\mathbf v_2,\\mathbf v_3\\}\\) is independent, because no two of these vectors are multiples of each other. What step did they skip? Then name one habit from this problem you want to use on the next one.<\/p>", "phase": "Look back"}]};</script>
