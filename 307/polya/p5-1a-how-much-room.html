<script>window.POLYA = {"slug": "p5-1a-how-much-room", "title": "5.1 Problem A: How much room do three vectors make?", "statement": "Let \\(\\mathbf v_1=\\begin{bmatrix}1\\\\2\\\\1\\end{bmatrix}\\), \\(\\mathbf v_2=\\begin{bmatrix}2\\\\1\\\\0\\end{bmatrix}\\), and \\(\\mathbf v_3=\\begin{bmatrix}3\\\\3\\\\1\\end{bmatrix}\\) in \\(\\mathbb{R}^3\\), and let \\(U=\\operatorname{span}\\{\\mathbf v_1,\\mathbf v_2,\\mathbf v_3\\}\\). Decide <strong>(a)<\/strong> whether \\(\\mathbf b=\\begin{bmatrix}4\\\\5\\\\2\\end{bmatrix}\\) lies in \\(U\\), and <strong>(b)<\/strong> whether \\(U=\\mathbb{R}^3\\).", "questions": [{"type": "write", "text": "In your own words, what is this problem asking for?", "phase": "Understand", "model": "<p>We have three vectors in \\(\\mathbb{R}^3\\) and the set \\(U\\) of all their combinations. Part (a) asks whether \\(\\mathbf b\\) is one of those combinations: are there weights \\(c_1,c_2,c_3\\) with \\(c_1\\mathbf v_1+c_2\\mathbf v_2+c_3\\mathbf v_3=\\mathbf b\\)? Part (b) asks whether every vector in \\(\\mathbb{R}^3\\) is such a combination. Both need a yes or no, and for (a) I should be able to show the weights.<\/p>"}, {"type": "mc", "text": "Before you compute anything, could three vectors in \\(\\mathbb{R}^3\\) fail to span \\(\\mathbb{R}^3\\)?", "phase": "Understand", "answers": [{"html": "No. Three vectors always span \\(\\mathbb{R}^3\\), since there are three of them and three entries in each.", "ok": false, "comment": "Counting is not enough. For example, \\(\\begin{bmatrix}1\\\\0\\\\0\\end{bmatrix}\\), \\(\\begin{bmatrix}0\\\\1\\\\0\\end{bmatrix}\\), and \\(\\begin{bmatrix}1\\\\1\\\\0\\end{bmatrix}\\) are three vectors in \\(\\mathbb{R}^3\\), but every combination of them has third entry \\(0\\)."}, {"html": "Yes, but only when all three vectors are multiples of one vector.", "ok": false, "comment": "Lines are one way to fall short, but not the only way. The vectors \\(\\begin{bmatrix}1\\\\0\\\\1\\end{bmatrix}\\), \\(\\begin{bmatrix}0\\\\1\\\\1\\end{bmatrix}\\), and \\(\\begin{bmatrix}1\\\\1\\\\2\\end{bmatrix}\\) are not multiples of each other, yet every combination satisfies \\(z=x+y\\)."}, {"html": "No. Three vectors span \\(\\mathbb{R}^3\\) as long as none of them is the zero vector.", "ok": false, "comment": "A nonzero vector is not enough. Take \\(\\begin{bmatrix}1\\\\0\\\\0\\end{bmatrix}\\), \\(\\begin{bmatrix}2\\\\0\\\\0\\end{bmatrix}\\), and \\(\\begin{bmatrix}0\\\\1\\\\1\\end{bmatrix}\\): all are nonzero, but every combination has second entry equal to third, so \\(\\begin{bmatrix}0\\\\1\\\\0\\end{bmatrix}\\) is missed."}, {"html": "Yes. If the three vectors lie in one plane through the origin, every combination of them stays in that plane.", "ok": true, "comment": "Right. Combinations of vectors in a plane through the origin stay in that plane, so their span can fall short of \\(\\mathbb{R}^3\\). Counting the vectors settles nothing."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> We have two questions about one set of three vectors: whether \\(\\mathbf b\\) is one of their combinations, and whether every vector in \\(\\mathbb{R}^3\\) is. Both come down to a system of equations in the weights \\(c_1,c_2,c_3\\).<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "phase": "Plan", "cta": "Got it. On to Phase 2: Plan."}, {"type": "write", "text": "Before you start, write your plan in 1–3 sentences: which method, and which step needs care?", "phase": "Plan", "model": "<p>Put \\(\\mathbf v_1,\\mathbf v_2,\\mathbf v_3\\) in as the first three columns of a matrix, with \\(\\mathbf b\\) as the last column, and row-reduce. If the last column never gets a pivot, \\(\\mathbf b\\) is in \\(U\\). The pivots in the first three columns show whether the vectors reach all of \\(\\mathbb{R}^3\\). The step that needs care is the setup: each vector is a column, not a row.<\/p>"}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: build the augmented matrix whose first three columns are \\(\\mathbf v_1,\\mathbf v_2,\\mathbf v_3\\) and whose last column is \\(\\mathbf b\\), row-reduce it, and read both answers from the reduced form.<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "mc", "text": "Which is the reduced row-echelon form of that augmented matrix?", "phase": "Carry out", "answers": [{"html": "\\(\\left[\\begin{array}{ccc|c}1&0&1&2\\\\0&1&1&1\\\\0&0&0&0\\end{array}\\right]\\)", "ok": true, "comment": "Right. The left block has leading 1s in columns 1 and 2 only, so \\(c_3\\) is free to choose. The last row reads \\(0\\ 0\\ 0\\mid 0\\), which is consistent."}, {"html": "\\(\\left[\\begin{array}{ccc|c}1&0&1&4\\\\0&1&1&5\\\\0&0&0&2\\end{array}\\right]\\)", "ok": false, "comment": "The left side is right, but the right-hand column changes with every row operation too. Here it stayed as \\(\\mathbf b\\), so the last row reads \\(0=2\\)."}, {"html": "\\(\\left[\\begin{array}{ccc|c}1&0&-\\tfrac13&0\\\\0&1&\\tfrac23&0\\\\0&0&0&1\\end{array}\\right]\\)", "ok": false, "comment": "This is the reduced form when the vectors go in as rows. Each \\(\\mathbf v_i\\) should be one column of the matrix, with its entries going down."}, {"html": "\\(\\left[\\begin{array}{ccc|c}1&0&1&2\\\\0&1&1&1\\\\0&0&0&1\\end{array}\\right]\\)", "ok": false, "comment": "An arithmetic slip in the last column. After \\(R_3\\to R_3-R_1\\) that entry is \\(-2\\), and adding \\(2\\) times row 2 (which has \\(1\\) there) gives \\(-2+2=0\\), not \\(1\\)."}]}, {"type": "mc", "text": "Read both answers from that reduced form. Which pair is correct, for (a) and for (b)?", "phase": "Carry out", "answers": [{"html": "(a) Yes. (b) Yes, because three vectors in \\(\\mathbb{R}^3\\) span \\(\\mathbb{R}^3\\).", "ok": false, "comment": "Three vectors do not automatically span \\(\\mathbb{R}^3\\). The left block has only two leading 1s, so \\(\\begin{bmatrix}0\\\\0\\\\1\\end{bmatrix}\\) cannot be reached: it would make the last row read \\(0=1\\). Part (a) is right."}, {"html": "(a) No, because the last entry of \\(\\mathbf b\\) does not fit. (b) No.", "ok": false, "comment": "Careful: one entry can look wrong before you solve the whole system. Here \\(2\\mathbf v_1+\\mathbf v_2\\) equals \\(\\mathbf b\\) in all three entries."}, {"html": "(a) Yes, \\(\\mathbf b\\) is in \\(U\\). (b) No, \\(U\\neq\\mathbb{R}^3\\).", "ok": true, "comment": "Right. (a) \\(2\\mathbf v_1+\\mathbf v_2=\\mathbf b\\), so \\(\\mathbf b\\) is in \\(U\\). (b) The left block has only two leading 1s, so the vectors miss some of \\(\\mathbb{R}^3\\). For example, \\(\\begin{bmatrix}0\\\\0\\\\1\\end{bmatrix}\\) would make the last row read \\(0=1\\)."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The answers are (a) yes, \\(\\mathbf b\\) is in \\(U\\), and (b) no, \\(U\\neq\\mathbb{R}^3\\).<\/p><p>Last phase: <strong>look back<\/strong>. Test the answer against the vectors themselves, not by repeating the row operations.<\/p>", "phase": "Look back", "cta": "Got it. On to Phase 4: Look back."}, {"type": "write", "text": "Choose a check of your own and carry it out. What did you check, and did it pass?", "phase": "Look back", "model": "<p>I checked the combination \\(2\\mathbf v_1+\\mathbf v_2\\), which is the one with \\(c_3=0\\). Multiplying it out: \\(2\\begin{bmatrix}1\\\\2\\\\1\\end{bmatrix}+\\begin{bmatrix}2\\\\1\\\\0\\end{bmatrix}=\\begin{bmatrix}4\\\\5\\\\2\\end{bmatrix}=\\mathbf b\\). It passed, so \\(\\mathbf b\\) is in \\(U\\).<\/p>"}, {"type": "mc", "text": "Now change the last entry of \\(\\mathbf b\\) from \\(2\\) to \\(3\\), and keep \\(\\mathbf v_1,\\mathbf v_2,\\mathbf v_3\\) as they are. Is \\(\\begin{bmatrix}4\\\\5\\\\3\\end{bmatrix}\\) in \\(U\\)?", "phase": "Look back", "answers": [{"html": "No. The left side is the same, so the same row operations work, and the last row reads \\(0=1\\).", "ok": true, "comment": "Right. Only the right-hand column moves, so the last row becomes \\(0\\ 0\\ 0\\mid 1\\), which says \\(0=1\\). That cannot hold, so this vector is not in \\(U\\)."}, {"html": "Yes. Three vectors in \\(\\mathbb{R}^3\\) span \\(\\mathbb{R}^3\\), so every vector is in \\(U\\).", "ok": false, "comment": "They do not span \\(\\mathbb{R}^3\\). The vectors miss some of it, for example \\(\\begin{bmatrix}0\\\\0\\\\1\\end{bmatrix}\\), so whether a given vector is in \\(U\\) depends on which vector it is."}, {"html": "Yes. The first two entries still match \\(2\\mathbf v_1+\\mathbf v_2\\).", "ok": false, "comment": "Check the last entry. \\(2\\mathbf v_1+\\mathbf v_2\\) is \\(\\begin{bmatrix}4\\\\5\\\\2\\end{bmatrix}\\), whose last entry is \\(2\\), not \\(3\\). Matching two of the three entries is not enough."}]}, {"type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate typed \\(\\mathbf v_1,\\mathbf v_2,\\mathbf v_3\\) in as rows instead of columns, row-reduced, and got a last row reading \\(0=1\\). They concluded that \\(\\mathbf b\\) is not in \\(U\\). What step did they skip? Then name one habit from this problem you want to use on the next one.<\/p>", "phase": "Look back"}]};</script>
