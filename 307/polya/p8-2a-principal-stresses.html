<script>window.POLYA = {"slug": "p8-2a-principal-stresses", "title": "8.2 Problem A: Principal stresses in a plate", "statement": "At one point in a thin plate, the stress matrix, with coordinates along the plate’s edges and in MPa, is \\(S=\\begin{bmatrix}6&2\\\\2&9\\end{bmatrix}\\). Find an orthogonal matrix \\(P\\) (one with \\(P^{T}=P^{-1}\\)) and a diagonal matrix \\(D\\) with \\(P^{T}SP=D\\). Put the eigenvalues of \\(S\\) on the diagonal of \\(D\\) in increasing order, and choose the sign of each column of \\(P\\) so that its first entry is positive.", "questions": [{"type": "write", "text": "In your own words, what will a finished answer to this problem look like?", "phase": "Understand", "model": "<p>We need an orthogonal \\(P\\) and a diagonal \\(D\\) with \\(P^{T}SP=D\\). Because \\(S\\) is symmetric, the Principal Axes Theorem says \\(S\\) is orthogonally diagonalizable, so such a \\(P\\) exists. A finished answer is \\(P\\), with two unit columns that are perpendicular to each other, together with \\(D\\), which lists the matching eigenvalues in increasing order.<\/p>"}, {"type": "write", "text": "Before you start, write your plan in 1–3 sentences: what will you do, in what order?", "phase": "Plan", "model": "<p>I’ll find the eigenvalues of \\(S\\) from the characteristic polynomial \\(\\det(xI-S)\\). For each eigenvalue I’ll find an eigenvector and divide it by its length, then put the results in \\(P\\) in the same order as \\(D\\). The step that needs care is dividing by the length: the columns of \\(P\\) must have length \\(1\\), not just be perpendicular.<\/p>"}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: find the eigenvalues of \\(S\\) from \\(\\det(xI-S)\\), then an eigenvector for each one, scaled to length \\(1\\), with the signs set as the problem asks. Put the unit eigenvectors in the columns of \\(P\\), in the order of the eigenvalues on the diagonal of \\(D\\).<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "mc", "text": "What are the eigenvalues of \\(S\\)?", "phase": "Carry out", "answers": [{"html": "\\(6\\) and \\(9\\)", "ok": false, "comment": "Those are the diagonal entries of \\(S\\). They would be the eigenvalues only if \\(S\\) were diagonal, and the \\(2\\)s off the diagonal change the answer."}, {"html": "\\(-10\\) and \\(-5\\)", "ok": false, "comment": "Those are the roots of \\(x^{2}+15x+50\\), a sign slip on the middle term. The characteristic polynomial has \\(-15x\\), so the eigenvalues add up to \\(+15\\)."}, {"html": "\\(5\\) and \\(10\\)", "ok": true, "comment": "Right. \\(\\det(xI-S)=(x-6)(x-9)-4=x^{2}-15x+50=(x-5)(x-10)\\). The corollary at the end of this section says the eigenvalues add up to the trace, \\(15\\), and multiply to the determinant, \\(50\\)."}, {"html": "\\(15\\) and \\(50\\)", "ok": false, "comment": "Those are the trace (\\(6+9=15\\)) and the determinant (\\(6\\cdot 9-2\\cdot 2=50\\)) of \\(S\\). The eigenvalues add up to the trace and multiply to the determinant, but they are not those two numbers."}]}, {"type": "mc", "text": "Which of these matrices works as \\(P\\)?", "phase": "Carry out", "answers": [{"html": "\\(\\dfrac{1}{5}\\begin{bmatrix}2&1\\\\-1&2\\end{bmatrix}\\)", "ok": false, "comment": "You divided by \\(5\\), which is the squared length. Divide by the length, \\(\\sqrt5\\), instead: with \\(5\\) in the denominator, each column has length \\(1/\\sqrt5\\), and \\(P^{T}P=\\tfrac15 I\\)."}, {"html": "\\(\\begin{bmatrix}2&1\\\\-1&2\\end{bmatrix}\\)", "ok": false, "comment": "The columns are perpendicular, but each has length \\(\\sqrt5\\), so \\(P^{T}P=5I\\) and \\(P^{T}\\neq P^{-1}\\). Divide each column by its length to get unit vectors."}, {"html": "\\(\\dfrac{1}{\\sqrt{5}}\\begin{bmatrix}1&2\\\\2&-1\\end{bmatrix}\\)", "ok": false, "comment": "Both columns are unit eigenvectors, but they are in the wrong order: the first belongs to \\(10\\), so \\(P^{T}SP\\) has \\(10\\) before \\(5\\). Keep each eigenvector next to its eigenvalue."}, {"html": "\\(\\dfrac{1}{\\sqrt{5}}\\begin{bmatrix}2&1\\\\1&2\\end{bmatrix}\\)", "ok": false, "comment": "Sign slip: the first row of \\(S-5I\\) gives \\(x+2y=0\\), so \\(x=-2y\\), and the eigenvector is \\((2,-1)\\), not \\((2,1)\\). Check it: \\(S\\begin{bmatrix}2\\\\1\\end{bmatrix}=\\begin{bmatrix}14\\\\13\\end{bmatrix}\\), which is not a multiple of \\((2,1)\\)."}, {"html": "\\(\\dfrac{1}{\\sqrt{5}}\\begin{bmatrix}2&1\\\\-1&2\\end{bmatrix}\\)", "ok": true, "comment": "Right. Each column is an eigenvector divided by its length, \\(\\sqrt5\\): \\((2,-1)\\) goes with \\(5\\), and \\((1,2)\\) goes with \\(10\\). So \\(P^{T}P=I\\), and \\(P^{T}SP\\) has \\(5\\) and \\(10\\) on its diagonal."}]}, {"type": "write", "text": "Check your answer yourself. Describe what you checked, and whether it passed.", "phase": "Look back", "model": "<p>I checked that \\(P^{T}P=I\\), so the columns are unit vectors that are perpendicular and \\(P^{T}=P^{-1}\\). Then I computed \\(P^{T}SP\\) and got a diagonal matrix with \\(5\\) and \\(10\\) on the diagonal, which is \\(D\\). Both checks passed.<\/p>"}, {"type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). The two eigenvectors of \\(S\\) came out perpendicular with no extra work. Why was that guaranteed here?<\/p>", "phase": "Look back"}]};</script>
