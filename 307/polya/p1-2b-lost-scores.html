<script>window.POLYA = {"slug": "p1-2b-lost-scores", "title": "1.2 Problem B: The lost scores", "statement": "A tournament’s individual scores were lost; only some pair totals survive.<br>(a) <em>Three players.<\/em> Players 1 and 2 scored 11 together, players 2 and 3 scored 15, and players 3 and 1 scored 12. Can the individual scores be recovered?<br>(b) <em>Four players.<\/em> The totals are 11 (players 1 and 2), 15 (2 and 3), 13 (3 and 4) and 9 (4 and 1). Can the scores be recovered now?", "questions": [{"phase": "Understand", "type": "mc", "text": "Call the scores \\(s_1, s_2, \\dots\\). What does it mean for the scores to be \"recovered\"?", "answers": [{"html": "We can find the pair totals.", "ok": false, "comment": "The pair totals are given. The unknowns are the individual scores."}, {"html": "We can find at least one list of scores that fits the totals.", "ok": false, "comment": "A list that fits might be one of many. If two different lists fit, we can’t tell which one really happened, so nothing is recovered."}, {"html": "We can tell who won.", "ok": false, "comment": "Who won depends on the scores, but the question asks whether the scores themselves are determined."}, {"html": "The totals allow exactly one possible list of scores.", "ok": true, "comment": "Right. Finding <em>a<\/em> list that fits isn’t enough; we need to know it is the <em>only<\/em> one."}]}, {"phase": "Understand", "type": "mc", "text": "Which system of equations describes part (a)?", "answers": [{"html": "\\(\\begin{aligned} s_1 + s_2 &= 11\\\\ s_2 + s_3 &= 12\\\\ s_3 + s_1 &= 15\\end{aligned}\\)", "ok": false, "comment": "Check which pair goes with which total: players 2 and 3 scored 15, players 3 and 1 scored 12."}, {"html": "\\(s_1 + s_2 + s_3 = 38\\)", "ok": false, "comment": "Adding the three totals counts each player twice, so the scores add to 19, not 38. And one equation keeps less information than three."}, {"html": "\\(\\begin{aligned} s_1 + s_2 &= 11\\\\ s_2 + s_3 &= 15\\\\ s_3 + s_1 &= 12\\end{aligned}\\)", "ok": true, "comment": "Yes: one equation per known pair total."}, {"html": "\\(s_1 = 11,\\ s_2 = 15,\\ s_3 = 12\\)", "ok": false, "comment": "Each total is the sum of <em>two<\/em> players’ scores, not one player’s score."}]}, {"phase": "Understand", "type": "mc", "text": "In the language of Section 1.2, what has to be true for the scores to be recovered?", "answers": [{"html": "The system is consistent and its coefficient matrix has a leading 1 in every column (rank = number of unknowns).", "ok": true, "comment": "Right. That is Theorem 1.2.2: a consistent system with rank \\(r = n\\) has a unique solution."}, {"html": "There are as many equations as unknowns.", "ok": false, "comment": "Tempting, and it holds in both parts of this problem. Keep an eye on part (b) before trusting this."}, {"html": "The system is consistent.", "ok": false, "comment": "Consistent means at least one solution. Recovery needs exactly one, so consistency alone isn’t enough."}, {"html": "All the totals are positive.", "ok": false, "comment": "The signs of the totals have nothing to do with how many solutions there are."}]}, {"phase": "Plan", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> Recovered means <em>exactly one<\/em> solution. For (a) the system is \\(\\begin{aligned} s_1 + s_2 &= 11\\\\ s_2 + s_3 &= 15\\\\ s_3 + s_1 &= 12\\end{aligned}\\), and by Theorem 1.2.2 we need a consistent system with a leading 1 in every variable column.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 2: Plan."}, {"phase": "Plan", "type": "multi", "text": "Which of these plans would settle part (a)? Select all that apply.", "answers": [{"html": "Count: three equations and three unknowns, so the answer is yes.", "ok": false, "comment": "Counting equations doesn’t decide it. Part (b) has four equations and four unknowns. Wait and see."}, {"html": "Row-reduce the augmented matrix and check for a leading 1 in each of the three variable columns.", "ok": true, "comment": "This is the general plan, and it is the one we’ll use for part (b) too."}, {"html": "Find scores that fit by trial and error.", "ok": false, "comment": "Finding one list that fits doesn’t show it’s the only one, and that was the whole question."}, {"html": "Add all three equations to get \\(2(s_1 + s_2 + s_3) = 38\\), then subtract each pair total from \\(s_1 + s_2 + s_3\\).", "ok": true, "comment": "Clever, and it works for (a): it produces each score, so the answer is unique. Notice it relies on the special shape of these equations, while row reduction always works."}]}, {"phase": "Plan", "type": "mc", "text": "Which result from Section 1.2 tells you whether a system has exactly one solution?", "answers": [{"html": "Theorem 1.2.1: every matrix can be carried to reduced row-echelon form.", "ok": false, "comment": "True and useful (it says the plan can always be carried out), but it doesn’t say how many solutions there are."}, {"html": "Theorem 1.2.2: a consistent system of rank \\(r\\) in \\(n\\) variables has \\(n - r\\) parameters, so \\(r = n\\) means a unique solution.", "ok": true, "comment": "Right: the parameter count is the test."}, {"html": "More variables than equations means infinitely many solutions.", "ok": false, "comment": "That needs a consistent system, and here the counts are equal anyway."}, {"html": "A row of zeros means there is no solution.", "ok": false, "comment": "A zero row says \\(0 = 0\\). It points to a parameter, not to an inconsistency."}]}, {"phase": "Carry out", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: row-reduce the augmented matrix \\(\\left[\\begin{array}{ccc|c} 1&1&0&11\\\\ 0&1&1&15\\\\ 1&0&1&12\\end{array}\\right]\\), and count leading 1s.<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 3: Carry out."}, {"phase": "Carry out", "type": "mc", "text": "Do \\(R_3 \\to R_3 - R_1\\), then \\(R_3 \\to R_3 + R_2\\). What is the new row 3?", "answers": [{"html": "\\(\\left[\\begin{array}{ccc|c} 0 & -2 & 0 & -14\\end{array}\\right]\\)", "ok": false, "comment": "That is \\(R_3 - R_1 - R_2\\). The second step adds \\(R_2\\)."}, {"html": "\\(\\left[\\begin{array}{ccc|c} 0 & 0 & 2 & 27\\end{array}\\right]\\)", "ok": false, "comment": "The augmented column changes too: \\(12 - 11 = 1\\) after the first step, then \\(1 + 15 = 16\\)."}, {"html": "\\(\\left[\\begin{array}{ccc|c} 0 & 0 & 2 & 16\\end{array}\\right]\\)", "ok": true, "comment": "Right: \\(R_3 - R_1 = [\\,0\\ \\ {-1}\\ \\ 1 \\mid 1\\,]\\), and adding \\(R_2\\) gives \\([\\,0\\ \\ 0\\ \\ 2 \\mid 16\\,]\\)."}, {"html": "\\(\\left[\\begin{array}{ccc|c} 0 & 0 & 0 & 16\\end{array}\\right]\\)", "ok": false, "comment": "Recheck the third entry: \\(1 - 0 = 1\\) after the first step, then \\(1 + 1 = 2\\)."}]}, {"phase": "Carry out", "type": "num", "text": "So what is \\(s_3\\)? (Type a number.)", "value": 8.0, "comment": "Row 3 says \\(2s_3 = 16\\), so \\(s_3 = 8\\)."}, {"phase": "Carry out", "type": "mc", "text": "Finish the reduction. What are \\(s_1\\) and \\(s_2\\)?", "answers": [{"html": "\\(s_1 = 7,\\ s_2 = 4\\)", "ok": false, "comment": "Check against \\(s_2 + s_3 = 15\\): \\(4 + 8 = 12\\). Use row 2 first: \\(s_2 = 15 - s_3\\)."}, {"html": "\\(s_1 = 4,\\ s_2 = 7\\)", "ok": true, "comment": "Right: \\(s_2 = 15 - 8 = 7\\) and \\(s_1 = 11 - 7 = 4\\)."}, {"html": "\\(s_1 = 3,\\ s_2 = 8\\)", "ok": false, "comment": "Check \\(s_3 + s_1 = 12\\): \\(8 + 3 = 11\\)."}, {"html": "They can’t be determined.", "ok": false, "comment": "Every variable column has a leading 1, so each score is determined. Back-substitute from \\(s_3 = 8\\)."}]}, {"phase": "Carry out", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> Part (a): three leading 1s, so exactly one solution: \\(s_1 = 4,\\ s_2 = 7,\\ s_3 = 8\\). The scores <em>are<\/em> recovered.<\/p><p>Now carry out the same plan for part (b).<\/p>", "cta": "Got it. Keep going."}, {"phase": "Carry out", "type": "mc", "text": "Part (b) has augmented matrix \\(\\left[\\begin{array}{cccc|c} 1&1&0&0&11\\\\ 0&1&1&0&15\\\\ 0&0&1&1&13\\\\ 1&0&0&1&9\\end{array}\\right]\\). What does its reduced row-echelon form look like?", "answers": [{"html": "Two leading 1s and two zero rows.", "ok": false, "comment": "Only one row becomes zero; rows 1 to 3 each keep a leading 1."}, {"html": "Four leading 1s: exactly one solution.", "ok": false, "comment": "Row 4 reduces to all zeros: \\(R_4 - R_1 + R_2 - R_3\\) is \\([\\,0\\ 0\\ 0\\ 0 \\mid 9 - 11 + 15 - 13\\,] = [\\,0\\ 0\\ 0\\ 0 \\mid 0\\,]\\)."}, {"html": "Three leading 1s and a row \\([\\,0\\ 0\\ 0\\ 0 \\mid c\\,]\\) with \\(c \\neq 0\\): no solution.", "ok": false, "comment": "Recheck the last entry: \\(9 - 11 + 15 - 13 = 0\\). The data are consistent (real scores produced them)."}, {"html": "Three leading 1s and a row \\([\\,0\\ 0\\ 0\\ 0 \\mid 0\\,]\\): consistent, with one parameter.", "ok": true, "comment": "Right. The reduced form is \\(\\left[\\begin{array}{cccc|c} 1&0&0&1&9\\\\ 0&1&0&-1&2\\\\ 0&0&1&1&13\\\\ 0&0&0&0&0\\end{array}\\right]\\), so \\(s_4\\) is a parameter."}]}, {"phase": "Carry out", "type": "mc", "text": "So, can the four scores be recovered?", "answers": [{"html": "No. Infinitely many score lists fit the totals, one for each value of the parameter \\(s_4 = t\\).", "ok": true, "comment": "Right: \\(s_1 = 9 - t,\\ s_2 = 2 + t,\\ s_3 = 13 - t,\\ s_4 = t\\)."}, {"html": "No, because the totals contradict each other.", "ok": false, "comment": "The system is consistent (no \\(0 = c\\) row). The trouble is too many solutions, not none."}, {"html": "Yes: four equations, four unknowns.", "ok": false, "comment": "Here is the counterexample to counting: four equations, but one of them is a combination of the other three."}, {"html": "Yes, because the system is consistent.", "ok": false, "comment": "Consistent means at least one solution; we need exactly one."}]}, {"phase": "Look back", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> (a) Yes: \\(s_1 = 4,\\ s_2 = 7,\\ s_3 = 8\\). (b) No: \\(s_1 = 9 - t,\\ s_2 = 2 + t,\\ s_3 = 13 - t,\\ s_4 = t\\) all fit.<\/p><p>Last phase: <strong>look back<\/strong>. Can we see <em>why<\/em> four players fail, and what happens with more players?<\/p>", "cta": "Got it. On to Phase 4: Look back."}, {"phase": "Look back", "type": "mc", "text": "Start from any score list that fits part (b). Which change keeps all four pair totals the same?", "answers": [{"html": "Swap the scores of players 1 and 2.", "ok": false, "comment": "The 2-and-3 total becomes \\(s_1 + s_3\\) instead of \\(s_2 + s_3\\); that changes unless \\(s_1 = s_2\\)."}, {"html": "Add 1 to players 1 and 2; subtract 1 from players 3 and 4.", "ok": false, "comment": "The pair 1 and 2 goes up by 2, and the pair 3 and 4 goes down by 2."}, {"html": "Add 1 to players 1 and 3; subtract 1 from players 2 and 4.", "ok": true, "comment": "Yes. Every pair has one \"+1\" player and one \"\\(-1\\)\" player, so no total changes. That is the parameter, made visible."}, {"html": "Add 1 to every player.", "ok": false, "comment": "Then every pair total goes up by 2."}]}, {"phase": "Look back", "type": "mc", "text": "Why doesn’t that trick work with three players?", "answers": [{"html": "The trick does work for three players.", "ok": false, "comment": "Try it: \\(+1, -1, +1\\) changes the players-3-and-1 total by 2."}, {"html": "Three players’ scores are always positive.", "ok": false, "comment": "Signs of scores don’t matter here."}, {"html": "With three players there are fewer equations.", "ok": false, "comment": "Three players have three equations, the same as unknowns, just like four players have four."}, {"html": "Going around the circle, \\(+1, -1, +1\\) puts two \"\\(+1\\)\" players side by side (players 3 and 1), so their total changes.", "ok": true, "comment": "Right. With an odd number of players the signs can’t alternate all the way around."}]}, {"phase": "Look back", "type": "mc", "text": "Generalize: with \\(n\\) players and totals for pairs 1&amp;2, 2&amp;3, ..., \\(n\\)&amp;1 (around a circle), for which \\(n\\) can the scores always be recovered?", "answers": [{"html": "Odd \\(n\\) only.", "ok": true, "comment": "Right. For even \\(n\\) the alternating trick gives a parameter; for odd \\(n\\) the rank is \\(n\\)."}, {"html": "Even \\(n\\) only.", "ok": false, "comment": "Reversed: even \\(n\\) is exactly when the alternating trick works, so recovery fails."}, {"html": "Every \\(n \\geq 3\\).", "ok": false, "comment": "Part (b) is a counterexample at \\(n = 4\\)."}, {"html": "Only \\(n = 3\\).", "ok": false, "comment": "Try the trick with \\(n = 5\\): the signs can’t alternate all the way around, so it fails."}]}, {"phase": "Look back", "type": "mc", "text": "Does the answer make sense in context? Scores are whole numbers and can’t be negative. How many score lists fit part (b)?", "answers": [{"html": "14", "ok": false, "comment": "\\(s_3 = 13 - t \\geq 0\\) allows \\(t\\) up to 13, but \\(s_1 = 9 - t \\geq 0\\) stops at 9."}, {"html": "10", "ok": true, "comment": "Right: \\(s_4 = t\\) and \\(s_1 = 9 - t\\) force \\(t = 0, 1, \\dots, 9\\); then \\(s_2 = 2 + t\\) and \\(s_3 = 13 - t\\) are fine."}, {"html": "1", "ok": false, "comment": "\\(t = 5\\) gives one list that fits, but so does \\(t = 4\\): \\((5, 6, 9, 4)\\)."}, {"html": "Infinitely many", "ok": false, "comment": "Mathematically yes, but the context rules most out: \\(s_1 = 9 - t\\) and \\(s_4 = t\\) can’t be negative."}]}, {"phase": "Look back", "type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). Part (b) had as many equations as unknowns and still failed. What does that tell you about \"counting equations\"? And which phase of this problem was hardest for you?<\/p>"}]};</script>
