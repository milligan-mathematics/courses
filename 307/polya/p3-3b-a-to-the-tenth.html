<script>window.POLYA = {"slug": "p3-3b-a-to-the-tenth", "title": "3.3 Problem B: What is A to the tenth?", "statement": "The matrix \\(A=\\begin{bmatrix}-4&3\\\\-6&5\\end{bmatrix}\\) factors as \\(A=PDP^{-1}\\), where \\(P=\\begin{bmatrix}1&1\\\\1&2\\end{bmatrix}\\), \\(D=\\begin{bmatrix}-1&0\\\\0&2\\end{bmatrix}\\), and \\(P^{-1}=\\begin{bmatrix}2&-1\\\\-1&1\\end{bmatrix}\\). The columns of \\(P\\) are eigenvectors of \\(A\\), listed in the same order as the diagonal entries of \\(D\\). Find a formula for \\(A^n\\) that works for every whole number \\(n\\ge 0\\), with \\(A^0=I\\). Then use it to find \\(A^{10}\\).", "questions": [{"phase": "Understand", "type": "write", "text": "In your own words, what is this problem asking for?", "model": "<p>It asks for a formula for \\(A^n\\) that works for every whole number \\(n\\), and then for \\(A^{10}\\) itself. The factorization \\(A=PDP^{-1}\\) is given, so the question is what that factorization tells us about powers of \\(A\\).<\/p>"}, {"phase": "Understand", "type": "mc", "text": "Try the special case \\(n=1\\). What is \\(A^1\\)?", "answers": [{"html": "\\(\\begin{bmatrix}-1&2\\\\-1&4\\end{bmatrix}\\)", "ok": false, "comment": "That is \\(PD\\). It leaves out \\(P^{-1}\\), so it isn’t \\(A\\) either."}, {"html": "\\(\\begin{bmatrix}-4&3\\\\-6&5\\end{bmatrix}\\)", "ok": true, "comment": "The first power of \\(A\\) is \\(A\\) itself, so any formula for \\(A^n\\) has to return \\(A\\) when \\(n=1\\). Keep that as a test."}, {"html": "\\(\\begin{bmatrix}-1&0\\\\0&2\\end{bmatrix}\\)", "ok": false, "comment": "That is the middle factor \\(D\\) by itself. The first power of \\(A\\) also needs \\(P\\) and \\(P^{-1}\\)."}, {"html": "\\(\\begin{bmatrix}1&0\\\\0&1\\end{bmatrix}\\)", "ok": false, "comment": "That is \\(I\\), which is \\(A^0\\), the power with \\(n=0\\). The first power, \\(n=1\\), is \\(A\\) itself."}]}, {"phase": "Plan", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> We want one formula for \\(A^n\\) that works for every \\(n\\). It has to give \\(A\\) at \\(n=1\\), and we have \\(A=PDP^{-1}\\) to work with, so \\(P\\), \\(D\\), and \\(P^{-1}\\) are the pieces we can use.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 2: Plan."}, {"phase": "Plan", "type": "write", "text": "Before you start, write your plan in 1–3 sentences: which method, and which step needs care?", "model": "<p>Use \\(A=PDP^{-1}\\): the \\(P^{-1}P\\) pairs in the middle cancel, so \\(A^n=PD^nP^{-1}\\), and raising the diagonal matrix \\(D\\) to the nth power is easy. The step that needs care is the order, with \\(P\\) on the left and \\(P^{-1}\\) on the right. The notes’ example that computes \\(A^3\\) as \\(PD^3P^{-1}\\) does the same thing with \\(n=3\\).<\/p>"}, {"phase": "Carry out", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan we follow: raise \\(D\\) to the nth power, then form \\(PD^nP^{-1}\\), with \\(P\\) on the left and \\(P^{-1}\\) on the right. We start with \\(D^n\\).<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 3: Carry out."}, {"phase": "Carry out", "type": "mc", "text": "What is \\(D^n\\)?", "answers": [{"html": "\\(\\begin{bmatrix}(-1)^n&0\\\\0&2^n\\end{bmatrix}\\)", "ok": true, "comment": "Each diagonal entry is raised to the nth power, and the zeros stay zero. Note that \\((-1)^n\\) alternates between \\(1\\) and \\(-1\\), so it can’t be replaced by \\(-1\\)."}, {"html": "\\(\\begin{bmatrix}(-1)^n&0\\\\0&2n\\end{bmatrix}\\)", "ok": false, "comment": "The 2 became \\(2n\\), a multiple, instead of \\(2^n\\), a power. Check with \\(n=3\\): \\(2\\cdot 3=6\\), but \\(2^3=8\\)."}, {"html": "\\(\\begin{bmatrix}-1&0\\\\0&2^n\\end{bmatrix}\\)", "ok": false, "comment": "You raised the 2 to the nth power but kept the \\(-1\\) as it is. The \\(-1\\) gets raised to the nth power too, and \\((-1)^2=1\\), not \\(-1\\)."}, {"html": "\\(\\begin{bmatrix}-n&0\\\\0&2n\\end{bmatrix}\\)", "ok": false, "comment": "That is \\(nD\\), which multiplies every entry by \\(n\\). A power is not a multiple. Each diagonal entry is multiplied by itself \\(n\\) times."}]}, {"phase": "Carry out", "type": "mc", "text": "Which product gives \\(A^n\\) for every \\(n\\)?", "answers": [{"html": "\\(PD^nP^{-1}\\)", "ok": true, "comment": "Only \\(D\\) gets raised to the power. In \\((PDP^{-1})^n\\), each inner \\(P^{-1}P\\) cancels to \\(I\\), which leaves \\(PD^nP^{-1}\\)."}, {"html": "\\(P\\begin{bmatrix}2^n&0\\\\0&(-1)^n\\end{bmatrix}P^{-1}\\)", "ok": false, "comment": "The eigenvalues are in the wrong order. The 2 belongs with the second column of \\(P\\), \\(\\begin{bmatrix}1\\\\2\\end{bmatrix}\\), but here \\(2^n\\) sits next to the first column."}, {"html": "\\(P^nD^n(P^{-1})^n\\)", "ok": false, "comment": "This raises \\(P\\) and \\(P^{-1}\\) to the nth power too, but only \\(D\\) should be raised to a power. At \\(n=1\\) it still gives \\(A\\), so the check at the start can’t rule it out."}, {"html": "\\(P^{-1}D^nP\\)", "ok": false, "comment": "The inverse is on the wrong side. With \\(P^{-1}\\) on the left, \\(P^{-1}D^nP\\) at \\(n=1\\) is \\(\\begin{bmatrix}-4&-6\\\\3&5\\end{bmatrix}\\), not \\(A\\)."}, {"html": "\\(\\begin{bmatrix}(-4)^n&3^n\\\\(-6)^n&5^n\\end{bmatrix}\\)", "ok": false, "comment": "That raises each entry of \\(A\\) to the nth power, which is not how matrix powers work. For example, the \\((1,1)\\) entry of \\(A^2\\) is \\((-4)(-4)+3(-6)\\), not \\((-4)^2\\)."}]}, {"phase": "Carry out", "type": "num", "text": "Use your formula with \\(n=10\\). What is the entry in row 1, column 2 of \\(A^{10}\\)?", "value": 1023.0, "comment": "The \\((1,2)\\) entry of \\(PD^nP^{-1}\\) is \\(2^n-(-1)^n\\). With \\(n=10\\) that is \\(1024-1=1023\\), since \\((-1)^{10}=1\\)."}, {"phase": "Look back", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> We have \\(A^n=PD^nP^{-1}\\), with \\(D^n=\\begin{bmatrix}(-1)^n&0\\\\0&2^n\\end{bmatrix}\\), and the \\((1,2)\\) entry of \\(A^{10}\\) is \\(1023\\).<\/p><p>Last phase: <strong>look back<\/strong>. Does the answer survive a test you didn’t use to build it?<\/p>", "cta": "Got it. On to Phase 4: Look back."}, {"phase": "Look back", "type": "mc", "text": "Which check is a real test that your formula is right?", "answers": [{"html": "Check that every entry of \\(A^{10}\\) is a whole number.", "ok": false, "comment": "Every choice in the earlier question gives whole numbers, since each is built from whole-number matrices and powers. So this check can’t catch a mistake."}, {"html": "Check that the formula gives \\(A\\) when \\(n=1\\), as you did at the start.", "ok": false, "comment": "That is the check from the start, and it can’t see everything. Raising each entry to the first power, or raising \\(P\\) and \\(P^{-1}\\) to the first power, also gives \\(A\\) when \\(n=1\\)."}, {"html": "Multiply \\(A\\) by itself to get \\(A^2\\), and compare it with your formula at \\(n=2\\).", "ok": true, "comment": "\\(A^2\\) is a power you can compute by hand, and a correct formula has to match it. Each wrong choice from the earlier question gives a different matrix at \\(n=2\\)."}, {"html": "Check that the formula gives \\(I\\) when \\(n=0\\).", "ok": false, "comment": "At \\(n=0\\) the correct formula gives \\(I\\), and so does \\(P^{-1}D^0P\\). A check that two different formulas both pass can’t tell them apart."}]}, {"phase": "Look back", "type": "mc", "text": "As \\(n\\) gets large, what happens to the entries of \\(A^n\\)?", "answers": [{"html": "They settle down to fixed numbers, because the powers of \\(A\\) approach \\(I\\).", "ok": false, "comment": "The \\(2^n\\) in the formula doubles every time \\(n\\) goes up by 1, so the entries keep growing and never settle."}, {"html": "They shrink toward \\(0\\), since the entries of \\(A\\) are small.", "ok": false, "comment": "The entries of \\(A\\) are small, but the powers aren’t. Each step up in \\(n\\) doubles the \\(2^n\\) part, so the entries get larger."}, {"html": "They grow, but only in proportion to \\(n\\), like \\(10n\\).", "ok": false, "comment": "The growth is exponential, not linear. At \\(n=10\\), \\(2^n=1024\\) while \\(10n=100\\), and the gap keeps widening as \\(n\\) grows."}, {"html": "They grow without bound, roughly like \\(2^n\\), since \\(2^n\\) outpaces the \\((-1)^n\\) part, which never gets bigger than \\(1\\).", "ok": true, "comment": "The \\(2^n\\) terms take over. The \\((-1)^n\\) terms stay at size \\(1\\) and keep flipping sign, so the eigenvalue \\(2\\) controls the long run."}]}, {"phase": "Look back", "type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate says \\(A^2=P^2D^2(P^{-1})^2\\), because every factor gets squared. In your own words, what happens in the middle of \\((PDP^{-1})(PDP^{-1})\\) that leaves \\(PD^2P^{-1}\\) instead?<\/p>"}]};</script>
