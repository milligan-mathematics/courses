<script>window.POLYA = {"slug": "p1-1a-one-equation-two-unknowns", "title": "1.1 Problem A: One equation, two readings", "statement": "The equation \\(x - 2y = 4\\) can be read two ways.<br>(a) As an equation in the two variables \\(x\\) and \\(y\\).<br>(b) As \\(x - 2y + 0z = 4\\), an equation in the three variables \\(x\\), \\(y\\), \\(z\\).<br>Find all solutions in parametric form for each reading. Do the two answers describe the same set?", "questions": [{"phase": "Understand", "type": "mc", "text": "What is this problem asking you to find?", "answers": [{"html": "For each reading, every ordered list of values, one per variable, that satisfies the equation, described in parametric form.", "ok": true, "comment": "Right. A solution is a list with one entry per variable, so (a) gives pairs and (b) gives triples."}, {"html": "One list of numbers that works for both readings.", "ok": false, "comment": "The two readings have different variables, so they have different solution lists. We need the full set for each."}, {"html": "The value of \\(x\\) in each reading.", "ok": false, "comment": "That is only part of a solution. The other variables have entries too, and the question asks for all of them."}, {"html": "Whether the two readings give the same answer.", "ok": false, "comment": "That is the last question of the problem. First we need the solutions of each reading."}]}, {"phase": "Understand", "type": "mc", "text": "A good way to understand a problem is to test a guess. Does \\((6, 1)\\) solve reading (a), and does \\((6, 1, 5)\\) solve reading (b)?", "answers": [{"html": "(a) no: \\(6\\) is not \\(4\\), so the pair fails.", "ok": false, "comment": "The constant is \\(4\\), but the equation says \\(x - 2y\\) equals \\(4\\), not \\(x\\). Check \\(6 - 2\\cdot 1\\)."}, {"html": "(a) no: a pair has no \\(z\\)-entry, so it can’t be a solution.", "ok": false, "comment": "Reading (a) has only the variables \\(x\\) and \\(y\\), so a pair is the right kind of list there."}, {"html": "(a) yes, (b) no: reading (b) needs \\(z = 0\\).", "ok": false, "comment": "The \\(z\\)-entry must be \\(0\\) only if the equation forced it. Here \\(0z\\) is \\(0\\) for every \\(z\\)."}, {"html": "Yes to both: \\(6 - 2\\cdot 1 = 4\\) in (a), and \\(6 - 2\\cdot 1 + 0\\cdot 5 = 4\\) in (b).", "ok": true, "comment": "Right. The \\(0\\cdot 5\\) term adds nothing, so the \\(z\\)-entry \\(5\\) is fine."}]}, {"phase": "Understand", "type": "mc", "text": "In reading (b), the coefficient of \\(z\\) is \\(0\\). What does that tell you about \\(z\\)?", "answers": [{"html": "\\(z\\) is no longer one of the unknowns, so reading (b) is really reading (a).", "ok": false, "comment": "Adding \\(0z\\) does not remove the variable. Reading (b) has three unknowns, and its solutions are triples."}, {"html": "\\(z\\) must be \\(0\\), because a zero coefficient means \\(z\\) drops out.", "ok": false, "comment": "A zero coefficient makes \\(z\\) free, not zero. The triple \\((6, 1, 5)\\) solves (b) with \\(z = 5\\)."}, {"html": "\\(z\\) is still a variable, and it can take any value, since the equation doesn’t depend on it.", "ok": true, "comment": "Right. A zero coefficient means the equation is not affected by \\(z\\). It does not remove \\(z\\)."}]}, {"phase": "Plan", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> Each reading needs a list with one entry per variable, and the coefficient of \\(z\\) in (b) is \\(0\\), so \\(z\\) may not be constrained at all.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 2: Plan."}, {"phase": "Plan", "type": "multi", "text": "Which of these plans would find <em>every<\/em> solution in both readings? Select all that apply.", "answers": [{"html": "In (b), set \\(z = 0\\), since \\(z\\) has coefficient \\(0\\), and solve for \\(x\\) and \\(y\\).", "ok": false, "comment": "That fixes \\(z\\) without any reason. A zero coefficient means \\(z\\) is free, so it needs its own parameter."}, {"html": "Write the augmented matrix \\(\\left[\\begin{array}{cc|c} 1 & -2 & 4 \\end{array}\\right]\\) for (a) and \\(\\left[\\begin{array}{ccc|c} 1 & -2 & 0 & 4 \\end{array}\\right]\\) for (b), then read off the leading variable \\(x\\). The other variables are free.", "ok": true, "comment": "Also right, and it is the same plan in matrix form. The leading 1 is in the \\(x\\) column, so the other variables are free: \\(y\\) in (a), and \\(y\\) and \\(z\\) in (b)."}, {"html": "Solve for \\(x\\) in each reading, and let the other variables be parameters: \\(y = s\\) in (a), and \\(y = s\\), \\(z = t\\) in (b).", "ok": true, "comment": "This is the plan we’ll follow. It is the method of Example 1.1.2, applied to \\(x\\), whose coefficient is not zero."}, {"html": "Pick one solution, such as \\((6, 1)\\) or \\((6, 1, 5)\\), and call it the answer.", "ok": false, "comment": "One solution is not all of them. The question asks for every solution, so we need a parametric description."}]}, {"phase": "Plan", "type": "mc", "text": "In reading (b), how many parameters do you need?", "answers": [{"html": "Three: every variable is free.", "ok": false, "comment": "The equation still links \\(x\\) to \\(y\\) and \\(z\\). It fixes \\(x\\) in terms of the others, so only two are free."}, {"html": "One, because there is only one equation.", "ok": false, "comment": "The number of equations does not decide the number of parameters. Count the free variables instead."}, {"html": "Two: \\(y\\) and \\(z\\) are free, since only \\(x\\) is solved for.", "ok": true, "comment": "Right. Each free variable gets its own parameter, so \\(s\\) for \\(y\\) and \\(t\\) for \\(z\\)."}, {"html": "One: \\(z\\) has coefficient \\(0\\), so \\(z = 0\\) and only \\(y\\) is free.", "ok": false, "comment": "That is the \\(z = 0\\) mistake. The zero coefficient makes \\(z\\) free, not zero, so it needs a parameter."}]}, {"phase": "Carry out", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: solve for \\(x\\) in each reading, and let the other variables be parameters.<\/p><p>Next phase: <strong>carry out the plan<\/strong>. Start with reading (a).<\/p>", "cta": "Got it. On to Phase 3: Carry out."}, {"phase": "Carry out", "type": "mc", "text": "In reading (a), solve \\(x - 2y = 4\\) for \\(x\\). What do you get?", "answers": [{"html": "\\(x = 4 + \\tfrac{1}{2}y\\)", "ok": false, "comment": "Nothing needs dividing here: adding \\(2y\\) to both sides gives \\(x = 4 + 2y\\). Check: \\((4 + \\tfrac12 y) - 2y\\) is not \\(4\\) unless \\(y = 0\\)."}, {"html": "\\(x = 4 + 2y\\)", "ok": true, "comment": "Right. Add \\(2y\\) to both sides."}, {"html": "\\(x = 4 - 2y\\)", "ok": false, "comment": "Sign slip. Moving \\(-2y\\) to the other side makes it \\(+2y\\). Check: \\((4 - 2y) - 2y = 4 - 4y\\), not \\(4\\)."}, {"html": "\\(x = 2y - 4\\)", "ok": false, "comment": "The constant has the wrong sign. Check: \\((2y - 4) - 2y = -4\\), not \\(4\\)."}]}, {"phase": "Carry out", "type": "mc", "text": "Let \\(y = t\\) in reading (a). Write all the solutions in parametric form.", "answers": [{"html": "\\((x, y) = (4 - 2t, t)\\), with \\(t\\) any real number.", "ok": false, "comment": "Sign slip carried forward. Then \\((4 - 2t) - 2t = 4 - 4t\\), which is not \\(4\\) for most \\(t\\)."}, {"html": "\\((x, y) = (4 + 2t, t)\\), with \\(t\\) any real number.", "ok": true, "comment": "Right. Every value of \\(t\\) gives a solution, and every pair has this form."}, {"html": "\\((x, y) = (4, t)\\), with \\(t\\) any real number.", "ok": false, "comment": "This forgets that \\(x\\) depends on \\(y\\). Check: \\(4 - 2t\\) is not \\(4\\) unless \\(t = 0\\)."}]}, {"phase": "Carry out", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> Reading (a) is a line of pairs: \\((x, y) = (4 + 2t, t)\\). Now reading (b). The same plan works, with one more variable to parametrize.<\/p>", "cta": "Got it. Keep going."}, {"phase": "Carry out", "type": "mc", "text": "In reading (b), write all the solutions in parametric form.", "answers": [{"html": "\\((x, y, z) = (4 - 2s, s, t)\\), with \\(s\\) and \\(t\\) any real numbers.", "ok": false, "comment": "Sign slip. Then \\((4 - 2s) - 2s = 4 - 4s\\), which is not \\(4\\) for most \\(s\\)."}, {"html": "\\((x, y, z) = (4 + 2s, s, 0)\\), with \\(s\\) any real number.", "ok": false, "comment": "This sets \\(z = 0\\) without a reason. Triples like \\((6, 1, 5)\\) also solve (b), and this form misses them."}, {"html": "\\((x, y, z) = (4 + 2s, s, t)\\), with \\(s\\) and \\(t\\) any real numbers.", "ok": true, "comment": "Right. Two parameters, one for each free variable. The \\(z\\)-entry can be anything."}, {"html": "\\((x, y, z) = (4 + 2t, t, t)\\), with \\(t\\) any real number.", "ok": false, "comment": "This ties \\(z\\) to \\(y\\). Since \\(z\\) has no effect on the equation, \\(z\\) can be anything, so \\((6, 1, 5)\\) is a solution this form misses."}]}, {"phase": "Carry out", "type": "mc", "text": "Put \\(s = 1\\) and \\(t = 5\\) into your answer for (b). Which triple do you get?", "answers": [{"html": "\\((6, 5, 1)\\)", "ok": false, "comment": "Swapped \\(y\\) and \\(z\\). Check: \\(6 - 2\\cdot 5 = -4\\), not \\(4\\)."}, {"html": "\\((2, 1, 5)\\)", "ok": false, "comment": "Sign slip in \\(x\\). Then \\(2 - 2\\cdot 1 = 0\\), not \\(4\\)."}, {"html": "\\((4, 1, 5)\\)", "ok": false, "comment": "The \\(2s\\) got dropped from \\(x\\). Then \\(4 - 2\\cdot 1 = 2\\), not \\(4\\)."}, {"html": "\\((6, 1, 5)\\)", "ok": true, "comment": "Right: \\(x = 4 + 2\\cdot 1 = 6\\), \\(y = 1\\), and \\(z = 5\\)."}]}, {"phase": "Look back", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> (a) \\((x, y) = (4 + 2t, t)\\). (b) \\((x, y, z) = (4 + 2s, s, t)\\).<\/p><p>Last phase: <strong>look back<\/strong>. Substitute the answers back, and ask whether they describe the same set.<\/p>", "cta": "Got it. On to Phase 4: Look back."}, {"phase": "Look back", "type": "mc", "text": "Substitute the answer for (b) back into \\(x - 2y + 0z = 4\\), keeping \\(s\\) and \\(t\\) as letters. Which check confirms it?", "answers": [{"html": "\\((4 + 2s) - 2s + 0\\cdot t = 4\\) for every \\(s\\) and \\(t\\).", "ok": true, "comment": "Yes. Because \\(s\\) and \\(t\\) stay letters, the check covers every solution at once."}, {"html": "Solve for \\(z\\) and check that it matches \\(t\\).", "ok": false, "comment": "You can’t solve for \\(z\\) here: its coefficient is \\(0\\), and dividing by \\(0\\) is not allowed."}, {"html": "Check only \\(s = 0\\) and \\(t = 0\\); one triple is enough.", "ok": false, "comment": "One triple only shows that one solution works. The answer claims a whole family, so the check has to cover \\(s\\) and \\(t\\)."}, {"html": "Add the entries: \\((4 + 2s) + s + t\\) should equal \\(4\\).", "ok": false, "comment": "That adds the entries instead of multiplying each by its coefficient. The check should use \\(x - 2y + 0z\\)."}]}, {"phase": "Look back", "type": "mc", "text": "Do the answers for (a) and (b) describe the same set?", "answers": [{"html": "Yes: in both readings \\(x = 4 + 2y\\), so the solutions match.", "ok": false, "comment": "The rule for \\(x\\) matches, but (b) lists triples with a free \\(z\\)-entry. A pair can’t equal a triple."}, {"html": "No. (a) is a set of pairs, a line in the plane. (b) is a set of triples, a plane in space. They are different sets.", "ok": true, "comment": "Right. Even though \\(x\\) and \\(y\\) follow the same rule, (b) also has a \\(z\\)-entry that can be anything. A pair can never equal a triple."}, {"html": "No, because (a) has a parameter and (b) has none.", "ok": false, "comment": "Both have parameters. (a) has one, \\(t\\), and (b) has two, \\(s\\) and \\(t\\)."}, {"html": "Yes: \\(z\\) has coefficient \\(0\\), so it adds nothing.", "ok": false, "comment": "A zero coefficient makes \\(z\\) free, not absent. The triples in (b) have a \\(z\\)-entry that can be anything."}]}, {"phase": "Look back", "type": "mc", "text": "Now change the equation in (b) to \\(0x + 0y + 0z = 4\\). How many solutions does it have?", "answers": [{"html": "None.", "ok": true, "comment": "Right. The left side is \\(0\\) for every triple, so the equation would say \\(0 = 4\\), which is never true."}, {"html": "Exactly one, \\((0, 0, 0)\\).", "ok": false, "comment": "Setting every variable to \\(0\\) gives \\(0 = 4\\), which is false. Zero coefficients don’t pin the variables to \\(0\\)."}, {"html": "Infinitely many.", "ok": false, "comment": "Free variables need an equation that holds. Here \\(0 = 4\\) never holds, so no triple works."}]}, {"phase": "Look back", "type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate says (a) and (b) have the same answer, because \\(z\\) \"doesn’t matter.\" What is right about that, and what is missing? Then name one habit from this problem you want to use on the next one.<\/p>"}]};</script>
