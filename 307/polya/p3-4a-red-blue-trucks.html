<script>window.POLYA = {"slug": "p3-4a-red-blue-trucks", "title": "3.4 Problem A: Red and blue trucks", "statement": "Here is the parking row from this section, with one change: trucks now come in two colors, red and blue. A row of \\(k\\) spaces, with \\(k \\ge 1\\), is filled completely by cars and trucks. A car takes one space, and all cars look alike. A truck takes two spaces and has one color. Two fillings count as different if their vehicles are in a different order or a different color. Let \\(x_k\\) be the number of ways to fill the row. Find a formula for \\(x_k\\).", "questions": [{"phase": "Understand", "type": "write", "text": "In your own words, what is this problem asking for?", "model": "<p>It asks for a formula for \\(x_k\\), the number of ways to fill a row of \\(k\\) spaces with cars (one space each) and red or blue trucks (two spaces each). I can list the small cases by hand, but I need a rule that works for every \\(k \\ge 1\\), not just the ones I can count.<\/p>"}, {"phase": "Understand", "type": "mc", "text": "How many ways are there to fill a row of 2 spaces?", "answers": [{"html": "1", "ok": false, "comment": "That leaves out the trucks. A single truck can fill both spaces, so it is another way to fill the row."}, {"html": "2", "ok": false, "comment": "That is the count if trucks came in one color: two cars, or one truck. With red and blue, the truck case doubles."}, {"html": "3", "ok": true, "comment": "Right: two cars, a red truck, or a blue truck. Each truck fills both spaces, and it can be either color."}, {"html": "4", "ok": false, "comment": "That gives each of the two spaces its own color, as if two trucks could fit in two spaces. One truck fills both spaces and has one color."}]}, {"phase": "Plan", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> We now have two starting counts: \\(x_1 = 1\\) (one car) and \\(x_2 = 3\\) (two cars, a red truck, or a blue truck). We need a rule that gives every later count from the ones before it.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 2: Plan."}, {"phase": "Plan", "type": "write", "text": "Before you start, write your plan in 1–3 sentences: which method, and which step needs care?", "model": "<p>Use the matrix method from the \\(x_{k+2}=x_{k+1}+6x_k\\) example in this section. First find a recurrence for \\(x_{k+2}\\) by sorting the fillings on what sits in the first space, then write \\(\\mathbf v_k=\\begin{bmatrix}x_k\\\\x_{k+1}\\end{bmatrix}\\) with \\(\\mathbf v_{k+1}=A\\mathbf v_k\\), diagonalize \\(A\\), and fit the two constants to \\(x_1=1\\) and \\(x_2=3\\). The step that needs care is the index: those counts sit at \\(k=1\\) and \\(k=2\\), not at \\(k=0\\) and \\(k=1\\).<\/p>"}, {"phase": "Carry out", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: a recurrence from the first space, then the matrix \\(A\\), then its eigenvalues from the characteristic polynomial, then a formula whose two constants are fitted to \\(x_1 = 1\\) and \\(x_2 = 3\\).<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 3: Carry out."}, {"phase": "Carry out", "type": "mc", "text": "Using the first-space split from your plan, which recurrence for \\(x_{k+2}\\) results?", "answers": [{"html": "\\(x_{k+2} = 2x_{k+1} + x_k\\)", "ok": false, "comment": "The factor 2 landed on the car case. Cars all look alike, so the 2 belongs with the truck case, \\(x_k\\)."}, {"html": "\\(x_{k+2} = x_{k+1} + 2x_k\\)", "ok": true, "comment": "Right. A car in the first space leaves \\(x_{k+1}\\) ways for the rest. A red or blue truck takes the first two spaces and leaves \\(x_k\\) ways, so that case gives \\(2x_k\\)."}, {"html": "\\(x_{k+2} = 2x_{k+1} + 2x_k\\)", "ok": false, "comment": "This doubles the car case as well. There is only one kind of car, so that case is counted once."}, {"html": "\\(x_{k+2} = x_{k+1} + x_k\\)", "ok": false, "comment": "That is the recurrence for the parking row with one color of truck. The second color is missing, so the truck case is counted once instead of twice."}]}, {"phase": "Carry out", "type": "mc", "text": "Let \\(\\mathbf v_k=\\begin{bmatrix}x_k\\\\x_{k+1}\\end{bmatrix}\\), so that \\(\\mathbf v_{k+1}=A\\mathbf v_k\\) for a \\(2\\times 2\\) matrix \\(A\\). What is \\(A\\)?", "answers": [{"html": "\\(\\begin{bmatrix}0&1\\\\1&2\\end{bmatrix}\\)", "ok": false, "comment": "You swapped the 1 and the 2 in the bottom row. The 2 multiplies \\(x_k\\), so it belongs in the first column."}, {"html": "\\(\\begin{bmatrix}2&1\\\\0&1\\end{bmatrix}\\)", "ok": false, "comment": "The rows are upside down. The top entry of \\(\\mathbf v_{k+1}\\) is \\(x_{k+1}\\), so the top row must be \\((0, 1)\\)."}, {"html": "\\(\\begin{bmatrix}0&1\\\\2&1\\end{bmatrix}\\)", "ok": true, "comment": "Right. The top entry of \\(\\mathbf v_{k+1}\\) is \\(x_{k+1}\\), so the top row is \\((0, 1)\\). The bottom entry is \\(x_{k+2} = 2x_k + x_{k+1}\\), so the bottom row is \\((2, 1)\\)."}, {"html": "\\(\\begin{bmatrix}0&2\\\\1&1\\end{bmatrix}\\)", "ok": false, "comment": "The coefficients went into the top row. The top entry of \\(\\mathbf v_{k+1}\\) is \\(x_{k+1}\\) alone, with no 2 in it."}]}, {"phase": "Carry out", "type": "mc", "text": "Which formula gives \\(x_k\\) for every \\(k \\ge 1\\)?", "answers": [{"html": "\\(x_k = \\dfrac{2^{k+1} + (-1)^k}{3}\\)", "ok": true, "comment": "Right. It matches \\(x_1 = 1\\) and \\(x_2 = 3\\), and it keeps the recurrence going. The bases \\(2\\) and \\(-1\\) are the eigenvalues of \\(A\\), and the constants are fitted to the two counts."}, {"html": "\\(x_k = \\dfrac{(-2)^k + 5}{3}\\)", "ok": false, "comment": "Those eigenvalues come from a factoring slip: \\((x+2)(x-1)\\) is not \\(x^2-x-2\\). The correct factoring is \\((x-2)(x+1)\\). Check \\(k = 3\\): this formula gives \\(-1\\), but the count is 5."}, {"html": "\\(x_k = \\dfrac{2^{k+2} - (-1)^k}{3}\\)", "ok": false, "comment": "It fits \\(x_1\\) and \\(x_2\\) as if they sat at \\(k = 0\\) and \\(k = 1\\), which shifts the whole formula by one step. Check \\(k = 1\\): it gives 3, but one car fills one space."}, {"html": "\\(x_k = \\dfrac{2^{k} + 2(-1)^k}{3}\\)", "ok": false, "comment": "The constants went to the wrong terms. The \\(2^k\\) term needs \\(\\tfrac23\\), and the \\((-1)^k\\) term needs \\(\\tfrac13\\). Check \\(k = 1\\): this formula gives 0, but one car fills one space."}]}, {"phase": "Look back", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The answer is \\(x_k = \\dfrac{2^{k+1} + (-1)^k}{3}\\) for every \\(k \\ge 1\\).<\/p><p>Next phase: <strong>look back<\/strong>. Check the formula against the story, then look at what it does for large \\(k\\).<\/p>", "cta": "Got it. On to Phase 4: Look back."}, {"phase": "Look back", "type": "mc", "text": "How many ways are there to fill a row of 3 spaces? Count them straight from the story, without the formula.", "answers": [{"html": "3", "ok": false, "comment": "That is the count for two spaces. A row of three spaces has more fillings than that."}, {"html": "5", "ok": true, "comment": "Right: cars only (1 way), or a car beside a red or a blue truck, in either order (4 ways). The formula also gives \\(\\dfrac{2^4 - 1}{3} = 5\\) at \\(k = 3\\)."}, {"html": "7", "ok": false, "comment": "That gives the car case two colors: \\(2 \\cdot 3 + 1 = 7\\). Cars all look alike, so recount the fillings that have a truck."}]}, {"phase": "Look back", "type": "mc", "text": "For large \\(k\\), which term of the formula is dominant?", "answers": [{"html": "The \\(\\dfrac{(-1)^k}{3}\\) term, because its sign alternates.", "ok": false, "comment": "The sign does alternate, but this term is always \\(\\pm\\tfrac13\\), so it cannot control how big \\(x_k\\) gets. Every \\(x_k\\) is a positive count."}, {"html": "Neither: \\(x_k\\) grows by the same amount at each step.", "ok": false, "comment": "The counts do not grow by a fixed amount. For \\(k = 2\\) through \\(6\\) they are \\(3, 5, 11, 21, 43\\), roughly doubling each time."}, {"html": "The \\(\\dfrac{2^{k+1}}{3}\\) term, because it doubles each time \\(k\\) goes up by 1.", "ok": true, "comment": "Right. The \\(\\frac{(-1)^k}{3}\\) term always stays between \\(-\\tfrac13\\) and \\(\\tfrac13\\), so the \\(\\frac{2^{k+1}}{3}\\) term sets the size. That is why \\(x_k\\) roughly doubles from one \\(k\\) to the next."}]}, {"phase": "Look back", "type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate used \\(x_{k+2} = x_{k+1} + x_k\\), the recurrence for the parking row with one color of truck. What step did they skip? Then name one habit from this problem you want to use on the next one.<\/p>"}]};</script>
