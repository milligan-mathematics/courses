<script>window.POLYA = {"slug": "p2-3a-commuting-matrices", "title": "2.3 Problem A: Which matrices commute with A?", "statement": "Let \\(A = \\begin{bmatrix}1&1\\\\0&1\\end{bmatrix}\\). Find every \\(2 \\times 2\\) matrix \\(X\\) that <strong>commutes<\/strong> with \\(A\\), meaning \\(AX = XA\\). Your answer should describe a whole family of matrices, using unknown entries.", "questions": [{"type": "write", "text": "In your own words, what is this problem asking for?", "phase": "Understand", "model": "We want every \\(2 \\times 2\\) matrix \\(X\\) for which multiplying by \\(A\\) gives the same result in either order: \\(AX = XA\\). The answer is probably not one matrix. It is more likely a family, with some entries free, so we should expect unknown letters in the answer."}, {"type": "mc", "text": "What does \"\\(X\\) commutes with \\(A\\)\" mean?", "phase": "Understand", "answers": [{"html": "\\(AX = XA\\), so the two products are the same matrix.", "ok": true, "comment": "Right. Commuting means the two orders of multiplying give the same matrix. Nothing more is required."}, {"html": "\\(XA = I\\), so \\(X\\) is the inverse of \\(A\\).", "ok": false, "comment": "Inverses are a different idea. The identity matrix commutes with \\(A\\) too, but \\(IA = A\\), not \\(I\\). Commuting only asks that \\(AX\\) and \\(XA\\) match."}, {"html": "\\(X = A\\).", "ok": false, "comment": "Commuting is about \\(AX\\) and \\(XA\\) agreeing, not about \\(X\\) being \\(A\\). The identity matrix commutes with \\(A\\) but is not \\(A\\)."}, {"html": "\\(AX = X\\), so \\(A\\) leaves \\(X\\) unchanged.", "ok": false, "comment": "That is a statement about \\(A\\) acting like the identity. The identity matrix \\(X = I\\) commutes with \\(A\\), but \\(AI = A\\), which is not \\(I\\) unless \\(A\\) is the identity."}]}, {"type": "mc", "text": "Try a special case. Does the identity matrix \\(I\\) commute with \\(A\\)?", "phase": "Understand", "answers": [{"html": "No. \\(IA\\) is not \\(I\\), so they cannot match.", "ok": false, "comment": "Comparing \\(IA\\) with \\(I\\) is the wrong test. Commuting compares \\(IA\\) with \\(AI\\), and both equal \\(A\\)."}, {"html": "It depends on the size of \\(A\\).", "ok": false, "comment": "Size does not decide it here. For any \\(2 \\times 2\\) matrix \\(A\\), the identity commutes with \\(A\\)."}, {"html": "Yes. \\(IA\\) and \\(AI\\) are both \\(A\\).", "ok": true, "comment": "Right. Multiplying by \\(I\\) on either side changes nothing, so \\(IA = AI = A\\). The identity commutes with every matrix."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> We want every \\(X\\) with \\(AX = XA\\), and we expect a whole family, not one matrix. The identity and \\(A\\) itself are both in it.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "phase": "Plan", "cta": "Got it. On to Phase 2: Plan."}, {"type": "multi", "text": "Which of these plans would find every \\(X\\) that commutes with \\(A\\)? Select all that apply.", "phase": "Plan", "answers": [{"html": "Guess that only multiples of the identity commute with \\(A\\), since \\(A\\) is close to \\(I\\).", "ok": false, "comment": "This is the plan that misses the answer. \\(A\\) itself commutes with \\(A\\), and \\(A\\) is not a multiple of \\(I\\). Matrices that commute with \\(A\\) can have off-diagonal entries."}, {"html": "Write \\(X\\) with entries \\(a, b, c, d\\), multiply out \\(AX\\) and \\(XA\\), and set the matching entries equal.", "ok": true, "comment": "This works. Four entry-by-entry comparisons give equations in \\(a, b, c, d\\), and solving them gives the family."}, {"html": "Write \\(A = I + N\\) with \\(N = \\begin{bmatrix}0&1\\\\0&0\\end{bmatrix}\\). Since \\(I\\) commutes with everything, \\(X\\) commutes with \\(A\\) exactly when it commutes with \\(N\\).", "ok": true, "comment": "This also works, and it is a shorter route. The identity drops out of both products, so we only need \\(NX = XN\\)."}, {"html": "Test only \\(X = A\\), since a matrix always commutes with itself, and report that as the answer.", "ok": false, "comment": "A matrix does commute with itself, but that is one example, not all of them. The identity also commutes with \\(A\\), and \\(I \\ne A\\), so a single test cannot find the whole family."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: write \\(X = \\begin{bmatrix}a&b\\\\c&d\\end{bmatrix}\\), multiply out \\(AX\\) and \\(XA\\), and set matching entries equal.<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "mc", "text": "Compare the \\((2,2)\\) entries of \\(AX\\) and \\(XA\\). Which condition does that give?", "phase": "Carry out", "answers": [{"html": "\\(c = 0\\)", "ok": true, "comment": "The \\((2,2)\\) entry of \\(AX\\) is \\(d\\). The \\((2,2)\\) entry of \\(XA\\) is \\(c + d\\). Setting them equal gives \\(d = c + d\\), so \\(c = 0\\)."}, {"html": "\\(c = d\\)", "ok": false, "comment": "From \\(d = c + d\\), subtract \\(d\\) from both sides: \\(0 = c\\). Nothing here forces \\(c\\) to equal \\(d\\)."}, {"html": "\\(b = 0\\)", "ok": false, "comment": "That is the upper-right entry, \\(b\\), and this comparison never constrains it. The \\((2,2)\\) comparison controls \\(c\\)."}]}, {"type": "mc", "text": "Compare the \\((1,2)\\) entries of \\(AX\\) and \\(XA\\). Which condition does that give?", "phase": "Carry out", "answers": [{"html": "\\(a = 0\\)", "ok": false, "comment": "This happens if you drop the \\(d\\) from the \\((1,2)\\) entry of \\(AX\\). Row 1 of \\(A\\) is \\((1, 1)\\), so that entry is \\(b + d\\), not \\(b\\)."}, {"html": "\\(a = d\\)", "ok": true, "comment": "The \\((1,2)\\) entry of \\(AX\\) is \\(b + d\\), because row 1 of \\(A\\) is \\((1, 1)\\). The \\((1,2)\\) entry of \\(XA\\) is \\(a + b\\). Setting them equal and cancelling \\(b\\) gives \\(a = d\\)."}, {"html": "\\(d = 0\\)", "ok": false, "comment": "This happens if you read the \\((1,2)\\) entry of \\(XA\\) as just \\(b\\). It is \\(a + b\\), because row 1 of \\(X\\) is \\((a, b)\\) and column 2 of \\(A\\) is \\((1, 1)\\)."}]}, {"type": "mc", "text": "Put the conditions together. Which matrices commute with \\(A\\)?", "phase": "Carry out", "answers": [{"html": "\\(\\begin{bmatrix}a&b\\\\c&a\\end{bmatrix}\\), with \\(a, b, c\\) arbitrary.", "ok": false, "comment": "This keeps \\(a = d\\) but forgets \\(c = 0\\). Try \\(X = \\begin{bmatrix}1&0\\\\1&1\\end{bmatrix}\\): \\(AX = \\begin{bmatrix}2&1\\\\1&1\\end{bmatrix}\\) and \\(XA = \\begin{bmatrix}1&1\\\\1&2\\end{bmatrix}\\)."}, {"html": "\\(\\begin{bmatrix}a&b\\\\0&d\\end{bmatrix}\\), with \\(a, b, d\\) arbitrary.", "ok": false, "comment": "This keeps \\(c = 0\\) but forgets \\(a = d\\). Try \\(X = \\begin{bmatrix}1&0\\\\0&2\\end{bmatrix}\\): \\(AX\\) and \\(XA\\) differ in the \\((1,2)\\) entry."}, {"html": "\\(\\begin{bmatrix}a&0\\\\0&a\\end{bmatrix}\\), with \\(a\\) arbitrary.", "ok": false, "comment": "Scalar matrices do commute with \\(A\\), but \\(b\\) is free, so the family is bigger. \\(X = A\\) has \\(b = 1\\) and commutes with \\(A\\), but it is not a scalar matrix."}, {"html": "\\(\\begin{bmatrix}a&b\\\\0&a\\end{bmatrix}\\), with \\(a\\) and \\(b\\) arbitrary.", "ok": true, "comment": "Right. The conditions are \\(c = 0\\) and \\(a = d\\), and \\(b\\) is free. Every such matrix is \\(aI + bN\\), and each one commutes with \\(A\\)."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The matrices that commute with \\(A\\) are exactly \\(\\begin{bmatrix}a&b\\\\0&a\\end{bmatrix}\\), with \\(a\\) and \\(b\\) any numbers.<\/p><p>Last phase: <strong>look back<\/strong>. Test the family, then ask what it says about commuting in general.<\/p>", "phase": "Look back", "cta": "Got it. On to Phase 4: Look back."}, {"type": "mc", "text": "Which of these matrices commutes with \\(A\\)?", "phase": "Look back", "answers": [{"html": "\\(\\begin{bmatrix}0&1\\\\1&0\\end{bmatrix}\\)", "ok": false, "comment": "Matrices that look symmetric or tidy can still fail. \\(AP\\) swaps the columns of \\(A\\), and \\(PA\\) swaps its rows. Here \\(AP = \\begin{bmatrix}1&1\\\\1&0\\end{bmatrix}\\) and \\(PA = \\begin{bmatrix}0&1\\\\1&1\\end{bmatrix}\\), which differ."}, {"html": "\\(\\begin{bmatrix}3&-2\\\\0&3\\end{bmatrix}\\)", "ok": true, "comment": "Right. It has \\(c = 0\\) and \\(a = d = 3\\), so it is in the family with \\(b = -2\\). Multiply it by \\(A\\) in both orders and you get the same matrix."}, {"html": "\\(\\begin{bmatrix}2&1\\\\0&1\\end{bmatrix}\\)", "ok": false, "comment": "It has \\(c = 0\\), but its diagonal entries differ (\\(2 \\ne 1\\)). The \\((1,2)\\) entries of \\(AX\\) and \\(XA\\) are \\(2\\) and \\(3\\), so they don’t match."}, {"html": "\\(\\begin{bmatrix}1&0\\\\1&1\\end{bmatrix}\\)", "ok": false, "comment": "The diagonal matches \\(A\\), but the lower-left 1 breaks the match. The \\(c\\) entry has to be \\(0\\)."}]}, {"type": "mc", "text": "Generalize. Suppose \\(D = \\begin{bmatrix}1&0\\0&2\\end{bmatrix}\\) instead of \\(A\\). Which matrices commute with \\(D\\)?", "phase": "Look back", "answers": [{"html": "Only \\(X = D\\).", "ok": false, "comment": "The identity commutes with \\(D\\), and \\(I \\ne D\\). Commuting with \\(D\\) is a whole family, not one matrix."}, {"html": "Every \\(2 \\times 2\\) matrix, since they are all the same size.", "ok": false, "comment": "Same size is not enough. For \\(X = \\begin{bmatrix}0&1\\\\0&0\\end{bmatrix}\\), \\(DX\\) and \\(XD\\) are different. Matrix multiplication is not commutative in general."}, {"html": "All diagonal matrices \\(\\begin{bmatrix}a&0\\\\0&d\\end{bmatrix}\\), with \\(a\\) and \\(d\\) arbitrary.", "ok": true, "comment": "Right. Diagonal matrices commute with each other. A nonzero off-diagonal entry gets scaled differently by \\(D\\) from the left and the right, so it has to be \\(0\\)."}, {"html": "Only multiples of the identity.", "ok": false, "comment": "Scalars commute with \\(D\\), but so does \\(D\\) itself, and it is not a scalar matrix. The diagonal entries can differ."}]}, {"type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate guessed that only multiples of the identity commute with \\(A\\). Which matrix shows they’re wrong, and what did solving the entry equations give you that guessing couldn’t?<\/p>", "phase": "Look back"}]};</script>
