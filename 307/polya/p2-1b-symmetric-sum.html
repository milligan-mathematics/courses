<script>window.POLYA = {"slug": "p2-1b-symmetric-sum", "title": "2.1 Problem B: Why is A plus its transpose symmetric?", "statement": "Show that \\(A + A^{T}\\) is symmetric for <em>any<\/em> square matrix \\(A\\).", "questions": [{"type": "write", "text": "In your own words, what does the claim say, and what would a proof have to show?", "phase": "Understand", "model": "<p>Take any square matrix \\(A\\), add it to its transpose, and the result is always symmetric. A proof has to work for every square matrix at once, so it can’t rely on particular numbers. Since “symmetric” means “equal to its own transpose”, we have to show \\((A+A^{T})^{T} = A+A^{T}\\).<\/p>", "checklist": ["say the claim is about every square matrix, not one example", "say what symmetric means: a matrix equal to its own transpose", "name the equation to show: \\((A+A^{T})^{T} = A+A^{T}\\)"]}, {"type": "mc", "text": "What does it mean for a matrix \\(B\\) to be symmetric?", "phase": "Understand", "answers": [{"html": "\\(B^{T} = -B\\): its transpose is its negative.", "ok": false, "comment": "That is a skew-symmetric matrix, which you’ll meet in Look back. Symmetric means \\(B^{T} = B\\)."}, {"html": "\\(B^{T} = B\\): it equals its own transpose.", "ok": true, "comment": "Right. Flipping a symmetric matrix across its main diagonal changes nothing, so its \\((i,j)\\) and \\((j,i)\\) entries match."}, {"html": "It is square.", "ok": false, "comment": "A symmetric matrix has to be square, but being square isn’t enough: \\(\\begin{bmatrix}1&2\\\\5&3\\end{bmatrix}\\) is square and not symmetric."}, {"html": "All of its entries are equal.", "ok": false, "comment": "A matrix of equal entries is symmetric, but most symmetric matrices aren’t like that. Only the entries in mirror positions, \\((i,j)\\) and \\((j,i)\\), have to match."}]}, {"type": "matrix", "text": "Try a case before proving anything. For \\(A = \\begin{bmatrix}1&2\\\\5&3\\end{bmatrix}\\), enter \\(A + A^{T}\\).", "phase": "Understand", "comment": "Right. \\(A + A^{T} = \\begin{bmatrix}2&7\\\\7&6\\end{bmatrix}\\), and the \\(7\\)s in mirror positions show it is symmetric. Each off-diagonal entry is \\(2 + 5\\), added in one order or the other.", "label": "A + A^{T} =", "hints": ["First write \\(A^{T}\\): its rows are the columns of \\(A\\).", "\\(A^{T} = \\begin{bmatrix}1&5\\\\2&3\\end{bmatrix}\\). Now add it to \\(A\\) entry by entry."], "shape": [2, 2], "values": [2.0, 7.0, 7.0, 6.0], "answer_tex": "\\begin{bmatrix}2&7\\\\7&6\\end{bmatrix}", "typed_answer": ["2", "7", "7", "6"], "wrong": [{"values": [2.0, 4.0, 10.0, 6.0], "comment": "That is \\(2A\\). It treats \\(A^{T}\\) as if it were \\(A\\), but \\(A\\) isn’t symmetric: its \\((1,2)\\) and \\((2,1)\\) entries differ."}, {"values": [1.0, 5.0, 2.0, 3.0], "comment": "That is \\(A^{T}\\) by itself. Add it to \\(A\\), entry by entry."}]}, {"type": "multi", "text": "Which facts about transposes will the proof need? Select all that apply.", "phase": "Plan", "answers": [{"html": "\\((XY)^{T} = Y^{T}X^{T}\\)", "ok": false, "comment": "That rule is about products, and there is no product here. (You’ll meet it in 2.3.)"}, {"html": "\\(A^{T} = A\\)", "ok": false, "comment": "That is true only when \\(A\\) is symmetric, and the claim is about every square matrix. The proof can’t assume it."}, {"html": "\\(X + Y = Y + X\\)", "ok": true, "comment": "Yes: this puts \\(A^{T} + A\\) back in the order \\(A + A^{T}\\)."}, {"html": "\\((X+Y)^{T} = X^{T} + Y^{T}\\)", "ok": true, "comment": "Yes: this spreads the transpose over the sum \\(A + A^{T}\\)."}, {"html": "\\((X^{T})^{T} = X\\)", "ok": true, "comment": "Yes: this turns the \\((A^{T})^{T}\\) that appears into \\(A\\)."}]}, {"type": "multi", "text": "Which of these plans would prove the claim? Select all that work.", "phase": "Plan", "answers": [{"html": "Check the claim on several matrices of different sizes.", "ok": false, "comment": "Examples build confidence, but they can’t cover every square matrix. A proof has to."}, {"html": "Assume \\(A+A^{T}\\) is symmetric, and show this leads to something true.", "ok": false, "comment": "That assumes what we are trying to prove. Reaching something true from it proves nothing."}, {"html": "Start from \\((A+A^{T})^{T}\\) and use the transpose rules until you reach \\(A+A^{T}\\).", "ok": true, "comment": "Yes. That shows the equation in the definition of symmetric directly."}, {"html": "Compare entries: show the \\((i,j)\\) and \\((j,i)\\) entries of \\(A+A^{T}\\) are equal for every \\(i\\) and \\(j\\).", "ok": true, "comment": "Yes, this works too: the \\((i,j)\\) entry is \\(a_{ij} + a_{ji}\\) and the \\((j,i)\\) entry is \\(a_{ji} + a_{ij}\\), the same sum. We’ll write the first plan out."}]}, {"type": "order", "text": "Arrange the lines into a proof that \\(A + A^{T}\\) is symmetric.", "phase": "Carry out", "lines": [{"html": "Since \\(A\\) is symmetric, \\(A^{T} = A\\), so \\(A + A^{T} = 2A\\), which is symmetric.", "pos": -1, "comment": "This line assumes \\(A\\) is symmetric, but the claim is about every square matrix. The proof can’t use that."}, {"html": "For example, with \\(A = \\begin{bmatrix}1&2\\\\5&3\\end{bmatrix}\\), \\(A + A^{T} = \\begin{bmatrix}2&7\\\\7&6\\end{bmatrix}\\), which is symmetric.", "pos": -1, "comment": "An example shows the claim can hold, but a proof has to work for every square matrix. Examples are for building intuition, not for the proof itself."}, {"html": "Let \\(A\\) be any square matrix. We show that \\((A+A^{T})^{T} = A+A^{T}\\).", "pos": 0}, {"html": "Matrix addition is commutative, so \\((A+A^{T})^{T} = A^{T} + A = A + A^{T}\\).", "pos": 3}, {"html": "Transposing twice gives back the original matrix, so \\((A^{T})^{T} = A\\), and \\((A+A^{T})^{T} = A^{T} + A\\).", "pos": 2}, {"html": "Therefore \\(A + A^{T}\\) equals its own transpose, so it is symmetric.", "pos": 4}, {"html": "The transpose of a sum is the sum of the transposes, so \\((A+A^{T})^{T} = A^{T} + (A^{T})^{T}\\).", "pos": 1}], "groups": [], "comment": "Right. Each line uses one rule, and the chain runs from \\((A+A^{T})^{T}\\) to \\(A+A^{T}\\). Nothing in it depends on the numbers in \\(A\\), so it works for every square matrix.", "model": "<ol class=\"pl-model-proof\"><li>Let \\(A\\) be any square matrix. We show that \\((A+A^{T})^{T} = A+A^{T}\\).<\/li><li>The transpose of a sum is the sum of the transposes, so \\((A+A^{T})^{T} = A^{T} + (A^{T})^{T}\\).<\/li><li>Transposing twice gives back the original matrix, so \\((A^{T})^{T} = A\\), and \\((A+A^{T})^{T} = A^{T} + A\\).<\/li><li>Matrix addition is commutative, so \\((A+A^{T})^{T} = A^{T} + A = A + A^{T}\\).<\/li><li>Therefore \\(A + A^{T}\\) equals its own transpose, so it is symmetric.<\/li><\/ol>", "hints": ["A proof starts with what we are given and what we will show, and ends with the conclusion.", "Follow the expression \\((A+A^{T})^{T}\\): spread the transpose over the sum, then simplify \\((A^{T})^{T}\\), then reorder the sum."]}, {"type": "mc", "text": "Where does the proof use that \\(A\\) is square?", "phase": "Look back", "answers": [{"html": "Nowhere: the proof works for any matrix.", "ok": false, "comment": "Try a \\(2\\times 3\\) matrix \\(A\\): then \\(A^{T}\\) is \\(3\\times 2\\), and the sum \\(A + A^{T}\\) isn’t defined."}, {"html": "In the step \\((A^{T})^{T} = A\\).", "ok": false, "comment": "Transposing twice gives back any matrix, square or not. Look for a step that needs two matrices of the same size."}, {"html": "At the very start: \\(A\\) and \\(A^{T}\\) can be added only if they are the same size, and that happens only when \\(A\\) is square.", "ok": true, "comment": "Right. If \\(A\\) is \\(2\\times 3\\), then \\(A^{T}\\) is \\(3\\times 2\\), and \\(A + A^{T}\\) isn’t even defined."}, {"html": "In the step \\(A^{T} + A = A + A^{T}\\).", "ok": false, "comment": "Addition is commutative for any two matrices of the same size. The question is whether \\(A\\) and \\(A^{T}\\) have the same size in the first place."}]}, {"type": "write", "text": "Now you: a matrix \\(B\\) is <em>skew-symmetric<\/em> if \\(B^{T} = -B\\). Prove that \\(A - A^{T}\\) is skew-symmetric for any square matrix \\(A\\).", "phase": "Look back", "model": "<p>Let \\(A\\) be any square matrix. The transpose of a difference is the difference of the transposes, so \\((A-A^{T})^{T} = A^{T} - (A^{T})^{T}\\). Transposing twice gives back \\(A\\), so this is \\(A^{T} - A\\). And \\(A^{T} - A = -(A - A^{T})\\). So \\((A-A^{T})^{T} = -(A-A^{T})\\), which means \\(A - A^{T}\\) is skew-symmetric.<\/p>", "checklist": ["start with any square matrix \\(A\\), no particular numbers", "spread the transpose over the difference", "use \\((A^{T})^{T} = A\\)", "rewrite \\(A^{T} - A\\) as \\(-(A - A^{T})\\)", "end by naming the conclusion: skew-symmetric"]}, {"type": "essay", "text": "Reflection: how is writing a proof different from checking an example? What did the proof need that an example could not give you?", "phase": "Look back"}], "goal": "Prove a statement about every square matrix, using the transpose rules rather than examples.", "connects": "Builds on the transpose rules in this section: the transpose of a sum, and transposing twice. Leads to 2.3, where the transpose of a product reverses the order, and to symmetric matrices in Chapter 8.", "discuss": "An example can show that a claim is false, but no number of examples shows it is always true. Why the difference?"};</script>
