<script>window.POLYA = {"slug": "p5-3a-three-dot-products", "title": "5.3 Problem A: Three dot products, no system", "statement": "Let \\(\\mathbf f_1=\\begin{bmatrix}1\\\\1\\\\1\\end{bmatrix}\\), \\(\\mathbf f_2=\\begin{bmatrix}1\\\\-2\\\\1\\end{bmatrix}\\), \\(\\mathbf f_3=\\begin{bmatrix}1\\\\0\\\\-1\\end{bmatrix}\\), and \\(\\mathbf x=\\begin{bmatrix}1\\\\3\\\\0\\end{bmatrix}\\) in \\(\\mathbb R^3\\). Find \\(c_1\\), \\(c_2\\), and \\(c_3\\) so that \\(\\mathbf x=c_1\\mathbf f_1+c_2\\mathbf f_2+c_3\\mathbf f_3\\).", "questions": [{"type": "write", "text": "In your own words, what is this problem asking for?", "phase": "Understand", "model": "<p>It asks for the three numbers \\(c_1\\), \\(c_2\\), and \\(c_3\\) that make \\(\\mathbf x\\) equal to \\(c_1\\mathbf f_1+c_2\\mathbf f_2+c_3\\mathbf f_3\\). Written out, that is three equations in three unknowns. Row reduction would solve it, but the vectors might be special in a way that makes the work easier.<\/p>", "checklist": ["name the three unknowns, \\(c_1\\), \\(c_2\\), and \\(c_3\\), and the vector \\(\\mathbf x\\) they build", "say that written out, this is three equations in three unknowns", "say that row reduction would solve it, but the vectors may make the work easier"]}, {"type": "mc", "text": "Before you compute anything: what does it mean for \\(\\mathbf f_1\\), \\(\\mathbf f_2\\), and \\(\\mathbf f_3\\) to be an orthogonal set?", "phase": "Understand", "answers": [{"html": "Every pair of different vectors has dot product \\(0\\), and none of the vectors is the zero vector.", "ok": true, "comment": "Right. That is the definition, so every pair counts, and no vector can be zero. The vectors do not need length \\(1\\); unit length is the extra condition that makes a set orthonormal."}, {"html": "Every vector has length \\(1\\).", "ok": false, "comment": "Not quite. That describes an orthonormal set. Orthogonal asks only for dot products of \\(0\\) between different vectors, so the lengths can be any positive numbers."}, {"html": "Every dot product is \\(0\\), including each vector with itself.", "ok": false, "comment": "Not quite. A vector’s dot product with itself is its squared length, which is positive for a nonzero vector. Only dot products between different vectors have to be \\(0\\)."}, {"html": "Only the neighboring pairs in the list have dot product \\(0\\): \\(\\mathbf f_1\\) with \\(\\mathbf f_2\\), and \\(\\mathbf f_2\\) with \\(\\mathbf f_3\\).", "ok": false, "comment": "Not quite. Checking two of the three pairs is not enough. The definition needs every pair of different vectors, including \\(\\mathbf f_1\\) and \\(\\mathbf f_3\\), which are not neighbors in the list."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> We want the three numbers \\(c_1\\), \\(c_2\\), and \\(c_3\\) with \\(\\mathbf x=c_1\\mathbf f_1+c_2\\mathbf f_2+c_3\\mathbf f_3\\), and we have pinned down what an orthogonal set means.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "phase": "Plan", "cta": "Got it. On to Phase 2: Plan."}, {"type": "write", "text": "Before you start, write your plan in 1–3 sentences: which method, and which step needs care?", "phase": "Plan", "model": "<p>Confirm that the set is orthogonal by checking all three pairs of dot products: \\(\\mathbf f_1\\) with \\(\\mathbf f_2\\), \\(\\mathbf f_1\\) with \\(\\mathbf f_3\\), and \\(\\mathbf f_2\\) with \\(\\mathbf f_3\\). Then use the Expansion Theorem: each \\(c_i\\) is \\(\\mathbf x\\cdot\\mathbf f_i\\) divided by \\(\\|\\mathbf f_i\\|^2\\), and multiply the answer back out to check it. The step that needs care is the squared length, since dividing by \\(\\|\\mathbf f_i\\|\\) is an easy slip.<\/p>", "checklist": ["check all three pairs of vectors for dot product \\(0\\)", "use the Expansion Theorem: divide each \\(\\mathbf x\\cdot\\mathbf f_i\\) by \\(\\|\\mathbf f_i\\|^2\\)", "name the step that needs care, such as dividing by the squared length, not the length", "say how you will check the answer, such as multiplying it back out"]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: check that all three pairs of vectors have dot product \\(0\\). Then use the Expansion Theorem. Its coefficients, the Fourier coefficients, are \\(c_i=\\dfrac{\\mathbf x\\cdot\\mathbf f_i}{\\|\\mathbf f_i\\|^2}\\), where \\(\\|\\mathbf f_i\\|^2=\\mathbf f_i\\cdot\\mathbf f_i\\).<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "num", "text": "Confirm that the set is orthogonal. What is \\(\\mathbf f_1\\cdot\\mathbf f_3\\)?", "phase": "Carry out", "comment": "Right: \\(1\\cdot 1+1\\cdot 0+1\\cdot(-1)=0\\). So \\(\\mathbf f_1\\) and \\(\\mathbf f_3\\) are orthogonal. The other two pairs get the same check.", "hints": ["Multiply the entries of \\(\\mathbf f_1\\) and \\(\\mathbf f_3\\) in matching positions, then add the three products.", "Check the sign in the last position. The last entry of \\(\\mathbf f_3\\) is negative, and that carries into its product."], "shape": [1, 1], "values": [0.0], "answer_tex": "0", "typed_answer": ["0"], "wrong": [{"values": [1.0], "comment": "That leaves out the last product, \\(1\\cdot(-1)\\). A dot product has one product for each entry, and all three count."}, {"values": [2.0], "comment": "Check the last entry of \\(\\mathbf f_3\\). It is \\(-1\\), so the last product is \\(-1\\), not \\(+1\\)."}, {"values": [3.0], "comment": "That adds the entries of \\(\\mathbf f_1\\) and ignores \\(\\mathbf f_3\\). A dot product multiplies matching entries in pairs, then adds."}]}, {"type": "matrix", "text": "Now find the coefficients. Enter \\((c_1,c_2,c_3)\\) as a column, from top to bottom.", "phase": "Carry out", "comment": "Right. Each coefficient is its dot product with \\(\\mathbf x\\) divided by the squared length of its vector: \\(c_1=\\tfrac43\\), \\(c_2=-\\tfrac56\\), and \\(c_3=\\tfrac12\\).", "label": "\\mathbf c =", "hints": ["Find each dot product \\(\\mathbf x\\cdot\\mathbf f_i\\) first, one vector at a time.", "Then divide each one by \\(\\mathbf f_i\\cdot\\mathbf f_i\\), the squared length of that vector, not by its length.", "Watch the signs. The middle entries of \\(\\mathbf x\\) and \\(\\mathbf f_2\\) multiply to a negative number, and that carries over to \\(c_2\\)."], "shape": [3, 1], "values": [1.3333333333333333, -0.8333333333333334, 0.5], "answer_tex": "\\begin{bmatrix}\\frac{4}{3}\\\\- \\frac{5}{6}\\\\\\frac{1}{2}\\end{bmatrix}", "typed_answer": ["4/3", "-5/6", "1/2"], "wrong": [{"values": [4.0, -5.0, 1.0], "comment": "You used the dot products without dividing. That works only when every vector has length \\(1\\), and these vectors don’t."}, {"values": [2.309401076758503, -2.041241452319315, 0.7071067811865476], "comment": "You divided by the length \\(\\|\\mathbf f_i\\|\\). The expansion divides by the squared length \\(\\|\\mathbf f_i\\|^2\\), which is a whole number here."}, {"values": [1.3333333333333333, 0.8333333333333334, 0.5], "comment": "Check the sign of \\(\\mathbf x\\cdot\\mathbf f_2\\). Its sign carries over to \\(c_2\\), so the minus sign has to stay."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The answer is \\(c_1=\\tfrac43\\), \\(c_2=-\\tfrac56\\), and \\(c_3=\\tfrac12\\).<\/p><p>Last phase: <strong>look back<\/strong>. Check the answer your own way, and then see what else the same method can do.<\/p>", "phase": "Look back", "cta": "Got it. On to Phase 4: Look back."}, {"type": "write", "text": "Choose a check of your own and carry it out. What did you check, and did it pass?", "phase": "Look back", "model": "<p>I multiplied the answer back out: \\(\\tfrac43\\mathbf f_1-\\tfrac56\\mathbf f_2+\\tfrac12\\mathbf f_3\\) should equal \\(\\mathbf x\\). Adding the three scaled vectors entry by entry gives \\((1,3,0)\\), which is \\(\\mathbf x\\), so the check passed.<\/p>", "checklist": ["name the check you chose, such as multiplying the combination back out", "carry it out with numbers, not just words", "say whether it passed", "say what the check would catch if an answer were wrong"]}, {"type": "error", "text": "Here is a classmate’s solution. Read it line by line, and click the first line that is wrong.", "phase": "Look back", "lines": [{"html": "Check that the set is orthogonal: \\(\\mathbf f_1\\cdot\\mathbf f_2=1-2+1=0\\), \\(\\mathbf f_1\\cdot\\mathbf f_3=1+0-1=0\\), and \\(\\mathbf f_2\\cdot\\mathbf f_3=1+0-1=0\\).", "wrong": false, "comment": "All three products are \\(0\\), so the set is orthogonal, and the expansion can be used."}, {"html": "Dot \\(\\mathbf x=(1,3,0)\\) with each \\(\\mathbf f_i\\): \\(\\mathbf x\\cdot\\mathbf f_1=4\\), \\(\\mathbf x\\cdot\\mathbf f_2=-5\\), and \\(\\mathbf x\\cdot\\mathbf f_3=1\\).", "wrong": false, "comment": "Those are the numerators: \\(1+3+0=4\\), \\(1-6+0=-5\\), and \\(1+0+0=1\\)."}, {"html": "The squared lengths are \\(\\|\\mathbf f_1\\|^2=3\\), \\(\\|\\mathbf f_2\\|^2=6\\), and \\(\\|\\mathbf f_3\\|^2=2\\).", "wrong": false, "comment": "Each one is a sum of three squares: \\(1+1+1\\), \\(1+4+1\\), and \\(1+0+1\\)."}, {"html": "So \\(c_1=\\dfrac{4}{3}\\) and \\(c_3=\\dfrac{1}{2}\\).", "wrong": false, "comment": "Both divide by the squared length, as they should."}, {"html": "Next, \\(c_2=\\dfrac{\\mathbf x\\cdot\\mathbf f_2}{\\|\\mathbf f_2\\|}=\\dfrac{-5}{\\sqrt6}\\).", "wrong": true, "comment": "Right. This is the forgot-the-square slip. It divides by the length \\(\\|\\mathbf f_2\\|=\\sqrt6\\) instead of the squared length \\(\\|\\mathbf f_2\\|^2=6\\), so \\(c_2=-\\tfrac56\\)."}, {"html": "Each \\(c_i\\) came from its own dot product, so no \\(3\\times 3\\) system was needed.", "wrong": false, "comment": "That is true. Orthogonality is what lets each coefficient be found on its own."}]}, {"type": "example", "text": "Now build one. Give a nonzero vector \\(\\mathbf w\\) in \\(\\mathbb R^3\\) that is orthogonal to both \\(\\mathbf f_1\\) and \\(\\mathbf f_2
