<script>window.POLYA = {"slug": "p5-5a-enough-eigenvectors", "title": "5.5 Problem A: Enough eigenvectors?", "statement": "Recall that \\(A\\) is diagonalizable when \\(P^{-1}AP=D\\) for some invertible \\(P\\) and some diagonal \\(D\\). Is \\(A=\\begin{bmatrix}4&-1&2\\\\0&2&0\\\\-1&0&1\\end{bmatrix}\\) diagonalizable? Decide, and say why.", "questions": [{"type": "write", "text": "In your own words, what is this problem asking for?", "phase": "Understand", "model": "<p>It asks whether \\(A\\) has enough independent eigenvectors to be diagonalized: an invertible \\(P\\) and a diagonal \\(D\\) with \\(P^{-1}AP=D\\). The columns of \\(P\\) must be three independent eigenvectors of \\(A\\), so the eigenvalues, and the eigenspace for each one, are where I start.<\/p>", "checklist": ["say that the question is whether \\(P^{-1}AP=D\\) for an invertible \\(P\\) and a diagonal \\(D\\)", "say that the columns of \\(P\\) must be three independent eigenvectors", "say that the eigenvalues and their eigenspaces are where to start"]}, {"type": "explore", "text": "<p>Warm-up, not the problem’s \\(A\\): \\(W=\\begin{bmatrix}2&1\\\\-1&4\\end{bmatrix}\\). The blue arrow is a unit vector \\(\\mathbf x\\), and the orange arrow is \\(W\\mathbf x\\). Drag \\(\\mathbf x\\) around the circle until \\(W\\mathbf x\\) lies along \\(\\mathbf x\\).<\/p>", "phase": "Understand", "widget": {"kind": "circle-map", "A": [[2, 1], [-1, 4]], "goal": "eigen", "need": 1, "quiet": true, "hint": "Drag the blue dot (or focus it and use the arrow keys). The blue arrow is x, a unit vector; the orange arrow is Wx. Faint orange dots trace where Wx has been."}, "found": "Right. \\(W\\mathbf x\\) lies along \\(\\mathbf x\\) in the direction {dir}, and the figure stops at the first one it finds. Is there a second direction like that? The figure can’t settle it, so keep the question for the eigenspace step below."}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The tools from the notes decide this. The eigenvalues of \\(A\\) are the roots of \\(c_A(x)=\\det(xI-A)\\), and the multiplicity of an eigenvalue is the number of times it is a root. For each eigenvalue \\(\\lambda\\), \\(\\dim E_\\lambda(A)\\) is \\(3\\) minus the rank of \\(\\lambda I-A\\). If \\(c_A(x)\\) factors completely, then \\(A\\) is diagonalizable exactly when \\(\\dim E_\\lambda(A)\\) equals the multiplicity of \\(\\lambda\\) for every eigenvalue \\(\\lambda\\). A repeated eigenvalue doesn’t decide the question by itself; the count of its independent eigenvectors does.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "phase": "Plan", "cta": "Got it. On to Phase 2: Plan."}, {"type": "write", "text": "Before you start, write your plan in 1–3 sentences: which method, and which step needs care?", "phase": "Plan", "model": "<p>Factor \\(c_A(x)=\\det(xI-A)\\) to find each eigenvalue and its multiplicity. For each eigenvalue \\(\\lambda\\), row-reduce \\(\\lambda I-A\\) to count its free variables, which is \\(\\dim E_\\lambda(A)\\), and compare that count with the multiplicity. The step that needs care is the count: it is \\(3\\) minus the rank, not the rank itself.<\/p>", "checklist": ["start from \\(c_A(x)=\\det(xI-A)\\), to get the eigenvalues and their multiplicities", "row-reduce \\(\\lambda I-A\\) for each eigenvalue \\(\\lambda\\)", "compare each eigenspace dimension with the multiplicity", "name the step that needs care: the count is \\(3\\) minus the rank"]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: find \\(c_A(x)\\), and with it the eigenvalues and their multiplicities. Then, for each eigenvalue, count its independent eigenvectors (\\(3\\) minus the rank of \\(\\lambda I-A\\)) and compare the count with the multiplicity. The warm-up’s question comes back here, now for \\(A\\).<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "matrix", "text": "Enter the eigenvalues
