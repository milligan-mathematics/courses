<script>window.PRACTICE = {"section": "5.1", "title": "Subspaces and spanning", "links": [{"label": "Pólya problem: How much room do three vectors make?", "url": "https://milligan-mathematics.github.io/courses/307/polya/p5-1a-how-much-room.html"}], "skills": [{"id": "subspace-test", "title": "The subspace test", "mastery": "Decides whether a subset \\(U\\) of \\(\\mathbb{R}^n\\) given by an equation or condition is a subspace by checking the three parts of the test: \\(\\mathbf{0}\\in U\\), closed under addition, closed under scalar multiplication. When one part fails, gives a specific counterexample made of vectors that really are in \\(U\\). Knows that every span is a subspace and that a line or plane is a subspace exactly when it passes through the origin.", "book": "Exercise 5.1.1", "items": [{"statement": "Let \\(U = \\{(x,y,z) : -3x + 3y - 3z = 0\\}\\).", "steps": [{"type": "mc", "text": "Is \\(U\\) a subspace of \\(\\mathbb{R}^3\\), and why?", "answers": [{"html": "Yes. The zero vector satisfies the equation, so \\(U\\) is a subspace.", "ok": false, "comment": "Not quite. The zero vector is in \\(U\\), but that is only the first of the three checks. Sums and scalar multiples have to stay in \\(U\\) too."}, {"html": "No. It is only part of \\(\\mathbb{R}^3\\), not all of it.", "ok": false, "comment": "The answer is no, but not for that reason. Lots of subspaces are only part of \\(\\mathbb{R}^3\\). This one passes all three checks."}, {"html": "No. \\((1,0,0)\\) and \\((0,1,0)\\) are in \\(U\\), but their sum \\((1,1,0)\\) is not.", "ok": false, "comment": "Those two vectors are not in \\(U\\) to begin with: \\((1,0,0)\\) gives \\(-3\\neq 0\\), and \\((0,1,0)\\) gives \\(3\\neq 0\\). A counterexample has to start from vectors that are in the set."}, {"html": "Yes. The zero vector satisfies the equation. The equation is linear, so if \\(\\mathbf{u}\\) and \\(\\mathbf{w}\\) are in \\(U\\), then so are \\(\\mathbf{u}+\\mathbf{w}\\) and \\(k\\mathbf{u}\\).", "ok": true, "comment": "Right. All three parts of the test hold: \\(\\mathbf{0}\\) is in \\(U\\), and sums and scalar multiples of vectors in \\(U\\) stay in \\(U\\)."}]}]}, {"statement": "Let \\(U = \\{(x,y,z) : 2x + 3y + z = 3\\}\\).", "steps": [{"type": "mc", "text": "Is \\(U\\) a subspace of \\(\\mathbb{R}^3\\), and why?", "answers": [{"html": "No. It is only part of \\(\\mathbb{R}^3\\), not all of it.", "ok": false, "comment": "The answer is no, but not for that reason. Lots of subspaces are only part of \\(\\mathbb{R}^3\\). This set fails because the zero vector is missing."}, {"html": "No. The vector \\((1,0,0)\\) is not in \\(U\\), so \\(U\\) is not closed under addition.", "ok": false, "comment": "A vector outside \\(U\\) doesn’t show that \\(U\\) fails. A counterexample needs two vectors that are in \\(U\\) whose sum is not."}, {"html": "Yes. It is a plane, and a plane is a subspace of \\(\\mathbb{R}^3\\).", "ok": false, "comment": "Not quite. A plane is a subspace only when it passes through the origin. Check whether the zero vector is in the set first."}, {"html": "No. The zero vector is not in \\(U\\): at \\((0,0,0)\\) the left side is \\(0\\), and \\(0\\neq 3\\).", "ok": true, "comment": "Right. A subspace always contains the zero vector, and this set misses it, so the test stops there."}]}]}, {"statement": "Let \\(U = \\{(x,y,z) : y = 3x^2 - z\\}\\).", "steps": [{"type": "mc", "text": "Is \\(U\\) a subspace of \\(\\mathbb{R}^3\\), and why?", "answers": [{"html": "No. \\((2,3,0)\\) and \\((1,0,0)\\) are in \\(U\\), but their sum \\((3,3,0)\\) is not.", "ok": false, "comment": "The vector \\((2,3,0)\\) is not in \\(U\\) to begin with: \\(3\\neq12\\). A counterexample has to start from vectors that are in the set."}, {"html": "Yes. The zero vector satisfies the equation, so \\(U\\) is a subspace.", "ok": false, "comment": "Not quite. The zero vector is in \\(U\\), but that is only the first of the three checks. Sums and scalar multiples have to stay in \\(U\\
