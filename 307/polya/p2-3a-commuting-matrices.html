<script>window.POLYA = {"slug": "p2-3a-commuting-matrices", "title": "2.3 Problem A: Which matrices commute with A?", "statement": "Let \\(A = \\begin{bmatrix}1&1\\\\0&1\\end{bmatrix}\\). Find every \\(2 \\times 2\\) matrix \\(X\\) that <strong>commutes<\/strong> with \\(A\\), meaning \\(AX = XA\\). Your answer should describe a whole family of matrices, using unknown entries.", "questions": [{"type": "write", "text": "In your own words, what is this problem asking for?", "phase": "Understand", "model": "<p>We want every \\(2 \\times 2\\) matrix \\(X\\) for which multiplying by \\(A\\) gives the same result in either order: \\(AX = XA\\). The answer is probably not one matrix. It is more likely a family, with some entries free, so the answer should use unknown letters.<\/p>", "checklist": ["say we want every \\(2 \\times 2\\) matrix \\(X\\) with \\(AX = XA\\)", "expect a family with some entries free, not one matrix", "say the answer will use unknown letters for the free entries"]}, {"type": "mc", "text": "What does \"\\(X\\) commutes with \\(A\\)\" mean?", "phase": "Understand", "answers": [{"html": "\\(AX = XA\\), so the two products are the same matrix.", "ok": true, "comment": "Right. Commuting means the two orders of multiplying give the same matrix. Nothing more is required."}, {"html": "\\(XA = I\\), so \\(X\\) is the inverse of \\(A\\).", "ok": false, "comment": "Inverses are a different idea. The identity matrix commutes with \\(A\\) too, but \\(IA = A\\), not \\(I\\). Commuting only asks that \\(AX\\) and \\(XA\\) match."}, {"html": "\\(X = A\\).", "ok": false, "comment": "Commuting is about \\(AX\\) and \\(XA\\) agreeing, not about \\(X\\) being \\(A\\). The identity matrix commutes with \\(A\\) but is not \\(A\\)."}, {"html": "\\(AX = X\\), so \\(A\\) leaves \\(X\\) unchanged.", "ok": false, "comment": "That is a statement about \\(A\\) acting like the identity. The identity matrix \\(X = I\\) commutes with \\(A\\), but \\(AI = A\\), which is not \\(I\\) unless \\(A\\) is the identity."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> We want every \\(X\\) with \\(AX = XA\\), and we expect a whole family, not one matrix.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "phase": "Plan", "cta": "Got it. On to Phase 2: Plan."}, {"type": "multi", "text": "Which of these plans would find every \\(X\\) that commutes with \\(A\\)? Select all that apply.", "phase": "Plan", "answers": [{"html": "Guess that only multiples of the identity commute with \\(A\\), since \\(A\\) is close to \\(I\\).", "ok": false, "comment": "This is the plan that misses the answer. \\(A\\) itself commutes with \\(A\\), and \\(A\\) is not a multiple of \\(I\\). Matrices that commute with \\(A\\) can have off-diagonal entries."}, {"html": "Test only \\(X = A\\), since a matrix always commutes with itself, and report that as the answer.", "ok": false, "comment": "A matrix does commute with itself, but that is one example, not all of them. The identity also commutes with \\(A\\), and \\(I \\ne A\\), so a single test cannot find the whole family."}, {"html": "Write \\(X\\) with entries \\(x, y, z, w\\), multiply out \\(AX\\) and \\(XA\\), and set the matching entries equal.", "ok": true, "comment": "This works. Four entry-by-entry comparisons give equations in \\(x, y, z, w\\), and solving them gives the family."}, {"html": "Write \\(A = I + N\\) with \\(N = \\begin{bmatrix}0&1\\\\0&0\\end{bmatrix}\\). Since \\(I\\) commutes with everything, \\(X\\) commutes with \\(A\\) exactly when it commutes with \\(N\\).", "ok": true, "comment": "This also works, and it is a shorter route. The identity drops out of both products, so we only need \\(NX = XN\\)."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: write \\(X = \\begin{bmatrix}x&y\\\\z&w\\end{bmatrix}\\), multiply out \\(AX\\) and \\(XA\\), and set matching entries equal.<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out",
