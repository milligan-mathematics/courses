<script>window.POLYA = {"slug": "p2-4a-which-side-inverse", "title": "2.4 Problem A: Which side does the inverse go on?", "statement": "Let \\(A = \\begin{bmatrix}1&1\\\\1&2\\end{bmatrix}\\), \\(B = \\begin{bmatrix}2&1\\\\1&1\\end{bmatrix}\\), and \\(C = \\begin{bmatrix}1&2\\\\3&4\\end{bmatrix}\\). Both \\(A\\) and \\(B\\) are invertible. Solve \\(AXB = C\\) for the matrix \\(X\\).", "questions": [{"type": "write", "text": "In your own words, what is this problem asking for?", "phase": "Understand", "model": "<p>It gives me \\(A\\), \\(B\\), and \\(C\\), and asks for the matrix \\(X\\) that makes \\(AXB = C\\) true. Since \\(X\\) sits between \\(A\\) and \\(B\\), I can’t just divide. I need to undo \\(A\\) on the left and \\(B\\) on the right, with each inverse on its own side.<\/p>", "checklist": ["name \\(X\\) as the unknown, with \\(A\\), \\(B\\), and \\(C\\) given", "say that \\(X\\) sits between \\(A\\) and \\(B\\), so it can’t just be divided out", "say that each inverse goes on its own side"]}, {"type": "mc", "text": "In \\(AXB = C\\), where do \\(A\\) and \\(B\\) sit relative to \\(X\\)?", "phase": "Understand", "answers": [{"html": "\\(B\\) multiplies from the left and \\(A\\) from the right.", "ok": false, "comment": "That is \\(BXA = C\\), which is a different problem. Read \\(AXB\\) from left to right."}, {"html": "Both multiply \\(X\\) from the left.", "ok": false, "comment": "That would be \\(ABX = C\\), not \\(AXB = C\\). Matrix products depend on order, so \\(B\\) comes after \\(X\\)."}, {"html": "\\(A\\) multiplies \\(X\\) from the left, and \\(B\\) multiplies \\(X\\) from the right.", "ok": true, "comment": "Right. Each matrix touches \\(X\\) on its own side, so each inverse has to go on its own side too."}, {"html": "Both multiply \\(X\\) from the right.", "ok": false, "comment": "That would be \\(XAB = C\\). In \\(AXB\\), \\(A\\) is in front of \\(X\\), not behind it."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> We want \\(X\\) alone, so both \\(A\\) and \\(B\\) have to come off. Each one comes off with its inverse. Matrix products depend on order, so the plan has to say which side each inverse goes on.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "phase": "Plan", "cta": "Got it. On to Phase 2: Plan."}, {"type": "multi", "text": "Which of these plans would solve \\(AXB = C\\) for \\(X\\)? Select all that apply.", "phase": "Plan", "answers": [{"html": "Divide both sides by \\(A\\), then divide by \\(B\\), the way you would with numbers.", "ok": false, "comment": "Matrices don’t divide. The matrix version of dividing is multiplying by an inverse, on the correct side."}, {"html": "Multiply both sides on the left by \\(A^{-1}\\), and then on the left by \\(B^{-1}\\).", "ok": false, "comment": "The \\(B^{-1}\\) has to go on the right, where \\(B\\) sits. On the left it can’t reach \\(B\\), so it cancels nothing."}, {"html": "Multiply both sides on the right by \\(B^{-1}\\), then multiply both sides on the left by \\(A^{-1}\\).", "ok": true, "comment": "Also works. \\(A\\) and \\(B\\) are on opposite sides of \\(X\\), so the two steps don’t get in each other’s way."}, {"html": "Multiply both sides on the left by \\(A^{-1}\\), then multiply both sides on the right by \\(B^{-1}\\).", "ok": true, "comment": "Yes. The left multiplication removes \\(A\\) from the front of \\(X\\), and the right multiplication removes \\(B\\) from the back."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: undo \\(A\\) on the left and \\(B\\) on the right, using inverses. We start with \\(A^{-1}\\).<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "matrix", "text": "Find \\(A^{-1}\\), the inverse of \\(A\\). Enter its entries below.", "phase": "Carry out", "comment": "Right. Swap the diagonal entries, negate the off-diagonal entries, and divide by \\(ad - bc\\). Here \\(ad - bc = 1\\), so no fraction is left over.", "label": "A^{-1} =", "hints": ["For \\(\\begin{bmatrix}a&b\\\\c&d\\end{bmatrix}\\), the inverse is \\(\\dfrac{1}{ad-bc}\\begin{bmatrix}d&-b\\\\-c&a\\end{bmatrix}\\). Which entries of \\(A\\) play the roles of \\(a\\), \\(b\\), \\(c\\), and \\(d\\)?", "Find \\(ad-bc\\) for \\(A\\) first. That number goes in front, as the fraction.", "Swap the two diagonal entries of \\(A\\), and change the sign of each off-diagonal entry."], "shape": [2, 2], "values": [2.0, -1.0, -1.0, 1.0], "answer_tex": "\\begin{bmatrix}2&-1\\\\-1&1\\end{bmatrix}", "typed_answer": ["2", "-1", "-1", "1"], "wrong": [{"values": [2.0, 1.0, 1.0, 1.0], "comment": "You swapped the diagonal entries but kept the off-diagonal signs. Those need to change too."}, {"values": [1.0, -1.0, -1.0, 2.0], "comment": "You changed the off-diagonal signs but left the diagonal where it was. The diagonal entries swap."}, {"values": [0.6666666666666666, -0.3333333333333333, -0.3333333333333333, 0.3333333333333333], "comment": "The determinant is \\(ad - bc = 1\\cdot 2 - 1\\cdot 1 = 1\\), not \\(ad + bc = 3\\). Adding instead of subtracting is the mistake here."}, {"values": [1.0, 1.0, 1.0, 0.5], "comment": "Inverting a matrix doesn’t invert each entry. Swap and negate the entries, then divide by the determinant."}]}, {"type": "mc", "text": "Using \\(A^{-1} = \\begin{bmatrix}2&-1\\\\-1&1\\end{bmatrix}\\), multiply both sides of \\(AXB = C\\) on the left by \\(A^{-1}\\). The equation becomes \\(XB = \\;?\\) What goes in the blank?", "phase": "Carry out", "answers": [{"html": "\\(AC\\)", "ok": false, "comment": "That is \\(AC\\). Multiplying by \\(A\\) doesn’t undo it. We need the inverse \\(A^{-1}\\)."}, {"html": "\\(CA^{-1}\\)", "ok": false, "comment": "That is \\(CA^{-1}\\). The inverse went to the wrong side of \\(C\\). It has to stay on the left, next to \\(A\\)."}, {"html": "\\(A^{-1}C\\)", "ok": true, "comment": "Right. \\(A^{-1}C\\) is the product with \\(A^{-1}\\) on the left of \\(C\\), because that is the side where it cancels \\(A\\)."}]}, {"type": "matrix", "text": "Multiply both sides by \\(B^{-1} = \\begin{bmatrix}1&-1\\\\-1&2\\end{bmatrix}\\) on the side where \\(B\\) sits, so that \\(X\\) is alone. Enter \\(X\\).", "phase": "Carry out", "comment": "Right: \\(X = A^{-1}CB^{-1}\\). Each inverse is used once, on its own side.", "label": "X =", "hints": ["From \\(XB = A^{-1}C\\), the \\(B\\) on the right is what has to go. Multiply by its inverse on the right, and keep \\(A^{-1}C\\) in front.", "Each entry of the product is a row of \\(A^{-1}C\\) times a column of \\(B^{-1}\\). Work through the four entries one at a time, starting at the top left."], "shape": [2, 2], "values": [-1.0, 1.0, 0.0, 2.0], "answer_tex": "\\begin{bmatrix}-1&1\\\\0&2\\end{bmatrix}", "typed_answer": ["-1", "1", "0", "2"], "wrong": [{"values": [-9.0, -10.0, 7.0, 8.0], "comment": "Both inverses went on the left: \\(A^{-1}B^{-1}C\\). \\(B^{-1}\\) belongs on the right of \\(X\\), where \\(B\\) was."}, {"values": [-1.0, 2.0, 1.0, 0.0], "comment": "Both inverses went on the right of \\(C\\): \\(CA^{-1}B^{-1}\\). \\(A^{-1}\\) has to stay on the left, next to \\(A\\)."}, {"values": [-2.0, 0.0, 4.0, 1.0], "comment": "The two inverses are swapped. \\(A^{-1}\\) goes on the left, where \\(A\\) sits, and \\(B^{-1}\\) on the right."}, {"values": [-2.0, -1.0, 6.0, 4.0], "comment": "You multiplied by \\(B\\) where you needed \\(B^{-1}\\). To undo \\(B\\), use its inverse."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The answer is \\(X = \\begin{bmatrix}-1&1\\\\0&2\\end{bmatrix}\\).<\/p><p>Last phase: <strong>look back<\/strong>. Put the answer back into the original equation.<\/p>", "phase": "Look back", "cta": "Got it. On to Phase 4: Look back."}, {"type": "mc", "text": "Multiply \\(A\\), your \\(X\\), and \\(B\\) together, in that order. Which result confirms the answer?", "phase": "Look back", "answers": [{"html": "\\(C\\), but only if you multiply in the order \\(BXA\\).", "ok": false, "comment": "That is the product for \\(BXA = C\\), a different equation. Keep the order from the original problem."}, {"html": "\\(C\\) itself, since \\(AXB = C\\).", "ok": true, "comment": "Right. Multiplying back is the check, and it lands exactly on \\(C\\)."}, {"html": "\\(C\\), but only if you multiply in the order \\(XAB\\).", "ok": false, "comment": "Order matters. \\(XAB\\) is a different product, and for this \\(X\\) it does not give \\(C\\)."}, {"html": "\\(X\\) itself, since \\(A\\) and \\(B\\) cancel.", "ok": false, "comment": "Multiplying by \\(A\\) and \\(B\\) doesn’t cancel \\(X\\). Only inverses cancel. Here \\(AXB\\) comes back as \\(C\\), not \\(X\\)."}]}, {"type": "error", "text": "A classmate solved this problem and wrote out the steps. Check the solution line by line.", "phase": "Look back", "lines": [{"html": "We start with \\(AXB = C\\).", "wrong": false, "comment": "That is the equation we start from."}, {"html": "Multiply on the left by \\(A^{-1}\\): \\(XB = A^{-1}C\\).", "wrong": false, "comment": "That is the left step, and it is right. \\(A^{-1}\\) cancels \\(A\\) on the left, and \\(B\\) stays on the right of \\(X\\)."}, {"html": "Multiply on the right by \\(B^{-1}\\): \\(X = A^{-1}B^{-1}C\\).", "wrong": true, "comment": "Exactly. The words say \"on the right,\" but the product puts \\(B^{-1}\\) in front of \\(C\\). Multiplying on the right keeps \\(C\\) ahead of \\(B^{-1}\\)."}]}, {"type": "example", "text": "Now build one. Enter an invertible \\(2\\times 2\\) matrix \\(P\\) that does <strong>not<\/strong> commute with \\(C\\), so that \\(PC \\neq CP\\).", "phase": "Look back", "shape": [2, 2], "conditions": [{"js": "isInvertible(M)", "comment": "That matrix has no inverse, so its determinant is 0. Try one whose two rows are not multiples of each other."}, {"js": "!eq(mul(M, [[1, 2], [3, 4]]), mul([[1, 2], [3, 4]], M))", "comment": "For your \\(P\\), \\(PC\\) and \\(CP\\) come out equal, so \\(P\\) commutes with \\(C\\)
