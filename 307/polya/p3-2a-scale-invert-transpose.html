<script>window.POLYA = {"slug": "p3-2a-scale-invert-transpose", "title": "3.2 Problem A: Scale, invert, and transpose", "statement": "Let \\(A\\) and \\(B\\) be \\(3\\times 3\\) matrices with \\(\\det A = 2\\) and \\(\\det B = -1\\). Find \\(\\det(2A^{-1}B^{T})\\), and decide whether \\(2A^{-1}B^{T}\\) is invertible.", "questions": [{"phase": "Understand", "type": "write", "text": "In your own words, what is this problem asking for?", "model": "<p>It gives the determinants of two \\(3\\times 3\\) matrices, \\(A\\) and \\(B\\), and asks for the determinant of \\(2A^{-1}B^{T}\\). I can’t compute that from the entries, because they aren’t given. So I need the determinant rules for a scalar, an inverse, a transpose, and a product. It also asks whether \\(2A^{-1}B^{T}\\) is invertible.<\/p>"}, {"phase": "Understand", "type": "mc", "text": "What do \\(\\det A = 2\\) and \\(\\det B = -1\\) tell you about \\(A\\) and \\(B\\)?", "answers": [{"html": "Both are invertible, because a square matrix is invertible exactly when its determinant is not zero.", "ok": true, "comment": "Right. Both determinants are nonzero, so \\(A\\) and \\(B\\) are both invertible. That is what lets us use \\(A^{-1}\\) in the expression."}, {"html": "\\(A\\) is invertible, but \\(B\\) is not, because its determinant is negative.", "ok": false, "comment": "The sign doesn’t decide it. Only whether the determinant is zero matters, and \\(-1\\) is not zero, so \\(B\\) is invertible too."}, {"html": "Nothing. The determinant doesn’t say whether a matrix is invertible.", "ok": false, "comment": "The determinant does say that. A matrix is invertible exactly when its determinant is not zero. That is why the problem can use \\(A^{-1}\\)."}, {"html": "Neither is invertible, because a nonzero determinant means the matrix has no inverse.", "ok": false, "comment": "That reverses the rule. A matrix is invertible when its determinant is not zero, so these nonzero determinants mean both matrices have inverses."}]}, {"phase": "Plan", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> We know what’s being asked, and both matrices are invertible. The expression has a scalar, an inverse, a transpose, and several matrix factors, but we only know two determinants. Before any arithmetic, we need a plan.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 2: Plan."}, {"phase": "Plan", "type": "write", "text": "Before you start, write your plan in 1–3 sentences: which method, and which step needs care?", "model": "<p>I’ll use the Product Theorem (Theorem 3.2.1) to split \\(\\det(2A^{-1}B^{T})\\) into pieces, and use one rule for each piece: the scalar rule, the inverse rule, and the transpose rule. The step that needs care is the 2. It is a scalar on a \\(3\\times 3\\) matrix, so its effect on the determinant depends on the size of the matrix, not on the 2 alone.<\/p>"}, {"phase": "Carry out", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: split the expression into pieces, and apply the rule for each piece. We start with \\(2A^{-1}\\).<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 3: Carry out."}, {"phase": "Carry out", "type": "mc", "text": "What is \\(\\det(2A^{-1})\\)?", "answers": [{"html": "\\(-16\\)", "ok": false, "comment": "You flipped the sign. The determinant of an inverse is \\(1/\\det A\\), which is \\(\\tfrac12\\) here. It is not \\(-\\det A\\)."}, {"html": "\\(1\\)", "ok": false, "comment": "You pulled the 2 out only once. Each of the three rows contributes a factor of \\(2\\), so the scalar is \\(2^3=8\\), not \\(2\\)."}, {"html": "\\(4\\)", "ok": true, "comment": "Right. Each of the three rows contributes a factor of \\(2\\), so the scalar part is \\(2^3=8\\). Also \\(\\det(A^{-1})=1/\\det A=\\tfrac12\\), and \\(8\\cdot\\tfrac12=4\\)."}, {"html": "\\(16\\)", "ok": false, "comment": "You used \\(\\det A=2\\) where \\(\\det(A^{-1})\\) belongs. The inverse has the reciprocal determinant, \\(1/\\det A=\\tfrac12\\), not \\(\\det A\\)."}]}, {"phase": "Carry out", "type": "mc", "text": "What is \\(\\det(2A^{-1}B^{T})\\)?", "answers": [{"html": "\\(16\\)", "ok": false, "comment": "That uses \\(-\\det A\\) for \\(\\det(A^{-1})\\), which flips the sign of the first piece. The inverse rule gives \\(\\det(A^{-1})=\\tfrac12\\), and the product is \\(-4\\)."}, {"html": "\\(-4\\)", "ok": true, "comment": "Right. The determinant of a product is the product of the determinants, so \\(\\det(2A^{-1}B^{T})=\\det(2A^{-1})\\det(B^{T})=4\\cdot(-1)=-4\\). Transposing doesn’t change the determinant."}, {"html": "\\(-1\\)", "ok": false, "comment": "That uses \\(\\det(2A^{-1})=1\\), with the 2 counted only once. The scalar comes out as \\(2^3=8\\), so the first piece is \\(4\\)."}, {"html": "\\(4\\)", "ok": false, "comment": "That treats \\(\\det(B^{T})\\) as \\(-\\det B=1\\). Transposing doesn’t change the determinant, so \\(\\det(B^{T})=-1\\), and the product is \\(-4\\)."}]}, {"phase": "Carry out", "type": "mc", "text": "Is \\(2A^{-1}B^{T}\\) invertible?", "answers": [{"html": "Yes. Its determinant is \\(-4\\), which is not zero.", "ok": true, "comment": "Right. A square matrix is invertible exactly when its determinant is not zero, and \\(-4\\neq 0\\). We never needed the entries of \\(A\\) and \\(B\\)."}, {"html": "It can’t be decided, because we don’t know the entries of \\(A\\) and \\(B\\).", "ok": false, "comment": "We don’t need the entries. The determinant settles it, and \\(-4\\) is not zero."}, {"html": "No. Its determinant is negative, and only positive determinants come from invertible matrices.", "ok": false, "comment": "The sign doesn’t matter. Only zero versus nonzero decides invertibility, and \\(-4\\) is not zero."}]}, {"phase": "Look back", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The answer is \\(\\det(2A^{-1}B^{T})=-4\\), and \\(2A^{-1}B^{T}\\) is invertible.<\/p><p>Last phase: <strong>look back<\/strong>. Check the value another way.<\/p>", "cta": "Got it. On to Phase 4: Look back."}, {"phase": "Look back", "type": "mc", "text": "Which of these would check your value of \\(\\det(2A^{-1}B^{T})\\)?", "answers": [{"html": "Multiply \\(2A^{-1}B^{T}\\) by its own inverse, and check that you get the identity matrix.", "ok": false, "comment": "That checks that the matrix is invertible, not what its determinant is. Many invertible matrices have different determinants."}, {"html": "Check that \\(2A^{-1}B^{T}\\) is \\(3\\times 3\\).", "ok": false, "comment": "A size check is a good start, but a \\(3\\times 3\\) matrix can have any determinant."}, {"html": "Take \\(A=B=I\\), the identity matrix, and compute \\(\\det(2A^{-1}B^{T})\\) directly.", "ok": false, "comment": "The identity has determinant \\(1\\), not \\(2\\) and \\(-1\\). A check has to use matrices with the given determinants, or it doesn’t test this problem."}, {"html": "Take \\(A\\) diagonal with diagonal entries \\(2, 1, 1\\) and \\(B\\) diagonal with diagonal entries \\(-1, 1, 1\\), and compute \\(\\det(2A^{-1}B^{T})\\) directly.", "ok": true, "comment": "Right. These matrices have \\(\\det A=2\\) and \\(\\det B=-1\\), so they fit the problem. Computing with actual matrices gives \\(-4\\) without using the determinant rules, so it is an independent check."}]}, {"phase": "Look back", "type": "mc", "text": "Vary the problem. Now \\(A\\) and \\(B\\) are \\(4\\times 4\\), with \\(\\det A=2\\) and \\(\\det B=-1\\) as before. What is \\(\\det(2A^{-1}B^{T})\\)?", "answers": [{"html": "\\(8\\)", "ok": false, "comment": "The transpose doesn’t change the determinant, so \\(\\det(B^{T})=\\det B=-1\\), not \\(+1\\)."}, {"html": "\\(-8\\)", "ok": true, "comment": "Right. The scalar comes out as \\(2^4=16\\), so \\(\\det(2A^{-1})=16\\cdot\\tfrac12=8\\), and the full determinant is \\(8\\cdot(-1)=-8\\). The power on the 2 follows the size of the matrix."}, {"html": "\\(-32\\)", "ok": false, "comment": "You used \\(\\det A=2\\) for \\(\\det(A^{-1})\\). The inverse’s determinant is the reciprocal, \\(\\tfrac12\\), at any size."}, {"html": "\\(-4\\)", "ok": false, "comment": "The power on the 2 is the size of the matrix, which is \\(4\\) here, not \\(3\\). The \\(3\\) belonged to the \\(3\\times 3\\) problem."}]}, {"phase": "Look back", "type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). Suppose a classmate, asked for \\(\\det(A+B)\\), writes \\(\\det(A+B)=\\det A+\\det B=2+(-1)=1\\), so \\(A+B\\) must be invertible. What is wrong with this reasoning?<\/p>"}]};</script>
