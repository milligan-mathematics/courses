<script>window.POLYA = {"slug": "p2-2a-columns-reach-b", "title": "2.2 Problem A: Many ways to reach b", "statement": "Let \\(A = \\begin{bmatrix}1&2&1\\\\2&4&3\\end{bmatrix}\\) and \\(\\mathbf{b} = \\begin{bmatrix}7\\\\18\\end{bmatrix}\\). Find <strong>all<\/strong> vectors \\(\\mathbf{x}\\) with \\(A\\mathbf{x} = \\mathbf{b}\\). Equivalently, find every way to write \\(\\mathbf{b}\\) as a linear combination of the columns of \\(A\\).", "questions": [{"type": "write", "text": "In your own words, what is this problem asking for?", "phase": "Understand", "model": "<p>We want every vector \\(\\mathbf{x} = (x_1, x_2, x_3)\\) with \\(A\\mathbf{x} = \\mathbf{b}\\). Equivalently, we want every set of weights on the columns of \\(A\\) that adds up to \\(\\mathbf{b}\\). One weighting isn’t enough; we want all of them.<\/p>", "checklist": ["say the answer is every \\(\\mathbf x\\), not just one", "say that \\(\\mathbf x\\) has one entry per column of \\(A\\)", "say that \\(A\\) and \\(\\mathbf b\\) are given, and \\(\\mathbf x\\) is the unknown"]}, {"type": "mc", "text": "Try a special case first. Is \\(\\mathbf x = \\begin{bmatrix}3\\\\0\\\\4\\end{bmatrix}\\) a solution?", "phase": "Understand", "answers": [{"html": "Yes. \\(3\\) times column 1 plus \\(4\\) times column 3 gives \\(\\mathbf b\\), and the zero weight on column 2 is fine.", "ok": true, "comment": "Right: \\(3(1,2) + 0(2,4) + 4(1,3) = (7,18)\\). So at least one solution exists. The question is whether there are others."}, {"html": "No. \\(\\mathbf x\\) should have two entries, one per equation.", "ok": false, "comment": "\\(\\mathbf x\\) has one entry per <em>column<\/em> of \\(A\\), not one per equation. \\(A\\) has three columns, so three entries is the right size."}, {"html": "Yes. Any vector with three entries is a solution, since \\(A\\) has three columns.", "ok": false, "comment": "The answer is yes, but not for that reason. Three entries is the right size, but most such vectors are not solutions: \\((1,1,1)\\) gives \\((4,9)\\). This one works because \\(3(1,2) + 4(1,3) = (7,18)\\)."}, {"html": "No. A weight of \\(0\\) means that column doesn’t belong, so the product can’t match \\(\\mathbf b\\).", "ok": false, "comment": "A weight of \\(0\\) just means that column isn’t used. The other two columns still reach \\(\\mathbf b\\)."}]}, {"type": "explore", "text": "Now see the columns. Call them \\(\\mathbf a_1=(1,2)\\), \\(\\mathbf a_2=(2,4)\\) and \\(\\mathbf a_3=(1,3)\\). The sliders set the weights \\(x_1,x_2,x_3\\), and the weighted columns add head to tail. Land the tip on \\(\\mathbf b\\) in two different ways.", "phase": "Understand", "widget": {"kind": "combine", "columns": [[1, 2], [2, 4], [1, 3]], "target": [7, 18], "names": ["a₁", "a₂", "a₃"], "goal": "two-ways", "solutions": [[3, 0, 4], [1, 1, 4]], "start": [1, 1, 1], "window": [-4, 14, -3, 21], "grid": 2, "ranges": [{"min": -3, "max": 7, "step": 1}, {"min": -2, "max": 4, "step": 1}, {"min": 0, "max": 6, "step": 1}]}, "found": "Right: {ways} both land on \\(\\mathbf b\\). Column 2 is twice column 1, so one \\(\\mathbf a_2\\) can stand in for two \\(\\mathbf a_1\\)s. The weights \\(x_1\\) and \\(x_2\\) trade off, but \\(x_3\\) comes out the same every time. That is why there is more than one solution."}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> We want every \\(\\mathbf{x}\\) with \\(A\\mathbf{x} = \\mathbf{b}\\). We already have one, \\(\\mathbf{x} = (3, 0, 4)\\). Are there others?<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "phase": "Plan", "cta": "Got it. On to Phase 2: Plan."}, {"type": "multi", "text": "Which of these plans would find <em>all<\/em> the solutions? Select all that apply.", "phase": "Plan", "answers": [{"html": "Try small whole numbers for the weights until one works, then stop.", "ok": false, "comment": "That can find one solution, but it can’t show you that you have them all. You would never know when to stop."}, {"html": "Row-reduce the augmented matrix \\([A\\mid\\mathbf{b}]\\), then read off the leading variables and the free variables.", "ok": true, "comment": "This finds everything: the free variables tell you how many solutions there are and how they vary."}, {"html": "Find one solution \\(\\mathbf{x}_1\\) of \\(A\\mathbf{x} = \\mathbf{b}\\), find all solutions of \\(A\\mathbf{x} = \\mathbf{0}\\), and add \\(\\mathbf{x}_1\\) to each of those.", "ok": true, "comment": "Also correct. It is the theorem from this section: every solution is one particular solution plus a solution of \\(A\\mathbf{x} = \\mathbf{0}\\)."}, {"html": "Use only column 1: check whether \\(\\mathbf{b}\\) is a multiple of \\(\\begin{bmatrix}1\\\\2\\end{bmatrix}\\).", "ok": false, "comment": "That ignores column 3, \\(\\begin{bmatrix}1\\\\3\\end{bmatrix}\\). Column 1 alone can’t reach \\(\\mathbf{b}\\), because \\(\\mathbf{b}\\) is not a multiple of column 1."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: row-reduce \\([A\\mid\\mathbf{b}]\\). Remember that each row operation changes the right-hand column too.<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "matrix", "text": "Row-reduce \\([A\\mid\\mathbf{b}]\\) to reduced row-echelon form. Enter the reduced matrix, row by row.", "phase": "Carry out", "comment": "Right. \\(R_2 \\to R_2 - 2R_1\\) gives \\([\\,0\\ 0\\ 1\\mid 4\\,]\\), and then \\(R_1 \\to R_1 - R_2\\) gives \\([\\,1\\ 2\\ 0\\mid 3\\,]\\).", "label": "\\text{RREF} =", "hints": ["Start with row 2. Subtract 2 times row 1 from it, entry by entry. Don’t forget the last entry, the one on the right of the bar.", "Now row 2 has a leading 1 in column 3. Use row 2 to clear the entry above that 1, in row 1.", "Column 2 has no leading 1, so its entries are left alone. Only the pivot columns need zeros."], "syntax": "Fill in all eight boxes, row by row. The last box in each row is the right side.", "shape": [2, 4], "values": [1.0, 2.0, 0.0, 3.0, 0.0, 0.0, 1.0, 4.0], "answer_tex": "\\begin{bmatrix}1&2&0&3\\\\0&0&1&4\\end{bmatrix}", "typed_answer": ["1", "2", "0", "3", "0", "0", "1", "4"], "wrong": [{"values": [1.0, 2.0, 0.0, 3.0, 0.0, 0.0, 1.0, 18.0], "comment": "Recheck the right-hand column. The row operation changes \\(\\mathbf b\\) too, so do the same arithmetic to 18 that you did to the left side."}, {"values": [1.0, 2.0, 0.0, 3.0, 0.0, 0.0, 0.0, 4.0], "comment": "Row 2 still has a \\(1\\) in column 3, so it isn’t a row of zeros. The row \\(0 = 4\\) would mean no solution, but that isn’t what row 2 says."}, {"values": [1.0, 2.0, 1.0, 7.0, 0.0, 0.0, 1.0, 4.0], "comment": "Row 1 still has a \\(1\\) above the leading 1 in column 3. Reduced form needs zeros above and below each leading 1."}]}, {"type": "num", "text": "Row-reduce \\([A\\mid\\mathbf{b}]\\). What does row 2 of the reduced form say about \\(x_3\\)? (Type a number.)", "phase": "Carry out", "comment": "Right. Row 2 says \\(x_3 = 4\\), so every solution has third entry \\(4\\).", "hints": ["Write row 2 of the reduced form as an equation, with the zero entries dropped. What does it say about \\(x_3\\)?"], "shape": [1, 1], "values": [4.0], "answer_tex": "4", "typed_answer": ["4"], "wrong": [{"values": [1.0], "comment": "The 1 in row 2 is the coefficient of \\(x_3\\), not its value. Read the number on the right of the bar."}, {"values": [3.0], "comment": "That is the coefficient of \\(x_3\\) in the original row 2, not the value of \\(x_3\\)."}, {"values": [18.0], "comment": "That is the right side of the original row 2. The row operation changed it."}]}, {"type": "mc", "text": "Which describes <em>all<\/em> solutions? (Let \\(s\\) be any real number.)", "phase": "Carry out", "answers": [{"html": "\\(\\begin{bmatrix}3\\\\0\\\\4\\end{bmatrix}\\)", "ok": false, "comment": "That is one solution. There is a whole family, because \\(x_2\\) is free."}, {"html": "\\(\\begin{bmatrix}3\\\\0\\\\4\\end{bmatrix} + s\\begin{bmatrix}2\\\\1\\\\0\\end{bmatrix}\\)", "ok": false, "comment": "Check \\(A\\) times \\((2,1,0)\\): that is \\((4,8)\\), not \\(\\mathbf{0}\\). The direction vector has to solve \\(A\\mathbf{x} = \\mathbf{0}\\), so its first entry must be \\(-2\\)."}, {"html": "\\(\\begin{bmatrix}3\\\\0\\\\4\\end{bmatrix} + s\\begin{bmatrix}-2\\\\1\\\\0\\end{bmatrix}\\)", "ok": true, "comment": "Right. The free variable \\(x_2 = s\\) gives \\(x_1 = 3 - 2s\\) and \\(x_3 = 4\\). So \\(\\mathbf{x} = (3 - 2s,\\ s,\\ 4)\\), which is \\((3,0,4) + s(-2,1,0)\\). Other letters or scalings describe the same set, such as \\((3 - 4u,\\ 2u,\\ 4)\\)."}, {"html": "\\(s\\begin{bmatrix}-2\\\\1\\\\0\\end{bmatrix}\\)", "ok": false, "comment": "Those vectors solve \\(A\\mathbf{x} = \\mathbf{0}\\), but not \\(A\\mathbf{x} = \\mathbf{b}\\). Dropping the particular solution is a classic slip: \\(\\mathbf{b}\\) has to come from somewhere."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> Every solution is \\((3,0,4) + s(-2,1,0)\\). Last phase: <strong>look back<\/strong>. Check the answer, then change the problem and see what moves.<\/p>", "phase": "Look back", "cta": "Got it. On to Phase 4: Look back."}, {"type": "mc", "text": "Take \\(s = 2\\): \\(\\mathbf x = (-1, 2, 4)\\). What is \\(A\\mathbf x\\)?", "phase": "Look back", "answers": [{"html": "\\(\\begin{bmatrix}18\\\\7\\end{bmatrix}\\)", "ok": false, "comment": "The two entries are swapped. The first row is the one that gives \\(7\\)."}, {"html": "\\(\\begin{bmatrix}7\\\\6\\end{bmatrix}\\)", "ok": false, "comment": "You left out the \\(x_3\\) term in row 2. Row 2 also has \\(3 \\cdot 4 = 12\\)."}, {"html": "\\(\\begin{bmatrix}9\\\\22\\end{bmatrix}\\)", "ok": false, "comment": "Check the sign of \\(x_1\\). It is \\(-1\\), not \\(+1\\). With \\(+1\\) the first row would be \\(9\\)."}, {"html": "\\(\\begin{bmatrix}7\\\\18\\end{bmatrix}\\)", "ok": true, "comment": "Right: row 1 gives \\(-1 + 4 + 4 = 7\\) and row 2 gives \\(-2 + 8 + 12 = 18\\). Every value of \\(s\\) gives \\(\\mathbf b\\)."}]}, {"type": "error", "text": "A classmate solved this problem. Read the solution, then click the first line that is wrong.", "phase": "Look back", "lines": [{"html": "Row-reduce \\([A\\mid\\mathbf{b}]\\). Row 2 becomes \\([\\,0\\ 0\\ 1\\mid 4\\,]\\).", "wrong": false, "comment": "Row 2 has its leading 1 in column 3, so that row pins down \\(x_3\\)."}, {"html": "Row 1 becomes \\([\\,1\\ 2\\ 0\\mid 3\\,]\\), so \\(x_1 + 2x_2 = 3\\).", "wrong": false, "comment": "Row 1 has its leading 1 in column 1, so \\(x_1\\) is written in terms of \\(x_2\\)."}, {"html": "So \\(x_2\\) and \\(x_3\\) are both free, because neither column has a leading 1.", "wrong": true, "comment": "Right. Column 3 does have a leading 1, in row 2, so \\(x_3\\) is pinned to one value. Only \\(x_2\\) is free."}, {"html": "Check \\((3, 0, 4)\\) in the original equations.", "wrong": false, "comment": "Both equations come out right: \\(3 + 0 + 4 = 7\\) and \\(6 + 0 + 12 = 18\\)."}]}, {"type": "example", "text": "Give one vector \\(\\mathbf x\\) with \\(A\\mathbf x = \\mathbf b\\) that is different from \\((3,0,4)\\). Enter its three entries, top to bottom.", "phase": "Look back", "shape": [3, 1], "conditions": [{"js": "eq(mul([[1, 2, 1], [2, 4, 3]], M), [[7], [18]])", "comment": "Both rows have to come out right. Check \\(A\\mathbf x\\) row by row against \\(\\mathbf b\\)."}, {"js": "!eq(M, [[3], [0], [4]])", "comment": "That is the vector we already have. Find a different one."}, {"js": "!M[0][0].isZero() && !M[1][0].isZero()", "comment": "Make \\(x_1\\) and \\(x_2\\) both nonzero."}], "comment": "Right. Both rows of \\(A\\mathbf x\\) come out to \\(\\mathbf b\\), and your vector is new, with \\(x_1\\) and \\(x_2\\) both nonzero.", "model": "\\((1, 1, 4)\\): row 1 gives \\(1 + 2 + 4 = 7\\) and row 2 gives \\(2 + 4 + 12 = 18\\). From \\((3, 0, 4)\\), we raised \\(x_2\\) by 1 and lowered \\(x_1\\) by 2.", "label": "\\mathbf x =", "hints": ["Changing one entry of \\((3, 0, 4)
