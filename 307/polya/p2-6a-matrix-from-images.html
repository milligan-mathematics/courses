<script>window.POLYA = {"slug": "p2-6a-matrix-from-images", "title": "2.6 Problem A: Find the matrix from two images", "statement": "A linear transformation \\(T:\\mathbb{R}^2\\to\\mathbb{R}^2\\) satisfies \\[T\\left(\\begin{bmatrix}1\\\\1\\end{bmatrix}\\right)=\\begin{bmatrix}4\\\\1\\end{bmatrix}\\] and \\[T\\left(\\begin{bmatrix}1\\\\-1\\end{bmatrix}\\right)=\\begin{bmatrix}2\\\\-3\\end{bmatrix}\\] Find the matrix \\(A\\) of \\(T\\), so that \\(T(\\mathbf x)=A\\mathbf x\\) for every \\(\\mathbf x\\) in \\(\\mathbb{R}^2\\).", "questions": [{"type": "write", "text": "In your own words, what is this problem asking for?", "phase": "Understand", "model": "<p>We want the \\(2\\times 2\\) matrix \\(A\\) that does everything \\(T\\) does, so that \\(T(\\mathbf x)=A\\mathbf x\\) for every \\(\\mathbf x\\). The problem gives \\(T\\) on two vectors, \\(\\begin{bmatrix}1\\\\1\\end{bmatrix}\\) and \\(\\begin{bmatrix}1\\\\-1\\end{bmatrix}\\), which are not the standard basis. So we need linearity to find \\(T\\) on \\(\\mathbf e_1\\) and \\(\\mathbf e_2\\).<\/p>", "checklist": ["say the answer is a \\(2\\times 2\\) matrix that works for every \\(\\mathbf x\\)", "say the two given inputs are not \\(\\mathbf e_1\\) and \\(\\mathbf e_2\\)", "say that linearity gets \\(T\\) on \\(\\mathbf e_1\\) and \\(\\mathbf e_2\\)"]}, {"type": "explore", "text": "Before computing anything, explore. The blue and purple dots are the two columns of a \\(2\\times 2\\) matrix. Drag them until the gray arrow for \\((1,1)\\) ends in the green circle at \\((4,1)\\). Is that the only matrix that does this?", "phase": "Understand", "widget": {"kind": "grid-map", "A": [[1, 0], [0, 1]], "goal": "probes", "probes": [{"v": [1, 1], "target": [4, 1]}], "solution": [[2, 2], [0, 1]], "window": 5, "hint": "Drag the blue and purple dots. The gray arrow is the input (1, 1), and the green arrow shows where it lands."}, "found": "Right. You found a matrix that sends \\((1,1)\\) to \\((4,1)\\), and many others do too.
