<script>window.POLYA = {"slug": "p4-1a-almost-meeting", "title": "4.1 Problem A: Almost meeting in space", "statement": "Lines \\(L_1\\) and \\(L_2\\) in \\(\\mathbb{R}^3\\) are \\(L_1:\\ \\mathbf x=\\mathbf p_1+t\\mathbf d_1\\) and \\(L_2:\\ \\mathbf x=\\mathbf p_2+s\\mathbf d_2\\), where \\(\\mathbf p_1=\\begin{bmatrix}1\\\\0\\\\1\\end{bmatrix}\\), \\(\\mathbf d_1=\\begin{bmatrix}1\\\\2\\\\1\\end{bmatrix}\\), \\(\\mathbf p_2=\\begin{bmatrix}0\\\\4\\\\0\\end{bmatrix}\\), and \\(\\mathbf d_2=\\begin{bmatrix}1\\\\-1\\\\2\\end{bmatrix}\\). Decide whether \\(L_1\\) and \\(L_2\\) intersect, are parallel, or are skew. If they intersect, give the point where they meet. Two lines are <em>parallel<\/em> when their direction vectors are multiples of each other, and <em>skew<\/em> when they are not parallel and have no common point.", "questions": [{"type": "write", "text": "In your own words, what is this problem asking for?", "phase": "Understand", "model": "<p>It asks whether the two lines have a point in common. If they do, I need that point. If they don’t, I need to say whether they are parallel or skew. Different directions don’t settle the question in space, so I have to check the points themselves.<\/p>", "checklist": ["say whether the two lines share a point", "say that different directions alone don’t decide it", "say that if they don’t meet, you still need to tell parallel from skew"]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> We need to know whether some point lies on both lines. Different directions don’t settle that in space: the lines might meet or might miss each other. So the plan has to test the points themselves.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "phase": "Plan", "cta": "Got it. On to Phase 2: Plan."}, {"type": "write", "text": "Before you start, write your plan in 1–3 sentences: how will you decide whether the two lines share a point, and how will you tell parallel from skew? Which step needs care?", "phase": "Plan", "model": "<p>I’ll give \\(L_1\\) the parameter \\(t\\) and \\(L_2\\) the parameter \\(s\\), set their coordinates equal, and solve the first two equations. Then I’ll check the third equation with those values. If the directions are multiples of each other, the lines are parallel. Otherwise, if the third check fails, they are skew. The step that needs care is the third check.<\/p>", "checklist": ["give the two lines separate parameters", "solve two equations, then check the third", "say how you will tell parallel from skew", "name the step that needs care"]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: give the lines separate parameters, set their coordinates equal, solve two of the equations, and check the third with those values. If the directions are multiples of each other, the lines are parallel.<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "error", "text": "A classmate solved this problem and wrote the solution below. Read it line by line, and click the first line that is wrong.", "phase": "Carry out", "lines": [{"html": "Give \\(L_1\\) the parameter \\(t\\) and \\(L_2\\) the parameter \\(s\\), and set their coordinates equal.", "wrong": false, "comment": "Each line needs its own parameter, because the two lines can reach a shared point at different times."}, {"html": "That gives \\(1+t=s\\), \\(2t=4-s\\), and \\(1+t=2s\\).", "wrong": false, "comment": "There is one equation for each coordinate, and all three have to hold at a shared point."}, {"html": "Solving the first two equations gives one value of \\(t\\) and one value of \\(s\\).", "wrong": false, "comment": "Two equations in two unknowns give one candidate pair of values. That candidate still has to pass the third equation."}, {"html": "So the lines meet at the point those values give, because the first two equations hold there.", "wrong": true, "comment": "Right. Two coordinates agreeing isn’t enough. Check the third equation, \\(1+t=2s\\), with the same values of \\(t\\) and \\(s\\): it fails, so that point is not on both lines."}]}, {"type": "matrix", "text": "Solve the first two equations for \\(t\\) and \\(s\\). Enter \\(\\mathbf u=\\begin{bmatrix}t\\\\s\\end{bmatrix}\\), with \\(t\\) on top.", "phase": "Carry out", "comment": "Right. With \\(s=1+t\\) in the second equation, \\(2t=4-(1+t)\\), so \\(t=1\\) and \\(s=2\\).", "label": "\\mathbf u =", "hints": ["The first equation, \\(1+t=s\\), gives \\(s\\) in terms of \\(t\\). Use it in the second equation, \\(2t=4-s\\).", "After that substitution the second equation has only \\(t\\) in it. Solve it for \\(t\\), then find \\(s\\) from the first equation.", "Check your pair in the first equation: \\(1+t\\) should equal \\(s\\)."], "syntax": "Enter \\(t\\) on top and \\(s\\) below. Fractions are fine.", "shape": [2, 1], "values": [1.0, 2.0], "answer_tex": "\\begin{bmatrix}1\\\\2\\end{bmatrix}", "typed_answer": ["1", "2"], "wrong": [{"values": [3.0, -2.0], "comment": "That comes from writing \\(s=1-t\\). The first equation is \\(1+t=s\\), so \\(s=1+t\\)."}, {"values": [5.0, 6.0], "comment": "That is a sign slip in the second equation. It is \\(2t=4-s\\), so the \\(s\\) on that side is subtracted."}, {"values": [2.0, 1.0], "comment": "That swaps \\(t\\) and \\(s\\). The first line uses \\(t\\) and the second line uses \\(s\\), so the two values can’t trade places."}, {"values": [1.4, 1.2], "comment": "That solves the second and third equations instead. The question asks for the first two, and for lines that don’t meet, different pairs give different answers."}, {"values": [-1.0, 0.0], "comment": "That solves the first and third equations. Those give a different pair, so use the first two."}]}, {"type": "num", "text": "Put these values into the third equation, \\(1+t=2s\\). What does its left side, \\(1+t\\), equal?", "phase": "Carry out", "comment": "Right. The left side is \\(2\\). The right side, \\(2s\\), is \\(4\\) at \\(s=2\\), and \\(2\\neq4\\), so the third coordinates don’t match at these values.", "hints": ["Use the value of \\(t\\) you just found, and put it into \\(1+t\\).", "Then compare with the right side, \\(2s\\), using your value of \\(s\\). Do the two sides agree?"], "shape": [1, 1], "values": [2.0], "answer_tex": "2", "typed_answer": ["2"], "wrong": [{"values": [4.0], "comment": "That is the right side, \\(2s\\), at \\(s=2\\). The question asks for the left side, \\(1+t\\)."}, {"values": [0.0], "comment": "That is \\(1-t\\), with the sign flipped. The left side is \\(1+t\\)."}, {"values": [3.0], "comment": "That uses \\(t=2\\), which comes from swapping \\(t\\) and \\(s\\). Use the \\(t\\) you found for the first line."}]}, {"type": "mc", "text": "Following your plan, which description of \\(L_1\\) and \\(L_2\\) is correct?", "phase": "Carry out", "answers": [{"html": "Intersecting, at the point found from the first two equations.", "ok": false, "comment": "That is the two-equation mistake: two coordinates agreeing doesn’t mean the third one does. Solve the first two equations, then check the third."}, {"html": "Skew. The lines are not parallel, and they have no common point.", "ok": true, "comment": "Right. The first two equations have one solution, but the third equation fails at that solution. So the lines have no common point, and since their directions are not multiples of each other, they are not parallel."}, {"html": "Intersecting, since the lines are not parallel.", "ok": false, "comment": "That is the not-parallel mistake. In space, lines with different directions can still miss each other, so you have to look for a common point."}, {"html": "Parallel, since the lines have no common point.", "ok": false, "comment": "That is the parallel mistake: lines with no common point aren’t necessarily parallel. These lines are parallel only if \\(\\mathbf d_1\\) and \\(\\mathbf d_2\\) are multiples of each other, and they are not."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The answer: \\(L_1\\) and \\(L_2\\) are skew. They have no common point, and their directions are not multiples of each other.<\/p><p>Last phase: <strong>look back<\/strong>. Check the answer another way, and then change the problem.<\/p>", "phase": "Look back", "cta": "Got it. On to Phase 4: Look back."}, {"type": "explore", "text": "See it in space. The blue line is \\(L_1\\) and the orange line is \\(L_2\\); the sliders move a point along each one. Press “Look from above” and slide the points until they look like one point. Then reset the view. How far apart are they?", "phase": "Look back", "widget": {"kind": "space", "mode": "two-lines", "p1": [1, 0, 1], "d1": [1, 2, 1], "p2": [0, 4, 0], "d2": [1, -1, 2], "names": ["L₁", "L₂"], "goal": "above", "solution": {"t": 1, "s": 2}, "window": 5, "t": {"min": -2, "max": 3, "step": 0.5, "start": -1}, "s": {"min": -1, "max": 4, "step": 0.5, "start": 0}, "label": "The lines L1 and L2 in space, with a point on each"}, "found": "Right. At \\(t={t}\\) and \\(s={s}\\) the points line up seen from above: that is where the first two equations agree. But one point sits {dz} units above the other, so the third equation fails, just as you found. Seen from above, skew lines look as if they cross."}, {"type": "write", "text": "Choose a check of your own, one that doesn’t reuse the same steps, and carry it out. What did you check, and did it pass?", "phase": "Look back", "model": "<p>I solved a different pair of equations. The first and third give \\(t=-1\\) and \\(s=0\\). The second equation, \\(2t=4-s\\), then reads \\(-2=4\\), which fails. So the lines still have no common point, and the check agrees with the verdict.<\/p>", "checklist": ["name a check that doesn’t reuse the same steps", "say what the check produced", "say whether it passed"]}, {"type": "mc", "text": "Suppose both lines lie in one flat plane. If two lines in a plane are not parallel, must they meet?", "phase": "Look back", "answers": [{"html": "Yes, but only at the origin.", "ok": false, "comment": "Non-parallel lines in a plane cross wherever their equations put them. Nothing forces the crossing to be at the origin."}, {"html": "Yes, at infinitely many points, since lines go on forever.", "ok": false, "comment": "Lines that share infinitely many points are the same line, and that line is parallel to itself. Non-parallel lines share only one point."}, {"html": "Yes, at exactly one point.", "ok": true, "comment": "Right. In a flat plane, two lines that are not parallel always cross at exactly one point. There is no height for one line to pass over the other."}, {"html": "No. In a plane, non-parallel lines can miss each other too.", "ok": false, "comment": "That is the space mistake carried into a plane. A flat plane has no height for one line to pass over the other, so non-parallel lines always cross."}]}, {"type": "example", "text": "Change the problem. Keep \\(L_1\\) as it is. Give a direction vector \\(\\mathbf v\\) for a new line \\(L_3\\) through the point \\(\\mathbf p_2\\) that would make \\(L_3\\) <strong>intersect<\/strong> \\(L_1\\). Enter \\(\\mathbf v\\).", "phase": "Look back", "shape": [3, 1], "conditions": [{"js": "!isZero(M)", "comment": "A direction vector can’t be all zeros. Choose at least one nonzero entry."}, {"js": "rank([[1, M[0][0]], [2, M[1][0]], [1, M[2][0]]]) === 2", "comment": "That direction is a multiple of \\(\\mathbf d_1\\), so \\(L_3\\) is parallel to \\(L_1\\). Parallel lines that are not the same line never meet. Choose a direction that is not a multiple of \\(\\mathbf d_1\\)."}, {"js": "det([[1, M[0][0], 1], [2, M[1][0], -4], [1, M[2][0], 1]]).isZero()", "comment": "Your line misses \\(L_1\\). For the two lines to meet, the vector from \\(\\mathbf p_2\\) to some point of \\(L_1\\) has to lie in the flat plane spanned by \\(\\mathbf d_1\\) and \\(\\mathbf v\\). Compare the two base points to find that vector."}], "comment": "Right. The vec
