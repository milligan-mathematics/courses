<script>window.POLYA = {"slug": "p2-1a-undoing-a-transpose", "title": "2.1 Problem A: Undoing a transpose", "statement": "Let \\(B = \\begin{bmatrix}2&-1\\\\1&3\\end{bmatrix}\\) and \\(C = \\begin{bmatrix}4&1\\\\0&2\\end{bmatrix}\\). Solve for the \\(2\\times 2\\) matrix \\(A\\) if<br>\\[\\left(2A^{T} - 3B\\right)^{T} = C.\\]", "questions": [{"phase": "Understand", "type": "write", "text": "In your own words, what is this problem asking for?", "model": "We need the matrix \\(A\\) itself, not \\(A^{T}\\). The equation says: double the transpose of \\(A\\), subtract \\(3B\\), then transpose the whole thing, and you get \\(C\\). Our job is to undo those steps. The answer is a \\(2\\times 2\\) matrix with four entries to find."}, {"phase": "Understand", "type": "mc", "text": "Before computing: what exactly is the unknown, and what size is it?", "answers": [{"html": "The matrix \\(C\\), since it is the answer we are given.", "ok": false, "comment": "\\(C\\) is the given right side. It is data, not the unknown."}, {"html": "The number \\(3\\), since it is multiplying \\(B\\).", "ok": false, "comment": "Scalars like \\(2\\) and \\(3\\) are known constants. The unknown is a matrix, so we need all four of its entries."}, {"html": "The matrix \\(A^{T}\\), since that is what is inside the parentheses.", "ok": false, "comment": "The question asks for \\(A\\). Solving for \\(A^{T}\\) is a step on the way; transposing at the end gets you back to \\(A\\)."}, {"html": "The matrix \\(A\\) itself, which must be \\(2\\times 2\\) so that \\(2A^{T}\\) can be subtracted from \\(3B\\).", "ok": true, "comment": "Right. \\(2A^{T}\\) has to be the same size as \\(3B\\), which is \\(2\\times 2\\), so \\(A\\) is \\(2\\times 2\\) too."}]}, {"phase": "Understand", "type": "mc", "text": "Try a special case to test the idea: let \\(B\\) be the zero matrix. Then the equation is \\(\\left(2A^{T}\\right)^{T} = C\\). What is \\(A\\)?", "answers": [{"html": "\\(A = \\tfrac12 C\\)", "ok": true, "comment": "Right. Transposing twice gives back \\(2A\\), so \\(2A = C\\), and dividing by 2 gives \\(\\tfrac12 C\\)."}, {"html": "\\(A = \\tfrac12 C^{T}\\)", "ok": false, "comment": "The two transposes cancel: \\(\\left(A^{T}\\right)^{T} = A\\). No transpose is left over on \\(C\\)."}, {"html": "\\(A = 2C\\)", "ok": false, "comment": "The 2 multiplies \\(A\\) on the left side, so it moves across as a division, not a multiplication."}, {"html": "\\(A = C\\)", "ok": false, "comment": "Careful: \\(\\left(2A^{T}\\right)^{T} = 2A\\), and the 2 is still there. It has to be divided out."}]}, {"phase": "Plan", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The unknown is the \\(2\\times 2\\) matrix \\(A\\). The transposes are the hard part: when \\(B = 0\\) they cancel and \\(A = \\tfrac12 C\\), but with \\(B \\neq 0\\) the transposes do not simply vanish.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 2: Plan."}, {"phase": "Plan", "type": "multi", "text": "Which of these plans would solve for \\(A\\)? Select all that apply.", "answers": [{"html": "Ignore the outer transpose and solve \\(2A^{T} - 3B = C\\) directly.", "ok": false, "comment": "Dropping the transpose changes the equation. With \\(B = 0\\) this would give \\(A = \\tfrac12 C^{T}\\), not \\(\\tfrac12 C\\)."}, {"html": "Use the transpose rules to spread the outer transpose across the sum and the scalar: \\(\\left(2A^{T} - 3B\\right)^{T} = 2A - 3B^{T}\\). Then solve \\(2A - 3B^{T} = C\\) for \\(A\\).", "ok": true, "comment": "Also correct. This is the transpose rules at work: the transpose of a sum is the sum of the transposes, and \\(\\left(kX\\right)^{T} = kX^{T}\\)."}, {"html": "Try a few \\(2\\times 2\\) matrices until one works.", "ok": false, "comment": "Trial can show that one matrix works, but it can’t show that it is the only one, and it may never find it."}, {"html": "Transpose both sides. Since \\(\\left(X^{T}\\right)^{T} = X\\), the left side becomes \\(2A^{T} - 3B\\) and the right side becomes \\(C^{T}\\). Solve for \\(A^{T}\\), then transpose back.", "ok": true, "comment": "This works, and it is a clean move. Transposing an equation is allowed as long as you do it to both sides."}]}, {"phase": "Carry out", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> Use the plan you chose. Whichever way you go, the transposes on \\(A\\) and \\(B\\) have to be handled correctly, and then \\(A\\) has to stand alone.<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 3: Carry out."}, {"phase": "Carry out", "type": "mc", "text": "After spreading the outer transpose across the sum and the scalar, which equation do we get?", "answers": [{"html": "\\(2A - 3B = C\\)", "ok": false, "comment": "Dropping the outer transpose changes the equation. Every piece inside the parentheses still gets flipped."}, {"html": "\\(2A - 3B^{T} = C\\)", "ok": true, "comment": "Right. \\(\\left(2A^{T}\\right)^{T} = 2A\\), and \\(\\left(3B\\right)^{T} = 3B^{T}\\), so the left side is \\(2A - 3B^{T}\\)."}, {"html": "\\(2A - 3B = C^{T}\\)", "ok": false, "comment": "That moves the transpose onto the right side, where it doesn’t belong, and leaves \\(B\\) unflipped. Transposing the left side is what turns \\(B\\) into \\(B^{T}\\)."}, {"html": "\\(2A^{T} - 3B^{T} = C\\)", "ok": false, "comment": "The transpose reached \\(B\\) but not \\(A^{T}\\). Transposing \\(A^{T}\\) gives \\(A\\), so the \\(A^{T}\\) has to flip too."}]}, {"phase": "Carry out", "type": "mc", "text": "Solve \\(2A - 3B^{T} = C\\) for \\(2A\\). What matrix is \\(2A\\)?", "answers": [{"html": "\\(\\begin{bmatrix}-2 & -2\\\\3 & -7\\end{bmatrix}\\)", "ok": false, "comment": "That is \\(C - 3B^{T}\\). It keeps the minus sign, but moving \\(-3B^{T}\\) to the other side makes it \\(+3B^{T}\\)."}, {"html": "\\(\\begin{bmatrix}10 & -2\\\\3 & 11\\end{bmatrix}\\)", "ok": false, "comment": "That is \\(C + 3B\\). Use \\(B^{T}\\): swap the rows and columns of \\(B\\) first."}, {"html": "\\(\\begin{bmatrix}10 & 4\\\\-3 & 11\\end{bmatrix}\\)", "ok": true, "comment": "Right. \\(3B^{T} = \\begin{bmatrix}6&3\\\\-3&9\\end{bmatrix}\\), and adding \\(C\\) entry by entry gives this."}, {"html": "\\(\\begin{bmatrix}6 & 2\\\\-1 & 5\\end{bmatrix}\\)", "ok": false, "comment": "That is \\(C + B^{T}\\). The 3 multiplies every entry of \\(B^{T}\\), so you need \\(3B^{T}\\)."}]}, {"phase": "Carry out", "type": "mc", "text": "Last step: divide by 2. What is \\(A\\)?", "answers": [{"html": "\\(\\begin{bmatrix}5 & -1\\\\\\tfrac{3}{2} & \\tfrac{11}{2}\\end{bmatrix}\\)", "ok": false, "comment": "That came from \\(C + 3B\\). The transpose of \\(B\\) is needed here, so start from \\(C + 3B^{T}\\)."}, {"html": "\\(\\begin{bmatrix}5 & -\\tfrac{3}{2}\\\\2 & \\tfrac{11}{2}\\end{bmatrix}\\)", "ok": false, "comment": "The numbers are right, but they are flipped. That is \\(A^{T}\\), and the question asks for \\(A\\)."}, {"html": "\\(\\begin{bmatrix}10 & 4\\\\-3 & 11\\end{bmatrix}\\)", "ok": false, "comment": "That is \\(2A\\). The 2 has to be divided out to get \\(A\\)."}, {"html": "\\(\\begin{bmatrix}5 & 2\\\\-\\tfrac{3}{2} & \\tfrac{11}{2}\\end{bmatrix}\\)", "ok": true, "comment": "Right. Halving \\(\\begin{bmatrix}10&4\\\\-3&11\\end{bmatrix}\\) halves every entry, including the negative one."}]}, {"phase": "Look back", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> You should have one \\(2\\times 2\\) matrix \\(A\\).<\/p><p>Last phase: <strong>look back<\/strong>. Check the answer in the original equation, then ask why there is only one answer.<\/p>", "cta": "Got it. On to Phase 4: Look back."}, {"phase": "Look back", "type": "mc", "text": "Check your answer. Which check confirms it?", "answers": [{"html": "Compute \\(2A^{T} - 3B\\), transpose the result, and confirm you get \\(C\\).", "ok": true, "comment": "Right. That plugs \\(A\\) back into the original equation, which is the most direct check."}, {"html": "Compute \\(A + B\\) and check that it equals \\(C\\).", "ok": false, "comment": "That is a different equation. The original one has \\(2A^{T}\\), \\(3B\\), and a transpose on the outside."}, {"html": "Check that every entry of \\(A\\) is a whole number.", "ok": false, "comment": "Solutions don’t have to be whole numbers. Fractions are fine, so this doesn’t test the answer."}, {"html": "Check that \\(A = A^{T}\\), since the equation looks symmetric.", "ok": false, "comment": "The equation doesn’t say \\(A\\) is symmetric. Here \\(A\\) and \\(A^{T}\\) are different matrices, so this check cannot pass."}]}, {"phase": "Look back", "type": "mc", "text": "Why is there exactly one matrix \\(A\\) that works?", "answers": [{"html": "Because \\(A\\) is a square matrix.", "ok": false, "comment": "Square matrices don’t automatically have exactly one solution. The division by 2 is what settles it."}, {"html": "Because the equation can be solved step by step to \\(2A = C + 3B^{T}\\), and dividing by the number 2 gives exactly one matrix.", "ok": true, "comment": "Right. Every step was forced, so no other \\(A\\) can satisfy the equation."}, {"html": "Because there are four unknown entries and four equations.", "ok": false, "comment": "Counting doesn’t decide it. Equal counts can still give no solution or many solutions. Here the reason is that each step is forced."}, {"html": "Because \\(B\\) is symmetric.", "ok": false, "comment": "\\(B\\) isn’t symmetric (its off-diagonal entries are \\(-1\\) and \\(1\\)), and symmetry isn’t what makes the answer unique anyway."}]}, {"phase": "Look back", "type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate wrote the answer as \\(\\begin{bmatrix}5 & -1\\\\\\tfrac{3}{2} & \\tfrac{11}{2}\\end{bmatrix}\\). What step did they skip? Then name one habit from this problem you want to use on the next one.<\/p>"}]};</script>
