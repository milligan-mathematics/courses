<script>window.POLYA = {"slug": "p1-1a-one-equation-two-unknowns", "title": "1.1 Problem A: One equation, two readings", "statement": "The equation \\(x - 2y = 4\\) can be read two ways.<br>(a) As an equation in the two variables \\(x\\) and \\(y\\).<br>(b) As \\(x - 2y + 0z = 4\\), an equation in the three variables \\(x\\), \\(y\\), \\(z\\).<br>Find all solutions in parametric form for each reading. Do the two answers describe the same set?", "questions": [{"type": "mc", "text": "What is this problem asking you to find?", "phase": "Understand", "answers": [{"html": "For each reading, every ordered list of values, one per variable, that satisfies the equation, described in parametric form.", "ok": true, "comment": "Right. A solution is a list with one entry per variable, so (a) gives pairs and (b) gives triples."}, {"html": "One list of numbers that works for both readings.", "ok": false, "comment": "The two readings have different variables, so they have different solution lists. We need the full set for each."}, {"html": "The value of \\(x\\) in each reading.", "ok": false, "comment": "That is only part of a solution. The other variables have entries too, and the question asks for all of them."}, {"html": "Whether the two readings give the same answer.", "ok": false, "comment": "That is the last question of the problem. First we need the solutions of each reading."}]}, {"type": "mc", "text": "A good way to understand a problem is to test a guess. Does \\((6, 1)\\) solve reading (a), and does \\((6, 1, 5)\\) solve reading (b)?", "phase": "Understand", "answers": [{"html": "(a) no: \\(6\\) is not \\(4\\), so the pair fails.", "ok": false, "comment": "The constant is \\(4\\), but the equation says \\(x - 2y\\) equals \\(4\\), not \\(x\\). Check \\(6 - 2\\cdot 1\\)."}, {"html": "(a) no: a pair has no \\(z\\)-entry, so it can’t be a solution.", "ok": false, "comment": "Reading (a) has only the variables \\(x\\) and \\(y\\), so a pair is the right kind of list there."}, {"html": "(a) yes, (b) no: reading (b) needs \\(z = 0\\).", "ok": false, "comment": "The \\(z\\)-entry must be \\(0\\) only if the equation forced it. Here \\(0z\\) is \\(0\\) for every \\(z\\)."}, {"html": "(a) yes and (b) yes: \\(6 - 2\\cdot 1 = 4\\) in (a), and \\(6 - 2\\cdot 1 + 0\\cdot 5 = 4\\) in (b).", "ok": true, "comment": "Right. The \\(0\\cdot 5\\) term adds nothing, so the \\(z\\)-entry \\(5\\) is fine."}]}, {"type": "mc", "text": "In reading (b), the coefficient of \\(z\\) is \\(0\\). What does that tell you about \\(z\\)?", "phase": "Understand", "answers": [{"html": "\\(z\\) is no longer one of the unknowns, so reading (b) is really reading (a).", "ok": false, "comment": "Adding \\(0z\\) does not remove the variable. Reading (b) has three unknowns, and its solutions are triples."}, {"html": "\\(z\\) must be \\(0\\), because a zero coefficient means \\(z\\) drops out.", "ok": false, "comment": "A zero coefficient makes \\(z\\) free, not zero. The triple \\((6, 1, 5)\\) solves (b) with \\(z = 5\\)."}, {"html": "\\(z\\) is still a variable, and it can take any value, since the equation doesn’t depend on it.", "ok": true, "comment": "Right. A zero coefficient means the equation is not affected by \\(z\\). It does not remove \\(z\\)."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> Each reading needs a list with one entry per variable, and the coefficient of \\(z\\) in (b) is \\(0\\), so \\(z\\) may not be constrained at all.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "phase": "Plan", "cta": "Got it. On to Phase 2: Plan."}, {"type": "multi", "text": "Which of these plans would find <em>every<\/em> solution in both readings? Select all that apply.", "phase": "Plan", "answers": [{"html": "In (b), set \\(z = 0\\), since \\(z\\) has coefficient \\(0\\), and solve for \\(x\\) and \\(y\\).", "ok": false, "comment": "That fixes \\(z\\) without any reason. A zero coefficient means \\(z\\) is free, so it needs its own parameter."}, {"html": "Write the augmented matrix \\(\\left[\\begin{array}{cc|c} 1 & -2 & 4 \\end{array}\\right]\\) for (a) and \\(\\left[\\begin{array}{ccc|c} 1 & -2 & 0 & 4 \\end{array}\\right]\\) for (b), then read off the leading variable \\(x\\). The other variables are free.", "ok": true, "comment": "Also right, and it is the same plan in matrix form. The leading 1 is in the \\(x\\) column, so the other variables are free: \\(y\\) in (a), and \\(y\\) and \\(z\\) in (b)."}, {"html": "Solve for \\(x\\) in each reading, and let the other variables be parameters: \\(y = s\\) in (a), and \\(y = s\\), \\(z = t\\) in (b).", "ok": true, "comment": "This is the plan we’ll follow. It is the method of Example 1.1.2, applied to \\(x\\), whose coefficient is not zero."}, {"html": "Pick one solution, such as \\((6, 1)\\) or \\((6, 1, 5)\\), and call it the answer.", "ok": false, "comment": "One solution is not all of them. The question asks for every solution, so we need a parametric description."}]}, {"type": "mc", "text": "In reading (b), how many parameters do you need?", "phase": "Plan", "answers": [{"html": "Three: every variable is free.", "ok": false, "comment": "The equation still links \\(x\\) to \\(y\\) and \\(z\\). It fixes \\(x\\) in terms of the others, so only two are free."}, {"html": "One, because there is only one equation.", "ok": false, "comment": "The number of equations does not decide the number of parameters. Count the free variables instead."}, {"html": "Two: \\(y\\) and \\(z\\) are free, since only \\(x\\) is solved for.", "ok": true, "comment": "Right. Each free variable gets its own parameter, so \\(s\\) for \\(y\\) and \\(t\\) for \\(z\\)."}, {"html": "One: \\(z\\) has coefficient \\(0\\), so \\(z = 0\\) and only \\(y\\) is free.", "ok": false, "comment": "That is the \\(z = 0\\) mistake. The zero coefficient makes \\(z\\) free, not zero, so it needs a parameter."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: solve for \\(x\\) in each
