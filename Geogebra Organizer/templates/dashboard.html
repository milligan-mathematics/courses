<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoGebra Curriculum Organizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
            padding-bottom: 50px;
        }

        .app-card {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .app-thumb {
            height: 150px;
            width: 100%;
            object-fit: cover;
            background: #eee;
        }

        .app-body {
            padding: 15px;
        }

        .status-badge {
            font-size: 0.8em;
            padding: 3px 8px;
            border-radius: 10px;
        }

        .status-manual {
            background: #d4edda;
            color: #155724;
        }

        .status-auto {
            background: #fff3cd;
            color: #856404;
        }

        .sidebar {
            position: sticky;
            top: 20px;
            height: calc(100vh - 40px);
            overflow-y: auto;
        }

        .filter-group {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">GeoGebra Curriculum Organizer</span>
            <div class="d-flex align-items-center">
                <span class="text-light me-3" id="last-updated">Updating...</span>
                <button class="btn btn-primary btn-sm" onclick="syncApps()" id="sync-btn">
                    🔄 Sync from GeoGebra
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Filters -->
            <div class="col-md-3">
                <div class="sidebar">
                    <div class="card p-3 mb-3">
                        <h5>Statistics</h5>
                        <p class="mb-1">Total Apps: <span id="stat-total">0</span></p>
                        <p class="mb-0">Organized: <span id="stat-organized">0</span></p>
                    </div>

                    <div class="filter-group">
                        <label>Filter by Status</label>
                        <select class="form-select" id="filter-status" onchange="renderApps()">
                            <option value="all">All Apps</option>
                            <option value="unorganized">Unorganized / Auto</option>
                            <option value="organized">Organized (Manual)</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>Search</label>
                        <input type="text" class="form-control" id="search-input" placeholder="Search titles..."
                            onkeyup="renderApps()">
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9">
                <div id="apps-container" class="row">
                    <div class="col-12 text-center py-5">Loading apps...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allApps = [];
        let courses = {};

        async function loadData() {
            try {
                // Add timestamp to prevent caching
                const response = await fetch('/api/data?t=' + new Date().getTime());
                const data = await response.json();
                allApps = data.apps;
                courses = data.courses;

                document.getElementById('stat-total').textContent = data.stats.total;
                document.getElementById('stat-organized').textContent = data.stats.organized;
                document.getElementById('last-updated').textContent = 'Synced: ' + data.stats.last_updated;

                renderApps();
            } catch (e) {
                console.error(e);
                alert("Failed to load data");
            }
        }

        function renderApps() {
            const container = document.getElementById('apps-container');
            const filterStatus = document.getElementById('filter-status').value;
            const searchText = document.getElementById('search-input').value.toLowerCase();

            container.innerHTML = '';

            const filtered = allApps.filter(app => {
                const matchesSearch = app.title.toLowerCase().includes(searchText);
                if (!matchesSearch) return false;

                if (filterStatus === 'organized') return app.is_manual;
                if (filterStatus === 'unorganized') return !app.is_manual;
                return true;
            });

            filtered.forEach(app => {
                const col = document.createElement('div');
                col.className = 'col-md-4 col-lg-3';

                const thumb = app.thumbnail || 'https://www.geogebra.org/assets/images/geogebra-logo.svg';

                // Build options for courses
                let courseOptions = '<option value="">Select Course...</option>';
                for (const courseName in courses) {
                    const selected = app.course === courseName ? 'selected' : '';
                    courseOptions += `<option value="${courseName}" ${selected}>${courseName}</option>`;
                }

                // Build options for chapters (dependent on selected course)
                let chapterOptions = '<option value="">Select Chapter...</option>';
                if (app.course && courses[app.course]) {
                    courses[app.course].forEach(chap => {
                        const selected = app.chapter === chap ? 'selected' : '';
                        chapterOptions += `<option value="${chap}" ${selected}>${chap}</option>`;
                    });
                } else if (app.chapter && app.chapter !== 'Unsorted') {
                    // Preserve current chapter even if course not in standard map (edge case)
                    chapterOptions += `<option value="${app.chapter}" selected>${app.chapter}</option>`;
                }

                col.innerHTML = `
                    <div class="app-card">
                        <img src="${thumb}" class="app-thumb" loading="lazy">
                        <div class="app-body">
                            <h6 class="text-truncate" title="${app.title}">${app.title}</h6>
                            <div class="mb-2">
                                <span class="badge ${app.is_manual ? 'bg-success' : 'bg-warning text-dark'}">
                                    ${app.is_manual ? 'Manual' : 'Auto'}
                                </span>
                                <a href="${app.url}" target="_blank" class="small text-muted ms-2">Open ↗</a>
                            </div>
                            
                            <div class="mb-2">
                                <select class="form-select form-select-sm mb-1 course-select" data-id="${app.id}">
                                    ${courseOptions}
                                </select>
                                <select class="form-select form-select-sm chapter-select" id="chapter-${app.id}" data-id="${app.id}">
                                    ${chapterOptions}
                                </select>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(col);
            });

            // Attach event listeners
            document.querySelectorAll('.course-select').forEach(sel => {
                sel.addEventListener('change', function () {
                    updateChapterOptions(this.dataset.id, this.value);
                    saveChange(this.dataset.id);
                });
            });

            document.querySelectorAll('.chapter-select').forEach(sel => {
                sel.addEventListener('change', function () {
                    saveChange(this.dataset.id);
                });
            });
        }

        function updateChapterOptions(appId, courseName) {
            const chapSelect = document.getElementById(`chapter-${appId}`);
            chapSelect.innerHTML = '<option value="">Select Chapter...</option>';

            if (courseName && courses[courseName]) {
                courses[courseName].forEach(chap => {
                    const opt = document.createElement('option');
                    opt.value = chap;
                    opt.textContent = chap;
                    chapSelect.appendChild(opt);
                });
            }
        }

        async function saveChange(appId) {
            // Find the selects
            const card = document.querySelector(`.course-select[data-id="${appId}"]`).closest('.app-card');
            const course = card.querySelector('.course-select').value;
            const chapter = card.querySelector('.chapter-select').value;

            if (!course) return; // Don't save if no course selected

            try {
                const res = await fetch('/api/organize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: appId, course, chapter })
                });

                if (res.ok) {
                    // Update local state to reflect change (mark as manual)
                    const app = allApps.find(a => a.id === appId);
                    if (app) {
                        app.course = course;
                        app.chapter = chapter;
                        app.is_manual = true;
                        // Re-render only if needed or show feedback
                        const badge = card.querySelector('.badge');
                        badge.className = 'badge bg-success';
                        badge.textContent = 'Manual';
                    }
                }
            } catch (e) {
                console.error("Save failed", e);
            }
        }

        async function syncApps() {
            const btn = document.getElementById('sync-btn');
            btn.disabled = true;
            btn.textContent = 'Syncing...';

            try {
                const res = await fetch('/api/sync', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    alert(`Synced ${data.count} apps!`);
                    loadData();
                } else {
                    alert('Sync failed: ' + data.error);
                }
            } catch (e) {
                alert("Sync request error");
            } finally {
                btn.disabled = false;
                btn.textContent = '🔄 Sync from GeoGebra';
            }
        }

        loadData();
    </script>
</body>

</html>
