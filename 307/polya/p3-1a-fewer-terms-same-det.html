<script>window.POLYA = {"slug": "p3-1a-fewer-terms-same-det", "title": "3.1 Problem A: Fewer terms, same determinant", "statement": "Find \\(\\det A\\) for \\[A=\\begin{bmatrix}1&3&0&2\\\\1&2&1&3\\\\2&1&0&1\\\\4&1&2&8\\end{bmatrix}\\].", "questions": [{"type": "write", "text": "In your own words, what is this problem asking for?", "phase": "Understand", "model": "<p>It asks for \\(\\det A\\), a single number built from the entries of \\(A\\). Since \\(A\\) is \\(4\\times 4\\), the \\(2\\times 2\\) formula and the \\(3\\times 3\\) pattern don’t apply directly. I’ll need the cofactor expansion, which reduces the problem to smaller determinants. The zeros in \\(A\\) should help keep the work small.<\/p>"}, {"type": "mc", "text": "How does a cofactor expansion handle a \\(4\\times 4\\) determinant?", "phase": "Understand", "answers": [{"html": "It reduces the problem to \\(3\\times 3\\) determinants.", "ok": true, "comment": "Each entry of the row or column you expand along is multiplied by a \\(3\\times 3\\) cofactor, and the results are added with signs."}, {"html": "It applies the six-product \\(3\\times 3\\) pattern to the whole matrix.", "ok": false, "comment": "That pattern is only for \\(3\\times 3\\) matrices. A \\(4\\times 4\\) has \\(4!=24\\) products, not six, so the cofactor expansion is needed."}, {"html": "It reduces the problem to \\(2\\times 2\\) determinants in one step.", "ok": false, "comment": "One expansion gives \\(3\\times 3\\) determinants, not \\(2\\times 2\\). Each of those can be reduced again, one step at a time."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> We want \\(\\det A\\) for a \\(4\\times 4\\) matrix, so the \\(2\\times 2\\) and \\(3\\times 3\\) shortcuts won’t do. Two facts from Section 3.1 are relevant: expanding along any row or column gives the same determinant (the Cofactor Expansion Theorem), and adding a multiple of one row to another leaves the determinant unchanged (the theorem on row operations).<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "phase": "Plan", "cta": "Got it. On to Phase 2: Plan."}, {"type": "write", "text": "Before you start, write your plan in 1–3 sentences: which method, and which step needs care?", "phase": "Plan", "model": "<p>Expand along column 3, because it has the most zeros. First, add a multiple of one row to another, which leaves the determinant unchanged, to clear the \\(2\\) in row 4 of column 3. Then column 3 has only one nonzero entry, and the step that needs care is its sign.<\/p>"}, {"type": "multi", "text": "Which of these plans would find \\(\\det A\\)? Select all that apply.", "phase": "Plan", "answers": [{"html": "Since \\(A\\) has zeros in it, \\(\\det A\\) must be \\(0\\).", "ok": false, "comment": "A single zero doesn’t make the determinant \\(0\\). A zero row or column would, but \\(A\\) has no zero row or column."}, {"html": "Multiply the diagonal entries of \\(A\\), and use that product as \\(\\det A\\).", "ok": false, "comment": "The diagonal shortcut works only for triangular matrices, where all the entries on one side of the diagonal are zero. \\(A\\) has nonzero entries on both sides. Its diagonal product is \\(1\\cdot 2\\cdot 0\\cdot 8=0\\), which is not \\(\\det A\\)."}, {"html": "Expand along column 3 as it stands. Its two nonzero entries, the \\(1\\) and the \\(2\\), each need a \\(3\\times 3\\) determinant, and you add the two terms with their signs.", "ok": true, "comment": "This works too. It takes more work, since it needs two \\(3\\times 3\\) determinants instead of one, but expanding along any column gives \\(\\det A\\)."}, {"html": "Use a row operation that adds a multiple of one row to another, to make the entry in row 4, column 3, equal to \\(0\\) without changing the determinant. Then expand along column 3, which now has one nonzero entry.", "ok": true, "comment": "This is the plan we’ll follow. Adding a multiple of one row to another leaves the determinant unchanged, so the row operation costs nothing, and column 3 becomes a single term."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: clear the \\(2\\) in row 4, column 3, with a row operation that leaves the determinant unchanged. Then expand along column 3.<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "mc", "text": "Which row operation makes the entry in row 4, column 3, equal to \\(0\\)?", "phase": "Carry out", "answers": [{"html": "\\(R_4 \\to R_4 - 2R_3\\)", "ok": false, "comment": "Row 3 has a \\(0\\) in column 3, so subtracting a multiple of it leaves that entry at \\(2\\). The row you subtract has to have a nonzero entry in column 3."}, {"html": "\\(R_4 \\to R_4 + 2R_2\\)", "ok": false, "comment": "The sign is off. Adding \\(2\\) times row 2 gives \\(2 + 2\\cdot 1 = 4\\), not \\(0\\). To cancel a positive entry, you subtract."}, {"html": "\\(R_4 \\to R_4 - 2R_2\\)", "ok": true, "comment": "Row 2 has a \\(1\\) in column 3, so \\(2 - 2\\cdot 1 = 0\\). Subtracting a multiple of one row from another leaves the determinant unchanged."}, {"html": "\\(R_4 \\to R_4 - R_2\\)", "ok": false, "comment": "The multiple is off. Subtracting row 2 once leaves \\(2 - 1 = 1\\) in that spot. To cancel the \\(2\\) in row 4, the multiple has to be \\(2\\), since \\(2 = 2\\cdot 1\\)."}]}, {"type": "mc", "text": "Let \\(B\\) be \\(A\\) after your row operation, and let \\(M\\) be the \\(3\\times 3\\) matrix left when you delete row 2 and column 3 of \\(B\\). Expanding \\(B\\) along column 3, which equation is correct?", "phase": "Carry out", "answers": [{"html": "\\(\\det A = -2\\det M\\)", "ok": false, "comment": "The row operation turned the \\(2\\) in row 4 into a \\(0\\), so that term is gone. The only nonzero entry left in column 3 is the \\(1\\) in row 2."}, {"html": "\\(\\det A = \\det M\\)", "ok": false, "comment": "You dropped the sign. Position \\((2,3)\\) has sign \\((-1)^{2+3}=-1\\), so the minus stays."}, {"html": "\\(\\det A = -\\det M\\)", "ok": true, "comment": "The only nonzero entry in column 3 is the \\(1\\) in row 2, and its sign is \\((-1)^{2+3}=-1\\). The row operation left the determinant unchanged, so \\(\\det A=\\det B=-\\det M\\)."}]}, {"type": "num", "text": "What is \\(\\det A\\)?", "phase": "Carry out", "comment": "The minor \\(M\\) has \\(\\det M=-17\\). The \\(1\\) sits in a position with sign \\(-1\\), so \\(\\det A=-\\det M=17\\).", "shape": [1, 1], "values": [17.0], "answer_tex": "17", "typed_answer": ["17"], "wrong": []}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The answer is \\(\\det A = 17\\).<\/p><p>Last phase: <strong>look back<\/strong>. Check the number a different way, and then see what happens when you change the problem.<\/p>", "phase": "Look back", "cta": "Got it. On to Phase 4: Look back."}, {"type": "mc", "text": "Which check would confirm \\(\\det A = 17\\) without repeating the same steps?", "phase": "Look back", "answers": [{"html": "Check that the signs alternate along row 1.", "ok": false, "comment": "The sign pattern is the same for every matrix, so it says nothing about the number you got."}, {"html": "Expand the original \\(A\\) along column 3, using its entries as they were, and see whether you get \\(17\\) again.", "ok": true, "comment": "That uses different \\(3\\times 3\\) determinants, so it is a real second computation. Expanding along any row or column gives \\(\\det A\\) (the Cofactor Expansion Theorem), so a match is good evidence."}, {"html": "Check that \\(17\\) is a whole number.", "ok": false, "comment": "Many wrong answers are whole numbers too, so this can’t catch a mistake."}, {"html": "Redo the expansion of \\(B\\) along column 3, checking each arithmetic line.", "ok": false, "comment": "That repeats the same steps. A sign or arithmetic slip you made the first time would show up again."}]}, {"type": "mc", "text": "Suppose you multiply row 3 of \\(A\\) by \\(5\\) and leave the other rows alone. What is the determinant of the new matrix?", "phase": "Look back", "answers": [{"html": "\\(85\\)", "ok": true, "comment": "Multiplying one row by \\(5\\) multiplies the determinant by \\(5\\), so \\(5\\cdot 17=85\\)."}, {"html": "\\(\\tfrac{17}{5}\\)", "ok": false, "comment": "You divided. Multiplying a row by \\(5\\) multiplies the determinant by \\(5\\), not by \\(\\tfrac15\\)."}, {"html": "\\(17\\)", "ok": false, "comment": "You kept the old value. Multiplying a row by a number does change the determinant, by that same factor."}, {"html": "\\(10625\\)", "ok": false, "comment": "That would be right if every row were multiplied by \\(5\\). Only row 3 changes, so there is one factor of \\(5\\), not \\(5^4\\)."}]}, {"type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate says, \"I used \\(R_4 \\to R_4 - 2R_2\\), which changes the determinant, so I have to divide my answer by \\(2\\) at the end.\" What would you tell them?<\/p>", "phase": "Look back"}]};</script>
