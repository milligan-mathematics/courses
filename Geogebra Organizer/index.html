fqnab", "title": "y=mx reflection Three 2D transformations", "type": "ws", "category": "Uncategorized", "url": "https://www.geogebra.org/m/kpxfqnab", "thumbnail": "https://www.geogebra.org/resource/kpxfqnab/YYaF4sR7zAIDkAuM/material-kpxfqnab-thumb$1.png", "modified": 1613581662}];
        
        // Group by category
        const grouped = {};
        data.forEach(app => {
            if (!grouped[app.category]) grouped[app.category] = [];
            grouped[app.category].push(app);
        });
        
        const container = document.getElementById('content');
        
        // Sort categories to put Math ones first
        const categories = Object.keys(grouped).sort();
        
        categories.forEach(cat => {
            const section = document.createElement('div');
            
            const title = document.createElement('h2');
            title.className = 'category-title';
            title.textContent = cat;
            section.appendChild(title);
            
            const grid = document.createElement('div');
            grid.className = 'apps-grid';
            
            grouped[cat].forEach(app => {
                const card = document.createElement('div');
                card.className = 'app-card';
                
                // Use thumbnail if available, else placeholder
                const thumbUrl = app.thumbnail || 'https://www.geogebra.org/assets/images/geogebra-logo.svg';
                
                card.innerHTML = `
                    <div style="height:200px; overflow:hidden;">
                        <img src="${thumbUrl}" class="app-thumb" loading="lazy" alt="${app.title}">
                    </div>
                    <div class="app-info">
                        <h3 class="app-title">${app.title}</h3>
                        <a href="${app.url}" target="_blank" class="app-link">Open in GeoGebra</a>
                    </div>
                `;
                grid.appendChild(card);
            });
            
            section.appendChild(grid);
            container.appendChild(section);
        });
    </script>
