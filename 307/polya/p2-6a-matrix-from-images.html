<script>window.POLYA = {"slug": "p2-6a-matrix-from-images", "title": "2.6 Problem A: Find the matrix from two images", "statement": "A linear transformation \\(T:\\mathbb{R}^2\\to\\mathbb{R}^2\\) satisfies\\[T\\left(\\begin{bmatrix}1\\\\1\\end{bmatrix}\\right)=\\begin{bmatrix}4\\\\1\\end{bmatrix}\\qquad T\\left(\\begin{bmatrix}1\\\\-1\\end{bmatrix}\\right)=\\begin{bmatrix}2\\\\-3\\end{bmatrix}\\]Find the matrix \\(A\\) of \\(T\\), so that \\(T(\\mathbf x)=A\\mathbf x\\) for every \\(\\mathbf x\\) in \\(\\mathbb{R}^2\\).", "questions": [{"type": "write", "text": "In your own words, what is this problem asking for?", "phase": "Understand", "model": "<p>We want the \\(2\\times 2\\) matrix \\(A\\) that does everything \\(T\\) does, so that \\(T(\\mathbf x)=A\\mathbf x\\) for every \\(\\mathbf x\\). The problem gives \\(T\\) on two vectors, \\(\\begin{bmatrix}1\\\\1\\end{bmatrix}\\) and \\(\\begin{bmatrix}1\\\\-1\\end{bmatrix}\\), which are not the standard basis. So we need linearity to find \\(T\\) on \\(\\mathbf e_1\\) and \\(\\mathbf e_2\\).<\/p>"}, {"type": "mc", "text": "What would a finished answer look like?", "phase": "Understand", "answers": [{"html": "The two values \\(T\\left(\\begin{bmatrix}1\\\\1\\end{bmatrix}\\right)\\) and \\(T\\left(\\begin{bmatrix}1\\\\-1\\end{bmatrix}\\right)\\), which the problem already gives.", "ok": false, "comment": "Those are given, not found. We need \\(T\\) at every vector, and the matrix gives us that."}, {"html": "A vector \\(\\mathbf x\\) with \\(T(\\mathbf x)=\\mathbf 0\\).", "ok": false, "comment": "That asks for a vector that \\(T\\) sends to zero. The problem asks for the rule \\(T\\) itself."}, {"html": "A number \\(c\\) with \\(T(\\mathbf x)=c\\mathbf x\\).", "ok": false, "comment": "That would mean \\(T\\) only stretches vectors. The given images are not multiples of their inputs, so \\(T\\) is not a stretch."}, {"html": "A \\(2\\times 2\\) matrix \\(A\\) with \\(T(\\mathbf x)=A\\mathbf x\\) for every \\(\\mathbf x\\) in \\(\\mathbb{R}^2\\).", "ok": true, "comment": "Right. That is the matrix of \\(T\\), and it has to work for every vector, not just the two given."}]}, {"type": "mc", "text": "Before computing anything, pick a check. If \\(A\\) is the matrix you want, what must \\(A\\begin{bmatrix}1\\\\1\\end{bmatrix}\\) equal?", "phase": "Understand", "answers": [{"html": "\\(\\begin{bmatrix}1\\\\1\\end{bmatrix}\\)", "ok": false, "comment": "That would mean \\(A\\) leaves \\(\\begin{bmatrix}1\\\\1\\end{bmatrix}\\) alone. Nothing in the problem says that."}, {"html": "\\(\\begin{bmatrix}2\\\\-3\\end{bmatrix}\\)", "ok": false, "comment": "That is the image of \\(\\begin{bmatrix}1\\\\-1\\end{bmatrix}\\), not of \\(\\begin{bmatrix}1\\\\1\\end{bmatrix}\\). Keep the two vectors apart."}, {"html": "\\(\\begin{bmatrix}4\\\\1\\end{bmatrix}\\)", "ok": true, "comment": "Right. That is what the problem says \\(T\\) does to \\(\\begin{bmatrix}1\\\\1\\end{bmatrix}\\), and \\(A\\) has to do the same."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> We want \\(A\\) with \\(A\\begin{bmatrix}1\\\\1\\end{bmatrix}=\\begin{bmatrix}4\\\\1\\end{bmatrix}\\) and \\(A\\begin{bmatrix}1\\\\-1\\end{bmatrix}=\\begin{bmatrix}2\\\\-3\\end{bmatrix}\\). Those two vectors are not \\(\\mathbf e_1\\) and \\(\\mathbf e_2\\), so we need a way around that.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "phase": "Plan", "cta": "Got it. On to Phase 2: Plan."}, {"type": "multi", "text": "Which of these plans would find \\(A\\)? Select all that apply.", "phase": "Plan", "answers": [{"html": "Put \\(\\begin{bmatrix}4\\\\1\\end{bmatrix}\\) and \\(\\begin{bmatrix}2\\\\-3\\end{bmatrix}\\) directly as the columns of \\(A\\).", "ok": false, "comment": "Tempting, but the result sends \\(\\begin{bmatrix}1\\\\1\\end{bmatrix}\\) to something other than \\(\\begin{bmatrix}4\\\\1\\end{bmatrix}\\). The columns have to be the images of \\(\\mathbf e_1\\) and \\(\\mathbf e_2\\)."}, {"html": "Write \\(\\mathbf e_1\\) and \\(\\mathbf e_2\\) as combinations of \\(\\begin{bmatrix}1\\\\1\\end{bmatrix}\\) and \\(\\begin{bmatrix}1\\\\-1\\end{bmatrix}\\). Use linearity to find \\(T(\\mathbf e_1)\\) and \\(T(\\mathbf e_2)\\), and make them the columns of \\(A\\).", "ok": true, "comment": "This is the plan we’ll follow. Theorem 2.6.2 says the columns of the matrix are \\(T(\\mathbf e_1)\\) and \\(T(\\mathbf e_2)\\), and linearity lets us get those from the given images."}, {"html": "Let \\(A=\\begin{bmatrix}a&b\\\\c&d\\end{bmatrix}\\), write \\(A\\begin{bmatrix}1\\\\1\\end{bmatrix}=\\begin{bmatrix}4\\\\1\\end{bmatrix}\\) and \\(A\\begin{bmatrix}1\\\\-1\\end{bmatrix}=\\begin{bmatrix}2\\\\-3\\end{bmatrix}\\) as four equations in \\(a,b,c,d\\), and solve.", "ok": true, "comment": "This works too. It is a linear system in four unknowns with four equations, and it lands on the same matrix. It takes more algebra than the first plan."}, {"html": "Assume \\(T\\) is a rotation and use the rotation matrix that sends \\(\\begin{bmatrix}1\\\\1\\end{bmatrix}\\) to \\(\\begin{bmatrix}4\\\\1\\end{bmatrix}\\).", "ok": false, "comment": "The problem doesn’t say \\(T\\) is a rotation. A rotation keeps lengths, and \\(\\begin{bmatrix}4\\\\1\\end{bmatrix}\\) is much longer than \\(\\begin{bmatrix}1\\\\1\\end{bmatrix}\\), so no rotation does this."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> Write \\(\\mathbf e_1\\) and \\(\\mathbf e_2\\) as combinations of \\(\\begin{bmatrix}1\\\\1\\end{bmatrix}\\) and \\(\\begin{bmatrix}1\\\\-1\\end{bmatrix}\\), then apply \\(T\\) to each combination.<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "mc", "text": "Write \\(\\mathbf e_1=\\begin{bmatrix}1\\\\0\\end{bmatrix}=a\\begin{bmatrix}1\\\\1\\end{bmatrix}+b\\begin{bmatrix}1\\\\-1\\end{bmatrix}\\). What is \\(T(\\mathbf e_1)\\)?", "phase": "Carry out", "answers": [{"html": "\\(\\begin{bmatrix}1\\\\2\\end{bmatrix}\\)", "ok": false, "comment": "That is \\(\\tfrac12\\begin{bmatrix}4\\\\1\\end{bmatrix}-\\tfrac12\\begin{bmatrix}2\\\\-3\\end{bmatrix}\\), which is the combination for \\(\\mathbf e_2\\). Check the sign."}, {"html": "\\(\\begin{bmatrix}3\\\\-1\\end{bmatrix}\\)", "ok": true, "comment": "Right. Here \\(a=b=\\tfrac12\\), so \\(T(\\mathbf e_1)=\\tfrac12\\begin{bmatrix}4\\\\1\\end{bmatrix}+\\tfrac12\\begin{bmatrix}2\\\\-3\\end{bmatrix}=\\begin{bmatrix}3\\\\-1\\end{bmatrix}\\)."}, {"html": "\\(\\begin{bmatrix}2\\\\-3\\end{bmatrix}\\)", "ok": false, "comment": "That is just \\(T\\left(\\begin{bmatrix}1\\\\-1\\end{bmatrix}\\right)\\). \\(\\mathbf e_1\\) is a different vector, so its image is different too."}, {"html": "\\(\\begin{bmatrix}6\\\\-2\\end{bmatrix}\\)", "ok": false, "comment": "The coefficients are \\(\\tfrac12\\), not \\(1\\). With coefficients of \\(1\\) you add the two images and get twice the right answer."}]}, {"type": "mc", "text": "Likewise, \\(\\mathbf e_2=\\tfrac12\\begin{bmatrix}1\\\\1\\end{bmatrix}-\\tfrac12\\begin{bmatrix}1\\\\-1\\end{bmatrix}\\). What is \\(T(\\mathbf e_2)\\)?", "phase": "Carry out", "answers": [{"html": "\\(\\begin{bmatrix}3\\\\-1\\end{bmatrix}\\)", "ok": false, "comment": "That is \\(T(\\mathbf e_1)\\). \\(\\mathbf e_2\\) needs the minus sign in front of the second term."}, {"html": "\\(\\begin{bmatrix}1\\\\2\\end{bmatrix}\\)", "ok": true, "comment": "Right: \\(\\tfrac12\\begin{bmatrix}4\\\\1\\end{bmatrix}-\\tfrac12\\begin{bmatrix}2\\\\-3\\end{bmatrix}=\\tfrac12\\begin{bmatrix}2\\\\4\\end{bmatrix}=\\begin{bmatrix}1\\\\2\\end{bmatrix}\\)."}, {"html": "\\(\\begin{bmatrix}-1\\\\-2\\end{bmatrix}\\)", "ok": false, "comment": "That is \\(-T(\\mathbf e_2)\\). The coefficient on \\(\\begin{bmatrix}1\\\\1\\end{bmatrix}\\) is \\(+\\tfrac12\\), not \\(-\\tfrac12\\)."}]}, {"type": "mc", "text": "Put \\(T(\\mathbf e_1)\\) and \\(T(\\mathbf e_2)\\) together. Which matrix is \\(A\\)?", "phase": "Carry out", "answers": [{"html": "\\(\\begin{bmatrix}3&-1\\\\1&2\\end{bmatrix}\\)", "ok": false, "comment": "The images went in as rows here. Column \\(j\\) of \\(A\\) is \\(T(\\mathbf e_j)\\)."}, {"html": "\\(\\begin{bmatrix}6&2\\\\-2&4\\end{bmatrix}\\)", "ok": false, "comment": "Both columns are doubled. That comes from using coefficients of \\(1\\) instead of \\(\\tfrac12\\)."}, {"html": "\\(\\begin{bmatrix}3&1\\\\-1&2\\end{bmatrix}\\)", "ok": true, "comment": "Right. The columns are \\(T(\\mathbf e_1)=\\begin{bmatrix}3\\\\-1\\end{bmatrix}\\) and \\(T(\\mathbf e_2)=\\begin{bmatrix}1\\\\2\\end{bmatrix}\\)."}, {"html": "\\(\\begin{bmatrix}4&2\\\\1&-3\\end{bmatrix}\\)", "ok": false, "comment": "These are the given images. They are \\(T\\) of \\(\\begin{bmatrix}1\\\\1\\end{bmatrix}\\) and \\(\\begin{bmatrix}1\\\\-1\\end{bmatrix}\\), not of \\(\\mathbf e_1\\) and \\(\\mathbf e_2\\), so they can’t be the columns."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The answer is \\(A=\\begin{bmatrix}3&1\\\\-1&2\\end{bmatrix}\\).<\/p><p>Last phase: <strong>look back<\/strong>. Check the matrix against the data the problem gave you.<\/p>", "phase": "Look back", "cta": "Got it. On to Phase 4: Look back."}, {"type": "mc", "text": "Which check is a real test that \\(A\\) is correct?", "phase": "Look back", "answers": [{"html": "Multiply \\(A\\) by \\(\\begin{bmatrix}1\\\\1\\end{bmatrix}\\) and by \\(\\begin{bmatrix}1\\\\-1\\end{bmatrix}\\), and compare with \\(\\begin{bmatrix}4\\\\1\\end{bmatrix}\\) and \\(\\begin{bmatrix}2\\\\-3\\end{bmatrix}\\).", "ok": true, "comment": "Yes. Both products match the given images, so \\(A\\) reproduces the data. That is exactly what \\(A\\) has to do."}, {"html": "Check that \\(A\\) is \\(2\\times 2\\).", "ok": false, "comment": "A size check is a good start, but a matrix of the right size can still have the wrong entries."}, {"html": "Multiply \\(A\\) by \\(\\mathbf e_1\\) and check that you get the first column of \\(A\\).", "ok": false, "comment": "That is true for every matrix, so it can’t catch a mistake. The check has to use the given data."}, {"html": "Check that every entry is a whole number.", "ok": false, "comment": "Whole numbers are no guarantee. \\(\\begin{bmatrix}4&2\\\\1&-3\\end{bmatrix}\\) has whole entries and is still wrong."}]}, {"type": "mc", "text": "Now change the problem. Suppose \\(T\\left(\\begin{bmatrix}1\\\\0\\end{bmatrix}\\right)=\\begin{bmatrix}4\\\\1\\end{bmatrix}\\) and \\(T\\left(\\begin{bmatrix}0\\\\1\\end{bmatrix}\\right)=\\begin{bmatrix}2\\\\-3\\end{bmatrix}\\). What is the matrix now?", "phase": "Look back", "answers": [{"html": "\\(\\begin{bmatrix}4&2\\\\1&-3\\end{bmatrix}\\)", "ok": true, "comment": "Right. Now the given images are the images of \\(\\mathbf e_1\\) and \\(\\mathbf e_2\\), so they go straight into the columns. That is why the shortcut fails on the original problem."}, {"html": "\\(\\begin{bmatrix}3&1\\\\-1&2\\end{bmatrix}\\)", "ok": false, "comment": "That is the answer to the original problem. The matrix depends on which vectors are given, so it changes when the data does."}, {"html": "\\(\\begin{bmatrix}4&1\\\\2&-3\\end{bmatrix}\\)", "ok": false, "comment": "The images went in as rows here. They belong in the columns."}]}, {"type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate wrote \\(\\begin{bmatrix}4&2\\\\1&-3\\end{bmatrix}\\) for this problem. What step did they skip, and what one check would have caught it?<\/p>", "phase": "Look back"}]};</script>
