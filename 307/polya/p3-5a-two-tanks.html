<script>window.POLYA = {"slug": "p3-5a-two-tanks", "title": "3.5 Problem A: Where does the salt go?", "statement": "Two tanks of brine are connected by pipes, and brine also drains out of the system. Let \\(f_1(x)\\) and \\(f_2(x)\\) be the amounts of salt (in kg) in tanks 1 and 2 at time \\(x\\) (in minutes), and let \\(\\mathbf f(x) = \\begin{bmatrix}f_1(x)\\\\f_2(x)\\end{bmatrix}\\). They satisfy the system \\[f_1^{\\prime} = -3f_1 + f_2, \\qquad f_2^{\\prime} = 2f_1 - 2f_2,\\] with \\(f_1(0) = 5\\) and \\(f_2(0) = 1\\). Solve the system with these starting amounts.", "questions": [{"phase": "Understand", "type": "write", "text": "In your own words, what is this problem asking for?", "model": "<p>Salt passes between the two tanks and also drains away, so the salt in each tank changes at a rate that depends on both amounts. I need the two functions \\(f_1(x)\\) and \\(f_2(x)\\) that satisfy the system and start at 5 kg and 1 kg. I can’t solve one equation by itself, because each one involves the other function.<\/p>"}, {"phase": "Understand", "type": "mc", "text": "For the single equation \\(f^{\\prime} = -5f\\) with \\(f(0) = 4\\), what is \\(f(x)\\)?", "answers": [{"html": "\\(f(x) = e^{-5x}\\)", "ok": false, "comment": "That solves \\(f^{\\prime} = -5f\\), but at \\(x = 0\\) it equals 1, not 4. The starting value sets the constant."}, {"html": "\\(f(x) = 4e^{-5x}\\)", "ok": true, "comment": "Right. Differentiating gives \\(-20e^{-5x} = -5\\cdot 4e^{-5x}\\), so the derivative is \\(-5\\) times the function, and at \\(x = 0\\) the function equals 4."}, {"html": "\\(f(x) = 4(-5)^x\\)", "ok": false, "comment": "That uses \\(\\lambda^x\\) in place of \\(e^{\\lambda x}\\). The function \\(e^{-5x}\\) has derivative \\(-5\\) times itself, and \\((-5)^x\\) does not."}, {"html": "\\(f(x) = 4 - 5x\\)", "ok": false, "comment": "That has \\(f^{\\prime} = -5\\), but the equation says \\(f^{\\prime} = -5f\\). The rate depends on \\(f\\) itself, so the answer is an exponential, not a line."}]}, {"phase": "Plan", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> We want \\(f_1(x)\\) and \\(f_2(x)\\) that satisfy the system and start at \\(f_1(0) = 5\\) and \\(f_2(0) = 1\\). For a single equation \\(f^{\\prime} = af\\), the solutions are \\(ce^{ax}\\), and the starting value fixes \\(c\\).<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 2: Plan."}, {"phase": "Plan", "type": "write", "text": "Before you start, write your plan in 1–3 sentences: which method, and which step needs care?", "model": "<p>I’ll find the eigenvalues and eigenvectors of the matrix of the system, since each eigenvector times its own exponential is a solution. Then I’ll write \\(\\mathbf f(x)\\) as a combination of those two solutions and use \\(\\mathbf f(0)\\) to find the two constants. The step that needs care is pairing each eigenvector with its own exponential.<\/p>"}, {"phase": "Carry out", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The system is \\(\\mathbf f^{\\prime} = A\\mathbf f\\) with \\(A = \\begin{bmatrix}-3&1\\\\2&-2\\end{bmatrix}\\). Our plan: find the eigenvalues and eigenvectors of \\(A\\), build the general solution from them, and then find the constants from \\(\\mathbf f(0)\\).<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 3: Carry out."}, {"phase": "Carry out", "type": "mc", "text": "What are the eigenvalues of \\(A\\)?", "answers": [{"html": "\\(\\lambda = 1\\) and \\(\\lambda = 4\\).", "ok": false, "comment": "Those come from using \\(3 - \\lambda\\) and \\(2 - \\lambda\\) on the diagonal. The diagonal entries are \\(-3\\) and \\(-2\\), so \\(A - \\lambda I\\) has \\(-3 - \\lambda\\) and \\(-2 - \\lambda\\)."}, {"html": "\\(\\lambda = -3\\) and \\(\\lambda = -2\\).", "ok": false, "comment": "Those are the diagonal entries of \\(A\\). They are eigenvalues only when \\(A\\) is diagonal, and the off-diagonal entries \\(1\\) and \\(2\\) change the answer."}, {"html": "\\(\\lambda = -1\\) and \\(\\lambda = -4\\).", "ok": true, "comment": "Right. Expanding \\(\\det(A - \\lambda I) = \\lambda^2 + 5\\lambda + 4 = (\\lambda + 1)(\\lambda + 4)\\) gives these two roots."}]}, {"phase": "Carry out", "type": "mc", "text": "The eigenvalues are \\(\\lambda_1 = -1\\) and \\(\\lambda_2 = -4\\). Which choice gives an eigenvector for each eigenvalue?", "answers": [{"html": "\\(\\mathbf x_1 = \\begin{bmatrix}1\\\\1\\end{bmatrix}\\) for \\(\\lambda_1 = -1\\), and \\(\\mathbf x_2 = \\begin{bmatrix}2\\\\-1\\end{bmatrix}\\) for \\(\\lambda_2 = -4\\).", "ok": false, "comment": "These are eigenvectors of the transpose of \\(A\\), so the rows and columns got swapped. The first row of \\(A\\) comes from \\(f_1^{\\prime} = -3f_1 + f_2\\), so it reads \\(-3\\) and \\(1\\)."}, {"html": "\\(\\mathbf x_1 = \\begin{bmatrix}1\\\\2\\end{bmatrix}\\) for \\(\\lambda_1 = -1\\), and \\(\\mathbf x_2 = \\begin{bmatrix}1\\\\-1\\end{bmatrix}\\) for \\(\\lambda_2 = -4\\).", "ok": true, "comment": "Right. Check: \\(A\\begin{bmatrix}1\\\\2\\end{bmatrix} = \\begin{bmatrix}-1\\\\-2\\end{bmatrix} = -1\\begin{bmatrix}1\\\\2\\end{bmatrix}\\), and \\(A\\begin{bmatrix}1\\\\-1\\end{bmatrix} = \\begin{bmatrix}-4\\\\4\\end{bmatrix} = -4\\begin{bmatrix}1\\\\-1\\end{bmatrix}\\)."}, {"html": "\\(\\mathbf x_1 = \\begin{bmatrix}1\\\\-1\\end{bmatrix}\\) for \\(\\lambda_1 = -1\\), and \\(\\mathbf x_2 = \\begin{bmatrix}1\\\\2\\end{bmatrix}\\) for \\(\\lambda_2 = -4\\).", "ok": false, "comment": "The pairs are swapped. \\(A\\begin{bmatrix}1\\\\-1\\end{bmatrix}\\) is \\(-4\\) times that vector, so \\(\\begin{bmatrix}1\\\\-1\\end{bmatrix}\\) belongs with \\(\\lambda = -4\\)."}]}, {"phase": "Carry out", "type": "mc", "text": "With \\(\\mathbf x_1 = \\begin{bmatrix}1\\\\2\\end{bmatrix}\\) for \\(\\lambda_1 = -1\\) and \\(\\mathbf x_2 = \\begin{bmatrix}1\\\\-1\\end{bmatrix}\\) for \\(\\lambda_2 = -4\\), build the general solution and use \\(\\mathbf f(0) = \\begin{bmatrix}5\\\\1\\end{bmatrix}\\) to find the constants. Which function \\(\\mathbf f(x)\\) is the solution?", "answers": [{"html": "\\(\\mathbf f(x) = \\begin{bmatrix}3e^{-x}+2e^{-4x}\\\\-3e^{-x}+4e^{-4x}\\end{bmatrix}\\)", "ok": false, "comment": "The pairing is swapped. \\(e^{-x}\\) multiplies \\(\\begin{bmatrix}1\\\\-1\\end{bmatrix}\\), but that eigenvector belongs with \\(e^{-4x}\\). Each eigenvector has to stay with its own exponential."}, {"html": "\\(\\mathbf f(x) = \\begin{bmatrix}e^{-x}+e^{-4x}\\\\2e^{-x}-e^{-4x}\\end{bmatrix}\\)", "ok": false, "comment": "That is the general solution with \\(c_1 = c_2 = 1\\), so the constants were left out. It solves the system, but it starts at \\((2,1)\\), not \\((5,1)\\)."}, {"html": "\\(\\mathbf f(x) = \\begin{bmatrix}5e^{-x}+e^{-4x}\\\\10e^{-x}-e^{-4x}\\end{bmatrix}\\)", "ok": false, "comment": "The starting values aren’t the constants. Here \\(c_1 = 5\\) and \\(c_2 = 1\\) were read straight off \\(\\mathbf f(0)\\), but \\(\\mathbf f(0) = c_1\\mathbf x_1 + c_2\\mathbf x_2\\) has to be solved for them."}, {"html": "\\(\\mathbf f(x) = \\begin{bmatrix}2e^{-x}+3e^{-4x}\\\\4e^{-x}-3e^{-4x}\\end{bmatrix}\\)", "ok": true, "comment": "Right. The general solution is \\(c_1\\mathbf x_1e^{-x} + c_2\\mathbf x_2e^{-4x}\\), and \\(\\mathbf f(0)\\) gives \\(c_1 = 2\\) and \\(c_2 = 3\\)."}]}, {"phase": "Look back", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The answer is \\(\\mathbf f(x) = \\begin{bmatrix}2e^{-x}+3e^{-4x}\\\\4e^{-x}-3e^{-4x}\\end{bmatrix}\\).<\/p><p>Next phase: <strong>look back<\/strong>.<\/p>", "cta": "Got it. On to Phase 4: Look back."}, {"phase": "Look back", "type": "mc", "text": "Which checks really confirm that \\(\\mathbf f(x)\\) is the solution?", "answers": [{"html": "Check that \\(f_1^{\\prime} = -3f_1 + f_2\\) holds for every \\(x\\), and stop there.", "ok": false, "comment": "The equation test is a real check, but it can’t see the starting values. A solution with the wrong constants still passes it, so check \\(\\mathbf f(0)\\) too."}, {"html": "Check that \\(\\mathbf f(0) = \\begin{bmatrix}5\\\\1\\end{bmatrix}\\), and nothing more.", "ok": false, "comment": "The starting values are necessary, but not enough. A solution with the pairing swapped also starts at \\((5,1)\\), so check the equation as well."}, {"html": "Check that \\(\\mathbf f(0) = \\begin{bmatrix}5\\\\1\\end{bmatrix}\\), and check that one equation, such as \\(f_1^{\\prime} = -3f_1 + f_2\\), holds for every \\(x\\).", "ok": true, "comment": "Right. The equation test catches a wrong pairing, and the starting-value test catches wrong constants. A solution has to pass both."}, {"html": "Check that both exponents are negative.", "ok": false, "comment": "Negative exponents match the decay the eigenvalues predict, but every function of this form has them. This test can’t tell a solution from a non-solution."}]}, {"phase": "Look back", "type": "mc", "text": "As \\(x\\) grows, what happens to \\(\\mathbf f(x)\\)?", "answers": [{"html": "Both amounts go to 0, and the \\(e^{-x}\\) term is what remains. For large \\(x\\), \\(f_2\\) is about twice \\(f_1\\).", "ok": true, "comment": "Right. The \\(e^{-4x}\\) term fades much faster, so the slower \\(e^{-x}\\) term is what remains. Its direction is \\((1,2)\\), so the ratio of salt in tank 2 to tank 1 settles at 2 while both amounts drain to zero."}, {"html": "The amounts settle at their starting values, 5 kg and 1 kg.", "ok": false, "comment": "The amounts are still changing at \\(x = 0\\): \\(f_1^{\\prime}(0) = -14\\). They move away from the starting values and then drain."}, {"html": "Both amounts go to 0, and the \\(e^{-4x}\\) term is what remains. For large \\(x\\), \\(f_2\\) is about \\(-f_1\\).", "ok": false, "comment": "A bigger number in the exponent means faster decay. The \\(e^{-4x}\\) term disappears first, so it can’t be what remains for large \\(x\\)."}, {"html": "The amounts grow without limit, since the solution is built from exponentials.", "ok": false, "comment": "A negative exponent means decay, not growth. Both \\(e^{-x}\\) and \\(e^{-4x}\\) get smaller as \\(x\\) increases."}]}, {"phase": "Look back", "type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). In your own words, why do the eigenvectors let you solve a system whose two equations depend on each other?<\/p>"}]};</script>
