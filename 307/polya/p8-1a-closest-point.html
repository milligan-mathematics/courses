<script>window.POLYA = {"slug": "p8-1a-closest-point", "title": "8.1 Problem A: How far is x from U?", "statement": "Let \\(U\\) be the subspace of \\(\\mathbb{R}^4\\) spanned by \\(\\mathbf u_1=\\begin{bmatrix}1\\\\1\\\\1\\\\1\\end{bmatrix}\\) and \\(\\mathbf u_2=\\begin{bmatrix}1\\\\2\\\\0\\\\-1\\end{bmatrix}\\), and let \\(\\mathbf x=\\begin{bmatrix}3\\\\3\\\\-1\\\\1\\end{bmatrix}\\). The distance from \\(\\mathbf x\\) to \\(U\\) is the smallest value of \\(\\|\\mathbf x-\\mathbf y\\|\\) as \\(\\mathbf y\\) ranges over \\(U\\). Find the vector in \\(U\\) closest to \\(\\mathbf x\\), and find the distance from \\(\\mathbf x\\) to \\(U\\).", "questions": [{"type": "write", "text": "In your own words, what is this problem asking you to find, and what will the finished answer look like?", "phase": "Understand", "model": "<p>The answer has two parts: the vector \\(\\mathbf p\\) in \\(U\\) closest to \\(\\mathbf x\\), which has four entries, and the distance from \\(\\mathbf x\\) to \\(U\\), which is a single positive number. The distance is the length of the segment from \\(\\mathbf x\\) to that closest vector \\(\\mathbf p\\).<\/p>"}, {"type": "write", "text": "Before you compute anything, write your plan in 2–4 sentences: what will you compute, and in what order?", "phase": "Plan", "model": "<p>First I’ll make an orthogonal basis of \\(U\\) from \\(\\mathbf u_1\\) and \\(\\mathbf u_2\\) with Gram–Schmidt, since the projection formula needs one. Then I’ll use that basis in the projection formula to get \\(\\mathbf p=\\operatorname{proj}_U\\mathbf x\\). Last, the distance is the length of \\(\\mathbf x-\\mathbf p\\).<\/p>"}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> You should now have a plan. We’ll follow the Gram–Schmidt route: make an orthogonal basis of \\(U\\), use it in the projection formula to get \\(\\mathbf p\\), and then take the length of \\(\\mathbf x-\\mathbf p\\). The projection formula needs an orthogonal basis, with one term for each vector in that basis. By the Projection Theorem, \\(\\mathbf p\\) is the closest vector in \\(U\\), and \\(\\mathbf x-\\mathbf p\\) is orthogonal to \\(U\\).<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "mc", "text": "Which vector in \\(U\\) is closest to \\(\\mathbf x\\)?", "phase": "Carry out", "answers": [{"html": "\\(\\begin{bmatrix}1\\\\0\\\\-2\\\\1\\end{bmatrix}\\)", "ok": false, "comment": "That is \\(\\mathbf x-\\mathbf p\\), the part of \\(\\mathbf x\\) that is orthogonal to \\(U\\). The question asks for a vector in \\(U\\), and this one is not in \\(U\\)."}, {"html": "\\(\\begin{bmatrix}\\frac{17}{6}\\\\\\frac{25}{6}\\\\\\frac{3}{2}\\\\\\frac{1}{6}\\end{bmatrix}\\)", "ok": false, "comment": "That adds the projections onto \\(\\mathbf u_1\\) and onto \\(\\mathbf u_2\\), one at a time. Adding separate projections is only valid for orthogonal vectors, and here \\(\\mathbf u_1\\) and \\(\\mathbf u_2\\) are not orthogonal."}, {"html": "\\(\\begin{bmatrix}\\frac{3}{2}\\\\\\frac{3}{2}\\\\\\frac{3}{2}\\\\\\frac{3}{2}\\end{bmatrix}\\)", "ok": false, "comment": "That is only the first term of the formula, the projection onto the first vector of the orthogonal basis. The formula adds one term for each vector in the basis, and this answer is missing the second."}, {"html": "\\(\\begin{bmatrix}2\\\\3\\\\1\\\\0\\end{bmatrix}\\)", "ok": true, "comment": "Right. It lies in \\(U\\), and \\(\\mathbf x\\) minus this vector is orthogonal to \\(U\\). That is what makes it the closest vector in \\(U\\)."}]}, {"type": "mc", "text": "What is the distance from \\(\\mathbf x\\) to \\(U\\)?", "phase": "Carry out", "answers": [{"html": "\\(\\sqrt{6}\\)", "ok": true, "comment": "Right. The distance is the length of \\(\\mathbf x-\\mathbf p\\), and the squares of its four entries add up to \\(6\\)."}, {"html": "\\(2\\sqrt{5}\\)", "ok": false, "comment": "That is the length of \\(\\mathbf x\\), its distance from the origin. The distance to \\(U\\) is the smallest distance to any point of \\(U\\), and the origin is only one point of \\(U\\)."}, {"html": "\\(\\sqrt{14}\\)", "ok": false, "comment": "That is the length of \\(\\mathbf p\\) itself. The distance is the length of \\(\\mathbf x-\\mathbf p\\), so \\(\\mathbf p\\) has to be subtracted from \\(\\mathbf x\\) first."}]}, {"type": "write", "text": "Choose a check of your own and carry it out. Say what you checked and whether it passed.", "phase": "Look back", "model": "<p>I checked that \\(\\mathbf x-\\mathbf p\\) is orthogonal to both \\(\\mathbf u_1\\) and \\(\\mathbf u_2\\). Both dot products come out to \\(0\\), so the check passed. A check like this would have caught the sum of the two separate projections, because \\(\\mathbf x\\) minus that sum is not orthogonal to \\(\\mathbf u_1\\).<\/p>"}, {"type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate says, \"The projection formula works for any vectors that span \\(U\\), so I don’t need to check whether mine are orthogonal.\" What would you tell them?<\/p>", "phase": "Look back"}]};</script>
