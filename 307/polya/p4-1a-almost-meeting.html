<script>window.POLYA = {"slug": "p4-1a-almost-meeting", "title": "4.1 Problem A: Almost meeting in space", "statement": "Lines \\(L_1\\) and \\(L_2\\) in \\(\\mathbb{R}^3\\) are given by \\[L_1:\\ \\mathbf{x}=\\begin{bmatrix}1\\\\0\\\\1\\end{bmatrix}+t\\begin{bmatrix}1\\\\2\\\\1\\end{bmatrix}\\qquad L_2:\\ \\mathbf{x}=\\begin{bmatrix}0\\\\4\\\\0\\end{bmatrix}+s\\begin{bmatrix}1\\\\-1\\\\2\\end{bmatrix}\\] Decide whether \\(L_1\\) and \\(L_2\\) intersect, are parallel, or are skew. If they intersect, give the point of intersection. Two lines are <em>parallel<\/em> when their direction vectors are multiples of each other, and <em>skew<\/em> when they are not parallel and have no common point.", "questions": [{"type": "write", "text": "In your own words, what is this problem asking for?", "phase": "Understand", "model": "<p>It asks whether the two lines have a point in common. If they do, I need that point. If they don’t, I need to say whether they are parallel or skew. The directions are not multiples of each other, but in space that doesn’t settle whether the lines meet, so I have to check the points themselves.<\/p>"}, {"type": "mc", "text": "Suppose two lines in space are not parallel. Which statement is true?", "phase": "Understand", "answers": [{"html": "They must meet at one point, since they point in different directions.", "ok": false, "comment": "That is the picture from a flat sheet of paper. In space, lines that point in different directions can still pass each other without touching."}, {"html": "They might meet at one point, or they might miss each other.", "ok": true, "comment": "Right. In space, two lines can point in different directions and still miss each other. Whether they meet depends on their points, not only on their directions."}, {"html": "They can meet only if their direction vectors are equal.", "ok": false, "comment": "Equal directions would make the lines parallel. Two lines can meet while pointing in different directions, so equal directions aren’t needed to meet."}, {"html": "They can never meet, since they are not parallel.", "ok": false, "comment": "Different directions don’t rule out a meeting point. Two lines with different directions can cross, as long as the points work out."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> We need to know whether some point lies on both lines. Different directions don’t settle that in space: the lines might meet or might miss each other. So the plan has to test the points themselves.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "phase": "Plan", "cta": "Got it. On to Phase 2: Plan."}, {"type": "write", "text": "Before you start, write your plan in 1–3 sentences: how will you decide whether the two lines share a point, and which step needs care?", "phase": "Plan", "model": "<p>I’ll give the first line the parameter \\(t\\) and the second line the parameter \\(s\\), because a shared point can be reached at different times on the two lines. I’ll set the coordinates equal, solve two of the equations for \\(s\\) and \\(t\\), and then check the third equation with those values. The step that needs care is that third check.<\/p>"}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: give the two lines separate parameters, set their coordinates equal, solve two of the equations, and check the third with the same values.<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "mc", "text": "Which set of equations has a solution exactly when some point lies on both lines?", "phase": "Carry out", "answers": [{"html": "\\(1+t=s\\), \\(2t=4+s\\), and \\(1+t=2s\\).", "ok": false, "comment": "Check the second line’s \\(y\\)-coordinate. It is \\(4-s\\), so the minus sign in front of \\(s\\) has to stay in the equation."}, {"html": "\\(1=0\\), \\(0=4\\), and \\(1=0\\).", "ok": false, "comment": "Those are the points at \\(t=0\\) and \\(s=0\\), set equal. Each is just one point on its line, so matching them doesn’t tell you whether the lines share a point."}, {"html": "\\(1+t=s\\), \\(2t=4-s\\), and \\(1+t=2s\\).", "ok": true, "comment": "Right. A shared point is reached at some value of \\(t\\) on the first line and some value of \\(s\\) on the second. Each coordinate has to match, so there is one equation per coordinate."}, {"html": "\\(1+t=t\\), \\(2t=4-t\\), and \\(1+t=2t\\).", "ok": false, "comment": "That uses \\(t\\) for both lines, so both lines must be at the shared point at the same time. They can reach it at different times, so the second line needs its own parameter, \\(s\\)."}]}, {"type": "mc", "text": "Following your plan, which description of \\(L_1\\) and \\(L_2\\) is correct?", "phase": "Carry out", "answers": [{"html": "Parallel, since the lines have no common point.", "ok": false, "comment": "That is the parallel mistake: lines with no common point aren’t necessarily parallel. These lines are parallel only if their direction vectors are multiples of each other, and \\((1,2,1)\\) and \\((1,-1,2)\\) are not."}, {"html": "Intersecting, since the lines are not parallel.", "ok": false, "comment": "That is the not-parallel mistake. In space, lines with different directions can still miss each other, so you have to look for a common point."}, {"html": "Intersecting, at the point found from the first two equations.", "ok": false, "comment": "That is the two-equation mistake. Two coordinates agreeing doesn’t mean the third does too. Put the same values of \\(s\\) and \\(t\\) into the third equation and see whether it holds."}, {"html": "Skew. The lines are not parallel, and they have no common point.", "ok": true, "comment": "Right. The first two equations do have a solution, but the third equation fails at that solution. So the lines have no common point, and since their directions are not multiples of each other, they are not parallel."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The answer: \\(L_1\\) and \\(L_2\\) are skew. They don’t meet, and they aren’t parallel.<\/p><p>Last phase: <strong>look back<\/strong>. Test the result in a way that doesn’t reuse the same steps.<\/p>", "phase": "Look back", "cta": "Got it. On to Phase 4: Look back."}, {"type": "write", "text": "Choose a check of your own and carry it out. What did you check, and did it pass?", "phase": "Look back", "model": "<p>I took the point on \\(L_1\\) at \\(t=1\\), which is \\((2,2,2)\\), and asked whether it is on \\(L_2\\). On \\(L_2\\), the point with first coordinate \\(2\\) is at \\(s=2\\), which gives \\((2,2,4)\\). That point has third coordinate \\(4\\), but mine has \\(2\\), so \\((2,2,2)\\) is not on \\(L_2\\). The check did not pass. The first two equations allow only this one candidate, so there is no common point.<\/p>"}, {"type": "mc", "text": "Suppose both lines lie in one flat plane. If two lines in a plane are not parallel, must they meet?", "phase": "Look back", "answers": [{"html": "Yes, at exactly one point.", "ok": true, "comment": "Right. In a flat plane, two lines that are not parallel always cross at exactly one point. There is no height for one line to pass over the other."}, {"html": "Yes, but only at the origin.", "ok": false, "comment": "Non-parallel lines in a plane cross wherever their equations put them. Nothing forces the crossing to be at the origin."}, {"html": "Yes, at infinitely many points, since lines go on forever.", "ok": false, "comment": "Lines that share infinitely many points are the same line, and that line is parallel to itself. Non-parallel lines share only one point."}, {"html": "No. In a plane, non-parallel lines can miss each other too.", "ok": false, "comment": "That is the space mistake carried into a plane. A flat plane has no height for one line to pass over the other, so non-parallel lines always cross."}]}, {"type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate set up the two lines with the same \\(t\\), got \\(1=0\\), and said the lines don’t meet. That is the right answer for these lines. Explain why the same method could give a wrong answer for a different pair of lines.<\/p>", "phase": "Look back"}]};</script>
