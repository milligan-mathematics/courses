<script>window.POLYA = {"slug": "p8-6a-biggest-stretch", "title": "8.6 Problem A: The biggest stretch", "statement": "Let \\(A=\\begin{bmatrix}2&3\\\\0&2\\end{bmatrix}\\). Find a singular value decomposition \\(A=U\\Sigma V^T\\), with \\(U\\) and \\(V\\) orthogonal and the singular values on the diagonal of \\(\\Sigma\\) listed from largest to smallest.", "questions": [{"phase": "Understand", "type": "write", "text": "In your own words, what is this problem asking for, and what will a finished answer look like?", "model": "<p>It asks for a factorization \\(A=U\\Sigma V^T\\) with \\(U\\) and \\(V\\) orthogonal and \\(\\Sigma\\) diagonal. So a finished answer is a diagonal \\(\\Sigma\\) of singular values, largest first, together with two orthogonal matrices that multiply back to \\(A\\).<\/p>"}, {"phase": "Plan", "type": "write", "text": "Before you compute anything, write your plan in 2–3 sentences: what will you compute, and in what order?", "model": "<p>Compute \\(A^TA\\), then find its eigenvalues and unit eigenvectors. Take the square roots of the eigenvalues, largest first, to get the singular values. Build \\(U\\) by multiplying \\(A\\) by each eigenvector and dividing by its singular value, and build \\(V\\) from the eigenvectors themselves (the book’s SVD Algorithm calls these P and Q). The steps that need care are the square roots and that division.<\/p>"}, {"phase": "Carry out", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: find the eigenvalues of \\(A^TA\\), and unit eigenvectors \\(\\mathbf v_1,\\mathbf v_2\\) for them, with \\(\\mathbf v_1\\) for the larger eigenvalue. These are the columns of \\(V\\). Take square roots of the eigenvalues to get the singular values, and let the columns of \\(U\\) be \\(\\mathbf u_i=A\\mathbf v_i/\\sigma_i\\).<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 3: Carry out."}, {"phase": "Carry out", "type": "mc", "text": "What is \\(\\Sigma\\) for this \\(A\\)?", "answers": [{"html": "\\(\\begin{bmatrix}1&0\\\\0&4\\end{bmatrix}\\)", "ok": false, "comment": "The values are right, but the order is not. \\(\\Sigma\\) lists the singular values from largest to smallest, so \\(4\\) goes in the top left."}, {"html": "\\(\\begin{bmatrix}4&0\\\\0&1\\end{bmatrix}\\)", "ok": true, "comment": "Right. The eigenvalues of \\(A^TA\\) are \\(16\\) and \\(1\\), so the singular values are \\(\\sqrt{16}=4\\) and \\(\\sqrt{1}=1\\), largest first."}, {"html": "\\(\\begin{bmatrix}16&0\\\\0&1\\end{bmatrix}\\)", "ok": false, "comment": "Those are the eigenvalues of \\(A^TA\\), not the singular values. Take the square root of each one: \\(\\sqrt{16}=4\\)."}, {"html": "\\(\\begin{bmatrix}2&0\\\\0&2\\end{bmatrix}\\)", "ok": false, "comment": "Those are the eigenvalues of \\(A\\) itself, which sit on the diagonal because \\(A\\) is triangular. The singular values come from \\(A^TA\\), as the plan says."}]}, {"phase": "Carry out", "type": "mc", "text": "Let \\(\\mathbf v_1\\) be the unit eigenvector of \\(A^TA\\) for its largest eigenvalue, with positive entries. What is the first column \\(\\mathbf u_1\\) of \\(U\\)?", "answers": [{"html": "\\(\\dfrac{1}{\\sqrt{5}}\\begin{bmatrix}2\\\\1\\end{bmatrix}\\)", "ok": true, "comment": "Right. \\(A\\mathbf v_1=\\dfrac{1}{\\sqrt{5}}\\begin{bmatrix}8\\\\4\\end{bmatrix}\\), and dividing by \\(\\sigma_1=4\\) gives a unit vector."}, {"html": "\\(\\dfrac{1}{\\sqrt{5}}\\begin{bmatrix}1\\\\-2\\end{bmatrix}\\)", "ok": false, "comment": "That vector goes with the smaller singular value, \\(\\sigma_2=1\\), and with \\(\\mathbf v_2\\). The largest singular value goes with \\(\\mathbf v_1\\)."}, {"html": "\\(\\dfrac{1}{\\sqrt{5}}\\begin{bmatrix}8\\\\4\\end{bmatrix}\\)", "ok": false, "comment": "That is \\(A\\mathbf v_1\\) itself, and its length is \\(4\\). Divide by \\(\\sigma_1=4\\) to get a unit vector."}, {"html": "\\(\\dfrac{1}{\\sqrt{5}}\\begin{bmatrix}1\\\\2\\end{bmatrix}\\)", "ok": false, "comment": "That is \\(\\mathbf v_1\\), the eigenvector of \\(A^TA\\). The vector \\(\\mathbf u_1\\) is the direction \\(A\\) sends \\(\\mathbf v_1\\) to, scaled to length 1."}]}, {"phase": "Look back", "type": "write", "text": "Choose a check of your own and carry it out. What did you check, and did it pass?", "model": "<p>I multiplied \\(U\\Sigma V^T\\) back out and got \\(A\\) again, so the factors agree. I also checked \\(A\\mathbf v_1=4\\mathbf u_1\\): both sides are \\(\\dfrac{1}{\\sqrt{5}}\\begin{bmatrix}8\\\\4\\end{bmatrix}\\), so \\(A\\) stretches \\(\\mathbf v_1\\) by exactly \\(4\\). The first term, \\(\\sigma_1\\mathbf u_1\\mathbf v_1^T\\), carries most of \\(A\\): the squares of its entries add to \\(16\\), and the squares of the entries of \\(A\\) add to \\(17\\).<\/p>"}, {"phase": "Look back", "type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). What does the largest singular value of \\(A\\) tell you about how far \\(A\\) can stretch a vector?<\/p>"}]};</script>
