<script>window.POLYA = {"slug": "p2-2a-columns-reach-b", "title": "2.2 Problem A: Many ways to reach b", "statement": "Let \\(A = \\begin{bmatrix}1&2&1\\\\2&4&3\\end{bmatrix}\\) and \\(\\mathbf{b} = \\begin{bmatrix}7\\\\18\\end{bmatrix}\\). Find <strong>all<\/strong> vectors \\(\\mathbf{x}\\) with \\(A\\mathbf{x} = \\mathbf{b}\\). Equivalently, find every way to write \\(\\mathbf{b}\\) as a linear combination of the columns of \\(A\\).", "questions": [{"type": "write", "text": "In your own words, what is this problem asking for?", "phase": "Understand", "model": "We want every vector \\(\\mathbf{x} = (x_1, x_2, x_3)\\) with \\(A\\mathbf{x} = \\mathbf{b}\\). Equivalently, we want every set of weights on the columns of \\(A\\) that adds up to \\(\\mathbf{b}\\). One weighting isn’t enough; we want all of them."}, {"type": "mc", "text": "What is the unknown in this problem?", "phase": "Understand", "answers": [{"html": "The numbers \\(x_1, x_2, x_3\\) (the vector \\(\\mathbf{x}\\)) that make \\(A\\mathbf{x} = \\mathbf{b}\\) true.", "ok": true, "comment": "Right. \\(A\\) and \\(\\mathbf{b}\\) are given, and the unknown is the vector \\(\\mathbf{x}\\) of weights. The answer may be a set with more than one vector."}, {"html": "The product \\(A\\mathbf{b}\\).", "ok": false, "comment": "\\(A\\) has three columns and \\(\\mathbf{b}\\) has two entries, so \\(A\\mathbf{b}\\) isn’t defined. The unknown is \\(\\mathbf{x}\\), which multiplies \\(A\\) from the right."}, {"html": "Whether the columns of \\(A\\) are dependent.", "ok": false, "comment": "That is a question about \\(A\\) alone. It is related, but this problem fixes \\(\\mathbf{b}\\) and asks which \\(\\mathbf{x}\\) works."}, {"html": "The vector \\(\\mathbf{b}\\) that makes the equation true.", "ok": false, "comment": "\\(\\mathbf{b}\\) is given as \\(\\begin{bmatrix}7\\\\18\\end{bmatrix}\\). It is fixed, not unknown."}]}, {"type": "mc", "text": "Try a special case first. Is \\(\\mathbf{x} = \\begin{bmatrix}3\\\\0\\\\4\\end{bmatrix}\\) a solution?", "phase": "Understand", "answers": [{"html": "No. A weight of \\(0\\) means that column doesn’t belong, so the product can’t match \\(\\mathbf{b}\\).", "ok": false, "comment": "A weight of \\(0\\) just means that column isn’t used. The other two columns still reach \\(\\mathbf{b}\\)."}, {"html": "No. \\(\\mathbf{x}\\) would have to equal \\(\\mathbf{b}\\).", "ok": false, "comment": "Those are different things. \\(\\mathbf{b}\\) is the right side; \\(\\mathbf{x}\\) is the list of weights that produces it."}, {"html": "Yes. \\(3\\) times column 1 plus \\(4\\) times column 3 gives \\(\\mathbf{b}\\), and the zero weight on column 2 is fine.", "ok": true, "comment": "Right: \\(3(1,2) + 0(2,4) + 4(1,3) = (7,18)\\). So at least one solution exists. The question is whether there are others."}, {"html": "No. \\(\\mathbf{x}\\) should have two entries, one per equation.", "ok": false, "comment": "\\(\\mathbf{x}\\) has one entry per <em>column<\/em> of \\(A\\), not one per equation. \\(A\\) has three columns, so three entries is the right size."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> We want every \\(\\mathbf{x}\\) with \\(A\\mathbf{x} = \\mathbf{b}\\). We already have one, \\(\\mathbf{x} = (3, 0, 4)\\). Are there others?<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "phase": "Plan", "cta": "Got it. On to Phase 2: Plan."}, {"type": "multi", "text": "Which of these plans would find <em>all<\/em> the solutions? Select all that apply.", "phase": "Plan", "answers": [{"html": "Try small whole numbers for the weights until one works, then stop.", "ok": false, "comment": "That can find one solution, but it can’t show you that you have them all. You would never know when to stop."}, {"html": "Row-reduce the augmented matrix \\([A\\mid\\mathbf{b}]\\), then read off the leading variables and the free variables.", "ok": true, "comment": "This finds everything: the free variables tell you how many solutions there are and how they vary."}, {"html": "Use only column 1: check whether \\(\\mathbf{b}\\) is a multiple of \\(\\begin{bmatrix}1\\\\2\\end{bmatrix}\\).", "ok": false, "comment": "That ignores column 3, \\(\\begin{bmatrix}1\\\\3\\end{bmatrix}\\), which does most of the work. Also, \\(\\mathbf{b}\\) is not a multiple of column 1, and it still has solutions."}, {"html": "Find one solution \\(\\mathbf{x}_1\\) of \\(A\\mathbf{x} = \\mathbf{b}\\), find all solutions of \\(A\\mathbf{x} = \\mathbf{0}\\), and add \\(\\mathbf{x}_1\\) to each of those.", "ok": true, "comment": "Also correct. It is the theorem from this section: every solution is one particular solution plus a solution of \\(A\\mathbf{x} = \\mathbf{0}\\)."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: row-reduce \\([A\\mid\\mathbf{b}]\\). Remember that each row operation changes the right-hand column too.<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "mc", "text": "Which is the reduced row-echelon form of \\([A\\mid\\mathbf{b}]\\)?", "phase": "Carry out", "answers": [{"html": "\\(\\left[\\begin{array}{ccc|c} 1&2&1&7\\\\ 0&0&1&4\\end{array}\\right]\\)", "ok": false, "comment": "Row 1 still has a \\(1\\) above the leading 1 in column 3. Reduced form needs zeros above and below each leading 1."}, {"html": "\\(\\left[\\begin{array}{ccc|c} 1&2&0&3\\\\ 0&0&1&18\\end{array}\\right]\\)", "ok": false, "comment": "Recheck the right-hand column: \\(R_2 \\to R_2 - 2R_1\\) changes \\(\\mathbf{b}\\) too, since \\(18 - 2\\cdot 7 = 4\\)."}, {"html": "\\(\\left[\\begin{array}{ccc|c} 1&2&0&3\\\\ 0&0&0&4\\end{array}\\right]\\)", "ok": false, "comment": "Row 2 has a \\(1\\) in column 3, so there is a leading 1 there and no contradiction. The row \\(0 = 4\\) would mean no solution, but that isn’t what row 2 says."}, {"html": "\\(\\left[\\begin{array}{ccc|c} 1&2&0&3\\\\ 0&0&1&4\\end{array}\\right]\\)", "ok": true, "comment": "Right. \\(R_2 \\to R_2 - 2R_1\\) gives \\([\\,0\\ 0\\ 1\\mid 4\\,]\\), and then \\(R_1 \\to R_1 - R_2\\) gives \\([\\,1\\ 2\\ 0\\mid 3\\,]\\)."}]}, {"type": "num", "text": "In the reduced form, what is the value of \\(x_3\\)? (Type a number.)", "phase": "Carry out", "comment": "Row 2 says \\(x_3 = 4\\), so every solution has third entry \\(4\\).", "shape": [1, 1], "values": [4.0], "answer_tex": "4", "typed_answer": ["4"], "wrong": []}, {"type": "mc", "text": "Which describes <em>all<\/em> solutions? (Let \\(s\\) be any real number.)", "phase": "Carry out", "answers": [{"html": "\\(s\\begin{bmatrix}-2\\\\1\\\\0\\end{bmatrix}\\)", "ok": false, "comment": "Those vectors solve \\(A\\mathbf{x} = \\mathbf{0}\\), but not \\(A\\mathbf{x} = \\mathbf{b}\\). Dropping the particular solution is a classic slip: \\(\\mathbf{b}\\) has to come from somewhere."}, {"html": "\\(\\begin{bmatrix}3\\\\0\\\\4\\end{bmatrix} + s\\begin{bmatrix}-2\\\\1\\\\0\\end{bmatrix}\\)", "ok": true, "comment": "Right. The free variable \\(x_2 = s\\) gives \\(x_1 = 3 - 2s\\) and \\(x_3 = 4\\). So \\(\\mathbf{x} = (3 - 2s,\\ s,\\ 4)\\), which is \\((3,0,4) + s(-2,1,0)\\)."}, {"html": "\\(\\begin{bmatrix}3\\\\0\\\\4\\end{bmatrix} + s\\begin{bmatrix}2\\\\1\\\\0\\end{bmatrix}\\)", "ok": false, "comment": "Check \\(A\\) times \\((2,1,0)\\): that is \\((4,8)\\), not \\(\\mathbf{0}\\). The direction vector has to solve \\(A\\mathbf{x} = \\mathbf{0}\\), so its first entry must be \\(-2\\)."}, {"html": "\\(\\begin{bmatrix}3\\\\0\\\\4\\end{bmatrix}\\)", "ok": false, "comment": "That is one solution. There is a whole family, because \\(x_2\\) is free."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> Every solution is \\((3,0,4) + s(-2,1,0)\\). Last phase: <strong>look back<\/strong>. Check the answer, then change the problem and see what moves.<\/p>", "phase": "Look back", "cta": "Got it. On to Phase 4: Look back."}, {"type": "mc", "text": "Take \\(s = 2\\): \\(\\mathbf{x} = (-1, 2, 4)\\). What is \\(A\\mathbf{x}\\)?", "phase": "Look back", "answers": [{"html": "\\(\\begin{bmatrix}7\\\\18\\end{bmatrix}\\)", "ok": true, "comment": "Right: row 1 gives \\(-1 + 4 + 4 = 7\\) and row 2 gives \\(-2 + 8 + 12 = 18\\). Every value of \\(s\\) gives \\(\\mathbf{b}\\)."}, {"html": "\\(\\begin{bmatrix}18\\\\7\\end{bmatrix}\\)", "ok": false, "comment": "The two entries are swapped. The first row is the one that gives \\(7\\)."}, {"html": "\\(\\begin{bmatrix}7\\\\6\\end{bmatrix}\\)", "ok": false, "comment": "You left out the \\(x_3\\) term in row 2. Row 2 also has \\(3 \\cdot 4 = 12\\)."}, {"html": "\\(\\begin{bmatrix}9\\\\22\\end{bmatrix}\\)", "ok": false, "comment": "Check the sign of \\(x_1\\). It is \\(-1\\), not \\(+1\\). With \\(+1\\) the first row would be \\(9\\)."}]}, {"type": "mc", "text": "Now change the right side to \\(\\mathbf{b} = \\begin{bmatrix}7\\\\15\\end{bmatrix}\\) and keep \\(A\\) the same. Does \\(A\\mathbf{x} = \\mathbf{b}\\) still have solutions?", "phase": "Look back", "answers": [{"html": "No, because \\(\\text{column } 2 = 2\\cdot\\text{column } 1\\), and dependent columns can’t reach \\(\\mathbf{b}\\).", "ok": false, "comment": "Dependent columns don’t block solutions; they create free variables. Here the rank of \\(A\\) is \\(2\\), which is enough to reach every \\(\\mathbf{b}\\) in \\(\\mathbb{R}^2\\)."}, {"html": "No. \\(\\mathbf{b}\\) must be \\(2\\) times column 1, because the second entry is twice the first.", "ok": false, "comment": "That would only be needed if we ignored column 3. The original \\(\\mathbf{b} = (7,18)\\) isn’t a multiple of column 1 either, and it still had solutions."}, {"html": "Yes. The solutions are \\((6,0,1) + s(-2,1,0)\\). Column 3, \\(\\begin{bmatrix}1\\\\3\\end{bmatrix}\\), is not a multiple of column 1, so together the columns reach every vector in \\(\\mathbb{R}^2\\).", "ok": true, "comment": "Right. Check \\(A(6,0,1) = (7,15)\\). The columns of \\(A\\) span \\(\\mathbb{R}^2\\), so every \\(\\mathbf{b}\\) can be reached."}, {"html": "Yes, and the solution is unique: \\((6,0,1)\\).", "ok": false, "comment": "\\((6,0,1)\\) works, but \\(x_2\\) is free, so \\((6,0,1) + s(-2,1,0)\\) works too. Solutions are not unique here."}]}, {"type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate answered \\(s\\begin{bmatrix}-2\\\\1\\\\0\\end{bmatrix}\\). What did they leave out, and what one check would have caught it?<\/p>", "phase": "Look back"}]};</script>
