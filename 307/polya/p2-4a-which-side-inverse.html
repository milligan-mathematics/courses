<script>window.POLYA = {"slug": "p2-4a-which-side-inverse", "title": "2.4 Problem A: Which side does the inverse go on?", "statement": "Let \\(\\begin{bmatrix}1&1\\\\1&2\\end{bmatrix}\\), \\(\\begin{bmatrix}2&1\\\\1&1\\end{bmatrix}\\), and \\(\\begin{bmatrix}1&2\\\\3&4\\end{bmatrix}\\). Both \\(A\\) and \\(B\\) are invertible. Solve \\(AXB = C\\) for the matrix \\(X\\).", "questions": [{"phase": "Understand", "type": "write", "text": "In your own words, what is this problem asking for?", "model": "<p>It gives me \\(A\\), \\(B\\), and \\(C\\), and asks for the matrix \\(X\\) that makes \\(AXB = C\\) true. Since \\(X\\) sits between \\(A\\) and \\(B\\), I can’t just divide. I need to undo \\(A\\) on the left and \\(B\\) on the right, with each inverse on its own side.<\/p>"}, {"phase": "Understand", "type": "mc", "text": "Solve \\(AXB = C\\) for \\(X\\). What is the problem asking you to find?", "answers": [{"html": "The matrices \\(A\\) and \\(B\\), once \\(X\\) and \\(C\\) are known.", "ok": false, "comment": "Here \\(A\\) and \\(B\\) are given. The unknown is \\(X\\), so we solve for \\(X\\), not for \\(A\\) or \\(B\\)."}, {"html": "Whether \\(X\\) exists at all.", "ok": false, "comment": "The problem says \\(A\\) and \\(B\\) are invertible, so we can go straight to finding \\(X\\)."}, {"html": "The matrix \\(X\\) that makes \\(AXB = C\\) true, given that \\(A\\) and \\(B\\) are invertible.", "ok": true, "comment": "Right. \\(A\\), \\(B\\), and \\(C\\) are known, and \\(X\\) is the unknown matrix."}, {"html": "A matrix \\(X\\) that makes \\(XAB = C\\) true.", "ok": false, "comment": "The order matters. In \\(AXB = C\\) the \\(X\\) sits between \\(A\\) and \\(B\\), and \\(XAB\\) is a different equation."}]}, {"phase": "Understand", "type": "mc", "text": "In \\(AXB = C\\), where do \\(A\\) and \\(B\\) sit relative to \\(X\\)?", "answers": [{"html": "Both multiply \\(X\\) from the right.", "ok": false, "comment": "That would be \\(XAB = C\\). In \\(AXB\\), \\(A\\) is ide by \\(B\\), the way you would with numbers.", "ok": false, "comment": "Matrices don’t divide. The matrix version of dividing is multiplying by an inverse, on the correct side."}]}, {"phase": "Carry out", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: undo \\(A\\) on the left and \\(B\\) on the right, using inverses. We start with \\(A^{-1}\\).<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 3: Carry out."}, {"phase": "Carry out", "type": "mc", "text": "What is \\(A^{-1}\\) for \\(\\begin{bmatrix}1&1\\\\1&2\\end{bmatrix}\\)?", "answers": [{"html": "\\(\\begin{bmatrix}2&-1\\\\-1&1\\end{bmatrix}\\)", "ok": true, "comment": "Right. Swap the diagonal entries, negate the off-diagonal entries, and divide by \\(ad - bc = 1\\)."}, {"html": "\\(\\frac13\\begin{bmatrix}2&-1\\\\-1&1\\end{bmatrix}\\)", "ok": false, "comment": "The determinant is \\(ad - bc = 1\\cdot 2 - 1\\cdot 1 = 1\\), not \\(ad + bc = 3\\). Adding instead of subtracting is the mistake here."}, {"html": "\\(\\begin{bmatrix}1&-1\\\\-1&2\\end{bmatrix}\\)", "ok": false, "comment": "You changed the off-diagonal signs but left the diagonal where it was. The diagonal entries swap."}, {"html": "\\(\\begin{bmatrix}2&1\\\\1&1\\end{bmatrix}\\)", "ok": false, "comment": "You swapped the diagonal entries but kept the off-diagonal signs. Those need to change too."}]}, {"phase": "Carry out", "type": "mc", "text": "Using \\(A^{-1} = \\begin{bmatrix}2&-1\\\\-1&1\\end{bmatrix}\\), multiply both sides of \\(AXB = C\\) on the left by \\(A^{-1}\\). The equation becomes \\(XB = \\;?\\) What goes in the blank?", "answers": [{"html": "\\(\\begin{bmatrix}4&6\\\\7&10\\end{bmatrix}\\)", "ok": false, "comment": "That is \\(AC\\). Multiplying by \\(A\\) doesn’t undo it. We need the inverse \\(A^{-1}\\)."}, {"html": "\\(\\begin{bmatrix}0&1\\\\2&1\\end{bmatrix}\\)", "ok": false, "comment": "That is \\(CA^{-1}\\). The inverse went to the wrong side of \\(C\\). It has to stay on the left, next to \\(A\\)."}, {"html": "\\(\\begin{bmatrix}-1&0\\\\2&2\\end{bmatrix}\\)", "ok": true, "comment": "Right. \\(A^{-1}C\\) is the product with \\(A^{-1}\\) on the left of \\(C\\), because that is the side where it cancels \\(A\\)."}]}, {"phase": "Carry out", "type": "mc", "text": "Now multiply on the right by \\(B^{-1} = \\begin{bmatrix}1&-1\\\\-1&2\\end{bmatrix}\\). What is \\(X\\)?", "answers": [{"html": "\\(\\begin{bmatrix}-2&-1\\\\6&4\\end{bmatrix}\\)", "ok": false, "comment": "That is \\(A^{-1}CB\\). You multiplied by \\(B\\) where you needed \\(B^{-1}\\). To undo \\(B\\), use its inverse."}, {"html": "\\(\\begin{bmatrix}-9&-10\\\\7&8\\end{bmatrix}\\)", "ok": false, "comment": "Both inverses went on the left: \\(A^{-1}B^{-1}C\\). \\(B^{-1}\\) belongs on the right of \\(X\\), where \\(B\\) was."}, {"html": "\\(\\begin{bmatrix}-2&0\\\\4&1\\end{bmatrix}\\)", "ok": false, "comment": "The inverses are on the wrong sides. \\(A^{-1}\\) goes on the left and \\(B^{-1}\\) on the right."}, {"html": "\\(\\begin{bmatrix}-1&1\\\\0&2\\end{bmatrix}\\)", "ok": true, "comment": "Right: \\(X = A^{-1}CB^{-1}\\). Each inverse is used once, on its own side."}]}, {"phase": "Look back", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The answer is \\(X = \\begin{bmatrix}-1&1\\\\0&2\\end{bmatrix}\\).<\/p><p>Last phase: <strong>look back<\/strong>. Put the answer back into the original equation.<\/p>", "cta": "Got it. On to Phase 4: Look back."}, {"phase": "Look back", "type": "mc", "text": "Multiply \\(A\\), your \\(X\\), and \\(B\\) together, in that order. Which result confirms the answer?", "answers": [{"html": "\\(X\\) itself, since \\(A\\) and \\(B\\) cancel.", "ok": false, "comment": "Multiplying by \\(A\\) and \\(B\\) doesn’t cancel \\(X\\). Only inverses cancel. Here \\(AXB\\) comes back as \\(C\\), not \\(X\\)."}, {"html": "\\(C\\) itself, since \\(AXB = C\\).", "ok": true, "comment": "Right. Multiplying back is the check, and it lands exactly on \\(C\\)."}, {"html": "\\(C\\), but only if you multiply in the order \\(BXA\\).", "ok": false, "comment": "That is the product for \\(BXA = C\\), a different equation. Keep the order from the original problem."}, {"html": "\\(C\\), but only if you multiply in the order \\(XAB\\).", "ok": false, "comment": "Order matters. \\(XAB\\) is a different product, and for this \\(X\\) it does not give \\(C\\)."}]}, {"phase": "Look back", "type": "mc", "text": "Vary the problem. Suppose the equation were \\(BXA = C\\) instead. What is \\(X\\) now?", "answers": [{"html": "\\(\\begin{bmatrix}-1&1\\\\0&2\\end{bmatrix}\\)", "ok": false, "comment": "That is our old answer, for \\(AXB = C\\). Swapping which matrix sits on which side changes the answer."}, {"html": "\\(\\begin{bmatrix}-9&-10\\\\7&8\\end{bmatrix}\\)", "ok": false, "comment": "That is \\((BA)^{-1}C\\), which would be right for \\(BAX = C\\), with \\(X\\) on the outside. Here \\(X\\) is between \\(B\\) and \\(A\\)."}, {"html": "\\(\\begin{bmatrix}-1&2\\\\1&0\\end{bmatrix}\\)", "ok": false, "comment": "That is \\(CA^{-1}B^{-1}\\), with \\(C\\) on the outside. The \\(C\\) has to be in the middle."}, {"html": "\\(\\begin{bmatrix}-2&0\\\\4&1\\end{bmatrix}\\)", "ok": true, "comment": "Right. \\(B\\) is now on the left of \\(X\\) and \\(A\\) on the right, so \\(X = B^{-1}CA^{-1}\\)."}]}, {"phase": "Look back", "type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate wrote \\(X = A^{-1}B^{-1}C\\) for \\(AXB = C\\). What did they do with the inverses, and how could the multiplying-back check have caught it?<\/p>"}]};</script>
