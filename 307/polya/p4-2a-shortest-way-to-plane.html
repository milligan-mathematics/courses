<script>window.POLYA = {"slug": "p4-2a-shortest-way-to-plane", "title": "4.2 Problem A: The shortest way to a plane", "statement": "Find the shortest distance from the point \\(P(2, -4, 6)\\) to the plane \\(x - 2y + 2z = 4\\). Also find the point \\(Q\\) on the plane that is closest to \\(P\\).", "questions": [{"phase": "Understand", "type": "write", "text": "In your own words, what is this problem asking for?", "model": "<p>It asks for two things: the shortest distance from \\(P\\) to the plane \\(x - 2y + 2z = 4\\), and the point \\(Q\\) on the plane that is closest to \\(P\\). The shortest segment from \\(P\\) to the plane is perpendicular to the plane, so \\(Q\\) is where the perpendicular from \\(P\\) meets the plane.<\/p>"}, {"phase": "Understand", "type": "mc", "text": "Which vector is perpendicular to the plane \\(x - 2y + 2z = 4\\)?", "answers": [{"html": "\\((2, 1, 0)\\)", "ok": false, "comment": "Check the dot product: \\((2, 1, 0)\\cdot(1, -2, 2) = 0\\), so this vector lies along the plane, not across it."}, {"html": "\\(\\mathbf n = (1, -2, 2)\\)", "ok": true, "comment": "Right. The coefficients of \\(x\\), \\(y\\), \\(z\\) in the plane’s equation form a normal vector, and the shortest path from \\(P\\) to the plane runs along it."}, {"html": "\\((2, -4, 6)\\)", "ok": false, "comment": "That is the position vector of \\(P\\). It points from the origin to \\(P\\), which says nothing about how the plane is tilted."}, {"html": "\\((4, 0, 0)\\)", "ok": false, "comment": "That is a point on the plane (it satisfies the equation), not a direction perpendicular to it."}]}, {"phase": "Plan", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> We want two things: the shortest distance from \\(P\\) to the plane, and the point \\(Q\\) on the plane closest to \\(P\\). Since \\(Q\\) is the closest point, the segment \\(PQ\\) is perpendicular to the plane.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 2: Plan."}, {"phase": "Plan", "type": "write", "text": "Before you start, write your plan in 1–3 sentences: which method, and which step needs care?", "model": "<p>Pick a point \\(P_0\\) on the plane and let \\(\\mathbf u = P - P_0\\). Project \\(\\mathbf u\\) onto a normal \\(\\mathbf n\\), the vector of coefficients of the plane’s equation; the length of that projection is the distance. The step that needs care is the move from \\(P\\) to \\(Q\\), which runs along the projection toward the plane, not away from it.<\/p>"}, {"phase": "Carry out", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: pick a point \\(P_0\\) on the plane, let \\(\\mathbf u = P - P_0\\), and project \\(\\mathbf u\\) onto \\(\\mathbf n\\), using \\(\\operatorname{proj}_{\\mathbf n}\\mathbf u=\\dfrac{\\mathbf u\\cdot\\mathbf n}{\\|\\mathbf n\\|^2}\\,\\mathbf n\\). The length of that projection is the distance. Then \\(Q\\) is reached from \\(P\\) by moving along that projection until you land on the plane.<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 3: Carry out."}, {"phase": "Carry out", "type": "mc", "text": "Use \\(P_0 = (4, 0, 0)\\), which is on the plane, and a normal \\(\\mathbf n = (1, -2, 2)\\). What is the shortest distance from \\(P = (2, -4, 6)\\) to the plane?", "answers": [{"html": "\\(6\\)", "ok": true, "comment": "Right. \\(\\mathbf u = P - P_0 = (-2, -4, 6)\\) and \\(\\mathbf u\\cdot\\mathbf n = 18\\), so \\(\\operatorname{proj}_{\\mathbf n}\\mathbf u = \\tfrac{18}{9}\\mathbf n = (2, -4, 4)\\). Its length is \\(\\sqrt{36} = 6\\)."}, {"html": "\\(2\\)", "ok": false, "comment": "That is the scalar \\(\\tfrac{18}{9}\\) in \\(\\operatorname{proj}_{\\mathbf n}\\mathbf u = 2\\mathbf n\\), not the length of the projection. The length is \\(2\\|\\mathbf n\\| = 6\\)."}, {"html": "\\(2\\sqrt{5}\\)", "ok": false, "comment": "That is the length of \\(\\mathbf u - \\operatorname{proj}_{\\mathbf n}\\mathbf u = (-4, 0, 2)\\), the leftover part of \\(\\mathbf u\\) that runs along the plane. Projecting onto the plane instead of onto the normal doesn’t give the distance."}, {"html": "\\(18\\)", "ok": false, "comment": "That is \\(\\mathbf u\\cdot\\mathbf n\\) itself. You forgot to divide by \\(\\|\\mathbf n\\| = 3\\), which turns it into the length of the projection."}]}, {"phase": "Carry out", "type": "mc", "text": "Which point is \\(Q\\), the point of the plane closest to \\(P\\)?", "answers": [{"html": "\\(Q = (6, -4, 4)\\)", "ok": false, "comment": "That subtracts the part of \\(\\mathbf u\\) that runs along the plane, so \\(P\\) slides along the plane instead of moving toward it. Plugging in gives \\(6 - 2(-4) + 2(4) = 22\\), not \\(4\\)."}, {"html": "\\(Q = (4, -8, 10)\\)", "ok": false, "comment": "That is \\(P + \\operatorname{proj}_{\\mathbf n}\\mathbf u\\), which moves away from the plane. Plugging it in gives \\(4 - 2(-8) + 2(10) = 40\\), not \\(4\\)."}, {"html": "\\(Q = (-4, 8, -6)\\)", "ok": false, "comment": "That is \\(P - 6\\mathbf n\\). You divided by \\(\\|\\mathbf n\\|\\) instead of \\(\\|\\mathbf n\\|^2\\), so the move should be \\(2\\mathbf n\\). Plugging in gives \\(-4 - 2(8) + 2(-6) = -32\\), not \\(4\\)."}, {"html": "\\(Q = (0, 0, 2)\\)", "ok": true, "comment": "Right. \\(Q = P - \\operatorname{proj}_{\\mathbf n}\\mathbf u = (2, -4, 6) - (2, -4, 4) = (0, 0, 2)\\). It is on the plane: \\(0 - 2\\cdot 0 + 2\\cdot 2 = 4\\)."}]}, {"phase": "Look back", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The shortest distance is \\(6\\), and \\(Q = (0, 0, 2)\\).<\/p><p>Last phase: <strong>look back<\/strong>. Check the answer another way, and then see what else the method tells you.<\/p>", "cta": "Got it. On to Phase 4: Look back."}, {"phase": "Look back", "type": "write", "text": "Choose a check of your own and carry it out. What did you check, and did it pass?", "model": "<p>I checked that \\(Q\\) lies on the plane: \\(0 - 2\\cdot 0 + 2\\cdot 2 = 4\\), which matches the right side of the equation, so it passed.<\/p>"}, {"phase": "Look back", "type": "mc", "text": "Suppose you had started from a different point on the plane, such as \\((0, -2, 0)\\), and followed the same plan. Would the distance change?", "answers": [{"html": "The distance stays the same, but \\(Q\\) moves to a different point of the plane.", "ok": false, "comment": "\\(Q\\) is the point of the plane closest to \\(P\\). It depends only on \\(P\\) and the plane, not on the point you started from, so it doesn’t move."}, {"html": "No. Two points on the plane differ by a vector perpendicular to \\(\\mathbf n\\), so the part of \\(\\mathbf u\\) along \\(\\mathbf n\\) is the same no matter which point you start from.", "ok": true, "comment": "Right. Here \\((4, 0, 0) - (0, -2, 0) = (4, 2, 0)\\) is perpendicular to \\(\\mathbf n\\), since \\(4 - 4 + 0 = 0\\). The new \\(\\mathbf u = (2, -2, 6)\\) still has \\(\\mathbf u\\cdot\\mathbf n = 18\\), so the distance is still \\(6\\)."}, {"html": "Yes. The vector \\(\\mathbf u\\) changes, so its projection onto \\(\\mathbf n\\) changes too.", "ok": false, "comment": "\\(\\mathbf u\\) does change, but only by a vector that is perpendicular to \\(\\mathbf n\\). The part of \\(\\mathbf u\\) along \\(\\mathbf n\\) doesn’t change."}]}, {"phase": "Look back", "type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate says the closest point \\(Q\\) is found by changing only the \\(x\\)-coordinate of \\(P\\) until the point lands on the plane. What is wrong with that idea? Then name one habit from this problem you want to use on the next one.<\/p>"}]};</script>
