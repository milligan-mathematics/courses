<script>window.POLYA = {"slug": "p5-6a-spring-best-fit", "title": "5.6 Problem A: Fitting a line to a spring", "statement": "A spring is hung with loads of 0, 1, 2, and 3 kilograms, and its length is measured each time. The four measurements, as (load in kg, length in cm), are \\((0,10),\\ (1,12),\\ (2,13),\\ (3,15)\\). Find the line \\(y=z_0+z_1x\\) that best fits these measurements, where \\(x\\) is the load. Write \\(\\mathbf z=\\begin{bmatrix}z_0\\\\z_1\\end{bmatrix}\\), and let \\(\\mathbf y\\) be the column of the four lengths.", "questions": [{"type": "write", "text": "In your own words, what is this problem asking for?", "phase": "Understand", "model": "<p>We have four measurements of a spring’s length at four loads, and we want one straight line \\(y=z_0+z_1x\\) that fits them as well as possible. The unknowns are \\(z_0\\) and \\(z_1\\). The four points may not lie on one line, so I would need to decide what \"best\" means before I can compute anything.<\/p>"}, {"type": "mc", "text": "In this problem, what does \"best\" mean for the line?", "phase": "Understand", "answers": [{"html": "The sum of the vertical errors, without squaring, is as small as possible.", "ok": false, "comment": "This lets a positive error cancel a negative one, so a line can look good while missing badly in both directions. Squaring each error keeps them all positive."}, {"html": "The line passes through as many of the four measurements as possible.", "ok": false, "comment": "Aiming to hit as many measurements as possible means the rest get ignored. Here every measurement should count toward the fit."}, {"html": "The sum of the squares of the vertical errors (how far the line is above or below each measurement) is as small as possible.", "ok": true, "comment": "Right. Each vertical error is the gap between the line and one measurement. Squaring the errors and adding them up gives one number, and \"best\" means making that number as small as possible."}, {"html": "The largest single vertical error is as small as possible.", "ok": false, "comment": "This judges the line only by its worst miss and ignores the rest. Least squares squares every error and adds them up, so every measurement counts."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The four measurements don’t all lie on one straight line, so no line passes through all four. We want the line that makes the sum of the squared vertical errors as small as possible. The Best Approximation Theorem in this section is the tool for finding it.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "phase": "Plan", "cta": "Got it. On to Phase 2: Plan."}, {"type": "write", "text": "Before you start, write your plan in 1–3 sentences: which method, and which step needs care?", "phase": "Plan", "model": "<p>Set up the matrix \\(M\\) with a column of 1s next to the column of loads, so that \\(M\\mathbf z\\) gives \\(z_0+z_1x\\) in each row. Then form \\(M^TM\\) and \\(M^T\\mathbf y\\), and solve the normal equations \\((M^TM)\\mathbf z=M^T\\mathbf y\\) for \\(\\mathbf z\\). The step that needs care is the column of 1s: it has to be there, and it goes first, so that \\(z_0\\) is the intercept.<\/p>"}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: set up \\(M\\) with a column of 1s and a column of loads, form \\(M^TM\\) and \\(M^T\\mathbf y\\), solve \\((M^TM)\\mathbf z=M^T\\mathbf y\\), and read off the line \\(y=z_0+z_1x\\).<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "mc", "text": "Written out for these data, which system is \\((M^TM)\\mathbf z=M^T\\mathbf y\\)?", "phase": "Carry out", "answers": [{"html": "\\(\\begin{bmatrix}4&6\\\\6&14\\end{bmatrix}\\begin{bmatrix}z_0\\\\z_1\\end{bmatrix}=\\begin{bmatrix}50\\\\50\\end{bmatrix}\\)", "ok": false, "comment": "The second entry of \\(M^T\\mathbf y\\) multiplies each length by its load: \\(0\\cdot10+1\\cdot12+2\\cdot13+3\\cdot15=83\\). Adding the lengths, 50, forgets the loads."}, {"html": "\\(\\begin{bmatrix}4&6\\\\6&6\\end{bmatrix}\\begin{bmatrix}z_0\\\\z_1\\end{bmatrix}=\\begin{bmatrix}50\\\\83\\end{bmatrix}\\)", "ok": false, "comment": "The \\((2,2)\\) entry should be the sum of the squared loads, \\(0^2+1^2+2^2+3^2=14\\). The 6 is the sum of the loads themselves, so the squares were skipped."}, {"html": "\\(\\begin{bmatrix}14&6\\\\6&4\\end{bmatrix}\\begin{bmatrix}z_0\\\\z_1\\end{bmatrix}=\\begin{bmatrix}83\\\\50\\end{bmatrix}\\)", "ok": false, "comment": "Putting the loads first in \\(M\\) gives these entries, but then the unknowns come in the order \\(z_1, z_0\\). Keep the column of 1s first, so the rows match \\(\\mathbf z=(z_0,z_1)\\)."}, {"html": "\\(\\begin{bmatrix}4&6\\\\6&14\\end{bmatrix}\\begin{bmatrix}z_0\\\\z_1\\end{bmatrix}=\\begin{bmatrix}50\\\\83\\end{bmatrix}\\)", "ok": true, "comment": "Right. The first column of \\(M\\) is all 1s, and the second is the loads \\(0,1,2,3\\). So \\(M^TM\\) has entries \\(4\\), \\(6\\), and \\(14\\), and \\(M^T\\mathbf y\\) has \\(10+12+13+15=50\\) and \\(0\\cdot10+1\\cdot12+2\\cdot13+3\\cdot15=83\\)."}]}, {"type": "mc", "text": "Solve \\((M^TM)\\mathbf z=M^T\\mathbf y\\) for these data. Which line is the best fit?", "phase": "Carry out", "answers": [{"html": "\\(y=10+2x\\)", "ok": false, "comment": "That line goes through the first two measurements, \\((0,10)\\) and \\((1,12)\\), and ignores the other two. The best fit uses all four."}, {"html": "\\(y=10.1+1.6x\\)", "ok": true, "comment": "Right. Solving \\(4z_0+6z_1=50\\) and \\(6z_0+14z_1=83\\) gives \\(z_0=\\tfrac{101}{10}\\) and \\(z_1=\\tfrac85\\)."}, {"html": "\\(y=\\tfrac{83}{14}x\\)", "ok": false, "comment": "This line goes through the origin, so it has no intercept. That happens when the column of 1s is left out of \\(M\\)."}, {"html": "\\(y=1.6+10.1x\\)", "ok": false, "comment": "The intercept and the slope are swapped. This line puts the spring at about 22 cm when the load is 2 kg, but the measurement there is 13 cm."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The answer is \\(y=10.1+1.6x\\), so \\(z_0=10.1\\) and \\(z_1=1.6\\).<\/p><p>Last phase: <strong>look back<\/strong>. Test the answer in a way that doesn’t just repeat the arithmetic.<\/p>", "phase": "Look back", "cta": "Got it. On to Phase 4: Look back."}, {"type": "write", "text": "Choose a check of your own and carry it out. What did you check, and did it pass?", "phase": "Look back", "model": "<p>I checked the vertical errors \\(y_i-(z_0+z_1x_i)\\): \\(-0.1,\\ 0.3,\\ -0.3,\\ 0.1\\). They add to \\(0\\), as they must: the first normal equation, \\(4z_0+6z_1=50\\), says that \\(\\sum(y_i-z_0-z_1x_i)=0\\). It passed.<\/p>"}, {"type": "mc", "text": "Suppose we use the line to predict the length at a 2.5 kg load. Which statement about that prediction is correct?", "phase": "Look back", "answers": [{"html": "It predicts \\(14.1\\) cm. That is reasonable, because 2.5 kg lies between the 2 kg and 3 kg measurements, which were 13 cm and 15 cm.", "ok": true, "comment": "Right. \\(10.1+1.6(2.5)=14.1\\). A load between 2 kg and 3 kg should give a length between 13 and 15 cm, and 14.1 does."}, {"html": "It predicts \\(26.85\\) cm. That is reasonable, because the slope is steep.", "ok": false, "comment": "This swaps the intercept and the slope. At 2.5 kg the spring should be between 13 and 15 cm, so 26.85 cm is far too long."}, {"html": "It predicts \\(14.1\\) cm, and that value is exact, since the line passes through every measurement.", "ok": false, "comment": "The line does not pass through every measurement. The four points don’t lie on one line, so the line balances the misses, and \\(14.1\\) cm is an estimate."}, {"html": "It predicts \\(4.0\\) cm. That is reasonable, because the spring stretches only \\(1.6\\) cm per kilogram.", "ok": false, "comment": "That leaves out the starting length \\(z_0=10.1\\): the prediction is \\(10.1+4.0=14.1\\). A length of 4 cm makes no sense next to the 13 cm and 15 cm measured at 2 and 3 kg."}]}, {"type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate says, \"My line must be wrong, because the vertical errors are not all zero.\" What step did they skip? Then name one habit from this problem you want to use on the next one.<\/p>", "phase": "Look back"}]};</script>
