ve when you travel with the current. A battery is a rise when you pass through it from its \\(-\\) plate to its \\(+\\) plate, and a drop when you pass from \\(+\\) to \\(-\\).<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 2: Plan."}, {"phase": "Plan", "type": "multi", "text": "Which of these plans would find all three currents? Select all that apply.", "answers": [{"html": "Write the Circuit Rule for the left loop and the right loop, and solve those two equations.", "ok": false, "comment": "Two equations can’t pin down three unknowns. Without the Junction Rule, the currents can shift in many ways and still satisfy both loops."}, {"html": "Write the Junction Rule at \\(A\\), and the Circuit Rule for the left loop and the outer loop (both batteries and both 2 \\(\\Omega\\) resistors). Then solve.", "ok": true, "comment": "Also works. The outer loop equals the left loop minus the right loop, so the junction equation plus any two loop equations will do."}, {"html": "Write the Junction Rule at \\(A\\), and the Circuit Rule for the left loop and the right loop. Then solve the three equations together.", "ok": true, "comment": "This is the plan of Example 1.5.1. Three independent equations for three unknowns pin down one answer."}, {"html": "Write the Junction Rule at \\(A\\) and at \\(B\\), and solve those two equations.", "ok": false, "comment": "Junction \\(B\\) gives the same equation as junction \\(A\\): every current that leaves one junction arrives at the other. Two copies of one equation can’t determine three currents."}]}, {"phase": "Plan", "type": "mc", "text": "Which step in this setup needs the most care?", "answers": [{"html": "Getting the signs right when you go around a loop.", "ok": true, "comment": "Exactly. A drop is positive only when you travel with its current, and a battery is a rise only when you pass from \\(-\\) to \\(+\\). A sign slip still gives a tidy equation, just the wrong one."}, {"html": "Adding the two battery voltages, \\(20 + 10\\), in every loop equation.", "ok": false, "comment": "The batteries don’t always add. Around the outer loop they oppose each other, so their voltages combine as a difference."}, {"html": "Applying \\(V = RI\\) to each battery and its resistor as separate circuits.", "ok": false, "comment": "Each branch has one battery and one resistor, but the middle resistor connects them. The currents have to be found together."}]}, {"phase": "Carry out", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: write the Junction Rule at \\(A\\) and the Circuit Rule for the left and right loops, traveling clockwise around each loop. Put the three equations in an augmented matrix with columns \\(I_1, I_2, I_3\\), the junction in row 1, the left loop in row 2, and the right loop in row 3. Then reduce it.<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 3: Carry out."}, {"phase": "Carry out", "type": "mc", "text": "Write the Junction Rule at \\(A\\). Which equation do you get?", "answers": [{"html": "\\(I_1 = I_2 + I_3\\)", "ok": false, "comment": "That reverses in and out. \\(I_1\\) flows into \\(A\\), and \\(I_2\\) flows out of it."}, {"html": "\\(I_1 - I_3 = I_2\\)", "ok": false, "comment": "\\(I_3\\) flows up into \\(A\\), the same way as \\(I_1\\), so both count as incoming. Subtracting \\(I_3\\) treats it as leaving."}, {"html": "\\(I_1 + I_3 = I_2\\)", "ok": true, "comment": "Right. \\(I_1\\) and \\(I_3\\) flow up into \\(A\\), and \\(I_2\\) flows down and out of it. In equals out."}, {"html": "\\(I_1 + I_2 + I_3 = 0\\)", "ok": false, "comment": "\\(I_2\\) flows away from \\(A\\), so it counts as outgoing. Adding it as if it flowed in is the mistake."}]}, {"phase": "Carry out", "type": "mc", "text": "Travel clockwise around the left loop: up the left branch, then down the middle. Which equation does the Circuit Rule give?", "answers": [{"html": "\\(2I_1 + 4I_2 = -20\\)", "ok": false, "comment": "Going up through the battery takes you from \\(-\\) to \\(+\\), a rise of 20 V, so the right side is \\(+20\\), not \\(-20\\)."}, {"html": "\\(2I_1 - 4I_2 = 20\\)", "ok": false, "comment": "Going down the middle you travel with \\(I_2\\), so that drop is \\(+4I_2\\), the same sign as \\(2I_1\\)."}, {"html": "\\(2I_1 + 4I_1 = 20\\)", "ok": false, "comment": "The middle resistor carries \\(I_2\\), not \\(I_1\\). The current \\(I_1\\) flows only up the left branch."}, {"html": "\\(2I_1 + 4I_2 = 20\\)", "ok": true, "comment": "Right. Going up the left branch you pass the battery from \\(-\\) to \\(+\\), a rise of 20 V, and you travel with \\(I_1\\) through the 2 \\(\\Omega\\) resistor. Going down the middle you also travel with \\(I_2\\), so that drop is positive."}]}, {"phase": "Carry out", "type": "mc", "text": "Travel clockwise around the right loop: down the right branch, then up the middle. Which equation does the Circuit Rule give?", "answers": [{"html": "\\(2I_3 - 4I_2 = 10\\)", "ok": false, "comment": "Both resistors on this loop are traveled against their currents, so their terms have the same sign. The middle term is \\(+4I_2\\)."}, {"html": "\\(2I_3 + 4I_2 = 10\\)", "ok": true, "comment": "Right. Going down the right branch you travel against \\(I_3\\) and pass the battery from \\(+\\) to \\(-\\). Going up the middle you travel against \\(I_2\\). Every term flips sign, leaving \\(2I_3 + 4I_2 = 10\\)."}, {"html": "\\(I_3 + 4I_2 = 10\\)", "ok": false, "comment": "A 2 \\(\\Omega\\) resistor drops \\(2I_3\\), not \\(I_3\\). Ohm’s law multiplies the current by the resistance."}, {"html": "\\(2I_3 + 4I_2 = 20\\)", "ok": false, "comment": "The 20 V battery is on the left. This loop has the 10 V battery."}]}, {"phase": "Carry out", "type": "mc", "text": "In your matrix, row 2 is the left loop. Which row operation makes its \\(I_1\\) entry equal to 0?", "answers": [{"html": "\\(R_2 \\to R_2 - R_1\\)", "ok": false, "comment": "The multiplier has to match the entry ch other around this loop, so \\(20 - 10 = 10\\), and \\(2(4) - 2(-1) = 10\\) as well.", "ok": true, "comment": "Right. The rises net to 10 around this loop, and the answer gives 10 too. This loop skips the 4 \\(\\Omega\\) resistor, so it checks the answer from a different angle."}, {"html": "No. The batteries add around this loop, so the right side should be 30, and the answer gives 10.", "ok": false, "comment": "The batteries don’t add here. Going around this loop, one battery is passed from \\(-\\) to \\(+\\) and the other from \\(+\\) to \\(-\\), so they oppose each other."}, {"html": "No. The right-hand resistor adds, giving \\(2I_1 + 2I_3 = 10\\), and \\(8 + (-2) = 6\\), not 10.", "ok": false, "comment": "The right-hand resistor’s current runs against this loop, so its drop is \\(-2I_3\\), not \\(+2I_3\\)."}, {"html": "No. Leave out the 10 V battery, and the loop reads \\(2I_1 - 2I_3 = 20\\), which the answer doesn’t match.", "ok": false, "comment": "Both batteries belong to the outer loop. Leaving one out changes the right side from 10 to 20."}]}, {"phase": "Look back", "type": "mc", "text": "The answer gives \\(I_3 = -1\\) A. What does that tell you about the right branch?", "answers": [{"html": "The right branch carries no current, because the two batteries cancel out.", "ok": false, "comment": "Batteries in different branches don’t cancel each other. The right branch still carries 1 A, flowing downward."}, {"html": "The answer must be wrong, since a current can’t be negative. Flip the sign to get \\(I_3 = 1\\).", "ok": false, "comment": "Currents can be negative here. Flipping the sign breaks the Junction Rule, because \\(4 + 1 \\neq 3\\)."}, {"html": "The 10 V battery is pushing 1 A upward through the right branch.", "ok": false, "comment": "The 10 V battery does push upward, but the current from the 20 V battery reaches junction \\(A\\) and overpowers it. The net flow is 1 A downward."}, {"html": "1 A flows downward through the right branch, against the arrow for \\(I_3\\).", "ok": true, "comment": "Right. A negative current means the flow runs opposite to the arrow we drew, as in Example 1.5.1. The 20 V battery pushes 1 A backward through the 10 V battery."}]}, {"phase": "Look back", "type": "mc", "text": "Suppose the 10 V battery were changed to 20 V, so the two batteries match. Which way would \\(I_3\\) flow?", "answers": [{"html": "Zero, because two equal batteries cancel out.", "ok": false, "comment": "Equal batteries in separate branches don’t cancel. Each one drives current around its own loop, and the middle resistor shares it."}, {"html": "Downward, with \\(I_3 = -1\\) as before, because changing the battery changes nothing.", "ok": false, "comment": "Changing the battery changes the right loop’s equation, so the old answer no longer holds."}, {"html": "Upward, with \\(I_3 = 2\\) A, the same as \\(I_1\\).", "ok": true, "comment": "Right. With matching batteries and matching resistors, the two outer branches are identical, so \\(I_1 = I_3\\). Then \\(I_2 = 2I_1\\), and \\(2I_1 + 4I_2 = 20\\) gives \\(I_1 = 2\\)."}, {"html": "Upward, with \\(I_3 = 4\\) A, since \\(I_1\\) was 4 A.", "ok": false, "comment": "The old values no longer hold. With matching batteries, both outer branches carry 2 A, and the middle carries 4 A."}]}, {"phase": "Look back", "type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate counted junction \\(B\\) as a fourth equation and concluded that four equations for three unknowns means there is no solution. What did they miss? Then name one habit from this problem you want to use on the next circuit.<\/p>"}]};</script>
