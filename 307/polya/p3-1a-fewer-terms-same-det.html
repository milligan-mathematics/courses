<script>window.POLYA = {"slug": "p3-1a-fewer-terms-same-det", "title": "3.1 Problem A: Fewer terms, same determinant", "statement": "Find \\(\\det A\\) for \\[A=\\begin{bmatrix}1&3&0&2\\\\1&2&1&3\\\\2&1&0&1\\\\4&1&2&8\\end{bmatrix}\\]", "questions": [{"type": "write", "text": "In your own words, what is this problem asking for?", "phase": "Understand", "model": "<p>It asks for \\(\\det A\\), a single number built from the entries of \\(A\\). Since \\(A\\) is \\(4\\times 4\\), the \\(2\\times 2\\) formula and the \\(3\\times 3\\) pattern don’t apply directly. I’ll need the cofactor expansion, which reduces the problem to smaller determinants. The zeros in \\(A\\) should help keep the work small.<\/p>", "checklist": ["say the answer is one number, \\(\\det A\\)", "say the \\(2\\times 2\\) and \\(3\\times 3\\) shortcuts don’t apply to a \\(4\\times 4\\)", "name a way to reduce it, such as a cofactor expansion", "notice the zeros, which can keep the work small"]}, {"type": "mc", "text": "How does a cofactor expansion handle a \\(4\\times 4\\) determinant?", "phase": "Understand", "answers": [{"html": "It reduces the problem to \\(3\\times 3\\) determinants.", "ok": true, "comment": "Each entry of the row or column you expand along is multiplied by a \\(3\\times 3\\) cofactor, and the results are added with signs."}, {"html": "It applies the six-product \\(3\\times 3\\) pattern to the whole matrix.", "ok": false, "comment": "That pattern is only for \\(3\\times 3\\) matrices. A \\(4\\times 4\\) has \\(4!=24\\) products, not six, so the cofactor expansion is needed."}, {"html": "It reduces the problem to \\(2\\times 2\\) determinants in one step.", "ok": false, "comment": "One expansion gives \\(3\\times 3\\) determinants, not \\(2\\times 2\\). Each of those can be reduced again, one step at a time."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> We want \\(\\det A\\) for a \\(4\\times 4\\) matrix, so the \\(2\\times 2\\) and \\(3\\times 3\\) shortcuts won’t do. Two facts from Section 3.1 are relevant: expanding along any row or column gives the same determinant (the Cofactor Expansion Theorem), and adding a multiple of one row to another leaves the determinant unchanged (the theorem on row operations).<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "phase": "Plan", "cta": "Got it. On to Phase 2: Plan."}, {"type": "write", "text": "Before you start, write your plan in 1–3 sentences: which method, and which step needs care?", "phase": "Plan", "model": "<p>Expand along column 3, because it has the most zeros. First, add a multiple of one row to another, which leaves the determinant unchanged, to clear the \\(2\\) in row 4 of column 3. Then column 3 has only one nonzero entry, and the step that needs care is its sign.<\/p>", "checklist": ["name the method: a row operation, then one expansion", "say which column has the most zeros, and why that helps", "say what the row operation does to the determinant", "name the step that needs care, such as a sign"]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: clear the \\(2\\) in row 4, column 3, with a row operation that leaves the determinant unchanged. Then expand along column 3.<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "mc", "text": "Which row operation makes the entry in row 4, column 3, equal to \\(0\\)?", "phase": "Carry out", "answers": [{"html": "\\(R_4 \\to R_4 - 2R_3\\)", "ok": false, "comment": "Row 3 has a \\(0\\) in column 3, so subtracting a multiple of it leaves that entry at \\(2\\). The row you subtract has to have a nonzero entry in column 3."}, {"html": "\\(R_4 \\to R_4 - R_2\\)", "ok": false, "comment": "The multiple is off. Subtracting row 2 once leaves \\(2 - 1 = 1\\) in that spot. To cancel the \\(2\\) in row 4, the multiple has to be \\(2\\), since \\(2 = 2\\cdot 1\\)."}, {"html": "\\(R_4 \\to R_4 - 2R_2\\)", "ok": true, "comment": "Row 2 has a \\(1\\) in column 3, so \\(2 - 2\\cdot 1 = 0\\). Subtracting a multiple of one row from another leaves the determinant unchanged."}, {"html": "\\(R_4 \\to R_4 + 2R_2\\)", "ok": false, "comment": "The sign is off. Adding \\(2\\) times row 2 gives \\(2 + 2\\cdot 1 = 4\\), not \\(0\\). To cancel a positive entry, you subtract."}]}, {"type": "matrix", "text": "Let \\(B\\) be \\(A\\) after your row operation. Expanding \\(B\\) along column 3 uses the \\(3\\times 3\\) minor \\(M\\), which is what is left when you delete row 2 and column 3 of \\(B\\). Enter \\(M\\).", "phase": "Carry out", "comment": "Right. Row 2 and column 3 are crossed out, and the rest keeps its order. The first row of \\(M\\) is the first row of \\(B\\) without its third entry.", "label": "M =", "hints": ["Row 4 of \\(B\\) is row 4 of \\(A\\) minus 2 times row 2. Work that out first.", "Then cross out row 2 and column 3 of \\(B\\). The entries left, in their original order, fill \\(M\\)."], "shape": [3, 3], "values": [1.0, 3.0, 2.0, 2.0, 1.0, 1.0, 2.0, -3.0, 2.0], "answer_tex": "\\begin{bmatrix}1&3&2\\\\2&1&1\\\\2&-3&2\\end{bmatrix}", "typed_answer": ["1", "3", "2", "2", "1", "1", "2", "-3", "2"], "wrong": [{"values": [1.0, 3.0, 2.0, 2.0, 1.0, 1.0, 4.0, 1.0, 8.0], "comment": "That is the minor of \\(A\\), not \\(B\\). The row operation changed row 4, so use the new row 4."}, {"values": [1.0, 3.0, 2.0, 1.0, 2.0, 3.0, 2.0, 1.0, 1.0], "comment": "That deletes row 4, the row you changed. The minor belongs to the \\(1\\) in row 2, so delete row 2."}, {"values": [1.0, 0.0, 2.0, 2.0, 0.0, 1.0, 2.0, 0.0, 2.0], "comment": "That deletes column 2. The expansion is along column 3, so column 3 is the one to delete."}]}, {"type": "mc", "text": "Expanding \\(B\\) along column 3, which equation is correct?", "phase": "Carry out", "answers": [{"html": "\\(\\det A = -2\\det M\\)", "ok": false, "comment": "The row operation turned the \\(2\\) in row 4 into a \\(0\\), so that term is gone. The only nonzero entry left in column 3 is the \\(1\\) in row 2."}, {"html": "\\(\\det A = \\det M\\)", "ok": false, "comment": "You dropped the sign. Position \\((2,3)\\) has sign \\((-1)^{2+3}=-1\\), so the minus stays."}, {"html": "\\(\\det A = -\\det M\\)", "ok": true, "comment": "The only nonzero entry in column 3 is the \\(1\\) in row 2, and its sign is \\((-1)^{2+3}=-1\\). The row operation left the determinant unchanged, so \\(\\det A=\\det B=-\\det M\\)."}]}, {"type": "num", "text": "What is \\(\\det A\\)?", "phase": "Carry out", "comment": "Right. The minor \\(M\\) has determinant \\(-17\\), and the sign \\((-1)^{2+3}=-1\\) turns that into \\(17\\).", "hints": ["You found that \\(\\det A=-\\det M\\). Now find \\(\\det M\\), a \\(3\\times 3\\) determinant of the matrix you entered.", "Expand \\(\\det M\\) along its first row: three \\(2\\times 2\\) determinants, with signs \\(+,-,+\\)."], "shape": [1, 1], "values": [17.0], "answer_tex": "17", "typed_answer": ["17"], "wrong": [{"values": [-17.0], "comment": "That leaves out the sign of the cofactor. Position \\((2,3)\\) has sign \\((-1)^{2+3}=-1\\), and the minus has to stay."}, {"values": [34.0], "comment": "That treats the \\(2\\) from row 4 as if it still counted. The row operation made that entry \\(0\\), so only the \\(1\\) in row 2 is left."}, {"values": [8.5], "comment": "Adding a multiple of one row to another leaves the determinant unchanged, so there is nothing to divide by \\(2\\)."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The answer is \\(\\det A = 17\\).<\/p><p>Last phase: <strong>look back<\/strong>. Check the number another way, read a classmate’s check, and then change the problem.<\/p>", "phase": "Look back", "cta": "Got it. On to Phase 4: Look back."}, {"type": "mc", "text": "Which check would confirm \\(\\det A = 17\\) without repeating the same steps?", "phase": "Look back", "answers": [{"html": "Redo the expansion of \\(B\\) along column 3, checking each arithmetic line.", "ok": false, "comment": "That repeats the same steps. A sign or arithmetic slip you made the first time would show up again."}, {"html": "Expand the original \\(A\\) along column 3, using its entries as they were, and see whether you get \\(17\\) again.", "ok": true, "comment": "That uses different \\(3\\times 3\\) determinants, so it is a real second computation. Expanding along any row or column gives \\(\\det A\\) (the Cofactor Expansion Theorem), so a match is good evidence."}, {"html": "Check that \\(17\\) is a whole number.", "ok": false, "comment": "Many wrong answers are whole numbers too, so this can’t catch a mistake."}, {"html": "Check that the signs alternate along row 1.", "ok": false, "comment": "The sign pattern is the same for every matrix, so it says nothing about the number you got."}]}, {"type": "error", "text": "Here is a classmate’s check: an expansion of the original \\(A\\) along column 3. Read it line by line.", "phase": "Look back", "lines": [{"html": "Expand along column 3 of \\(A\\). Its entries are \\(0,\\ 1,\\ 0,\\ 2\\), so only rows 2 and 4 contribute.", "wrong": false, "comment": "The zeros drop out, so only the \\(1\\) and the \\(2\\) matter."}, {"html": "\\(\\det A = 1\\cdot C_{23} + 2\\cdot C_{43}\\), where \\(C_{ij}=(-1)^{i+j}\\det M_{ij}\\) and \\(M_{ij}\\) is \\(A\\) with row \\(i\\) and column \\(j\\) deleted.", "wrong": false, "comment": "That is the cofactor expansion along column 3, with each cofactor written out."}, {"html": "\\(C_{23}=(+1)\\det M_{23}=-33\\), using the sign \\(+\\) from the third spot of the pattern \\(+,-,+,-\\).", "wrong": true, "comment": "Right. The checkerboard sign is wrong: row 2 starts with \\(-\\), so position \\((2,3)\\) has sign \\((-1)^{2+3}=-1\\), not \\(+\\). With that fixed, the sum is \\(33-16=17\\), the answer you got."}, {"html": "\\(C_{43}=(-1)^{4+3}\\det M_{43}=-8\\), since \\(\\det M_{43}=8\\) and \\(4+3\\) is odd.", "wrong": false, "comment": "The sign for position \\((4,3)\\) is \\(-1\\), and its minor is \\(8\\), so \\(C_{43}=-8\\)."}, {"html": "\\(\\det A = 1\\cdot(-33) + 2\\cdot(-8) = -49\\).", "wrong": false, "comment": "The arithmetic is right, given the line above. The mistake is earlier, so keep looking for the first wrong line."}]}, {"type": "example", "text": "Give a \\(3\\times 3\\) matrix with <strong>no zero entries<\/strong> whose determinant is \\(0\\). Fill in all nine entries.", "phase": "Look back", "shape": [3, 3], "conditions": [{"js": "M.every(function (row) { return row.every(function (e) { return !e.isZero(); }); })", "comment": "Every entry has to be nonzero. Replace any zero, and check again."}, {"js": "det(M).isZero()", "comment": "All nine entries are nonzero, but the determinant isn’t \\(0\\) yet. Try making one row a multiple of another, or the sum of the other two."}], "comment": "Right. Every entry is nonzero, and the determinant is \\(0\\) because the rows depend on each other: some row is a combination of the others.", "model": "For example, \\(\\begin{bmatrix}1&2&3\\\\4&5&6\\\\5&7&9\\end{bmatrix}\\): row 3 is row 1 plus row 2, so the determinant is \\(0\\).", "label": "M =", "hints": ["A determinant of \\(0\\) means the rows depend on each other: one row can be built from the others.", "Pick two rows with no zeros. Make the second row a multiple of the first, or make the third row their sum. Then check every entry."], "syntax": "Any example that works is right. Fill the grid row by row, and type a minus sign for negative entries."}, {"type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate says, \"I used \\(R_4 \\to R_4 - 2R_2\\), which changes the determinant, so I have to divide my answer by \\(2\\) at the end.\" What would you tell them?<\/p>", "phase": "Look back"}], "goal": "Find a determinant by one row operation and one cofactor expansion, along the line with the most zeros.", "connects": "Builds on the \\(2\\times 2\\) and \\(3\\times 3\\) determinants and on the row operations from Chapter 1. Leads to 3.3, where \\(\\det(A-\\lambda I)\\) gives the eigenvalues.", "discuss": "Adding a multiple of one row to another leaves the determinant alone, but scaling a row by 2 doubles it. Why do the two differ? Picture a \\(2\\times 2\\) matrix, with its rows as the sides of a parallelogram: what happens to the area in each case?", "cold": [8], "twins": [{"statement": "Find \\(\\det A\\) for \\[A=\\begin{bmatrix}-4&-1&2&1\\\\0&0&-1&1\\\\-4&-1&-3&5\\\\5&2&-2&1\\end{bmatrix}\\]", "steps": [{"type": "num", "text": "What is \\(\\det A\\)?", "comment": "Right. Expanding along the line with the zeros gives \\(\\det A = -3\\).", "shape": [1, 1], "values": [-3.0], "answer_tex": "-3", "typed_answer": ["-3"], "wrong": [{"values": [-27.0], "comment": "You dropped the checkerboard signs along the line with the zeros. Each term needs its own sign, \\((-1)^{i+j}\\)."}]}]}, {"statement": "Find \\(\\det A\\) for \\[A=\\begin{bmatrix}3&1&3&2\\\\0&0&-2&-1\\\\3&2&-1&3\\\\3&2&2&-3\\end{bmatrix}\\]", "steps": [{"type": "num", "text": "What is \\(\\det A\\)?", "comment": "Right. Expanding along the line with the zeros gives \\(\\det A = -45\\).", "shape": [1, 1], "values": [-45.0], "answer_tex": "-45", "typed_answer": ["-45"], "wrong": [{"values": [27.0], "comment": "You dropped the checkerboard signs along the line with the zeros. Each term needs its own sign, \\((-1)^{i+j}\\)."}]}]}, {"statement": "Find \\(\\det A\\) for \\[A=\\begin{bmatrix}3&3&5&-4\\\\2&-3&-4&-1\\\\0&3&0&0\\\\3&-3&-1&-3\\end{bmatrix}\\]", "steps": [{"type": "num", "text": "What is \\(\\det A\\)?", "comment": "Right. Expanding along the line with the zeros gives \\(\\det A = -24\\).", "shape": [1, 1], "values": [-24.0], "answer_tex": "-24", "typed_answer": ["-24"], "wrong": [{"values": [24.0], "comment": "You dropped the checkerboard signs along the line with the zeros. Each term needs its own sign, \\((-1)^{i+j}\\)."}]}]}, {"statement": "Find \\(\\det A\\) for \\[A=\\begin{bmatrix}3&4&0&5\\\\-1&5&-4&-1\\\\2&-4&5&4\\\\5&-3&0&-2\\end{bmatrix}\\]", "steps": [{"type": "num", "text": "What is \\(\\det A\\)?", "comment": "Right. Expanding along the line with the zeros gives \\(\\det A = 19\\).", "shape": [1, 1], "values": [19.0], "answer_tex": "19", "typed_answer": ["19"], "wrong": [{"values": [-1789.0], "comment": "You dropped the checkerboard signs along the line with the zeros. Each term needs its own sign, \\((-1)^{i+j}\\)."}]}]}, {"statement": "Find \\(\\det A\\) for \\[A=\\begin{bmatrix}0&0&0&2\\\\1&-1&1&2\\\\-4&5&1&1\\\\2&1&-4&-3\\end{bmatrix}\\]", "steps": [{"type": "num", "text": "What is \\(\\det A\\)?", "comment": "Right. Expanding along the line with the zeros gives \\(\\det A = 42\\).", "shape": [1, 1], "values": [42.0], "answer_tex": "42", "typed_answer": ["42"], "wrong": [{"values": [-42.0], "comment": "You dropped the checkerboard signs along the line with the zeros. Each term needs its own sign, \\((-1)^{i+j}\\)."}]}]}, {"statement": "Find \\(\\det A\\) for \\[A=\\begin{bmatrix}2&5&1&4\\\\2&0&-1&-1\\\\-1&0&-2&-2\\\\1&0&5&3\\end{bmatrix}\\]", "steps": [{"type": "num", "text": "What is \\(\\det A\\)?", "comment": "Right. Expanding along the line with the zeros gives \\(\\det A = -50\\).", "shape": [1, 1], "values": [-50.0], "answer_tex": "-50", "typed_answer": ["-50"], "wrong": [{"values": [50.0], "comment": "You dropped the checkerboard signs along the line with the zeros. Each term needs its own sign, \\((-1)^{i+j}\\)."}]}]}, {"statement": "Find \\(\\det A\\) for \\[A=\\begin{bmatrix}0&0&0&1\\\\2&5&5&-3\\\\3&5&3&4\\\\5&5&3&-4\\end{bmatrix}\\]", "steps": [{"type": "num", "text": "What is \\(\\det A\\)?", "comment": "Right. Expanding along the line with the zeros gives \\(\\det A = 20\\).", "shape": [1, 1], "values": [20.0], "answer_tex": "20", "typed_answer": ["20"], "wrong": [{"values": [-20.0], "comment": "You dropped the checkerboard signs along the line with the zeros. Each term needs its own sign, \\((-1)^{i+j}
