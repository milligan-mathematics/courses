<script>window.POLYA = {"slug": "p3-5a-two-tanks", "title": "3.5 Problem A: Where does the salt go?", "statement": "Two tanks of brine are connected by pipes, and brine also drains out of the system. Let \\(f_1(x)\\) and \\(f_2(x)\\) be the amounts of salt (in kg) in tanks 1 and 2 at time \\(x\\) (in minutes), and let \\(\\mathbf f(x) = \\begin{bmatrix}f_1(x)\\\\f_2(x)\\end{bmatrix}\\). They satisfy the system \\[f_1^{\\prime} = -3f_1 + f_2, \\qquad f_2^{\\prime} = 2f_1 - 2f_2,\\] with \\(f_1(0) = 5\\) and \\(f_2(0) = 1\\). Call the coefficient matrix \\(A\\), so the system reads \\(\\mathbf f^{\\prime} = A\\mathbf f\\). Solve the system with these starting amounts.", "questions": [{"type": "write", "text": "In your own words, what is this problem asking for?", "phase": "Understand", "model": "<p>It asks for the amounts \\(f_1(x)\\) and \\(f_2(x)\\) at every time \\(x\\), not just at one time. Salt moves between the tanks and drains out, so each amount changes at a rate that depends on both amounts. I need two functions that satisfy both equations and start at 5 kg and 1 kg. One equation by itself doesn’t settle it, because each one involves the other function.<\/p>", "checklist": ["say that the answer is two functions of time, not one number", "say that each rate depends on both amounts", "mention the starting amounts, 5 kg and 1 kg"]}, {"type": "mc", "text": "For the single equation \\(f^{\\prime} = -5f\\) with \\(f(0) = 4\\), what is \\(f(x)\\)?", "phase": "Understand", "answers": [{"html": "\\(f(x) = 4(-5)^x\\)", "ok": false, "comment": "That uses \\(\\lambda^x\\) in place of \\(e^{\\lambda x}\\). The function \\(e^{-5x}\\) has derivative \\(-5\\) times itself, and \\((-5)^x\\) does not."}, {"html": "\\(f(x) = e^{-5x}\\)", "ok": false, "comment": "That solves \\(f^{\\prime} = -5f\\), but at \\(x = 0\\) it equals 1, not 4. The starting value sets the constant."}, {"html": "\\(f(x) = 4e^{-5x}\\)", "ok": true, "comment": "Right. Differentiating gives \\(-20e^{-5x} = -5\\cdot 4e^{-5x}\\), so the derivative is \\(-5\\) times the function, and at \\(x = 0\\) the function equals 4."}, {"html": "\\(f(x) = 4 - 5x\\)", "ok": false, "comment": "That has \\(f^{\\prime} = -5\\), but the equation says \\(f^{\\prime} = -5f\\). The rate depends on \\(f\\) itself, so the answer is an exponential, not a line."}]}, {"type": "explore", "text": "Before any computing, look at the picture. Each curve shows how the pair (tank 1, tank 2) moves over time. Drag the orange dot to change the starting amounts. Find a start whose path runs straight into the origin. What do those starts have in common?", "phase": "Understand", "widget": {"kind": "phase", "A": [[-3, 1], [2, -2]], "x0": [5, 1], "goal": "straight", "window": 6, "quiet": true, "xlabel": "tank 1 (kg)", "ylabel": "tank 2 (kg)", "hint": "Drag the orange dot to choose the starting amounts: tank 1 across, tank 2 up. Look for a start whose path into the origin is a straight line."}, "found": "Right. A path that runs straight into the origin is a straight-line solution. Along it, the two amounts keep the same ratio at every time. Such a solution has the form \\(e^{\\lambda x}\\) times one fixed vector. The next steps find that \\(\\lambda\\) and that vector."}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> We want \\(f_1(x)\\) and \\(f_2(x)\\) that satisfy the system and start at \\(f_1(0) = 5\\) and \\(f_2(0) = 1\\). For a single equation \\(f^{\\prime} = af\\), the solutions are \\(ce^{ax}\\), and the starting value fixes \\(c\\). The straight-line paths in the picture are solutions too.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "phase": "Plan", "cta": "Got it. On to Phase 2: Plan."}, {"type": "write", "text": "Before you start, write your plan in 1–3 sentences: which method, and which step needs care?", "phase": "Plan", "model": "<p>I’ll find the eigenvalues and eigenvectors of the matrix \\(A\\), since each eigenvector times its own exponential is a solution. Then I’ll write \\(\\mathbf f(x)\\) as a combination of those two solutions and use \\(\\mathbf f(0)\\) to find the two constants. The step that needs care is pairing each eigenvector with its own exponential.<\/p>", "checklist": ["find the eigenvalues and eigenvectors of \\(A\\)", "write the solution as eigenvectors times \\(e^{\\lambda x}\\)", "use \\(\\mathbf f(0)\\) to find the two constants", "pair each eigenvector with its own exponential"]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The system is \\(\\mathbf f^{\\prime} = A\\mathbf f\\) with \\(A = \\begin{bmatrix}-3&1\\\\2&-2\\end{bmatrix}\\). Our plan: find the eigenvalues and eigenvectors of \\(A\\), build the general solution from them, and then find the constants from \\(\\mathbf f(0)\\).<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "matrix", "text": "Find the eigenvalues of \\(A\\). Enter them in one row, smaller first.", "phase": "Carry out", "comment": "Right. Expanding the determinant gives a quadratic in \\(\\lambda\\) with roots \\(-4\\) and \\(-1\\), so \\(A\\) has these two eigenvalues.", "label": "\\lambda_1,\\ \\lambda_2 =", "hints": ["Subtract \\(\\lambda\\) from each diagonal entry of \\(A\\), then take the determinant of the new matrix and set it to zero.", "The determinant is a quadratic in \\(\\lambda\\). Factor it, and set each factor to zero."], "shape": [1, 2], "values": [-4.0, -1.0], "answer_tex": "\\begin{bmatrix}-4&-1\\end{bmatrix}", "typed_answer": ["-4", "-1"], "wrong": [{"values": [-1.0, -4.0], "comment": "Right numbers, wrong order: the question asks for the smaller one first, so \\(-4\\) goes first."}, {"values": [1.0, 4.0], "comment": "That is a sign slip. The diagonal entries of \\(A-\\lambda I\\) are \\(-3-\\lambda\\) and \\(-2-\\lambda\\), not \\(3-\\lambda\\) and \\(2-\\lambda\\)."}, {"values": [-3.0, -2.0], "comment": "Those are the diagonal entries of \\(A\\). They are eigenvalues only when \\(A\\) is diagonal, and the off-diagonal entries \\(1\\) and \\(2\\) change the answer."}]}, {"type": "matrix", "text": "Enter the matrix \\(P\\) whose columns are eigenvectors of \\(A\\), in the same order as the eigenvalues. Scale each column so its first entry is 1.", "phase": "Carry out", "comment": "Right. Check: \\(A\\begin{bmatrix}1\\\\-1\\end{bmatrix}=\\begin{bmatrix}-4\\\\4\\end{bmatrix}=-4\\begin{bmatrix}1\\\\-1\\end{bmatrix}\\), and \\(A\\begin{bmatrix}1\\\\2\\end{bmatrix}=\\begin{bmatrix}-1\\\\-2\\end{bmatrix}=-1\\begin{bmatrix}1\\\\2\\end{bmatrix}\\).", "label": "P =", "hints": ["For each eigenvalue \\(\\lambda\\), solve \\((A-\\lambda I)\\mathbf v=\\mathbf 0\\). The first row of \\(A-\\lambda I\\) gives one equation in the two entries of \\(\\mathbf v\\).", "Scale each vector so its first entry is 1. Then check it: \\(A\\mathbf v\\) should equal \\(\\lambda\\mathbf v\\)."], "shape": [2, 2], "values": [1.0, 1.0, -1.0, 2.0], "answer_tex": "\\begin{bmatrix}1&1\\\\-1&2\\end{bmatrix}", "typed_answer": ["1", "1", "-1", "2"], "wrong": [{"values": [1.0, 1.0, 2.0, -1.0], "comment": "The pairs are swapped. The vector \\(\\begin{bmatrix}1\\\\2\\end{bmatrix}\\) goes with \\(\\lambda=-1\\), so it belongs in the second column."}, {"values": [2.0, 1.0, -1.0, 1.0], "comment": "Those are eigenvectors of the transpose of \\(A\\), so the rows and columns got swapped. Check: \\(A\\begin{bmatrix}2\\\\-1\\end{bmatrix}=\\begin{bmatrix}-7\\\\6\\end{bmatrix}\\), which is not a multiple of \\(\\begin{bmatrix}2\\\\-1\\end{bmatrix}\\)."}]}, {"type": "expr", "text": "Enter a formula for \\(f_1(x)\\) that solves the system with \\(f_1(0) = 5\\) and \\(f_2(0) = 1\\).", "phase": "Carry out", "comment": "Right. At \\(x = 0\\) it gives 5, and each piece is \\(e^{\\lambda x}\\) times an eigenvector. The constants are 2 for \\(e^{-x}\\) and 3 for \\(e^{-4x}\\), both fitted to \\(\\mathbf f(0)\\).", "label": "f_1(x) =", "hints": ["The general solution is \\(c_1e^{\\lambda_1 x}\\mathbf v_1 + c_2e^{\\lambda_2 x}\\mathbf v_2\\), using the eigenvalues and eigenvectors you found above. Each piece is a solution on its own.", "Set \\(x = 0\\). The constants solve \\(c_1\\mathbf v_1 + c_2\\mathbf v_2 = \\mathbf f(0)\\): write it as two equations, one for each tank.", "Only the first entries matter for \\(f_1\\). Each eigenvector’s first entry multiplies its own exponential."], "syntax": "Type exponentials as e^(...) with the exponent in parentheses, for example 2*e^(-6*x) + e^(-7*x).", "vars": ["x"], "samples": [{"x": 0}, {"x": 0.25}, {"x": 0.5}, {"x": 1}, {"x": 1.5}, {"x": 2}, {"x": 3}], "values": [5.0, 2.6612398896571365, 1.6190671691351048, 0.7907057990090872, 0.4536965768268587, 0.2716769543569329, 0.09959256937278788], "answer_tex": "2 e^{- x} + 3 e^{- 4 x}", "typed_answer": "2*e^(-x) + 3*e^(-4*x)", "wrong": [{"values": [6.0, 4.261883356528466, 3.1679885817997797, 1.857712844745946, 1.1181295529188156, 0.677011878810966, 0.24894148605167304], "comment": "The starting amounts were used as the constants. Check \\(x = 0\\): this gives 6, not 5.", "typed": "5*e^(-x) + e^(-4*x)"}, {"values": [2.0, 1.146680224242847, 0.7418659429492461, 0.3861950800601765, 0.2256089123250962, 0.1356707458645152, 0.04979321258021727], "comment": "The constants were left out, so this is the general solution with \\(c_1 = c_2 = 1\\). It solves the system, but at \\(x = 0\\) it gives 2, not 5.", "typed": "e^(-x) + e^(-4*x)"}, {"values": [5.0, 10.72289631875262, 25.464610838192208, 169.23101375635082, 1219.2497586188815, 8957.652073323046, 488304.54533085815], "comment": "The eigenvalue signs flipped, so the exponents are positive. Positive exponents would make the amounts grow, but salt drains out.", "typed": "2*e^(x) + 3*e^(4*x)"}, {"values": [5.0, 3.072161231557099, 2.0902625456111257, 1.1402696012917954, 0.6743479847986222, 0.4066767749656431, 0.14937349352829848], "comment": "The pairing is swapped: each eigenvector has to stay with its own exponential. This formula starts at the right amount, but it does not solve the system.", "typed": "3*e^(-x) + 2*e^(-4*x)"}, {"values": [5.0, 2.3618327637050736, 1.115650800742149, 0.2489353418393197, 0.05554498269121153, 0.012393760883331792, 0.0006170490204333978], "comment": "This solves \\(f_1^{\\prime} = -3f_1\\) as if tank 2 didn’t feed tank 1. The \\(f_2\\) term is missing, so this formula fails the first equation.", "typed": "5*e^(-3*x)"}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The first amount is \\(f_1(x) = 2e^{-x} + 3e^{-4x}\\).<\/p><p>Next phase: <strong>look back<\/strong>. Check the answer, see what it does over time, and try a different start.<\/p>", "phase": "Look back", "cta": "Got it. On to Phase 4: Look back."}, {"type": "mc", "text": "Which checks really confirm that \\(\\mathbf f(x)\\) is the solution?", "phase": "Look back", "answers": [{"html": "Check that \\(\\mathbf f(0) = \\begin{bmatrix}5\\\\1\\end{bmatrix}\\), and check that one equation, such as \\(f_1^{\\prime} = -3f_1 + f_2\\), holds for every \\(x\\).", "ok": true, "comment": "Right. The equation test catches a wrong pairing, and the starting-value test catches wrong constants. A solution has to pass both."}, {"html": "Check that \\(\\mathbf f(0) = \\begin{bmatrix}5\\\\1\\end{bmatrix}\\), and nothing more.", "ok": false, "comment": "The starting values are necessary, but not enough. A solution with the pairing swapped also starts at \\((5,1)\\), so check the equation as well."}, {"html": "Check that \\(f_1^{\\prime} = -3f_1 + f_2\\) holds for every \\(x\\), and stop there.", "ok": false, "comment": "The equation test is a real check, but it can’t see the starting values. A solution with the wrong constants still passes it, so check \\(\\mathbf f(0)\\) too."}, {"html": "Check that both exponents are negative.", "ok": false, "comment": "Negative exponents match the decay the eigenvalues predict, but every function of this form has them. This test can’t tell a solution from a non-solution."}]}, {"type": "mc", "text": "As \\(x\\) grows, what happens to \\(\\mathbf f(x)\\)?", "phase": "Look back", "answers": [{"html": "The amounts grow without limit, since the solution is built from exponentials.", "ok": false, "comment": "A negative exponent means decay, not growth. Both \\(e^{-x}\\) and \\(e^{-4x}\\) get smaller as \\(x\\) increases."}, {"html": "The amounts settle at their starting values, 5 kg and 1 kg.", "ok": false, "comment": "The amounts are still changing at \\(x = 0\\): \\(f_1^{\\prime}(0) = -14\\). They move away from the starting values and then drain."}, {"html": "Both amounts go to 0, and the \\(e^{-4x}\\) term is what remains. For large \\(x\\), \\(f_2\\) is about \\(-f_1\\).", "ok": false, "comment": "A bigger number in the exponent means faster decay. The \\(e^{-4x}\\) term disappears first, so it can’t be what remains for large \\(x\\)."}, {"html": "Both amounts go to 0, and the \\(e^{-x}\\) term is what remains. For large \\(x\\), \\(f_2\\) is about twice \\(f_1\\).", "ok": true, "comment": "Right. The \\(e^{-4x}\\) term fades much faster, so the slower \\(e^{-x}\\) term is what remains. Its direction is \\((1,2)\\), so the ratio of salt in tank 2 to tank 1 settles at 2 while both amounts drain to zero."}]}, {"type": "example", "text": "Now change the starting amounts. Give a nonzero \\(\\mathbf f(0)\\) for which both amounts decay along a straight line, for the matrix \\(A\\) of this system. Tank 1 goes on top.", "phase": "Look back", "shape": [2, 1], "conditions": [{"js": "!isZero(M)", "comment": "Use a nonzero starting amount. If both amounts are 0, nothing moves, so there is no path to look at."}, {"js": "rank([v, mul([[-3, 1], [2, -2]], M).map(function (r) { return r[0]; })]) === 1", "comment": "That starting amount doesn’t keep its direction. The matrix \\(A\\) turns it, so the path curves instead of running straight into the origin."}], "comment": "Right. Starting on an eigenvector keeps the path on one line: \\(\\mathbf f(x) = e^{\\lambda x}\\mathbf f(0)\\), and both eigenvalues are negative, so both amounts shrink to 0. Negative amounts are fine as math, though a real tank can’t hold negative salt. The positive starts are the multiples of \\(\\begin{bmatrix}1\\\\2\\end{bmatrix}\\).", "model": "\\(\\mathbf f(0) = \\begin{bmatrix}1\\\\2\\end{bmatrix}\\): then \\(A\\mathbf f(0) = \\begin{bmatrix}-1\\\\-2\\end{bmatrix} = -\\mathbf f(0)\\), so \\(\\mathbf f(x) = e^{-x}\\mathbf f(0)\\) and both amounts shrink along one line.", "label": "\\mathbf f(0) =", "hints": ["A straight path keeps its direction, so \\(A\\mathbf f(0)\\) has to be a multiple of \\(\\mathbf f(0)\\). Which of your Carry out results has that property?", "Any nonzero multiple of an eigenvector from Carry out will do. Pick one, scale it, and check it the same way."], "syntax": "Enter the two starting amounts, tank 1 on top. Fractions like 1/2 and negative numbers are fine."}, {"type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). In your own words, why do eigenvectors let you solve a system whose two equations depend on each other? Connect your answer to the straight path you found in the picture.<\/p>", "phase": "Look back"}], "goal": "Find how the salt in two connected tanks changes over time, using eigenvalues and eigenvectors.", "connects": "Builds on 3.3 (eigenvectors and diagonalization) and on 3.4, where the same idea works with powers in place of exponentials. Later, the signs of the eigenvalues tell you whether the amounts grow or decay.", "discuss": "Why can’t the salt amounts settle at a nonzero value? Point to the matrix \\(A\\): what would a zero eigenvalue mean for the tanks, and does \\(A\\) have one?", "cold": [8], "twins": [{"statement": "Two tanks of brine are connected by pipes, and brine also drains out of the system. Let \\(f_1(x)\\) and \\(f_2(x)\\) be the amounts of salt (in kg) in tanks 1 and 2 at time \\(x\\) (in minutes). They satisfy the system \\[f_1^{\\prime} = -f_1 - f_2, \\qquad f_2^{\\prime} = 2f_1 - 4f_2,\\] with \\(f_1(0) = 1\\) and \\(f_2(0) = 3\\), and coefficient matrix \\(A = \\begin{bmatrix}-1&-1\\\\2&-4\\end{bmatrix}\\). Find \\(f_1(x)\\).", "steps": [{"type": "expr", "text": "Enter a formula for \\(f_1(x)\\) that solves this system.", "comment": "Right. The eigenvalues are \\(-2\\) and \\(-3\\), with eigenvectors \\(\\begin{bmatrix}1\\\\1\\end{bmatrix}\\) and \\(\\begin{bmatrix}1\\\\2\\end{bmatrix}\\). The constants \\(c_1 = -1\\) and \\(c_2 = 2\\) come from \\(\\mathbf f(0)\\).", "label": "f_1(x) =", "hints": ["Find the eigenvalues from \\(\\det(A-\\lambda I)=0\\), then an eigenvector for each one.", "The general solution is \\(c_1e^{\\lambda_1 x}\\mathbf v_1 + c_2e^{\\lambda_2 x}\\mathbf v_2\\). Use \\(\\mathbf f(0)\\) to find \\(c_1\\) and \\(c_2\\).", "Only the first entries matter for \\(f_1\\): each term is its constant, times the first entry of its eigenvector, times its own exponential."], "syntax": "Type exponentials as e^(...) with the exponent in parentheses, for example 2*e^(-6*x) + e^(-7*x).", "vars": ["x"], "samples": [{"x": 0}, {"x": 0.25}, {"x": 0.5}, {"x": 1}, {"x": 1.5}, {"x": 2}, {"x": 3}], "values": [1.0, 0.338202445769396, 0.07838087912541733, -0.035761146500884806, -0.02756907529137933, -0.013358134535401463, -0.0022319325684929995], "answer_tex": "- e^{- 2 x} + 2 e^{- 3 x}", "typed_answer": "-e^(-2*x) + 2*e^(-3*x)", "wrong": [{"values": [2.0, 1.0788972124536482, 0.5910096013198721, 0.18512235160447663, 0.06089606490610625, 0.020794391065400538, 0.0026021619807530378], "comment": "That is the general solution with \\(c_1 = c_2 = 1\\), so the constants were left out. It solves the system, but at \\(x = 0\\) it gives 2, not 1.", "typed": "e^(-2*x) + e^(-3*x)"}, {"values": [4.0, 2.0236303179356776, 1.0372699216167318, 0.2846964883402045, 0.08311405798259086, 0.025751895418733257, 0.0028489815889263972], "comment": "The starting amounts aren’t the constants.
