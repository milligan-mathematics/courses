<script>window.POLYA = {"slug": "p1-3a-where-solutions-hide", "title": "1.3 Problem A: Where the nontrivial solutions hide", "statement": "Consider the homogeneous system<br>\\[\\begin{aligned} x_1 + 2x_2 + x_3 - x_4 &= 0\\\\ 2x_1 + 4x_2 + 3x_3 + x_4 &= 0\\end{aligned}\\]Describe all of its solutions. Does it have nontrivial solutions, and if so, how many?", "questions": [{"phase": "Understand", "type": "mc", "text": "Before computing anything: what is this problem asking you to find?", "answers": [{"html": "The values of the coefficients that make both equations true.", "ok": false, "comment": "The coefficients are given. The unknowns are the variables \\(x_1, \\dots, x_4\\)."}, {"html": "All \\((x_1, x_2, x_3, x_4)\\) that satisfy both equations, and whether any of them is nontrivial.", "ok": true, "comment": "Right. The unknown is a whole set of four-number lists, and we want to know its shape and whether it contains anything besides \\((0,0,0,0)\\)."}, {"html": "Whether the system is consistent.", "ok": false, "comment": "Consistency isn’t in doubt here. A system with zeros on the right always has at least one solution, as the next question shows."}, {"html": "The single value of \\(x_1\\) that makes the system true.", "ok": false, "comment": "That expects one answer. A system with four unknowns and two equations usually has many solutions, so the answer is a set, not a single number."}]}, {"phase": "Understand", "type": "mc", "text": "Try the simplest possible list: \\((0,0,0,0)\\). Is it a solution, and what does that mean for the question?", "answers": [{"html": "Yes, but it only counts when the system has more equations than unknowns.", "ok": false, "comment": "The trivial solution is a solution for every homogeneous system, with any number of equations. The count of equations doesn’t decide whether it works."}, {"html": "Yes, but it is not a real solution, so the system has no solutions.", "ok": false, "comment": "The trivial solution is a real solution. Calling it \"not real\" doesn’t remove it from the set."}, {"html": "No. A homogeneous system needs nonzero values to satisfy it.", "ok": false, "comment": "Check it directly: every term in each equation is 0, so each equation says \\(0 = 0\\)."}, {"html": "Yes, always. So the real question is about <em>nontrivial<\/em> solutions, the ones with some entry not zero.", "ok": true, "comment": "Each equation becomes \\(0 = 0\\) when every variable is 0. That is the trivial solution, and it is always there."}]}, {"phase": "Understand", "type": "mc", "text": "Before any row reduction, what can you say about nontrivial solutions? Count the unknowns and equations.", "answers": [{"html": "We can’t tell until we row-reduce, because homogeneous systems are unpredictable.", "ok": false, "comment": "Row reduction is needed to <em>describe<\/em> the solutions, but the counting theorem already tells us they exist."}, {"html": "Exactly one nontrivial solution, since there are two equations.", "ok": false, "comment": "Count the free choices: 4 unknowns minus 2 equations leaves 2 free variables, which gives infinitely many solutions, not one."}, {"html": "There must be nontrivial solutions, in fact infinitely many: four unknowns and only two equations leave at least two free choices.", "ok": true, "comment": "Right. This is Theorem 1.3.1: more variables than equations forces a nontrivial solution. The count settles existence before we compute anything."}, {"html": "Only the trivial solution: a nontrivial one would need as many equations as unknowns.", "ok": false, "comment": "The theorem goes the other way. More unknowns than equations is exactly what forces nontrivial solutions."}]}, {"phase": "Plan", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The counting argument says nontrivial solutions exist. To describe all of them we need the reduced row-echelon form, the leading variables, and the free variables.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 2: Plan."}, {"phase": "Plan", "type": "multi", "text": "Which of these plans would find <em>all<\/em> the solutions? Select all that apply.", "answers": [{"html": "Try \\((1,1,1,1)\\). If it works, that is the answer.", "ok": false, "comment": "Substituting it: \\(1 + 2 + 1 - 1 = 3\\), not 0. And even when a guess works, one vector is not all of them."}, {"html": "Row-reduce the augmented matrix. Each nonleading (free) variable becomes a parameter, and each one gives its own basic solution.", "ok": true, "comment": "This is the plan we’ll follow. It is the method of Section 1.2 applied to a system with zeros on the right."}, {"html": "Use Theorem 1.3.1 to see that nontrivial solutions exist, then row-reduce to describe every one.", "ok": true, "comment": "Also right. The theorem settles existence, and the reduction does the describing. Both pieces matter."}, {"html": "Solve the first equation for \\(x_1\\) and ignore the second, because one equation is enough.", "ok": false, "comment": "Ignoring the second equation enlarges the set. The vector \\((1,0,-1,0)\\) satisfies the first equation but not the second: \\(2 - 3 = -1\\)."}]}, {"phase": "Plan", "type": "mc", "text": "Once the reduced form is ready, which trap should you avoid when you write the general solution?", "answers": [{"html": "Setting all the free variables to 1 at the same time and calling that one vector \"the\" basic solution.", "ok": true, "comment": "Each free variable needs its own basic solution: set it to 1 while the others are 0. One vector with every free variable set to 1 is just a sum of the basic solutions."}, {"html": "Using a parameter for a leading variable.", "ok": false, "comment": "Leading variables are the ones we solve for. Parameters go on the nonleading (free) variables."}, {"html": "Writing the solution with a constant term.", "ok": false, "comment": "That would be a non-homogeneous system. Here every equation has right-hand side 0, so the solutions are combinations with no constant."}, {"html": "Forgetting the zero column on the right.", "ok": false, "comment": "Dropping or keeping that zero column changes nothing: it stays zero through every row operation."}]}, {"phase": "Carry out", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> Start from \\(\\left[\\begin{array}{cccc|c} 1&2&1&-1&0\\\\ 2&4&3&1&0\\end{array}\\right]\\). Use \\(R_2 \\to R_2 - 2R_1\\) first, then \\(R_1 \\to R_1 - R_2\\).<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 3: Carry out."}, {"phase": "Carry out", "type": "mc", "text": "The first step is \\(R_2 \\to R_2 - 2R_1\\). What is the new row 2?", "answers": [{"html": "\\(\\left[\\begin{array}{cccc|c} 0 & 0 & 1 & -3 & 0\\end{array}\\right]\\)", "ok": false, "comment": "Watch the sign on the last coefficient: \\(1 - 2\\cdot(-1) = 1 + 2 = 3\\), not \\(-3\\)."}, {"html": "\\(\\left[\\begin{array}{cccc|c} 1 & 2 & 2 & 2 & 0\\end{array}\\right]\\)", "ok": false, "comment": "That is \\(R_2 - R_1\\). The multiplier is 2, not 1."}, {"html": "\\(\\left[\\begin{array}{cccc|c} 0 & 0 & 0 & 0 & 0\\end{array}\\right]\\)", "ok": false, "comment": "The second equation is not a multiple of the first: its \\(x_3\\) and \\(x_4\\) coefficients differ. Only \\(x_1\\) and \\(x_2\\) cancel."}, {"html": "\\(\\left[\\begin{array}{cccc|c} 0 & 0 & 1 & 3 & 0\\end{array}\\right]\\)", "ok": true, "comment": "Right: \\(2 - 2\\cdot 1 = 0\\), \\(4 - 2\\cdot 2 = 0\\), \\(3 - 2\\cdot 1 = 1\\), and \\(1 - 2\\cdot(-1) = 3\\)."}]}, {"phase": "Carry out", "type": "mc", "text": "Next, \\(R_1 \\to R_1 - R_2\\), using the new row 2. What is the new row 1?", "answers": [{"html": "\\(\\left[\\begin{array}{cccc|c} 1 & 2 & 0 & -4 & 0\\end{array}\\right]\\)", "ok": true, "comment": "Right: the \\(x_3\\) entry becomes \\(1 - 1 = 0\\), and the \\(x_4\\) entry becomes \\(-1 - 3 = -4\\)."}, {"html": "\\(\\left[\\begin{array}{cccc|c} 1 & 2 & 0 & 4 & 0\\end{array}\\right]\\)", "ok": false, "comment": "That adds row 2 instead of subtracting it. The \\(x_4\\) entry is \\(-1 - 3 = -4\\)."}, {"html": "\\(\\left[\\begin{array}{cccc|c} 1 & 2 & 2 & -4 & 0\\end{array}\\right]\\)", "ok": false, "comment": "Recheck the \\(x_3\\) entry: \\(1 - 1 = 0\\), so the leading 1 in row 2 is cleared out of row 1."}, {"html": "\\(\\left[\\begin{array}{cccc|c} 1 & 2 & 0 & -1 & 0\\end{array}\\right]\\)", "ok": false, "comment": "The \\(x_4\\) entry must change too. Subtracting row 2 changes it by \\(3\\)."}]}, {"phase": "Carry out", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The reduced form is \\(\\left[\\begin{array}{cccc|c} 1&2&0&-4&0\\\\ 0&0&1&3&0\\end{array}\\right]\\). Leading 1s sit in columns 1 and 3, so the variables \\(x_2\\) and \\(x_4\\) are the nonleading ones.<\/p>", "cta": "Got it. Keep going."}, {"phase": "Carry out", "type": "mc", "text": "Which variables are free, and how many basic solutions does the general solution need?", "answers": [{"html": "Only \\(x_4\\) is free, so there is one basic solution.", "ok": false, "comment": "\\(x_2\\) has no leading 1 in its column either. Count the nonleading columns, not just the last one."}, {"html": "\\(x_2\\) and \\(x_4\\) are free: two parameters, so two basic solutions.", "ok": true, "comment": "Right. Those are the columns with no leading 1. Two free variables give two basic solutions."}, {"html": "None: there is a leading 1 in each row, so there is only the trivial solution.", "ok": false, "comment": "Two rows with leading 1s in a 4-variable system leave two nonleading columns. Those are the parameters."}, {"html": "\\(x_1\\) and \\(x_3\\) are free, since they have the leading 1s.", "ok": false, "comment": "It is the other way around. Leading variables are solved for; the free ones are the nonleading ones."}]}, {"phase": "Carry out", "type": "mc", "text": "Let \\(x_2 = s\\) and \\(x_4 = t\\). Solve for \\(x_1\\) and \\(x_3\\), then write all solutions as a linear combination of basic solutions. Which is correct?", "answers": [{"html": "\\(s\\left[\\begin{array}{c}-2\\\\ 1\\\\ 0\\\\ 0\\end{array}\\right] + t\\left[\\begin{array}{c}4\\\\ 0\\\\ -3\\\\ -1\\end{array}\\right]\\)", "ok": false, "comment": "Check the \\(x_4\\) entry: \\(x_4\\) is the parameter \\(t\\), so its entry is \\(+1\\). This vector fails the first equation."}, {"html": "\\(\\left[\\begin{array}{c}2\\\\ 1\\\\ -3\\\\ 1\\end{array}\\right]\\)", "ok": false, "comment": "\\((2,1,-3,1)\\) does solve the system, but it is only one choice of \\(s\\) and \\(t\\) (both set to 1). There are infinitely many solutions, and they need two parameters."}, {"html": "\\(s\\left[\\begin{array}{c}-2\\\\ 1\\\\ 0\\\\ 0\\end{array}\\right] + t\\left[\\begin{array}{c}4\\\\ 0\\\\ -3\\\\ 1\\end{array}\\right]\\)", "ok": true, "comment": "Right: \\(x_1 = -2s + 4t\\) and \\(x_3 = -3t\\). Setting \\(s = 1, t = 0\\) gives \\((-2,1,0,0)\\); setting \\(s = 0, t = 1\\) gives \\((4,0,-3,1)\\)."}, {"html": "\\(s\\left[\\begin{array}{c}-2\\\\ 1\\\\ 0\\\\ 0\\end{array}\\right] + t\\left[\\begin{array}{c}4\\\\ 0\\\\ 3\\\\ 1\\end{array}\\right]\\)", "ok": false, "comment": "Check the \\(x_3\\) entry: \\(x_3 = -3t\\), so the entry is \\(-3\\), not \\(+3\\). This vector fails the second equation."}]}, {"phase": "Look back", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The general solution is \\(s\\,(-2,1,0,0) + t\\,(4,0,-3,1)\\), with \\(s, t\\) any numbers. It has nontrivial solutions, for example \\(t = 1, s = 0\\).<\/p><p>Last phase: <strong>look back<\/strong>. Checking the answer and asking what it means is where much of the learning happens.<\/p>", "cta": "Got it. On to Phase 4: Look back."}, {"phase": "Look back", "type": "mc", "text": "Check the basic solution \\((4,0,-3,1)\\) in the <em>original<\/em> system. Which statement is right?", "answers": [{"html": "Both equations hold: \\(4 + 0 - 3 - 1 = 0\\) and \\(8 + 0 - 9 + 1 = 0\\).", "ok": true, "comment": "Right. Each original equation has to hold, so checking both is the honest test."}, {"html": "It fails: the entries add to \\(4 + 0 - 3 + 1 = 2\\), not 0.", "ok": false, "comment": "A solution has to satisfy each equation, not have entries that add to zero. Substitute into each equation."}, {"html": "It is not a solution, because \\(x_2 = 0\\) means the system can’t be satisfied.", "ok": false, "comment": "Setting a variable to 0 is fine. Substitute the whole vector into both equations and see."}, {"html": "Checking the first equation alone is enough, since both equations belong to the same system.", "ok": false, "comment": "Check \\((1,0,-1,0)\\): the first equation gives \\(1 - 1 = 0\\), but the second gives \\(2 - 3 = -1\\). One equation doesn’t guarantee the other."}]}, {"phase": "Look back", "type": "mc", "text": "Add the two basic solutions: \\((-2,1,0,0) + (4,0,-3,1) = (2,1,-3,1)\\). Is that vector a solution?", "answers": [{"html": "No, because the sum has a negative entry.", "ok": false, "comment": "Negative entries are fine. The question is whether each equation is 0 for the sum."}, {"html": "Yes. For a homogeneous system, the sum of two solutions is a solution, because the right side stays 0.", "ok": true, "comment": "Right. Each equation splits into two sums that are each 0, so their total is 0. This is why the solutions form a combination of basic solutions."}, {"html": "No. Adding solutions gives a new right-hand side, so the sum is never a solution.", "ok": false, "comment": "The right-hand side is 0 for both solutions, and it stays 0 when they are added."}, {"html": "Only if the system has exactly two equations.", "ok": false, "comment": "That has nothing to do with it. The argument works for any number of equations."}]}, {"phase": "Look back", "type": "mc", "text": "Generalize: a homogeneous system has 3 equations in 5 unknowns, and its reduced form has leading 1s in three columns. How many basic solutions does its general solution have?", "answers": [{"html": "One: set all the free variables to 1 at once.", "ok": false, "comment": "Each free variable needs its own basic solution. One vector with every free variable set to 1 is a sum of them, not a replacement."}, {"html": "Five, one for each unknown.", "ok": false, "comment": "Only the free variables get parameters. Five unknowns with three leading ones leaves two free."}, {"html": "Three, one for each leading variable.", "ok": false, "comment": "Leading variables are determined by the free ones. Basic solutions come from the free variables."}, {"html": "Two, one for each of the two free variables.", "ok": true, "comment": "Right. Five unknowns minus three leading variables leaves two free variables, and each one gives one basic solution."}]}, {"phase": "Look back", "type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate says, \"This system has exactly one nontrivial solution, because it has two equations.\" What is wrong with that claim, and which count did they get wrong? Then name one habit from this problem you want to use on the next one.<\/p>"}]};</script>
