<script>window.POLYA = {"slug": "p3-3c-one-eigenvalue", "title": "3.3 Problem C: Only one eigenvalue", "statement": "Suppose \\(A\\) is an \\(n\\times n\\) diagonalizable matrix whose only eigenvalue is \\(\\lambda\\). Show that \\(A = \\lambda I\\).", "questions": [{"type": "write", "text": "In your own words, what does the claim say, and what would a proof have to show?", "phase": "Understand", "model": "<p>If a matrix can be diagonalized and has just one eigenvalue \\(\\lambda\\), then it can’t be anything except \\(\\lambda I\\): a multiple of the identity. We are given that \\(A\\) is diagonalizable and that \\(\\lambda\\) is its only eigenvalue, and we have to show the equation \\(A = \\lambda I\\) for every such matrix, of any size.<\/p>", "checklist": ["name the two things given: diagonalizable, and only one eigenvalue", "name what to show: \\(A = \\lambda I\\)", "say the proof must work for every such \\(A\\), of any size"]}, {"type": "mc", "text": "What does it mean for \\(A\\) to be diagonalizable?", "phase": "Understand", "answers": [{"html": "\\(A\\) is invertible.", "ok": false, "comment": "Invertibility is a different property. A diagonalizable matrix can have \\(0\\) as an eigenvalue."}, {"html": "There is an invertible matrix \\(P\\) with \\(P^{-1}AP = D\\), a diagonal matrix.", "ok": true, "comment": "Right. And the diagonal entries of \\(D\\) are the eigenvalues of \\(A\\)."}, {"html": "\\(A\\) is itself a diagonal matrix.", "ok": false, "comment": "Diagonal matrices are diagonalizable, but so are many others: \\(A\\) only has to become diagonal after the change \\(P^{-1}AP\\)."}, {"html": "\\(A\\) has \\(n\\) different eigenvalues.", "ok": false, "comment": "That is enough to make \\(A\\) diagonalizable, but it isn’t what the word means. (Our \\(A\\) has one eigenvalue and is still diagonalizable.)"}]}, {"type": "mc", "text": "If \\(P^{-1}AP = D\\) and \\(\\lambda\\) is the only eigenvalue of \\(A\\), what is \\(D\\)?", "phase": "Understand", "answers": [{"html": "\\(D = \\lambda I\\): every diagonal entry is \\(\\lambda\\).", "ok": true, "comment": "Right. The diagonal of \\(D\\) holds the eigenvalues of \\(A\\), and the only one available is \\(\\lambda\\)."}, {"html": "\\(D = \\lambda\\), a number.", "ok": false, "comment": "\\(D\\) is an \\(n\\times n\\) matrix, the same size as \\(A\\)."}, {"html": "\\(D\\) can’t be found without knowing \\(P\\).", "ok": false, "comment": "The diagonal of \\(D\\) is made of eigenvalues of \\(A\\), whatever \\(P\\) is. With only \\(\\lambda\\) available, \\(D\\) is determined."}, {"html": "\\(D\\) has \\(\\lambda\\) in the top corner and zeros elsewhere.", "ok": false, "comment": "Every diagonal entry of \\(D\\) is an eigenvalue of \\(A\\). A \\(0\\) there would make \\(0\\) an eigenvalue too."}]}, {"type": "matrix", "text": "Try a case. With \\(P = \\begin{bmatrix}1&1\\\\1&2\\end{bmatrix}\\) and \\(D = \\begin{bmatrix}3&0\\\\0&3\\end{bmatrix}\\), enter \\(PDP^{-1}\\).", "phase": "Understand", "comment": "Right. \\(PDP^{-1} = 3PP^{-1} = 3I\\). The \\(P\\) didn’t matter at all, and that is the whole proof in miniature.", "label": "PDP^{-1} =", "hints": ["\\(D = 3I\\), so \\(PD = 3P\\). What is \\(3P\\,P^{-1}\\)?", "\\(P^{-1} = \\begin{bmatrix}2&-1\\\\-1&1\\end{bmatrix}\\). Multiply \\(3P\\) by it."], "shape": [2, 2], "values": [3.0, 0.0, 0.0, 3.0], "answer_tex": "\\begin{bmatrix}3&0\\\\0&3\\end{bmatrix}", "typed_answer": ["3", "0", "0", "3"], "wrong": [{"values": [3.0, 3.0, 3.0, 6.0], "comment": "That is \\(PD\\). Multiply by \\(P^{-1}\\) on the right as well."}, {"values": [6.0, 9.0, 9.0, 15.0], "comment": "That uses \\(P\\) where \\(P^{-1}\\) belongs. Find \\(P^{-1}\\) first."}]}, {"type": "multi", "text": "Which facts will the proof need? Select all that apply.", "phase": "Plan", "answers": [{"html": "A matrix with only one eigenvalue is diagonal.", "ok": false, "comment": "That is false (see Look back), and it is close to assuming what we want to prove."}, {"html": "\\(P\\) must be the identity matrix.", "ok": false, "comment": "\\(P\\) can be any invertible matrix that diagonalizes \\(A\\). The proof works without knowing it."}, {"html": "\\(PP^{-1} = I\\), and a number can be moved out of a product: \\(P(\\lambda I)P^{-1} = \\lambda PP^{-1}\\).", "ok": true, "comment": "Yes: this is the step the special case showed."}, {"html": "From \\(P^{-1}AP = D\\) we get \\(A = PDP^{-1}\\).", "ok": true, "comment": "Yes: multiply on the left by \\(P\\) and on the right by \\(P^{-1}\\)."}]}, {"type": "multi", "text": "Which of these plans would prove the claim? Select all that work.", "phase": "Plan", "answers": [{"html": "Check the claim on several diagonalizable matrices.", "ok": false, "comment": "Examples can’t cover every diagonalizable matrix. A proof has to."}, {"html": "Write \\(A = PDP^{-1}\\), put in \\(D = \\lambda I\\), and simplify.", "ok": true, "comment": "Yes. This is the plan we’ll write out."}, {"html": "Start from \\(A = \\lambda I\\) and show that its only eigenvalue is \\(\\lambda\\).", "ok": false, "comment": "That proves the converse: it shows \\(\\lambda I\\) has only the eigenvalue \\(\\lambda\\), not that a matrix with only that eigenvalue must be \\(\\lambda I\\)."}, {"html": "Show that every vector is an eigenvector for \\(\\lambda\\), so \\(A\\mathbf{x} = \\lambda\\mathbf{x}\\) for every \\(\\mathbf{x}\\), which means \\(A = \\lambda I\\).", "ok": true, "comment": "Yes, this works too: \\(A\\) has \\(n\\) independent eigenvectors, all for \\(\\lambda\\), so the eigenspace of \\(\\lambda\\) is all of \\(\\mathbb{R}^{n}\\)."}]}, {"type": "order", "text": "Arrange the lines into a proof. Two of them may come in either order.", "phase": "Carry out", "lines": [{"html": "The only eigenvalue of \\(A\\) is \\(\\lambda\\), so every diagonal entry of \\(D\\) is \\(\\lambda\\), and \\(D = \\lambda I\\).", "pos": 1}, {"html": "Multiplying \\(P^{-1}AP = D\\) on the left by \\(P\\) and on the right by \\(P^{-1}\\) gives \\(A = PDP^{-1}\\).", "pos": 2}, {"html": "Conversely, \\(\\lambda I\\) has only the eigenvalue \\(\\lambda\\), so \\(A = \\lambda I\\).", "pos": -1, "comment": "That is the converse. Knowing \\(\\lambda I\\) has only the eigenvalue \\(\\lambda\\) says nothing about which other matrices do."}, {"html": "So \\(A = P(\\lambda I)P^{-1} = \\lambda PP^{-1} = \\lambda I\\).", "pos": 3}, {"html": "Since \\(A\\) has only one eigenvalue, \\(A\\) is already diagonal, so \\(A = \\lambda I\\).", "pos": -1, "comment": "This assumes what we are proving, and it is false without the diagonalizable hypothesis: \\(\\begin{bmatrix}3&-2\\\\2&-1\\end{bmatrix}\\) has only the eigenvalue \\(1\\) and isn’t diagonal."}, {"html": "Since \\(A\\) is diagonalizable, there is an invertible \\(P\\) with \\(P^{-1}AP = D\\), where \\(D\\) is diagonal with the eigenvalues of \\(A\\) on its diagonal.", "pos": 0}], "groups": [[1, 2]], "comment": "Right. Diagonalizable gives \\(A = PDP^{-1}\\); one eigenvalue gives \\(D = \\lambda I\\); and \\(\\lambda I\\) passes straight through \\(P\\) and \\(P^{-1}\\).", "model": "<ol class=\"pl-model-proof\"><li>Since \\(A\\) is diagonalizable, there is an invertible \\(P\\) with \\(P^{-1}AP = D\\), where \\(D\\) is diagonal with the eigenvalues of \\(A\\) on its diagonal.<\/li><li>The only eigenvalue of \\(A\\) is \\(\\lambda\\), so every diagonal entry of \\(D\\) is \\(\\lambda\\), and \\(D = \\lambda I\\).<\/li><li>Multiplying \\(P^{-1}AP = D\\) on the left by \\(P\\) and on the right by \\(P^{-1}\\) gives \\(A = PDP^{-1}\\).<\/li><li>So \\(A = P(\\lambda I)P^{-1} = \\lambda PP^{-1} = \\lambda I\\).<\/li><\/ol>", "hints": ["Start from what “diagonalizable” gives you, then use what “only eigenvalue \\(\\lambda\\)” says about \\(D\\).", "The last line is the special case from Understand, with \\(\\lambda\\) in place of \\(3\\)."]}, {"type": "mc", "text": "Use the result. Is \\(B = \\begin{bmatrix}3&-2\\\\2&-1\\end{bmatrix}\\) diagonalizable? Its characteristic polynomial is \\((x-1)^{2}\\).", "phase": "Look back", "answers": [{"html": "Yes. Its only eigenvalue is \\(1\\), so by the result it equals \\(I\\).", "ok": false, "comment": "The result runs the other way: IF \\(B\\) were diagonalizable, it would equal \\(I\\). \\(B\\) isn’t \\(I\\), so it can’t be diagonalizable."}, {"html": "No. Its eigenvalue \\(1\\) is repeated, and a repeated eigenvalue always rules out diagonalizing.", "ok": false, "comment": "The answer is no, but not for that reason: \\(I\\) has the repeated eigenvalue \\(1\\) and is diagonal. What rules \\(B\\) out is that it isn’t \\(I\\)."}, {"html": "No. Its only eigenvalue is \\(1\\), so if it were diagonalizable it would have to equal \\(I\\), and it doesn’t.", "ok": true, "comment": "Right. That is the text’s Exercise 3.4.15(b), settled without finding a single eigenvector."}, {"html": "Yes. It has an eigenvalue, so it can be diagonalized.", "ok": false, "comment": "Having an eigenvalue isn’t enough. By what we just proved, a diagonalizable matrix whose only eigenvalue is \\(1\\) must be \\(I\\)."}]}, {"type": "write", "text": "Now you: suppose \\(A\\) is diagonalizable and its only eigenvalues are \\(1\\) and \\(-1\\). Prove that \\(A^{-1} = A\\).", "phase": "Look back", "model": "<p>Since \\(A\\) is diagonalizable, \\(A = PDP^{-1}\\) with \\(D\\) diagonal and the eigenvalues of \\(A\\) on its diagonal. Each diagonal entry is \\(1\\) or \\(-1\\), so \\(D^{2} = I\\). Then \\(A^{2} = PDP^{-1}PDP^{-1} = PD^{2}P^{-1} = PIP^{-1} = I\\). So \\(A\\cdot A = I\\), which means \\(A^{-1} = A\\).<\/p>", "checklist": ["start from \\(A = PDP^{-1}\\)", "say why \\(D^{2} = I\\): each diagonal entry is \\(\\pm 1\\)", "compute \\(A^{2} = PD^{2}P^{-1}\\), with the middle \\(P^{-1}P\\) cancelling", "conclude \\(A^{2} = I\\)", "explain why \\(A^{2} = I\\) means \\(A^{-1} = A\\)"]}, {"type": "essay", "text": "Reflection: the special case in Understand turned out to be the whole proof. How did trying it help you see the general argument?", "phase": "Look back"}], "goal": "Prove what diagonalizability forces when a matrix has a single eigenvalue, and use it to rule a matrix out.", "connects": "Builds on diagonalization in this section: \\(P^{-1}AP = D\\) with the eigenvalues on the diagonal of \\(D\\). Leads to 5.5, where similar matrices share eigenvalues, and to the question of when a repeated eigenvalue still allows diagonalizing.", "discuss": "The matrix \\(\\begin{bmatrix}3&-2\\\\2&-1\\end{bmatrix}\\) has the repeated eigenvalue \\(1\\) and is not diagonalizable, but \\(I\\) also has the repeated eigenvalue \\(1\\) and is diagonal. What is the real difference?"};</script>
