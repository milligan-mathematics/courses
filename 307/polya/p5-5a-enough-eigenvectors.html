<script>window.POLYA = {"slug": "p5-5a-enough-eigenvectors", "title": "5.5 Problem A: Enough eigenvectors?", "statement": "Recall that \\(A\\) is diagonalizable when \\(P^{-1}AP=D\\) for some invertible \\(P\\) and some diagonal \\(D\\). Is \\(A=\\begin{bmatrix}4&-1&2\\\\0&2&0\\\\-1&0&1\\end{bmatrix}\\) diagonalizable? Decide, and say why.", "questions": [{"type": "write", "text": "In your own words, what is this problem asking for?", "phase": "Understand", "model": "<p>It asks whether there is an invertible \\(P\\) with \\(P^{-1}AP=D\\) for a diagonal \\(D\\). That means finding enough independent eigenvectors of \\(A\\) to form the columns of \\(P\\), and the eigenvalues are where I start.<\/p>"}, {"type": "mc", "text": "Before the full matrix, consider \\(D=\\begin{bmatrix}2&0&0\\\\0&2&0\\\\0&0&3\\end{bmatrix}\\). Is \\(D\\) diagonalizable?", "phase": "Understand", "answers": [{"html": "No. A diagonalizable matrix needs three different eigenvalues.", "ok": false, "comment": "Three different eigenvalues aren’t required. \\(D\\) has only two different eigenvalues, \\(2\\) and \\(3\\), and it is still diagonalizable."}, {"html": "Yes. \\(D\\) is already diagonal, so \\(P=I\\) gives \\(P^{-1}DP=D\\).", "ok": true, "comment": "Right. A diagonal matrix is diagonalizable with \\(P=I\\). The eigenvalue \\(2\\) is repeated, but \\(\\mathbf e_1\\) and \\(\\mathbf e_2\\) are two independent eigenvectors for it."}, {"html": "No. A matrix with a repeated eigenvalue can’t be diagonalized.", "ok": false, "comment": "A repeated eigenvalue doesn’t rule out diagonalization by itself. Here \\(D\\) has a repeated \\(2\\), and it still has two independent eigenvectors for it."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> A repeated eigenvalue doesn’t decide diagonalizability on its own, since \\(D\\) has one and is still diagonalizable. Here are the tools from the notes. The eigenvalues of \\(A\\) are the roots of \\(c_A(x)=\\det(xI-A)\\), and the multiplicity of an eigenvalue is the number of times it is a root. \\(\\dim E_\\lambda(A)\\) is the number of basic solutions of \\((\\lambda I-A)\\mathbf x=\\mathbf 0\\), which is \\(n\\) minus the rank of \\(\\lambda I-A\\). For a triangular matrix the eigenvalues are the diagonal entries. If \\(c_A(x)\\) factors completely, then \\(A\\) is diagonalizable exactly when \\(\\dim E_\\lambda(A)\\) equals the multiplicity of \\(\\lambda\\) for every eigenvalue \\(\\lambda\\).<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "phase": "Plan", "cta": "Got it. On to Phase 2: Plan."}, {"type": "write", "text": "Before you start, write your plan in 1–3 sentences: which method, and which step needs care?", "phase": "Plan", "model": "<p>Factor \\(c_A(x)=\\det(xI-A)\\) to find each eigenvalue and its multiplicity. For each eigenvalue \\(\\lambda\\), row-reduce \\(\\lambda I-A\\) to count its basic solutions, which is \\(\\dim E_\\lambda(A)\\), and compare that count with the multiplicity. The step that needs care is the count: it is \\(3\\) minus the rank, not the rank itself.<\/p>"}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: find \\(c_A(x)\\), and with it the eigenvalues and their multiplicities. Then, for each eigenvalue, count the basic solutions of \\((\\lambda I-A)\\mathbf x=\\mathbf 0\\), and compare that count with the multiplicity.<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "mc", "text": "What is the characteristic polynomial \\(c_A(x)=\\det(xI-A)\\)?", "phase": "Carry out", "answers": [{"html": "\\((x-2)^2(x-3)\\)", "ok": true, "comment": "Right. Row 2 of \\(xI-A\\) is \\((0,\\,x-2,\\,0)\\), so expanding along it gives \\((x-2)\\big[(x-4)(x-1)+2\\big]=(x-2)^2(x-3)\\)."}, {"html": "\\((x+2)^2(x+3)\\)", "ok": false, "comment": "The roots have the wrong signs. The eigenvalues are the roots of \\(c_A(x)\\), so they are \\(2\\) and \\(3\\), not \\(-2\\) and \\(-3\\)."}, {"html": "\\((x-4)(x-2)(x-1)\\)", "ok": false, "comment": "That reads the diagonal entries \\(4, 2, 1\\) as eigenvalues. That shortcut works only for triangular matrices, and \\(A\\) has nonzero entries above and below its diagonal."}]}, {"type": "mc", "text": "Is \\(A\\) diagonalizable? Choose the answer and the reason.", "phase": "Carry out", "answers": [{"html": "Yes. \\(A\\) has three eigenvalues counted with multiplicity, so it has three independent eigenvectors.", "ok": false, "comment": "The multiplicity counts roots, not eigenvectors. The eigenvalue \\(2\\) can contribute only \\(\\dim E_2(A)\\) independent eigenvectors, and that dimension is \\(1\\) here."}, {"html": "Yes. The rank of \\(2I-A\\) is \\(2\\), so \\(E_2(A)\\) has dimension \\(2\\), which matches the multiplicity.", "ok": false, "comment": "The rank is \\(2\\), but the dimension of the eigenspace is \\(n\\) minus the rank, which is \\(3-2=1\\). Using the rank itself gives the wrong count."}, {"html": "No. The eigenvalue \\(2\\) has multiplicity \\(2\\), but \\(\\dim E_2(A)=1\\), so \\(A\\) has only two independent eigenvectors.", "ok": true, "comment": "Right. \\(2I-A\\) has rank \\(2\\), so \\(\\dim E_2(A)=3-2=1\\). Together with one eigenvector for \\(3\\), that gives two independent eigenvectors, and a diagonalizing \\(P\\) needs three."}, {"html": "No. The eigenvalue \\(2\\) is repeated, and a repeated eigenvalue rules out diagonalization.", "ok": false, "comment": "The answer is right, but the reason isn’t. The diagonal matrix \\(D\\) from the start has a repeated \\(2\\) and is still diagonalizable."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The answer is that \\(A\\) is not diagonalizable: \\(\\lambda=2\\) has multiplicity \\(2\\), but \\(\\dim E_2(A)=1\\). Similar matrices share the trace, determinant and eigenvalues, and one is diagonalizable exactly when the other is.<\/p><p>Last phase: <strong>look back<\/strong>. Check the answer another way, and then see what changes when one entry changes.<\/p>", "phase": "Look back", "cta": "Got it. On to Phase 4: Look back."}, {"type": "write", "text": "Choose a check of your own and carry it out. What did you check, and did it pass?", "phase": "Look back", "model": "<p>I counted the basic eigenvectors directly. Row-reducing \\(2I-A\\) left one free variable, so there is one basic eigenvector for \\(2\\), namely \\((-1,0,1)\\). Row-reducing \\(3I-A\\) left one free variable too, giving \\((-2,0,1)\\). That makes two independent eigenvectors, not three, which agrees with \\(\\dim E_2(A)=1\\). The check passed.<\/p>"}, {"type": "mc", "text": "Suppose you change the entry in row 1, column 2 of \\(A\\) from \\(-1\\) to \\(0\\), and leave the rest alone. Is the new matrix diagonalizable?", "phase": "Look back", "answers": [{"html": "No. The rank of the new \\(2I-A\\) is \\(1\\), so the eigenspace for \\(2\\) has dimension \\(1\\).", "ok": false, "comment": "That treats the rank as the dimension again. The dimension is \\(n\\) minus the rank, which is \\(2\\) here."}, {"html": "Yes. Its determinant is still \\(12\\), so it is invertible, and invertible matrices are diagonalizable.", "ok": false, "comment": "The answer is right, but the reason isn’t. Invertible matrices aren’t always diagonalizable: the original \\(A\\) has determinant \\(12\\), so it is invertible, and it still isn’t diagonalizable."}, {"html": "No. Its trace and determinant match those of \\(A\\), so it is similar to \\(A\\), and \\(A\\) is not diagonalizable.", "ok": false, "comment": "Matching trace and determinant doesn’t make two matrices similar. The new matrix and \\(A\\) agree on both numbers, but only the new matrix is diagonalizable, and similar matrices are diagonalizable together."}, {"html": "Yes. The eigenspace for \\(2\\) now has dimension \\(2\\), which matches its multiplicity.", "ok": true, "comment": "Right. The new \\(2I-A\\) has rank \\(1\\), so \\(\\dim E_2=3-1=2\\). The eigenvalues stay the same, but now the eigenspace for \\(2\\) is big enough."}]}, {"type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate says, “My matrix has a repeated eigenvalue, so it can’t be diagonalized.” What would you tell them to check?<\/p>", "phase": "Look back"}]};</script>
