<script>window.POLYA = {"slug": "p1-2a-no-solution", "title": "1.2 Problem A: When does a system break?", "statement": "For which values of \\(k\\) does the system \\[\\begin{aligned} x + ky &= 1\\\\ kx + 4y &= 2\\end{aligned}\\] have <strong>no<\/strong> solution?", "questions": [{"phase": "Understand", "type": "mc", "text": "Before computing anything: what is this problem asking you to find?", "answers": [{"html": "Whether the system has a solution.", "ok": false, "comment": "That depends on \\(k\\), so there is no single yes-or-no answer. The question asks <em>for which<\/em> \\(k\\) it fails."}, {"html": "The one value of \\(k\\) that makes the system inconsistent.", "ok": false, "comment": "The question says \"which values.\" Don’t decide in advance that there is exactly one; the answer could be no values, one, or several."}, {"html": "Values of \\(x\\) and \\(y\\) that solve the system.", "ok": false, "comment": "\\(x\\) and \\(y\\) are the system’s variables, but the question is about \\(k\\). Each value of \\(k\\) gives a different system; we are sorting those systems by how many solutions they have."}, {"html": "All values of \\(k\\) for which the system has no solution.", "ok": true, "comment": "Right. The unknown is a <em>set<\/em> of \\(k\\) values, and it could be empty, one value, or several."}]}, {"phase": "Understand", "type": "mc", "text": "In the language of row reduction, what does \"no solution\" look like?", "answers": [{"html": "A leading 1 in every column of the coefficient matrix.", "ok": false, "comment": "That signals exactly one solution (rank equals the number of variables): the opposite of what we want."}, {"html": "A row of all zeros, \\(\\left[\\begin{array}{cc|c} 0 & 0 & 0\\end{array}\\right]\\).", "ok": false, "comment": "A zero row says \\(0 = 0\\), which is always true. It never blocks a solution; it usually means a parameter is coming."}, {"html": "\\(\\left[\\begin{array}{cc|c} 0 & 0 & c\\end{array}\\right]\\) with \\(c \\neq 0\\).", "ok": true, "comment": "Yes. That row says \\(0 = c\\) with \\(c \\neq 0\\), which is impossible, so the system is inconsistent."}, {"html": "Fewer equations than variables.", "ok": false, "comment": "This system has two equations and two variables, so that can’t be it. And fewer equations than variables never forces \"no solution\" by itself."}]}, {"phase": "Understand", "type": "mc", "text": "A good way to understand a problem is to try a special case. Put \\(k = 0\\): the system becomes \\(x = 1\\), \\(4y = 2\\). How many solutions does it have?", "answers": [{"html": "No solution.", "ok": false, "comment": "Try \\(x = 1,\\ y = \\tfrac12\\) in both equations. It works."}, {"html": "Exactly one.", "ok": true, "comment": "Right: \\(x = 1,\\ y = \\tfrac12\\). So \\(k = 0\\) is not in our answer, and the answer is not \"every \\(k\\).\""}, {"html": "Infinitely many.", "ok": false, "comment": "Each equation pins down one variable, so there is just one solution: \\(x = 1,\\ y = \\tfrac12\\)."}]}, {"phase": "Plan", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> We want every \\(k\\) that makes the system inconsistent, which after row reduction means a row \\(\\left[\\begin{array}{cc|c} 0 & 0 & c\\end{array}\\right]\\) with \\(c \\neq 0\\). The special case \\(k = 0\\) has one solution, so the answer is not \"all \\(k\\).\"<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 2: Plan."}, {"phase": "Plan", "type": "multi", "text": "Which of these plans would find <em>every<\/em> value of \\(k\\) that works? Select all that apply.", "answers": [{"html": "Try \\(k = 1, 2, 3, \\dots\\) until the system breaks.", "ok": false, "comment": "Testing values builds intuition, but it can’t find every answer: you would miss negative and fractional values, and you never know when to stop."}, {"html": "Solve the system for one specific value, such as \\(k = 1\\).", "ok": false, "comment": "One value of \\(k\\) tells you about one system. We need to know about all of them at once."}, {"html": "Write the augmented matrix \\(\\left[\\begin{array}{cc|c} 1 & k & 1\\\\ k & 4 & 2\\end{array}\\right]\\), keep \\(k\\) as a letter, and row-reduce. Look for when row 2 can become \\(\\left[\\begin{array}{cc|c} 0 & 0 & c\\end{array}\\right]\\) with \\(c \\neq 0\\).", "ok": true, "comment": "This is the plan we’ll follow. It is the idea of Example 1.2.4: row operations work fine with letters in the matrix."}, {"html": "Solve the first equation for \\(x\\), substitute into the second, and see when the resulting equation in \\(y\\) is impossible.", "ok": true, "comment": "This works too. It is the same computation as the row operation \\(R_2 - kR_1\\), written as equations."}]}, {"phase": "Plan", "type": "mc", "text": "Row reduction with a letter in the matrix has one trap. Which step needs extra care?", "answers": [{"html": "Nothing. Letters behave just like numbers.", "ok": false, "comment": "Almost. The one difference: you can’t divide by an expression unless you know it isn’t 0 (multiplying a row by 0 is not a row operation)."}, {"html": "Dividing a row by an expression involving \\(k\\), because that expression might be 0.", "ok": true, "comment": "Exactly. Dividing by something that could be zero is where the cases split; the \\(k\\) values that make it zero are the ones to look at closely."}, {"html": "Swapping rows, because it changes the solution set.", "ok": false, "comment": "Swapping rows never changes the solutions; it is an elementary row operation."}, {"html": "Adding a multiple of one row to another, because \\(k\\) might be negative.", "ok": false, "comment": "Adding \\(-k\\) times a row is allowed for any \\(k\\), negative or not."}]}, {"phase": "Carry out", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: row-reduce \\(\\left[\\begin{array}{cc|c} 1 & k & 1\\\\ k & 4 & 2\\end{array}\\right]\\) using \\(R_2 \\to R_2 - kR_1\\), and watch for division by an expression that could be 0.<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 3: Carry out."}, {"phase": "Carry out", "type": "mc", "text": "What is the new row 2 after \\(R_2 \\to R_2 - kR_1\\)?", "answers": [{"html": "\\(\\left[\\begin{array}{cc|c} 0 & 4-k^2 & 2-k\\end{array}\\right]\\)", "ok": true, "comment": "Right: \\(4 - k\\cdot k = 4 - k^2\\) and \\(2 - k\\cdot 1 = 2 - k\\)."}, {"html": "\\(\\left[\\begin{array}{cc|c} 0 & 4-k^2 & 2\\end{array}\\right]\\)", "ok": false, "comment": "A row operation acts on the whole row, including the augmented column: \\(2 - k\\cdot 1 = 2 - k\\)."}, {"html": "\\(\\left[\\begin{array}{cc|c} 0 & 4+k^2 & 2+k\\end{array}\\right]\\)", "ok": false, "comment": "Watch the sign: \\(R_2 - kR_1\\) subtracts, so the entries are \\(4 - k\\cdot k\\) and \\(2 - k\\cdot 1\\)."}, {"html": "\\(\\left[\\begin{array}{cc|c} 0 & 4-k & 2-k\\end{array}\\right]\\)", "ok": false, "comment": "Check the middle entry: you subtract \\(k\\) times row 1’s entry \\(k\\), which is \\(k^2\\)."}]}, {"phase": "Carry out", "type": "multi", "text": "To get a leading 1 in row 2 we would divide by \\(4 - k^2\\). For which values of \\(k\\) is that impossible because \\(4 - k^2 = 0\\)? Select all that apply.", "answers": [{"html": "\\(k = -4\\)", "ok": false, "comment": "\\(4 - (-4)^2 = -12 \\neq 0\\)."}, {"html": "\\(k = -2\\)", "ok": true, "comment": "\\(4 - (-2)^2 = 0\\). Don’t forget the negative root."}, {"html": "\\(k = 0\\)", "ok": false, "comment": "\\(4 - 0 = 4 \\neq 0\\), which matches the one solution you found for \\(k = 0\\)."}, {"html": "\\(k = 2\\)", "ok": true, "comment": "\\(4 - 2^2 = 0\\)."}, {"html": "\\(k = 4\\)", "ok": false, "comment": "\\(4 - 4^2 = -12 \\neq 0\\)."}]}, {"phase": "Carry out", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> For every \\(k\\) other than \\(2\\) and \\(-2\\), \\(4 - k^2 \\neq 0\\), so row 2 gets a leading 1 and the system has exactly one solution. Only \\(k = 2\\) and \\(k = -2\\) can possibly give no solution. Check each one.<\/p>", "cta": "Got it. Keep going."}, {"phase": "Carry out", "type": "mc", "text": "Put \\(k = 2\\) into row 2, \\(\\left[\\begin{array}{cc|c} 0 & 4-k^2 & 2-k\\end{array}\\right]\\). What do you get, and what does it mean?", "answers": [{"html": "\\(\\left[\\begin{array}{cc|c} 0 & 0 & 4\\end{array}\\right]\\): no solution.", "ok": false, "comment": "Recompute the last entry: \\(2 - k = 2 - 2 = 0\\)."}, {"html": "\\(\\left[\\begin{array}{cc|c} 0 & 0 & 4\\end{array}\\right]\\): infinitely many solutions.", "ok": false, "comment": "Recompute the last entry: \\(2 - k = 2 - 2 = 0\\). (And a row \\(0 = 4\\) would mean no solution.)"}, {"html": "\\(\\left[\\begin{array}{cc|c} 0 & 0 & 0\\end{array}\\right]\\): infinitely many solutions.", "ok": true, "comment": "Right. The row says \\(0 = 0\\), and \\(y\\) becomes a parameter. So \\(k = 2\\) is <em>not<\/em> in the answer."}, {"html": "\\(\\left[\\begin{array}{cc|c} 0 & 0 & 0\\end{array}\\right]\\): no solution.", "ok": false, "comment": "A zero row says \\(0 = 0\\), which is always true; it never blocks a solution. Here \\(y\\) is free, so there are infinitely many solutions."}]}, {"phase": "Carry out", "type": "mc", "text": "Now put \\(k = -2\\) into row 2. What do you get, and what does it mean?", "answers": [{"html": "\\(\\left[\\begin{array}{cc|c} 0 & 0 & 0\\end{array}\\right]\\): infinitely many solutions.", "ok": false, "comment": "\\(2 - k\\) with \\(k = -2\\) is \\(2 + 2 = 4\\), not 0."}, {"html": "\\(\\left[\\begin{array}{cc|c} 0 & 0 & 4\\end{array}\\right]\\): infinitely many solutions.", "ok": false, "comment": "The row says \\(0 = 4\\), which no \\(x, y\\) can satisfy, so there is no solution."}, {"html": "\\(\\left[\\begin{array}{cc|c} 0 & 8 & 4\\end{array}\\right]\\): exactly one solution.", "ok": false, "comment": "\\(4 - (-2)^2 = 4 - 4 = 0\\): squaring a negative gives a positive."}, {"html": "\\(\\left[\\begin{array}{cc|c} 0 & 0 & 4\\end{array}\\right]\\): no solution.", "ok": true, "comment": "Right: \\(2 - (-2) = 4\\), so the row says \\(0 = 4\\). Inconsistent."}]}, {"phase": "Carry out", "type": "mc", "text": "So: for which values of \\(k\\) does the system have no solution?", "answers": [{"html": "\\(k = 2\\) only", "ok": false, "comment": "At \\(k = 2\\) row 2 is all zeros, which means infinitely many solutions. Look at \\(k = -2\\) again."}, {"html": "\\(k = -2\\) only", "ok": true, "comment": "Right."}, {"html": "\\(k = 2\\) and \\(k = -2\\)", "ok": false, "comment": "Those are the two values where \\(4 - k^2 = 0\\), but \\(k = 2\\) gives infinitely many solutions, not none."}, {"html": "Every \\(k\\) except \\(2\\) and \\(-2\\)", "ok": false, "comment": "For those values \\(4 - k^2 \\neq 0\\), so the system has exactly one solution."}]}, {"phase": "Look back", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The answer is \\(k = -2\\) only.<\/p><p>Last phase: <strong>look back<\/strong>. Checking a result and asking what else it shows you is where much of the learning happens.<\/p>", "cta": "Got it. On to Phase 4: Look back."}, {"phase": "Look back", "type": "mc", "text": "Check \\(k = -2\\) in the original system: \\(x - 2y = 1\\) and \\(-2x + 4y = 2\\). Which observation confirms there is no solution?", "answers": [{"html": "Multiplying the first equation by \\(-2\\) gives \\(-2x + 4y = -2\\), but the second says \\(-2x + 4y = 2\\). The same left side can’t equal both.", "ok": true, "comment": "Yes. That is the row \\(0 = 4\\) in disguise: subtract the two equations and you get \\(0 = 4\\)."}, {"html": "There are more variables than equations.", "ok": false, "comment": "There are two of each."}, {"html": "Some of the coefficients are negative.", "ok": false, "comment": "Negative coefficients are fine; they have nothing to do with whether a solution exists."}, {"html": "The second equation is \\(-2\\) times the first, so they are the same equation.", "ok": false, "comment": "Check the right sides: \\(-2 \\times 1 = -2\\), but the second equation has \\(2\\). Same left sides, different right sides is a contradiction, not a duplicate."}]}, {"phase": "Look back", "type": "mc", "text": "Each equation is a line in the \\(xy\\)-plane. What do the two special cases look like?", "answers": [{"html": "\\(k = -2\\): the same line twice. \\(k = 2\\): two parallel lines.", "ok": false, "comment": "Swapped. At \\(k = 2\\) the second equation \\(2x + 4y = 2\\) is exactly 2 times the first, so it is the same line."}, {"html": "Both: two lines crossing at the origin.", "ok": false, "comment": "\\((0, 0)\\) doesn’t satisfy \\(x + ky = 1\\) for any \\(k\\)."}, {"html": "\\(k = -2\\): two parallel lines that never meet. \\(k = 2\\): the same line twice.", "ok": true, "comment": "Right. No solution means no intersection point; infinitely many means every point of the line works."}, {"html": "\\(k = -2\\): lines crossing at one point. \\(k = 2\\): two parallel lines.", "ok": false, "comment": "Crossing at one point would mean exactly one solution, which happens for every \\(k\\) except \\(\\pm 2\\)."}]}, {"phase": "Look back", "type": "mc", "text": "Put it all together. Which description of the system is correct?", "answers": [{"html": "No solution when \\(k = -2\\); exactly one for every other \\(k\\).", "ok": false, "comment": "What happens at \\(k = 2\\)? Row 2 is all zeros there."}, {"html": "No solution when \\(k = -2\\); infinitely many when \\(k = 2\\); exactly one for every other \\(k\\).", "ok": true, "comment": "Right. Every value of \\(k\\) lands in exactly one of the three cases. That is Theorem 1.2.2 at work."}, {"html": "No solution when \\(k = \\pm 2\\); exactly one for every other \\(k\\).", "ok": false, "comment": "This misses the zero row at \\(k = 2\\), which gives infinitely many solutions."}, {"html": "No solution when \\(k = -2\\); exactly one when \\(k = 0\\); infinitely many for every other \\(k\\).", "ok": false, "comment": "\\(k = 0\\) is just the special case we tried. Any \\(k\\) with \\(4 - k^2 \\neq 0\\) gives exactly one solution."}]}, {"phase": "Look back", "type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate answered \"\\(k = 2\\) and \\(k = -2\\).\" What step did they skip? Then name one habit from this problem you want to use on the next one.<\/p>"}]};</script>
