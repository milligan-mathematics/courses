<script>window.POLYA = {"slug": "p8-1a-closest-point", "title": "8.1 Problem A: How far is x from U?", "statement": "Let \\(U\\) be the subspace of \\(\\mathbb{R}^4\\) spanned by \\(\\mathbf u_1=\\begin{bmatrix}1\\\\1\\\\1\\\\1\\end{bmatrix}\\) and \\(\\mathbf u_2=\\begin{bmatrix}1\\\\2\\\\0\\\\-1\\end{bmatrix}\\), and let \\(\\mathbf x=\\begin{bmatrix}3\\\\3\\\\-1\\\\1\\end{bmatrix}\\). The distance from \\(\\mathbf x\\) to \\(U\\) is the smallest value of \\(\\|\\mathbf x-\\mathbf y\\|\\) as \\(\\mathbf y\\) ranges over \\(U\\). Find the vector in \\(U\\) closest to \\(\\mathbf x\\), and find the distance from \\(\\mathbf x\\) to \\(U\\).", "questions": [{"type": "write", "text": "In your own words, what is this problem asking you to find, and what will the finished answer look like?", "phase": "Understand", "model": "<p>It asks for two things: the vector \\(\\mathbf p\\) in \\(U\\) closest to \\(\\mathbf x\\), which has four entries, and the distance from \\(\\mathbf x\\) to \\(U\\), which is a single positive number. The distance is the length of \\(\\mathbf x-\\mathbf p\\), the segment from \\(\\mathbf x\\) to the closest vector. That segment is perpendicular to \\(U\\).<\/p>", "checklist": ["name the two answers: the closest vector in \\(U\\), and the distance from \\(\\mathbf x\\) to \\(U\\)", "say that the closest vector lies in \\(U\\) and has four entries", "say that the distance is the length of \\(\\mathbf x-\\mathbf p\\), and that this segment is perpendicular to \\(U\\)"]}, {"type": "explore", "text": "This is a picture of the idea in the plane, not the problem’s \\(\\mathbb{R}^4\\) data. The blue arrow is \\(\\mathbf b=(1,3)\\), and the gray line is every multiple of \\(\\mathbf u=(2,1)\\). Drag the purple dot along the line to the point closest to \\(\\mathbf b\\). What do you notice about the orange segment there?", "phase": "Understand", "widget": {"kind": "project", "b": [1, 3], "u": [2, 1]}, "found": "Right. The point on the line closest to \\(\\mathbf b\\) is {point}, and its distance from \\(\\mathbf b\\) is {dist}. There the orange segment meets the line at a right angle. That right angle is the key to the problem, in the plane and in \\(\\mathbb R^4\\)."}, {"type": "write", "text": "Before you compute anything, write your plan in 2–4 sentences: what will you compute, and in what order?", "phase": "Plan", "model": "<p>First I’ll check whether \\(\\mathbf u_1\\) and \\(\\mathbf u_2\\) are orthogonal, since the projection formula needs an orthogonal basis. If they aren’t, I’ll make one with Gram–Schmidt, keeping \\(\\mathbf u_1\\) and replacing \\(\\mathbf u_2\\). Then I’ll use the projection formula on that basis to get \\(\\mathbf p\\), and the distance is the length of \\(\\mathbf x-\\mathbf p\\). The step that needs care is the first check, because the formula gives a wrong answer without an orthogonal basis.<\/p>", "checklist": ["check whether \\(\\mathbf u_1\\) and \\(\\mathbf u_2\\) are orthogonal, and say what that check decides", "make an orthogonal basis of \\(U\\) before using the projection formula", "use the projection formula, with the length squared in each denominator", "say that the distance is the length of \\(\\mathbf x-\\mathbf p\\)"]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> You should now have a plan. We’ll follow it: check whether \\(\\mathbf u_1\\) and \\(\\mathbf u_2\\) are orthogonal, make an orthogonal basis of \\(U\\) if they aren’t, use that basis in the projection formula to get \\(\\mathbf p\\), and then take the length of \\(\\mathbf x-\\mathbf p\\). By the Projection Theorem, \\(\\mathbf p\\) is the closest vector in \\(U\\), and \\(\\mathbf x-\\mathbf p\\) is orthogonal to \\(U\\).<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "matrix", "text": "Find the vector \\(\\mathbf p\\) in \\(U\\) closest to \\(\\mathbf x\\). Enter its four entries from top to bottom.", "phase": "Carry out", "comment": "Right. The vectors are not orthogonal, so the formula runs on the orthogonal basis \\(\\mathbf f_1=\\mathbf u_1\\) and \\(\\mathbf f_2=\\mathbf u_2-\\tfrac12\\mathbf u_1\\). That gives \\(\\mathbf p=\\tfrac32\\mathbf f_1+\\mathbf f_2\\), and \\(\\mathbf x-\\mathbf p\\) is orthogonal to both \\(\\mathbf u_1\\) and \\(\\mathbf u_2\\).", "label": "\\mathbf p =", "hints": ["Are \\(\\mathbf u_1\\) and \\(\\mathbf u_2\\) orthogonal? Compute \\(\\mathbf u_1\\cdot\\mathbf u_2\\). If it isn’t 0, the projection formula can’t use them as they are.", "Keep \\(\\mathbf f_1=\\mathbf u_1\\), and replace \\(\\mathbf u_2\\) by \\(\\mathbf f_2=\\mathbf u_2-\\dfrac{\\mathbf u_1\\cdot\\mathbf u_2}{\\|\\mathbf u_1\\|^2}\\mathbf u_1\\). Check that \\(\\mathbf f_1\\cdot\\mathbf f_2=0\\).", "Then \\(\\mathbf p=\\dfrac{\\mathbf x\\cdot\\mathbf f_1}{\\|\\mathbf f_1\\|^2}\\mathbf f_1+\\dfrac{\\mathbf x\\cdot\\mathbf f_2}{\\|\\mathbf f_2\\|^2}\\mathbf f_2\\). Work out the two coefficients, then the two vectors, then add them."], "syntax": "Enter the four entries from top to bottom. Fractions like 3/2 are fine.", "shape": [4, 1], "values": [2.0, 3.0, 1.0, 0.0], "answer_tex": "\\begin{bmatrix}2\\\\3\\\\1\\\\0\\end{bmatrix}", "typed_answer": ["2", "3", "1", "0"], "wrong": [{"values": [3.5, 4.5, 2.5, 1.5], "comment": "You divided by \\(\\|\\mathbf u_1\\|=2\\) instead of \\(\\|\\mathbf u_1\\|^2=4\\) in the first term. That makes the first term too long, and the second term is fine."}, {"values": [2.8333333333333335, 4.166666666666667, 1.5, 0.16666666666666666], "comment": "That adds the projections onto \\(\\mathbf u_1\\) and onto \\(\\mathbf u_2\\), one at a time. Adding separate projections is only valid when the vectors are orthogonal, and here they are not."}, {"values": [1.0, 0.0, -2.0, 1.0], "comment": "That is \\(\\mathbf x-\\mathbf p\\), the part of \\(\\mathbf x\\) that is orthogonal to \\(U\\). The question asks for a vector in \\(U\\), and this one is no
