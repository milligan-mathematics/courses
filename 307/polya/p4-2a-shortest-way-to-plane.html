<script>window.POLYA = {"slug": "p4-2a-shortest-way-to-plane", "title": "4.2 Problem A: The shortest way to a plane", "statement": "Find the shortest distance from the point \\(P(2, -4, 6)\\) to the plane \\(x - 2y + 2z = 4\\). Also find the point \\(Q\\) on the plane that is closest to \\(P\\).", "questions": [{"type": "write", "text": "In your own words, what is this problem asking for?", "phase": "Understand", "model": "<p>It asks for two things: the shortest distance from \\(P\\) to the plane \\(x - 2y + 2z = 4\\), and the point \\(Q\\) on the plane that is closest to \\(P\\). The shortest segment from \\(P\\) to the plane is perpendicular to the plane, so \\(Q\\) is where the perpendicular from \\(P\\) meets the plane.<\/p>", "checklist": ["name the two answers: the distance from \\(P\\), and the point \\(Q\\)", "say that the shortest segment from \\(P\\) to the plane is perpendicular to the plane", "say that \\(Q\\) is where that perpendicular meets the plane"]}, {"type": "mc", "text": "Which vector is perpendicular to the plane \\(x - 2y + 2z = 4\\)?", "phase": "Understand", "answers": [{"html": "\\((2, 1, 0)\\)", "ok": false, "comment": "Check the dot product: \\((2, 1, 0)\\cdot(1, -2, 2) = 0\\), so this vector lies along the plane, not across it."}, {"html": "\\(\\mathbf n = (1, -2, 2)\\)", "ok": true, "comment": "Right. The coefficients of \\(x\\), \\(y\\), \\(z\\) in the plane’s equation form a normal vector \\(\\mathbf n\\), and the shortest path from \\(P\\) to the plane runs along it."}, {"html": "\\((2, -4, 6)\\)", "ok": false, "comment": "That is the position vector of \\(P\\). It points from the origin to \\(P\\), which says nothing about how the plane is tilted."}, {"html": "\\((4, 0, 0)\\)", "ok": false, "comment": "That is a point on the plane (it satisfies the equation), not a direction perpendicular to it."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> We want two things: the shortest distance from \\(P\\) to the plane, and the point \\(Q\\) on the plane closest to \\(P\\). Since \\(Q\\) is the closest point, the segment \\(PQ\\) is perpendicular to the plane.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "phase": "Plan", "cta": "Got it. On to Phase 2: Plan."}, {"type": "write", "text": "Before you start, write your plan in 1–3 sentences: which method, and which step needs care?", "phase": "Plan", "model": "<p>Pick a point \\(P_0\\) on the plane and let \\(\\mathbf u = P - P_0\\). Project \\(\\mathbf u\\) onto the normal \\(\\mathbf n\\), the vector of coefficients of the plane’s equation; the length of that projection is the distance. The step that needs care is the move from \\(P\\) to \\(Q\\), which runs along the projection toward the plane, not away from it.<\/p>", "checklist": ["pick a point \\(P_0\\) on the plane, and form \\(\\mathbf u = P - P_0\\)", "project \\(\\mathbf u\\) onto the normal \\(\\mathbf n\\), and take the length of that projection", "say how \\(Q\\) comes from \\(P\\): along the projection, toward the plane", "name the step that needs care, such as the direction of the move"]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: pick a point \\(P_0\\) on the plane, let \\(\\mathbf u = P - P_0\\), and project \\(\\mathbf u\\) onto \\(\\mathbf n\\), using \\(\\operatorname{proj}_{\\mathbf n}\\mathbf u=\\dfrac{\\mathbf u\\cdot\\mathbf n}{\\|\\mathbf n\\|^2}\\,\\mathbf n\\). The length of that projection is the distance. Then \\(Q\\) is reached from \\(P\\) by moving along that projection until you land on the plane.<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "num", "text": "Use the point \\(P_0 = (4, 0, 0)\\), which is on the plane, and the normal \\(\\mathbf n = (1, -2, 2)\\). What is the shortest distance from \\(P = (2, -4, 6)\\) to the plane?", "phase": "Carry out", "comment": "Right. \\(\\mathbf u = P - P_0 = (-2, -4, 6)\\), and \\(\\mathbf u\\cdot\\mathbf n = 18\\). So \\(\\operatorname{proj}_{\\mathbf n}\\mathbf u = \\tfrac{18}{9}\\mathbf n = (2, -4, 4)\\), and its length is \\(\\sqrt{36} = 6\\).", "hints": ["Start from \\(\\mathbf u = P - P_0\\), the vector from \\(P_0\\) to \\(P\\), and find \\(\\mathbf u\\cdot\\mathbf n\\).", "The length of the projection of \\(\\mathbf u\\) onto \\(\\mathbf n\\) is \\(\\dfrac{|\\mathbf u\\cdot\\mathbf n|}{\\|\\mathbf n\\|}\\). Find \\(\\|\\mathbf n\\|\\) too.", "Divide by \\(\\|\\mathbf n\\|\\), not by \\(\\|\\mathbf n\\|^2\\). The coefficient \\(\\dfrac{\\mathbf u\\cdot\\mathbf n}{\\|\\mathbf n\\|^2}\\) is not the distance itself."], "shape": [1, 1], "values": [6.0], "answer_tex": "6", "typed_answer": ["6"], "wrong": [{"values": [18.0], "comment": "That is \\(\\mathbf u\\cdot\\mathbf n\\) itself. You forgot to divide by \\(\\|\\mathbf n\\| = 3\\), which turns it into the length of the projection."}, {"values": [2.0], "comment": "That is the scalar \\(\\tfrac{18}{9}\\) in \\(\\operatorname{proj}_{\\mathbf n}\\mathbf u = 2\\mathbf n\\). You divided by \\(\\|\\mathbf n\\|^2 = 9\\), but the distance is the length of that projection, \\(2\\|\\mathbf n\\|\\)."}, {"values": [4.47213595499958], "comment": "That is the length of \\(\\mathbf u - \\operatorname{proj}_{\\mathbf n}\\mathbf u = (-4, 0, 2)\\), the part of \\(\\mathbf u\\) that runs along the plane. Measuring along the plane doesn’t give the distance."}, {"values": [7.333333333333333], "comment": "You used \\(\\mathbf n\\cdot P = 22\\) and forgot to subtract the \\(4\\) in the plane’s equation. The distance is \\(|\\mathbf n\\cdot P - 4|\\) divided by \\(\\|\\mathbf n\\|\\)."}]}, {"type": "matrix", "text": "Now find \\(Q\\), the point of the plane closest to \\(P\\). Enter its coordinates, from top to bottom.", "phase": "Carry out", "comment": "Right. \\(Q = (2, -4, 6) - (2, -4, 4) = (0, 0, 2)\\), since \\((2, -4, 4)\\) is the projection of \\(\\mathbf u\\) onto \\(\\mathbf n\\). It is on the plane: \\(0 - 2\\cdot 0 + 2\\cdot 2 = 4\\).", "label": "Q =", "hints": ["\\(Q\\) is on the line through \\(P\\) in the direction of \\(\\mathbf n\\). Start at \\(P\\), and move along \\(\\mathbf n\\) toward the plane.", "The move is the projection \\(\\operatorname{proj}_{\\mathbf n}\\mathbf u = \\dfrac{\\mathbf u\\cdot\\mathbf n}{\\|\\mathbf n\\|^2}\\,\\mathbf n\\). Work out its coefficient first, then subtract that multiple of \\(\\mathbf n\\) from \\(P\\).", "Check your \\(Q\\) in the plane’s equation, \\(x - 2y + 2z = 4\\). It has to come out exactly."], "shape": [3, 1], "values": [0.0, 0.0, 2.0], "answer_tex": "\\begin{bmatrix}0\\\\0\\\\2\\end{bmatrix}", "typed_answer": ["0", "0", "2"], "wrong": [{"values": [4.0, -8.0, 10.0], "comment": "That is \\(P + \\operatorname{proj}_{\\mathbf n}\\mathbf u\\), which moves away from the plane, the wrong way along \\(\\mathbf n\\). Check: \\(4 - 2(-8) + 2(10) = 40\\), not \\(4\\)."}, {"values": [-4.0, 8.0, -6.0], "comment": "You divided by \\(\\|\\mathbf n\\|\\) instead of \\(\\|\\mathbf n\\|^2\\), so the move is \\(6\\mathbf n\\) instead of \\(2\\mathbf n\\). Check: \\(-4 - 2(8) + 2(-6) = -32\\), not \\(4\\)."}, {"values": [6.0, -4.0, 4.0], "comment": "That subtracts the part of \\(\\mathbf u\\) that runs along the plane, so \\(P\\) slides along the plane instead of moving toward it. Check: \\(6 - 2(-4) + 2(4) = 22\\), not \\(4\\)."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The shortest distance is \\(6\\), and \\(Q = (0, 0, 2)\\).<\/p><p>Last phase: <strong>look back<\/strong>. Check the answer another way, and then see what else the method tells you.<\/p>", "phase": "Look back", "cta": "Got it. On to Phase 4: Look back."}, {"type": "write", "text": "Choose a check of your own and carry it out. What did you check, and did it pass?", "phase": "Look back", "model": "<p>I checked the segment \\(PQ\\). \\(P - Q = (2, -4, 4)\\), which has length \\(\\sqrt{4 + 16 + 16} = 6\\), the same as my distance. Also \\(P - Q = 2\\ma
