<script>window.POLYA = {"slug": "p5-6a-spring-best-fit", "title": "5.6 Problem A: Fitting a line to a spring", "statement": "A spring is hung with loads of 0, 1, 2, and 3 kilograms, and its length is measured each time. The four measurements, as (load in kg, length in cm), are \\((0,10),\\ (1,12),\\ (2,13),\\ (3,15)\\). Find the line \\(y=z_0+z_1x\\) that best fits these measurements, where \\(x\\) is the load. Write \\(\\mathbf z=\\begin{bmatrix}z_0\\\\z_1\\end{bmatrix}\\), and let \\(\\mathbf y\\) be the column of the four lengths.", "questions": [{"type": "write", "text": "In your own words, what is this problem asking for?", "phase": "Understand", "model": "<p>We have four measurements of a spring’s length at four loads, and we want one straight line \\(y=z_0+z_1x\\) that fits them as well as possible. The unknowns are \\(z_0\\) and \\(z_1\\). The four points may not lie on one line, so I need to decide what “best” means before I can compute anything.<\/p>", "checklist": ["says there are four measurements and one straight line to fit them", "says the four points may not lie on one line, so “best” needs a meaning", "names the unknowns, \\(z_0\\) and \\(z_1\\)", "says what a finished answer is: the line"]}, {"type": "explore", "text": "Before any algebra, try it by eye. Drag the two dots until the line fits the four measurements as well as you can.", "phase": "Understand", "widget": {"kind": "fit-line", "quiet": true, "points": [[0, 10], [1, 12], [2, 13], [3, 15]], "xlabel": "load (kg)", "ylabel": "length (cm)", "window": [-1, 4, 9, 16], "start": [12, 12], "hint": "Drag the two dots to move the line. Each orange segment is one vertical error. Make the total of their squares as small as you can."}, "found": "Right. The dashed green line is the least-squares line: no other line makes the squared errors smaller. Now find it exactly."}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The four measurements don’t all lie on one straight line, so no line passes through all four. We want the line that makes the sum of the squared vertical errors as small as possible. The Best Approximation Theorem in this section is the tool for finding it.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "phase": "Plan", "cta": "Got it. On to Phase 2: Plan."}, {"type": "write", "text": "Before you start, write your plan in 1–3 sentences: which method, and which step needs care?", "phase": "Plan", "model": "<p>Set up \\(M\\) with a column of 1s and a column of loads, so that \\(M\\mathbf z\\) gives \\(z_0+z_1x\\) in each row. Then form \\(M^{T}M\\) and \\(M^{T}\\mathbf y\\), and solve the normal equations \\((M^{T}M)\\mathbf z=M^{T}\\mathbf y\\) for \\(\\mathbf z\\). The step that needs care is the column of 1s: it has to be there, and it goes first, so that \\(z_0\\) is the intercept.<\/p>", "checklist": ["names the method: the normal equations \\((M^{T}M)\\mathbf z=M^{T}\\mathbf y\\)", "says \\(M\\) has a column of 1s next to the loads", "names the step that needs care, and why", "says how \\(\\mathbf z\\) gives the line: \\(z_0\\) is the intercept, \\(z_1\\) the slope"]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: let \\(M\\) be the \\(4\\times2\\) matrix with a column of 1s and a column of loads. Form \\(M^{T}M\\) and \\(M^{T}\\mathbf y\\), solve \\((M^{T}M)\\mathbf z=M^{T}\\mathbf y\\), and read off the line \\(y=z_0+z_1x\\).<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "matrix", "text": "Form \\(M^{T}M\\) for this \\(M\\). Enter the \\(2\\times2\\) matrix, row by row.", "phase": "Carry out", "comment": "Right. Entry \\((1,1)\\) counts the rows, entries \\((1,2)\\) and \\((2,1)\\) add up the loads, and entry \\((2,2)\\) adds up the squared loads.", "label": "M^{T}M =", "hints": ["Each entry of \\(M^{T}M\\) is a dot product: entry \\((i,j)\\) multiplies column \\(i\\) of \\(M\\) by column \\(j\\), entry by entry, and adds the products.", "Column 1 of \\(M\\) is all 1s, and column 2 holds the loads. Work out the products for each entry, then add them."], "syntax": "Fill in the entries row by row. Whole numbers are fine.", "shape": [2, 2], "values": [4.0, 6.0, 6.0, 14.0], "answer_tex": "\\begin{bmatrix}4&6\\\\6&14\\end{bmatrix}", "typed_answer": ["4", "6", "6", "14"], "wrong": [{"values": [14.0, 6.0, 6.0, 4.0], "comment": "That is what you get if the loads come first in \\(M\\). Keep the column of 1s first, so the rows match \\(\\mathbf z=(z_0,z_1)\\)."}, {"values": [4.0, 6.0, 6.0, 6.0], "comment": "The \\((2,2)\\) entry is the sum of the squared loads, so each load is squared before it is added. The \\(6\\) is the plain sum of the loads, so the squares were skipped."}, {"values": [3.0, 3.0, 3.0, 5.0], "comment": "That matrix comes from only the first three rows of \\(M\\). The measurement at 3 kg is left out, and every measurement belongs in the fit."}]}, {"type": "matrix", "text": "Solve \\((M^{T}M)\\mathbf z=M^{T}\\mathbf y\\) for \\(\\mathbf z=(z_0,z_1)\\). Enter \\(\\mathbf z\\) as a column, with \\(z_0\\) on top.", "phase": "Carry out", "comment": "Right. Solving \\(4z_0+6z_1=50\\) and \\(6z_0+14z_1=83\\) gives \\(z_0=\\tfrac{101}{10}\\) and \\(z_1=\\tfrac85\\).", "label": "\\mathbf z =", "hints": ["The right side of the normal equations is \\(M^{T}\\mathbf y\\). Multiply each length by its load and add those products. Separately, add up the lengths.", "Write the two normal equations, one from each row of \\((M^{T}M)\\mathbf z=M^{T}\\mathbf y\\), and solve them as a pair. Then check your \\(\\mathbf z\\) in both."], "syntax": "Fractions are fine. Enter z0 on top, then z1.", "shape": [2, 1], "values": [10.1, 1.6], "answer_tex": "\\begin{bmatrix}\\frac{101}{10}\\\\\\frac{8}{5}\\end{bmatrix}", "typed_answer": ["101/10", "8/5"], "wrong": [{"values": [1.6, 10.1], "comment": "The entries are swapped. \\(z_0\\) is the intercept, so it goes on top, and \\(z_1\\) is the slope."}, {"values": [10.0, 2.0], "comment": "That is the line through just the first two measurements, \\((0,10)\\) and \\((1,12)\\). It ignores the other two, and the best fit uses all four."}, {"values": [0.0, 5.928571428571429], "comment": "That line passes through the origin, so its intercept is \\(0\\). A column of 1s was left out of \\(M\\)."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The answer is \\(y=10.1+1.6x\\), so \\(z_0=10.1\\) and \\(z_1=1.6\\).<\/p><p>Last phase: <strong>look back<\/strong>. Test the answer in a way that doesn’t just repeat the arithmetic.<\/p>", "phase": "Look back", "cta": "Got it. On to Phase 4: Look back."}, {"type": "write", "text": "Choose a check of your own and carry it out. What did you check, and did it pass?", "phase": "Look back", "model": "<p>I checked the vertical errors \\(y_i-(z_0+z_1x_i)\\): \\(-0.1,\\ 0.3,\\ -0.3,\\ 0.1\\). They add to \\(0\\), as they must: the first normal equation, \\(4z_0+6z_1=50\\), says that \\(\\sum(y_i-z_0-z_1x_i)=0\\). It passed.<\/p>", "checklist": ["names the check, such as the vertical errors or their squares", "carries it out with numbers, not just words", "says whether it passed", "says what the check would catch if the answer were wrong"]}, {"type": "error", "text": "<p>A classmate solved this problem. Read the solution one line at a time, and click the first line that is wrong.<\/p>", "phase": "Look back", "lines": [{"html": "Write \\(M\\) with a column of 1s and a column of loads. Its rows are \\((1,0),\\ (1,1),\\ (1,2),\\ (1,3)\\).", "wrong": false, "comment": "Each row is \\((1,x)\\) for one measurement, with the 1 first. That is the set-up from the plan."}, {"html": "The normal equations are \\(MM^{T}\\mathbf z=M^{T}\\mathbf y\\), so I form \\(MM^{T}\\) first.", "wrong": true, "comment": "Right. The order is backwards. The normal equations use \\(M^{T}M\\), which is \\(2\\times2\\) and matches the two unknowns. \\(MM^{T}\\) is \\(4\\times4\\), so it can’t multiply \\(\\mathbf z\\), which has two entries."}, {"html": "\\(M^{T}\\mathbf y=\\begin{bmatrix}50\\\\83\\end{bmatrix}\\), since the lengths add to \\(50\\) and the lengths times their loads add to \\(83\\).", "wrong": false, "comment": "The sums check out: \\(10+12+13+15=50\\), and \\(0\\cdot10+1\\cdot12+2\\cdot13+3\\cdot15=83\\). The trouble started one line earlier."}]}, {"type": "example", "text": "Now build one. Enter three data points, \\((x,y)\\) each, whose least-squares line passes through all three of them.", "phase": "Look back", "shape": [3, 2], "conditions": [{"js": "!(M[0][0].eq(M[1][0]) && M[1][0].eq(M[2][0]))", "comment": "The x values can’t all be the same. Three points with one x value lie on a vertical line, which is not the graph of any \\(y=z_0+z_1x\\), so the least-squares line is not unique."}, {"js": "det([[M[0][0], M[0][1], 1], [M[1][0], M[1][1], 1], [M[2][0], M[2][1], 1]]).isZero()", "comment": "These three points don’t all lie on one line. A line that passes through all three makes every error \\(0\\), so the points must be collinear."}, {"js": "!(M[0][0].eq(M[1][0]) && M[0][1].eq(M[1][1])) && !(M[0][0].eq(M[2][0]) && M[0][1].eq(M[2][1])) && !(M[1][0].eq(M[2][0]) && M[1][1].eq(M[2][1]))", "comment": "Use three different points. Repeating a point doesn’t give the fit a second measurement."}], "comment": "Right. Your three points lie on one line, so the line through them makes every error \\(0\\). The x values differ, so that line is the only least-squares line, and it passes through all three points.", "model": "\\((0,1),\\ (1,3),\\ (2,5)\\), one point per row. They all lie on \\(y=1+2x\\), so every error is \\(0\\), and that line is the least-squares line.", "hints": ["Pick a line with an easy slope, such as one that rises by \\(1\\) each time \\(x\\) goes up by \\(1\\). Read off three points on it, at three different \\(x\\)-values.", "Three points lie on one line when the slope from the first point to the second equals the slope from the second to the third. Check both slopes."], "syntax": "One point per row: x, then y. Fractions like 1/2 are fine."}, {"type": "mc", "text": "Suppose we use the line to predict the length at a 2.5 kg load. Which statement about that prediction is correct?", "phase": "Look back", "answers": [{"html": "It predicts \\(4.0\\) cm. That is reasonable, because the spring stretches only \\(1.6\\) cm per kilogram.", "ok": false, "comment": "That leaves out the starting length \\(z_0=10.1\\): the prediction is \\(10.1+4.0=14.1\\). A length of 4 cm makes no sense next to the 13 cm and 15 cm measured at 2 and 3 kg."}, {"html": "It predicts \\(26.85\\) cm. That is reasonable, because the slope is steep.", "ok": false, "comment": "This swaps the intercept and the slope. At 2.5 kg the spring should be between 13 and 15 cm, so 26.85 cm is far too long."}, {"html": "It predicts \\(14.1\\) cm. That is reasonable, because 2.5 kg lies between the 2 kg and 3 kg measurements, which were 13 cm and 15 cm.", "ok": true, "comment": "Right. \\(10.1+1.6(2.5)=14.1\\). A load between 2 kg and 3 kg should give a length between 13 and 15 cm, and 14.1 does."}, {"html": "It predicts \\(14.1\\) cm, and that value is exact, since the line passes through every measurement.", "ok": false, "comment": "The line does not pass through every measurement. The four points don’t lie on one line, so the line balances the misses, and \\(14.1\\) cm is an estimate."}]}, {"type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate says, \"My line must be wrong, because the vertical errors are not all zero.\" What step did they skip? Then name one habit from this problem you want to use on the next one.<\/p>", "phase": "Look back"}], "goal": "Find the least-squares line through measurements that no single line fits exactly, by solving the normal equations.", "connects": "Builds on 4.2 (projecting a vector onto a plane) and 5.1 (the column space of a matrix). T
