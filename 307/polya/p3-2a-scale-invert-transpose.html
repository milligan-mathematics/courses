<script>window.POLYA = {"slug": "p3-2a-scale-invert-transpose", "title": "3.2 Problem A: Scale, invert, and transpose", "statement": "Let \\(A\\) and \\(B\\) be \\(3\\times 3\\) matrices with \\(\\det A = 2\\) and \\(\\det B = -1\\). Find \\(\\det(2A^{-1}B^{T})\\), and decide whether \\(2A^{-1}B^{T}\\) is invertible.", "questions": [{"type": "write", "text": "In your own words, what is this problem asking for?", "phase": "Understand", "model": "<p>It asks for \\(\\det(2A^{-1}B^{T})\\), the determinant of a product with a scalar, an inverse and a transpose. I can’t compute it from the entries, because the entries of \\(A\\) and \\(B\\) aren’t given. So I need the determinant rules for each piece. The expression uses \\(A^{-1}\\), which exists because \\(\\det A\\) is not zero. The problem also asks whether \\(2A^{-1}B^{T}\\) is invertible.<\/p>", "checklist": ["say what is unknown: one determinant, and whether the product is invertible", "say that the entries of \\(A\\) and \\(B\\) aren’t given, so the determinant rules must do the work", "note that \\(A\\) is invertible, because its determinant is not zero", "name the rules needed: for a scalar, an inverse, a transpose and a product"]}, {"type": "explore", "text": "Predict first: if you double both columns of a \\(2\\times 2\\) matrix, does its area double? Then check. Start from the identity, where the square has area \\(1\\), and drag the two dots until both columns are doubled.", "phase": "Understand", "widget": {"kind": "grid-map", "A": [[1, 0], [0, 1]], "goal": "det", "det": 4, "solution": [[2, 0], [0, 2]]}, "found": "Right. The area is now \\({det}\\) times what it was. Doubling both columns of a \\(2\\times 2\\) matrix multiplies its area by \\(4\\), not by \\(2\\). What would doubling all nine entries of a \\(3\\times 3\\) matrix do to its volume?"}, {"type": "mc", "text": "What do \\(\\det A = 2\\) and \\(\\det B = -1\\) tell you about \\(A\\) and \\(B\\)?", "phase": "Understand", "answers": [{"html": "Both are invertible, because a square matrix is invertible exactly when its determinant is not zero.", "ok": true, "comment": "Right. Both determinants are nonzero, so \\(A\\) and \\(B\\) are both invertible. That is what lets us use \\(A^{-1}\\) in the expression."}, {"html": "Neither is invertible, because a nonzero determinant means the matrix has no inverse.", "ok": false, "comment": "That reverses the rule. A matrix is invertible when its determinant is not zero, so these nonzero determinants mean both matrices have inverses."}, {"html": "\\(A\\) is invertible, but \\(B\\) is not, because its determinant is negative.", "ok": false, "comment": "The sign doesn’t decide it. Only whether the determinant is zero matters, and \\(-1\\) is not zero, so \\(B\\) is invertible too."}, {"html": "Nothing. The determinant doesn’t say whether a matrix is invertible.", "ok": false, "comment": "The determinant does say that. A matrix is invertible exactly when its determinant is not zero. That is why the problem can use \\(A^{-1}\\)."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> We know what’s being asked, and both matrices are invertible. The expression has a scalar, an inverse, a transpose, and several matrix factors, but we only know two determinants. Before any arithmetic, we need a plan.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "phase": "Plan", "cta": "Got it. On to Phase 2: Plan."}, {"type": "write", "text": "Before you start, write your plan in 1–3 sentences: which method, and which step needs care?", "phase": "Plan", "model": "<p>I’ll split \\(\\det(2A^{-1}B^{T})\\) with the Product Theorem into \\(\\det(2A^{-1})\\) and \\(\\det(B^{T})\\), and use one rule for each piece: the scalar rule, the inverse rule, and the transpose rule. The step that needs care is the 2. It is a scalar on a \\(3\\times 3\\) matrix, so its effect on the determinant depends on the size of the matrix, not on the 2 alone.<\/p>", "checklist": ["split the determinant into pieces with the Product Theorem", "handle the scalar 2 with the size of the matrix in mind", "use the inverse rule for \\(\\det(A^{-1})\\)", "note that the transpose doesn’t change the determinant"]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: split the expression into pieces, and apply the rule for each piece. We start with the piece \\(2A^{-1}\\).<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "error", "text": "A classmate solved \\(\\det(2A^{-1}B^{T})\\) in four lines. Read them in order, and click the first line that is wrong.", "phase": "Carry out", "lines": [{"html": "By the Product Theorem, \\(\\det(2A^{-1}B^{T})=\\det(2A^{-1})\\cdot\\det(B^{T})\\).", "wrong": false, "comment": "The Product Theorem splits the determinant of a product into a product of determinants."}, {"html": "Transposing doesn’t change a determinant, so \\(\\det(B^{T})=\\det B\\).", "wrong": false, "comment": "Transposing leaves the determinant alone, so this piece is \\(\\det B\\)."}, {"html": "The 2 is a scalar, so \\(\\det(2A^{-1})=2\\cdot\\det(A^{-1})\\).", "wrong": true, "comment": "Right. That is the slip. The 2 multiplies every row of \\(A^{-1}\\), so it comes out of each of the three rows, not just once."}, {"html": "The determinant of an inverse is \\(\\det(A^{-1})=1/\\det A\\).", "wrong": false, "comment": "It is true, but it doesn’t repair line 3. A correct fact can’t undo an earlier slip."}]}, {"type": "num", "text": "Carry out the first piece. What is \\(\\det(2A^{-1})\\)?", "phase": "Carry out", "comment": "Right. Each of the three rows contributes a factor of \\(2\\), so the scalar part is \\(2^{3}=8\\). Also \\(\\det(A^{-1})=1/\\det A=\\tfrac12\\), and \\(8\\cdot\\tfrac12=4\\).", "hints": ["Each of the three rows of \\(2A^{-1}\\) is twice the matching row of \\(A^{-1}\\). How does a factor of \\(2\\) in one row change the determinant?", "So \\(\\det(2A^{-1})=2^{3}\\det(A^{-1})\\) for a \\(3\\times 3\\) matrix. Then use \\(\\det(A^{-1})=1/\\det A\\)."], "shape": [1, 1], "values": [4.0], "answer_tex": "4", "typed_answer": ["4"], "wrong": [{"values": [1.0], "comment": "That is the classmate’s slip, with the 2 counted once. Each of the three rows contributes its own factor of \\(2\\)."}, {"values": [8.0], "comment": "Careful: that is only the scalar part. The inverse has a determinant too, \\(\\det(A^{-1})=1/\\det A\\), and it multiplies in."}, {"values": [16.0], "comment": "You used \\(\\det A=2\\) where \\(\\det(A^{-1})\\) belongs. The inverse has the reciprocal determinant, \\(1/\\det A\\), not \\(\\det A\\)."}, {"values": [-16.0], "comment": "You flipped the sign. The determinant of an inverse is \\(1/\\det A\\), which has the same sign as \\(\\det A\\), so it is not \\(-\\det A\\)."}]}, {"type": "num", "text": "Put the pieces together. What is \\(\\det(2A^{-1}B^{T})\\)?", "phase": "Carry out", "comment": "Right. The determinant of a product is the product of the determinants, so \\(\\det(2A^{-1}B^{T})=\\det(2A^{-1})\\det(B^{T})=4\\cdot(-1)=-4\\). Transposing doesn’t change the determinant.", "hints": ["Split the determinant with the Product Theorem: \\(\\det(2A^{-1}B^{T})=\\det(2A^{-1})\\cdot\\det(B^{T})\\). You found the first piece a moment ago.", "The transpose doesn’t change the determinant, so \\(\\det(B^{T})=\\det B\\). Multiply that by your first piece."], "shape": [1, 1], "values": [-4.0], "answer_tex": "-4", "typed_answer": ["-4"], "wrong": [{"values": [-1.0], "comment": "That uses \\(\\det(2A^{-1})=1\\), the classmate’s slip with the 2 counted once. Redo that first piece with a factor of \\(2\\) from each row."}, {"values": [16.0], "comment": "That uses \\(-\\det A\\) for \\(\\det(A^{-1})\\), which flips the sign of the first piece. The inverse has the reciprocal determinant, \\(1/\\det A\\), which has the same sign as \\(\\det A\\)."}, {"values": [4.0], "comment": "That treats \\(\\det(B^{T})\\) as \\(-\\det B=1\\). Transposing doesn’t change the determinant, so \\(\\det(B^{T})=\\det B\\)."}, {"values": [-16.0], "comment": "That uses \\(\\det A=2\\) for \\(\\det(A^{-1})\\). The inverse has the reciprocal determinant, \\(1/\\det A\\), not \\(\\det A\\)."}]}, {"type": "mc", "text": "Is \\(2A^{-1}B^{T}\\) invertible?", "phase": "Carry out", "answers": [{"html": "No. Its determinant is negative, and only positive determinants come from invertible matrices.", "ok": false, "comment": "The sign doesn’t matter. Only zero versus nonzero decides invertibility, and \\(-4\\) is not zero."}, {"html": "It can’t be decided, because we don’t know the entries of \\(A\\) and \\(B\\).", "ok": false, "comment": "We don’t need the entries. The determinant settles it, and it is not zero."}, {"html": "Yes. Its determinant is not zero.", "ok": true, "comment": "Right. A square matrix is invertible exactly when its determinant is not zero. Here the determinant is \\(-4\\), and \\(-4\\neq 0\\). We never needed the entries of \\(A\\) and \\(B\\)."}, {"html": "Yes, because it is a \\(3\\times 3\\) matrix, and square matrices have inverses.", "ok": false, "comment": "Yes is the right answer, but this reason is wrong. Being square is not enough: a \\(3\\times 3\\) matrix with determinant zero has no inverse."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The answer is \\(\\det(2A^{-1}B^{T})=-4\\), and \\(2A^{-1}B^{T}\\) is invertible. Back to the figure: doubling all nine entries of a \\(3\\times 3\\) matrix multiplies its determinant by \\(2^{3}=8\\), not by \\(2\\).<\/p><p>Last phase: <strong>look back<\/strong>. Check the value another way.<\/p>", "phase": "Look back", "cta": "Got it. On to Phase 4: Look back."}, {"type": "mc", "text": "Which of these would check your value of \\(\\det(2A^{-1}B^{T})\\)?", "phase": "Look back", "answers": [{"html": "Check that \\(2A^{-1}B^{T}\\) is \\(3\\times 3\\).", "ok": false, "comment": "A size check is a good start, but a \\(3\\times 3\\) matrix can have any determinant."}, {"html": "Take \\(A\\) diagonal with diagonal entries \\(2, 1, 1\\) and \\(B\\) diagonal with diagonal entries \\(-1, 1, 1\\), and compute \\(\\det(2A^{-1}B^{T})\\) directly.", "ok": true, "comment": "Right. These matrices have \\(\\det A=2\\) and \\(\\det B=-1\\), so they fit the problem. Computing with actual matrices gives \\(-4\\) without using the determinant rules, so it is an independent check."}, {"html": "Multiply \\(2A^{-1}B^{T}\\) by its own inverse, and check that you get the identity matrix.", "ok": false, "comment": "That checks that the matrix is invertible, not what its determinant is. Many invertible matrices have different determinants."}, {"html": "Take \\(A=B=I\\), the identity matrix, and compute \\(\\det(2A^{-1}B^{T})\\) directly.", "ok": false, "comment": "The identity has determinant \\(1\\), not \\(2\\) and \\(-1\\). A check has to use matrices with the given determinants, or it doesn’t test this problem."}]}, {"type": "example", "text": "Vary the problem. Give a \\(2\\times 2\\) matrix \\(A\\) with \\(\\det(3A)=18\\). Any one that works is right.", "phase": "Look back", "shape": [2, 2], "conditions": [{"js": "det(scale(3, M)).eq(18)", "comment": "Check the scalar. For a \\(2\\times 2\\) matrix, \\(\\det(3A)=9\\det A\\), not \\(3\\det A\\), so work out what \\(\\det A\\) has to be."}], "comment": "Right. For a \\(2\\times 2\\) matrix, \\(\\det(3A)=9\\det A\\), so \\(\\det A=2\\) gives \\(18\\). Many matrices work, so there is no single answer.", "model": "For example, \\(A=\\begin{bmatrix}1&0\\\\0&2\\end{bmatrix}\\). Then \\(3A=\\begin{bmatrix}3&0\\\\0&6\\end{bmatrix}\\), and \\(\\det(3A)=18\\).", "label": "A =", "hints": ["For a \\(2\\times 2\\) matrix, what does the scalar \\(3\\) do to the determinant? Compare \\(\\det(3A)\\) with \\(\\det A\\).", "So \\(\\det A\\) must be \\(18\\) divided by that factor. Any \\(2\\times 2\\) matrix with that determinant works, and a diagonal one is the easiest."], "syntax": "Fill in the four entries, row by row. Whole numbers or fractions are fine."}, {"type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). Suppose a classmate, asked for \\(\\det(A+B)\\), writes \\(\\det(A+B)=\\det A+\\det B=2+(-1)=1\\), so \\(A+B\\) must be invertible. What is wrong with this reasoning?<\/p>", "phase": "Look back"}], "goal": "Find the determinant of a product with a scalar, an inverse and a transpose, knowing only det A and det B.", "connects": "Builds on 2.4 (inverses) and 3.1 (determinants). It uses the Product Theorem and the rules for a scalar, an inverse and a transpose, the determinant properties this section introduces.", "discuss": "For a \\(3\\times 3\\) matrix \\(A\\), for which values of \\(c\\) does \\(\\det(cA)=c\\det A\\) hold for every such \\(A\\)? How does your answer change for \\(2\\times 2\\) matrices?", "cold": [8, 9], "twins": [{"statement": "Let \\(A\\) and \\(B\\) be \\(4\\times 4\\) matrices with \\(\\det A = -3\\) and \\(\\det B = 4\\).", "steps": [{"type": "num", "text": "What is \\(\\det(-3A^{-1}B^{T})\\)?", "comment": "Right. The scalar gives \\((-3)^{4}=81\\). The inverse gives \\(1/\\det A=1/(-3)\\), and transposing leaves \\(\\det B=4\\) alone. Multiplying out gives \\(-108\\).", "shape": [1, 1], "values": [-108.0], "answer_tex": "-108", "typed_answer": ["-108"], "wrong": [{"values": [4.0], "comment": "You counted the scalar once. Each of the \\(4\\) rows contributes a factor of \\(-3\\), so the scalar part is \\((-3)^{4}\\), not \\(-3\\)."}, {"values": [-972.0], "comment": "You used \\(\\det A\\) where \\(\\det(A^{-1})=1/\\det A\\) belongs. The inverse has the reciprocal determinant."}, {"values": [108.0], "comment": "Transposing doesn’t change the sign of a determinant: \\(\\det(B^{T})=\\det B\\), not \\(-\\det B\\)."}]}]}, {"statement": "Let \\(A\\) and \\(B\\) be \\(4\\times 4\\) matrices with \\(\\det A = -2\\) and \\(\\det B = 4\\).", "steps": [{"type": "num", "text": "What is \\(\\det(3A^{-1}B^{T})\\)?", "comment": "Right. The scalar gives \\(3^{4}=81\\). The inverse gives \\(1/\\det A=1/(-2)\\), and transposing leaves \\(\\det B=4\\) alone. Multiplying out gives \\(-162\\).", "shape": [1, 1], "values": [-162.0], "answer_tex": "-162", "typed_answer": ["-162"], "wrong": [{"values": [-6.0], "comment": "You counted the scalar once. Each of the \\(4\\) rows contributes a factor of \\(3\\), so the scalar part is \\(3^{4}\\), not \\(3\\)."}, {"values": [-648.0], "comment": "You used \\(\\det A\\) where \\(\\det(A^{-1})=1/\\det A\\) belongs. The inverse has the reciprocal determinant."}, {"values": [162.0], "comment": "Transposing doesn’t change the sign of a determinant: \\(\\det(B^{T})=\\det B\\), not \\(-\\det B\\)."}]}]}, {"statement": "Let \\(A\\) and \\(B\\) be \\(3\\times 3\\) matrices with \\(\\det A = -5\\) and \\(\\det B = 4\\).", "steps": [{"type": "num", "text": "What is \\(\\det(-3A^{T}B^{2})\\)?", "comment": "Right. The scalar gives \\((-3)^{3}=-27\\). Transposing A leaves \\(\\det A=-5\\) alone, and \\(\\det(B^{2})=(\\det B)^{2}=16\\). Multiplying out gives \\(2160\\).", "shape": [1, 1], "values": [2160.0], "answer_tex": "2160", "typed_answer": ["2160"], "wrong": [{"values": [240.0], "comment": "You counted the scalar once. Each of the \\(3\\) rows contributes a factor of \\(-3\\), so the scalar part is \\((-3)^{3}\\), not \\(-3\\)."}, {"values": [540.0], "comment": "Squaring a matrix squares its determinant: \\(\\det(B^{2})=(\\det B)^{2}\\). So the \\(B^{2}\\) factor gives \\(4^{2}\\), not \\(4\\)."}, {"values": [-2160.0], "comment": "Transposing doesn’t change the sign of a determinant: \\(\\det(A^{T})=\\det A\\), not \\(-\\det A\\)."}]}]}, {"statement": "Let \\(A\\) and \\(B\\) be \\(4\\times 4\\) matrices with \\(\\det A = -4\\) and \\(\\det B = 2\\).", "steps": [{"type": "num", "text": "What is \\(\\det(3A^{T}B^{-1})\\)?", "comment": "Right. The scalar gives \\(3^{4}=81\\). Transposing A leaves \\(\\det A=-4\\) alone, and the inverse gives \\(1/\\det B=1/2\\). Multiplying out gives \\(-162\\).", "shape": [1, 1], "values": [-162.0], "answer_tex": "-162", "typed_answer": ["-162"], "wrong": [{"values": [-6.0], "comment": "You counted the scalar once. Each of the \\(4\\) rows contributes a factor of \\(3\\), so the scalar part is \\(3^{4}\\), not \\(3\\)."}, {"values": [-648.0], "comment": "You used \\(\\det B\\) where \\(\\det(B^{-1})=1/\\det B\\) belongs. The inverse has the reciprocal determinant."}, {"values": [162.0], "comment": "Transposing doesn’t change the sign of a determinant: \\(\\det(A^{T})=\\det A\\), not \\(-\\det A\\)."}]}]}, {"statement": "Let \\(A\\) and \\(B\\) be \\(3\\times 3\\) matrices with \\(\\det A = -3\\) and \\(\\det B = -3\\).", "steps": [{"type": "num", "text": "What is \\(\\det(-3A^{-1}B^{T})\\)?", "comment": "Right. The scalar gives \\((-3)^{3}=-27\\). The inverse gives \\(1/\\det A=1/(-3)\\), and transposing leaves \\(\\det B=-3\\) alone. Multiplying out gives \\(-27\\).", "shape": [1, 1], "values": [-27.0], "answer_tex": "-27", "typed_answer": ["-27"], "wrong": [{"values": [-3.0], "comment": "You counted the scalar once. Each of the \\(3\\) rows contributes a factor of \\(-3\\), so the scalar part is \\((-3)^{3}\\), not \\(-3\\)."}, {"values": [-243.0], "comment": "You used \\(\\det A\\) where \\(\\det(A^{-1})=1/\\det A\\) belongs. The inverse has the reciprocal determinant."}, {"values": [27.0], "comment": "Transposing doesn’t change the sign of a determinant: \\(\\det(B^{T})=\\det B\\), not \\(-\\det B\\)."}]}]}, {"statement": "Let \\(A\\) and \\(B\\) be \\(3\\times 3\\) matrices with \\(\\det A = -2\\) and \\(\\det B = 5\\).", "steps": [{"type": "num", "text": "What is \\(\\det(-2A^{-1}B^{T})\\)?", "comment": "Right. The scalar gives \\((-2)^{3}=-8\\). The inverse gives \\(1/\\det A=1/(-2)\\), and transposing leaves \\(\\det B=5\\) alone. Multiplying out gives \\(20\\).", "shape": [1, 1], "values": [20.0], "answer_tex": "20", e scalar part is \\(2^{3}\\), not \\(2\\)."}, {"values": [-80.0], "comment": "You used \\(\\det A\\) where \\(\\det(A^{-1})=1/\\det A\\) belongs. The inverse has the reciprocal determinant."}, {"values": [20.0], "comment": "Transposing doesn’t change the sign of a determinant: \\(\\det(B^{T})=\\det B\\), not \\(-\\det B\\)."}]}]}, {"statement": "Let \\(A\\) and \\(B\\) be \\(2\\times 2\\) matrices with \\(\\det A = -4\\) and \\(\\det B = 3\\).", "steps": [{"type": "num", "text": "What is \\(\\det(-2A^{-1}B^{T})\\)?", "comment": "Right. The scalar gives \\((-2)^{2}=4\\). The inverse gives \\(1/\\det A=1/(-4)\\), and transposing leaves \\(\\det B=3\\) alone. Multiplying out gives \\(-3\\).", "shape": [1, 1], "values": [-3.0], "answer_tex": "-3", "typed_answer": ["-3"], "wrong": [{"values": [1.5], "comment": "You counted the scalar once. Each of the \\(2\\) rows contributes a factor of \\(-2\\), so the scalar part is \\((-2)^{2}\\), not \\(-2\\)."}, {"values": [-48.0], "comment": "You used \\(\\det A\\) where \\(\\det(A^{-1})=1/\\det A\\) belongs. The inverse has the reciprocal determinant."}, {"values": [3.0], "comment": "Transposing doesn’t change the sign of a determinant: \\(\\det(B^{T})=\\det B\\), not \\(-\\det B\\)."}]}]}, {"statement": "Let \\(A\\) and \\(B\\) be \\(3\\times 3\\) matrices with \\(\\det A = -2\\) and \\(\\det B = -3\\).", "steps": [{"type": "num", "text": "What is \\(\\det(-2A^{T}B^{2})\\)?", "comment": "Right. The scalar gives \\((-2)^{3}=-8\\). Transposing A leaves \\(\\det A=-2\\) alone, and \\(\\det(B^{2})=(\\det B)^{2}=9\\). Multiplying out gives \\(144\\).", "shape": [1, 1], "values": [144.0], "answer_tex": "144", "typed_answer": ["144"], "wrong": [{"values": [36.0], "comment": "You counted the scalar once. Each of the \\(3\\) rows contributes a factor of \\(-2\\), so the scalar part is \\((-2)^{3}\\), not \\(-2\\)."}, {"values": [-48.0], "comment": "Squaring a matrix squares its determinant: \\(\\det(B^{2})=(\\det B)^{2}\\). So the \\(B^{
