<script>window.POLYA = {"slug": "p1-5a-circuit", "title": "1.5 Problem A: Two batteries, one shared resistor", "statement": "Find the currents \\(I_1, I_2, I_3\\) in the circuit below, in amperes, using Ohm’s law and Kirchhoff’s laws. The arrows show the directions we assume for the three currents.<img src=\"https://milligan-mathematics.github.io/courses/307/polya/img/circuit-1-5a.svg\" alt=\"Circuit with three vertical branches between junction A at the top and junction B at the bottom. Left branch: a 2 Ω resistor above a 20 V battery with its positive plate up; the assumed current I1 flows upward. Middle branch: a 4 Ω resistor; the assumed current I2 flows downward. Right branch: a 2 Ω resistor above a 10 V battery with its positive plate up; the assumed current I3 flows upward.\" style=\"display:block;max-width:100%;height:auto;margin:8px auto 0;\">", "questions": [{"type": "mc", "text": "What is this problem asking you to find?", "phase": "Understand", "answers": [{"html": "The three currents \\(I_1, I_2, I_3\\), in amperes, measured along the arrows in the figure.", "ok": true, "comment": "Right. Each answer is an amount of current in amperes, for one branch, measured along that branch’s arrow."}, {"html": "The total resistance of the circuit.", "ok": false, "comment": "Total resistance wouldn’t tell you how the current splits among the three branches, and that split is what we want."}, {"html": "The current through the 4 \\(\\Omega\\) resistor only.", "ok": false, "comment": "That is \\(I_2\\), one of the three. The question asks for all three currents."}, {"html": "The voltage at junctions \\(A\\) and \\(B\\).", "ok": false, "comment": "The batteries supply voltages and the resistors have voltage drops, but the question asks for currents in amperes."}]}, {"type": "mc", "text": "Suppose the middle 4 \\(\\Omega\\) resistor were replaced by a plain wire, with no resistance. What would \\(I_1\\) be?", "phase": "Understand", "answers": [{"html": "\\(0\\) A.", "ok": false, "comment": "The wire doesn’t take all the current. The left battery still drives current around its own loop, through its 2 \\(\\Omega\\) resistor and back through the wire."}, {"html": "\\(4\\) A.", "ok": false, "comment": "The middle resistor does matter. With a wire there, the left loop is just \\(2I_1 = 20\\), so \\(I_1\\) changes."}, {"html": "\\(10\\) A.", "ok": true, "comment": "Right. With a wire in the middle, the left loop has only the 20 V battery and its 2 \\(\\Omega\\) resistor, so \\(I_1 = 20 \\div 2 = 10\\) A."}, {"html": "\\(15\\) A.", "ok": false, "comment": "That is \\(I_2\\) in this case, the total flowing through the wire. The question asks about the left branch, \\(I_1\\)."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> We want three currents, so we need three independent equations for three unknowns. The Junction Rule says that what flows into a junction equals what flows out. The Circuit Rule says that around a closed loop the drops equal the rises. A resistor drops \\(RI\\) (Ohm’s law), and that drop counts as positive when you travel with the current. A battery is a rise when you pass through it from its \\(-\\) plate to its \\(+\\) plate, and a drop when you pass from \\(+\\) to \\(-\\).<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "phase": "Plan", "cta": "Got it. On to Phase 2: Plan."}, {"type": "multi", "text": "Which of these plans would find all three currents? Select all that apply.", "phase": "Plan", "answers": [{"html": "Write the Circuit Rule for the left loop and the right loop, and solve those two equations.", "ok": false, "comment": "Two equations can’t pin down three unknowns. Without the Junction Rule, the currents can shift in many ways and still satisfy both loops."}, {"html": "Write the Junction Rule at \\(A\\), and the Circuit Rule for the left loop and the outer loop (both batteries and both 2 \\(\\Omega\\) resistors). Then solve.", "ok": true, "comment": "Also works. The outer loop equals the left loop minus the right loop, so the junction equation plus any two loop equations will do."}, {"html": "Write the Junction Rule at \\(A\\), and the Circuit Rule for the left loop and the right loop. Then solve the three equations together.", "ok": true, "comment": "This is the plan of Example 1.5.1. Three independent equations for three unknowns pin down one answer."}, {"html": "Write the Junction Rule at \\(A\\) and at \\(B\\), and solve those two equations.", "ok": false, "comment": "Junction \\(B\\) gives the same equation as junction \\(A\\): every current that leaves one junction arrives at the other. Two copies of one equation can’t determine three currents."}]}, {"type": "mc", "text": "Which step in this setup needs the most care?", "phase": "Plan", "answers": [{"html": "Getting the signs right when you go around a loop.", "ok": true, "comment": "Exactly. A drop is positive only when you travel with its current, and a battery is a rise only when you pass from \\(-\\) to \\(+\\). A sign slip still gives a tidy equation, just the wrong one."}, {"html": "Applying \\(V = RI\\) to each battery and its resistor as separate circuits.", "ok": false, "comment": "The two outer branches each have one battery and one resistor, but the middle resistor connects them. The currents have to be found together."}, {"html": "Adding the two battery voltages, \\(20 + 10\\), in every loop equation.", "ok": false, "comment": "The batteries don’t always add. Around the outer loop they oppose each other, so their voltages combine as a difference."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: write the Junction Rule at \\(A\\) and the Circuit Rule for the left and right loops, traveling clockwise around each loop. Put the three equations in an augmented matrix with columns \\(I_1, I_2, I_3\\), the junction in row 1, the left loop in row 2, and the right loop in row 3. Then reduce it.<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "phase": "Carry out", "cta": "Got it. On to Phase 3: Carry out."}, {"type": "mc", "text": "Write the Junction Rule at \\(A\\). Which equation do you get?", "phase": "Carry out", "answers": [{"html": "\\(I_1 + I_2 + I_3 = 0\\)", "ok": false, "comment": "\\(I_2\\) flows away from \\(A\\), so it counts as outgoing. Adding it as if it flowed in is the mistake."}, {"html": "\\(I_1 + I_3 = I_2\\)", "ok": true, "comment": "Right. \\(I_1\\) and \\(I_3\\) flow up into \\(A\\), and \\(I_2\\) flows down and out of it. In equals out."}, {"html": "\\(I_1 = I_2 + I_3\\)", "ok": false, "comment": "That reverses in and out. \\(I_1\\) flows into \\(A\\), and \\(I_2\\) flows out of it."}, {"html": "\\(I_1 - I_3 = I_2\\)", "ok": false, "comment": "\\(I_3\\) flows up into \\(A\\), the same way as \\(I_1\\), so both count as incoming. Subtracting \\(I_3\\) treats it as leaving."}]}, {"type": "mc", "text": "Travel clockwise around the left loop: up the left branch, then down the middle. Which equation does the Circuit Rule give?", "phase": "Carry out", "answers": [{"html": "\\(2I_1 + 4I_1 = 20\\)", "ok": false, "comment": "The middle resistor carries \\(I_2\\), not \\(I_1\\). The current \\(I_1\\) flows only up the left branch."}, {"html": "\\(2I_1 + 4I_2 = -20\\)", "ok": false, "comment": "Going up through the battery takes you from \\(-\\) to \\(+\\), a rise of 20 V, so the right side is \\(+20\\), not \\(-20\\)."}, {"html": "\\(2I_1 + 4I_2 = 20\\)", "ok": true, "comment": "Right. Going up the left branch you pass the battery from \\(-\\) to \\(+\\), a rise of 20 V, and you travel with \\(I_1\\) through the 2 \\(\\Omega\\) resistor. Going down the middle you also travel with \\(I_2\\), so that drop is positive."}, {"html": "\\(2I_1 - 4I_2 = 20\\)", "ok": false, "comment": "Going down the middle you travel with \\(I_2\\), so that drop is \\(+4I_2\\), the same sign as \\(2I_1\\)."}]}, {"type": "mc", "text": "Travel clockwise around the right loop: down the right branch, then up the middle. Which equation does the Circuit Rule give?", "phase": "Carry out", "answers": [{"html": "\\(2I_3 - 4I_2 = 10\\)", "ok": false, "comment": "Both resistors on this loop are traveled against their currents, so their terms have the same sign. The middle term is \\(+4I_2\\)."}, {"html": "\\(I_3 + 4I_2 = 10\\)", "ok": false, "comment": "A 2 \\(\\Omega\\) resistor drops \\(2I_3\\), not \\(I_3\\). Ohm’s law multiplies the current by the resistance."}, {"html": "\\(2I_3 + 4I_2 = 20\\)", "ok": false, "comment": "The 20 V battery is on the left. This loop has the 10 V battery."}, {"html": "\\(2I_3 + 4I_2 = 10\\)", "ok": true, "comment": "Right. On this loop you travel against \\(I_3\\) and against \\(I_2\\), so both resistor drops are negative: \\(-2I_3 - 4I_2\\). The battery goes from \\(+\\) to \\(-\\), a drop of 10 V, so the equation is \\(-2I_3 - 4I_2 = -10\\), which is \\(2I_3 + 4I_2 = 10\\)."}]}, {"type": "matrix", "text": "Row 1 (the junction) is \\(\\left[\\begin{array}{ccc|c}1&-1&1&0\\end{array}\\right]\\), and row 2 (the left loop) is \\(\\left[\\begin{array}{ccc|c}2&4&0&20\\end{array}\\right]\\). Do the row operation \\(R_2 \\to R_2 - 2R_1\\), and enter the new row 2.", "phase": "Carry out", "comment": "Right. The first entry is \\(2 - 2 \\cdot 1 = 0\\), the middle is \\(4 - 2(-1) = 6\\), the third is \\(0 - 2 \\cdot 1 = -2\\), and the right side is \\(20 - 2 \\cdot 0 = 20\\).", "label": "\\text{new row 2:}", "hints": ["Work out each entry as the entry of row 2 minus 2 times the entry of row 1, one column at a time.", "Watch the signs in row 1. Its middle entry is negative, so think about what subtracting twice that entry does."], "shape": [1, 4], "values": [0.0, 6.0, -2.0, 20.0], "answer_tex": "\\begin{bmatrix}0&6&-2&20\\end{bmatrix}", "typed_answer": ["0", "6", "-2", "20"], "wrong": [{"values": [4.0, 2.0, 2.0, 20.0], "comment": "That adds 2 times row 1 instead of subtracting it. The first entry becomes \\(2 + 2 = 4\\), not 0. To cancel a 2, subtract."}, {"values": [1.0, 5.0, -1.0, 20.0], "comment": "The multiplier has to match the entry you want to cancel. Row 2 has a 2 in the first column, so you need 2 times row 1. With 1 times row 1, the first entry is \\(2 - 1 = 1\\)."}, {"values": [0.0, 2.0, -2.0, 18.0], "comment": "You subtracted 2 from each entry of row 2. The operation subtracts 2 times each entry of row 1, so the middle entry is \\(4 - 2(-1) = 6\\)."}, {"values": [0.0, 6.0, 2.0, 20.0], "comment": "The third entry is \\(0 - 2 \\cdot 1 = -2\\). Subtracting a positive number gives a negative result."}]}, {"type": "num", "text": "What is \\(I_2\\), in amperes? (Type a number.)", "phase": "Carry out", "comment": "Right. Adding \\(6I_2 - 2I_3 = 20\\) and \\(4I_2 + 2I_3 = 10\\) removes \\(I_3\\), leaving \\(10I_2 = 30\\), so \\(I_2 = 3\\) A.", "hints": ["Add the new row 2 and row 3. Which variable drops out of the sum?", "Adding the left sides leaves only \\(I_2\\). Add the right sides too, then divide."], "shape": [1, 1], "values": [3.0], "answer_tex": "3", "typed_answer": ["3"], "wrong": [{"values": [1.0], "comment": "You added the left sides but subtracted the right sides. Both sides get added."}, {"values": [5.0], "comment": "You divided by 6, the \\(I_2\\) coefficient in row 2 alone. After you add the rows, the coefficient of \\(I_2\\) changes."}]}, {"type": "num", "text": "What is \\(I_3\\), in amperes? (Type a number.)", "phase": "Carry out", "comment": "Right. With \\(I_2 = 3\\), row 3 reads \\(12 + 2I_3 = 10\\), so \\(2I_3 = -2\\) and \\(I_3 = -1\\) A.", "hints": ["Use row 3, \\(4I_2 + 2I_3 = 10\\), with your value of \\(I_2\\) in it.", "Multiply the 4 by \\(I_2\\) first, then move that product to the right side."], "shape": [1, 1], "values": [-1.0], "answer_tex": "-1", "typed_answer": ["-1"], "wrong": [{"values": [1.0], "comment": "Sign slip: with \\(I_2 = 3\\), row 3 reads \\(12 + 2I_3 = 10\\). Putting a minus sign on the \\(2I_3\\) term gives \\(12 - 2I_3 = 10\\), so \\(I_3 = 1\\)."}, {"values": [3.5], "comment": "You used \\(I_2 = 3\\) but left out the 4 in front of it. Keep the coefficient: \\(4 \\cdot 3 = 12\\)."}]}, {"type": "num", "text": "What is \\(I_1\\), in amperes? (Type a number.)", "phase": "Carry out", "comment": "Right. The junction rule gives \\(I_1 = I_2 - I_3 = 3 - (-1) = 4\\) A.", "hints": ["Use the junction rule, \\(I_1 + I_3 = I_2\\), and solve it for \\(I_1\\).", "Put in your value of \\(I_3\\) with its sign. Subtracting a negative number adds."], "shape": [1, 1], "values": [4.0], "answer_tex": "4", "typed_answer": ["4"], "wrong": [{"values": [2.0], "comment": "Sign slip in the junction rule: \\(I_1 = I_2 + I_3\\) gives \\(3 + (-1) = 2\\). Since \\(I_3\\) flows into \\(A\\), it is subtracted: \\(I_1 = I_2 - I_3\\)."}, {"values": [16.0], "comment": "Sign slip in the left loop: \\(2I_1 - 4I_2 = 20\\) gives \\(I_1 = 16\\). Going down the middle you travel with \\(I_2\\), so that term is \\(+4I_2\\)."}]}, {"type": "text", "text": "<p><strong>Checkpoint.<\/strong> The answer is \\(I_1 = 4\\) A, \\(I_2 = 3\\) A, and \\(I_3 = -1\\) A.<\/p><p>Last phase: <strong>look back<\/strong>. Check the answer in a loop you haven’t used yet, then ask what the answer says about the circuit.<\/p>", "phase": "Look back", "cta": "Got it. On to Phase 4: Look back."}, {"type": "mc", "text": "Travel clockwise around the outer loop, through both batteries and both 2 \\(\\Omega\\) resistors. Does the answer satisfy the Circuit Rule for this loop?", "phase": "Look back", "answers": [{"html": "No. The right-hand resistor adds, giving \\(2I_1 + 2I_3 = 10\\), and \\(8 + (-2) = 6\\), not 10.", "ok": false, "comment": "The right-hand resistor’s current runs against this loop, so its drop is \\(-2I_3\\), not \\(+2I_3\\)."}, {"html": "Yes. The batteries oppose each other around this loop, so \\(20 - 10 = 10\\), and \\(2(4) - 2(-1) = 10\\) as well.", "ok": true, "comment": "Right. The rises net to 10 around this loop, and the answer gives 10 too. This loop skips the 4 \\(\\Omega\\) resistor, so it checks the answer from a different angle."}, {"html": "No. The batteries add around this loop, so the right side should be 30, and the answer gives 10.", "ok": false, "comment": "The batteries don’t add here. Going around this loop, one battery is passed from \\(-\\) to \\(+\\) and the other from \\(+\\) to \\(-\\), so they oppose each other."}, {"html": "Yes. Once the junction rule holds, every loop equation holds automatically.", "ok": false, "comment": "The answer is yes, but not for that reason: the junction rule alone doesn’t make a loop work. The outer loop checks out because the currents solve both inner loops, and the outer loop is what you get by combining them."}]}, {"type": "mc", "text": "The answer gives \\(I_3 = -1\\) A. What does that tell you about the right branch?", "phase": "Look back", "answers": [{"html": "The answer must be wrong, since a current can’t be negative. Flip the sign to get \\(I_3 = 1\\).", "ok": false, "comment": "Currents can be negative here. Flipping the sign breaks the Junction Rule, because \\(4 + 1 \\neq 3\\)."}, {"html": "The 10 V battery is pushing 1 A upward through the right branch.", "ok": false, "comment": "The 10 V battery does push upward, but the current from the 20 V battery reaches junction \\(A\\) and overpowers it. The net flow is 1 A downward."}, {"html": "1 A flows downward through the right branch, against the arrow for \\(I_3\\).", "ok": true, "comment": "Right. A negative current means the flow runs opposite to the arrow we drew, as in Example 1.5.1. The 20 V battery pushes 1 A backward through the 10 V battery."}, {"html": "The right branch carries no current, because the two batteries cancel out.", "ok": false, "comment": "Batteries in different branches don’t cancel each other. The right branch still carries 1 A, flowing downward."}]}, {"type": "error", "text": "A classmate solved this circuit and wrote three equations, one per line. Click the first line that is wrong. Your answer can help: plug it into each line.", "phase": "Look back", "lines": [{"html": "Junction at \\(A\\): \\(I_1 + I_3 = I_2\\)", "wrong": false, "comment": "Both \\(I_1\\) and \\(I_3\\) flow into \\(A\\), and \\(I_2\\) flows out, so in equals out."}, {"html": "Left loop: \\(2I_1 + 4I_2 = 20\\)", "wrong": false, "comment": "Both resistor drops run with their currents, and the 20 V battery is a rise, since you pass it from \\(-\\) to \\(+\\)."}, {"html": "Right loop: \\(2I_3 + 4I_2 = -10\\)", "wrong": true, "comment": "Right. This loop runs against both \\(I_3\\) and \\(I_2\\), so both resistor drops are negative. The classmate kept them positive, and the 10 V battery is fine."}]}, {"type": "example", "text": "Now make one yourself. Enter battery voltages \\(E_1\\) for the left battery (the top entry) and \\(E_2\\) for the right battery (the bottom entry), in volts, so that no current flows through the middle 4 \\(\\Omega\\) resistor, the one both loops share. Keep the two 2 \\(\\Omega\\) resistors as they are. A negative voltage means that battery is turned around.", "phase": "Look back", "shape": [2, 1], "conditions": [{"js": "!M[0][0].isZero() && !M[1][0].isZero()", "comment": "Use a voltage other than 0 for both batteries. A battery at 0 V is missing from the circuit."}, {"js": "M[0][0].add(M[1][0]).isZero()", "comment": "Not quite. With these voltages some current still flows through the middle resistor. Work out \\(I_2\\) in terms of \\(E_1\\) and \\(E_2\\)."}], "comment": "Right. The two batteries cancel in the middle: \\(I_2 = (E_1 + E_2)/10\\), which is 0 when \\(E_1 + E_2 = 0\\).", "model": "\\(E_1 = 20\\) V and \\(E_2 = -20\\) V, the right battery turned around. Then \\(I_1 = 10\\) A, \\(I_2 = 0\\), and \\(I_3 = -10\\) A, so no current crosses the middle resistor.", "label": "\\begin{bmatrix}E_1\\\\E_2\\end{bmatrix} =", "hints": ["Pick \\(E_1\\) first. Then find the \\(E_2\\) that makes the middle current zero.", "Write the three equations with \\(E_1\\) and \\(E_2\\) in place of the numbers, solve for \\(I_2\\), and set it to 0."]}, {"type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate counted junction \\(B\\) as a fourth equation and concluded that four equations for three unknowns means there is no solution. What did they miss? Then name one habit from this problem you want to use on the next circuit.<\/p>", "phase": "Look back"}], "goal": "Find every current in a circuit by turning Kirchhoff’s two laws into a linear system, then read what a negative answer means.", "connects": "Builds on 1.2: the three equations go into an augmented matrix and are reduced the same way. The same bookkeeping, one equation per junction or loop, sets up any network of batteries and resistors.", "discuss": "We picked the arrows before solving, and \\(I_3\\) came out negative. Why does the algebra still find the right currents when a guessed arrow points the wrong way?", "cold": [10, 11, 12], "twins": [{"statement": "Same circuit layout as the figure, with new values: left resistor \\(R_1 = 4\\,\\Omega\\), middle (shared) resistor \\(R_2 = 2\\,\\Omega\\), right resistor \\(R_3 = 5\\,\\Omega\\), left battery \\(E_1 = 26\\) V and right battery \\(E_2 = 15\\) V, each with its positive plate up. Find \\(I_1, I_2, I_3\\), in amperes, with the arrows in the same directions as in the figure.", "steps": [{"type": "matrix", "text": "Find \\(I_1, I_2, I_3\\), in amperes. Enter them as a column, with \\(I_1\\) on top.", "comment": "Right. \\(I_1 = 4\\), \\(I_2 = 5\\), and \\(I_3 = 1\\) A. The junction rule and both loops hold with these values.", "label": "\\begin{bmatrix}I_1\\\\I_2\\\\I_3\\end{bmatrix} =", "hints": ["Write the junction rule, then the left and right loops, with the same signs as in the original problem.", "Solve the three equations together. Row reduction works, and so does substitution."], "shape": [3, 1], "values": [4.0, 5.0, 1.0], "answer_tex": "\\begin{bmatrix}4\\\\5\\\\1\\
