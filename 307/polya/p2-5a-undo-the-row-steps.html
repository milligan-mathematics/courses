<script>window.POLYA = {"slug": "p2-5a-undo-the-row-steps", "title": "2.5 Problem A: Undo the row steps", "statement": "Let \\(A = \\begin{bmatrix}1 & 2 \\\\ 3 & 8\\end{bmatrix}\\). The matrix \\(A\\) is invertible. Write \\(A\\) as a product of elementary matrices.", "questions": [{"phase": "Understand", "type": "write", "text": "In your own words, what is this problem asking for?", "model": "<p>It gives an invertible matrix \\(A\\) and asks me to write \\(A\\) as a product of elementary matrices. Row operations take \\(A\\) to \\(I\\), and each operation corresponds to an elementary matrix. Undoing those operations, in the right order, builds \\(A\\) back up from \\(I\\). So the factors I need are the inverses of those matrices, multiplied in the right order.<\/p>"}, {"phase": "Understand", "type": "mc", "text": "What would a finished answer look like?", "answers": [{"html": "One elementary matrix \\(E\\) with \\(EA = I\\).", "ok": false, "comment": "That would mean one row operation turns \\(A\\) into \\(I\\). \\(A\\) needs more than one step, so one elementary matrix is not enough."}, {"html": "A list of elementary matrices whose product is \\(I\\).", "ok": false, "comment": "That product would be \\(I\\), not \\(A\\). We need the factors to multiply to \\(A\\) itself."}, {"html": "A list of elementary matrices whose product, in the right order, is \\(A\\).", "ok": true, "comment": "Right. The factors multiply to \\(A\\) itself. Order matters: the same matrices multiplied in another order can give a different matrix."}, {"html": "A list of elementary matrices whose product is \\(A^{-1}\\).", "ok": false, "comment": "That is a product for \\(A^{-1}\\), not for \\(A\\). The problem asks for \\(A\\) itself."}]}, {"phase": "Understand", "type": "mc", "text": "Recall that an elementary matrix is one obtained from \\(I\\) by a single row operation: swap two rows, multiply a row by a nonzero number, or add a multiple of one row to another. Which of these is elementary?", "answers": [{"html": "\\(\\begin{bmatrix}1 & 0 \\\\ 3 & 1\\end{bmatrix}\\)", "ok": true, "comment": "Right. Start from \\(I\\) and add \\(3\\) times row 1 to row 2. One row operation gives this matrix."}, {"html": "\\(\\begin{bmatrix}2 & 0 \\\\ 0 & 2\\end{bmatrix}\\)", "ok": false, "comment": "This multiplies both rows of \\(I\\) by \\(2\\). That takes two row operations, and an elementary matrix comes from just one."}, {"html": "\\(\\begin{bmatrix}2 & 1 \\\\ 1 & 1\\end{bmatrix}\\)", "ok": false, "comment": "This matrix is invertible, but no single row operation turns \\(I\\) into it. Invertible and elementary are not the same thing."}, {"html": "\\(\\begin{bmatrix}0 & 0 \\\\ 0 & 1\\end{bmatrix}\\)", "ok": false, "comment": "This would come from multiplying row 1 by \\(0\\). A row operation has to multiply by a nonzero number."}]}, {"phase": "Plan", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> We want \\(A\\) written as a product of elementary matrices. Row operations take \\(A\\) to \\(I\\), one elementary matrix per step, with each step multiplying \\(A\\) on the left. Each step can be undone by an inverse operation.<\/p><p>Next phase: <strong>make a plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 2: Plan."}, {"phase": "Plan", "type": "multi", "text": "Which of these plans would write \\(A\\) as a product of elementary matrices? Select all that apply.", "answers": [{"html": "Row-reduce \\(A\\) to \\(I\\), then write \\(A = E_k\\cdots E_1\\), the same steps multiplied in reverse order, without inverting them.", "ok": false, "comment": "Not quite. \\(E_k\\cdots E_1A = I\\), so \\(E_k\\cdots E_1\\) is \\(A^{-1}\\), not \\(A\\). Each step has to be inverted before the product gives \\(A\\)."}, {"html": "Start with \\(I\\), and undo the steps in the order they were done, beginning with the first step.", "ok": false, "comment": "The order is off. Undoing step 1 first gives \\(E_3^{-1}E_2^{-1}E_1^{-1}\\) for this problem, and that is not \\(A\\). Undo the last step first."}, {"html": "Row-reduce \\(A\\) to \\(I\\), and record each step as an elementary matrix \\(E_1, E_2, \\dots, E_k\\). Then \\(A = E_1^{-1}E_2^{-1}\\cdots E_k^{-1}\\), with the inverses in the order the steps were done.", "ok": true, "comment": "This is the method of Example 2.5.3 in the notes. By Theorem 2.5.1, the steps give \\(E_k\\cdots E_1A = I\\), so \\(A = (E_k\\cdots E_1)^{-1} = E_1^{-1}\\cdots E_k^{-1}\\). Inverting a product reverses its order and inverts each factor."}, {"html": "Start with \\(I\\), and undo the steps one at a time, beginning with the last one. Each undo is a row operation applied to what you have. The result is \\(A\\).", "ok": true, "comment": "This works too, and it is a different way to see the same answer. Undoing the last step first puts its inverse on the right, so the undo of step 1 ends up on the left. The product is \\(E_1^{-1}\\cdots E_k^{-1}\\)."}]}, {"phase": "Carry out", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The plan: row-reduce \\(A\\) to \\(I\\), find the inverse of each step, and multiply those inverses in the order the steps were done. We start with step 1.<\/p><p>Next phase: <strong>carry out the plan<\/strong>.<\/p>", "cta": "Got it. On to Phase 3: Carry out."}, {"phase": "Carry out", "type": "mc", "text": "Step 1 is the first row operation that clears the \\((2,1)\\) entry of \\(A\\). Let \\(E_1\\) be its elementary matrix. What is \\(E_1^{-1}\\)?", "answers": [{"html": "\\(\\begin{bmatrix}1 & 0 \\\\ -3 & 1\\end{bmatrix}\\)", "ok": false, "comment": "That is \\(E_1\\) itself, the step. The question asks for its inverse, which undoes the step."}, {"html": "\\(\\begin{bmatrix}1 & 0 \\\\ 3 & 1\\end{bmatrix}\\)", "ok": true, "comment": "Right. Step 1 subtracts \\(3\\) times row 1 from row 2, so its inverse adds \\(3\\) times row 1 back to row 2."}, {"html": "\\(\\begin{bmatrix}1 & 3 \\\\ 0 & 1\\end{bmatrix}\\)", "ok": false, "comment": "That matrix changes row 1, by adding \\(3\\) times row 2. Step 1 changes row 2, using row 1."}, {"html": "\\(\\begin{bmatrix}1 & 0 \\\\ \\tfrac{1}{3} & 1\\end{bmatrix}\\)", "ok": false, "comment": "The inverse of adding a multiple of one row is adding the opposite multiple, here \\(+3\\), not \\(\\tfrac13\\). Reciprocals belong to scaling a row."}]}, {"phase": "Carry out", "type": "mc", "text": "After step 1, \\(A\\) has become \\(\\begin{bmatrix}1 & 2 \\\\ 0 & 2\\end{bmatrix}\\). Step 2 makes the \\((2,2)\\) entry \\(1\\). Let \\(E_2\\) be its elementary matrix. What is \\(E_2^{-1}\\)?", "answers": [{"html": "\\(\\begin{bmatrix}2 & 0 \\\\ 0 & 1\\end{bmatrix}\\)", "ok": false, "comment": "That multiplies row 1 by \\(2\\). Step 2 works on row 2."}, {"html": "\\(\\begin{bmatrix}1 & 0 \\\\ 0 & -2\\end{bmatrix}\\)", "ok": false, "comment": "Undoing a division by \\(2\\) is multiplying by \\(2\\). A minus sign would flip row 2, which the step never did."}, {"html": "\\(\\begin{bmatrix}1 & 0 \\\\ 0 & \\tfrac{1}{2}\\end{bmatrix}\\)", "ok": false, "comment": "That is \\(E_2\\) itself, the step that divides row 2 by \\(2\\). The question asks for the inverse."}, {"html": "\\(\\begin{bmatrix}1 & 0 \\\\ 0 & 2\\end{bmatrix}\\)", "ok": true, "comment": "Right. Step 2 divides row 2 by \\(2\\), so its inverse multiplies row 2 by \\(2\\)."}]}, {"phase": "Carry out", "type": "mc", "text": "Step 3 finishes the reduction to \\(I\\). Which product of the inverses of steps 1, 2, and 3 equals \\(A\\)?", "answers": [{"html": "\\(\\begin{bmatrix}1 & 0 \\\\ 3 & 1\\end{bmatrix}\\begin{bmatrix}1 & 0 \\\\ 0 & 2\\end{bmatrix}\\begin{bmatrix}1 & -2 \\\\ 0 & 1\\end{bmatrix}\\)", "ok": false, "comment": "The last factor is still step 3 itself. Its inverse adds \\(2\\) times row 2 to row 1, so that sign has to change."}, {"html": "\\(\\begin{bmatrix}1 & 2 \\\\ 0 & 1\\end{bmatrix}\\begin{bmatrix}1 & 0 \\\\ 0 & 2\\end{bmatrix}\\begin{bmatrix}1 & 0 \\\\ 3 & 1\\end{bmatrix}\\)", "ok": false, "comment": "The factors are in reverse order. Step 1 was done first, so its inverse belongs on the left."}, {"html": "\\(\\begin{bmatrix}1 & 0 \\\\ 3 & 1\\end{bmatrix}\\begin{bmatrix}1 & 0 \\\\ 0 & 2\\end{bmatrix}\\begin{bmatrix}1 & 2 \\\\ 0 & 1\\end{bmatrix}\\)", "ok": true, "comment": "Right. Each step is undone by its inverse, and the inverses are multiplied in the order the steps were done, so step 1’s inverse is on the left."}, {"html": "\\(\\begin{bmatrix}1 & -2 \\\\ 0 & 1\\end{bmatrix}\\begin{bmatrix}1 & 0 \\\\ 0 & \\tfrac{1}{2}\\end{bmatrix}\\begin{bmatrix}1 & 0 \\\\ -3 & 1\\end{bmatrix}\\)", "ok": false, "comment": "These are the steps themselves, in reverse order, not their inverses. Their product is \\(A^{-1}\\), not \\(A\\)."}]}, {"phase": "Look back", "type": "text", "text": "<p><strong>Checkpoint.<\/strong> The answer is \\(A = \\begin{bmatrix}1 & 0 \\\\ 3 & 1\\end{bmatrix}\\begin{bmatrix}1 & 0 \\\\ 0 & 2\\end{bmatrix}\\begin{bmatrix}1 & 2 \\\\ 0 & 1\\end{bmatrix}\\).<\/p><p>Last phase: <strong>look back<\/strong>. Multiply the three factors back together to check the answer.<\/p>", "cta": "Got it. On to Phase 4: Look back."}, {"phase": "Look back", "type": "mc", "text": "Multiply the three factors from your answer, in the order you wrote them. Which result confirms the answer?", "answers": [{"html": "\\(\\begin{bmatrix}1 & 0 \\\\ 0 & 1\\end{bmatrix}\\)", "ok": false, "comment": "The reduction takes \\(A\\) to \\(I\\), but multiplying these factors does not cancel \\(A\\). They build \\(A\\) up from \\(I\\)."}, {"html": "\\(\\begin{bmatrix}4 & -1 \\\\ -\\tfrac{3}{2} & \\tfrac{1}{2}\\end{bmatrix}\\)", "ok": false, "comment": "That is \\(A^{-1}\\). The inverses of the steps multiply to \\(A\\), not to its inverse."}, {"html": "\\(\\begin{bmatrix}1 & 2 \\\\ 3 & 8\\end{bmatrix}\\)", "ok": true, "comment": "Right. Multiplying the factors back gives \\(A\\) exactly, so the factorization checks out."}]}, {"phase": "Look back", "type": "mc", "text": "Vary the problem. Suppose you want \\(A^{-1}\\) instead of \\(A\\). Using the three steps themselves, with no inverses, which product gives \\(A^{-1}\\)?", "answers": [{"html": "\\(\\begin{bmatrix}1 & -2 \\\\ 0 & 1\\end{bmatrix}\\begin{bmatrix}1 & 0 \\\\ 0 & \\tfrac{1}{2}\\end{bmatrix}\\begin{bmatrix}1 & 0 \\\\ -3 & 1\\end{bmatrix}\\)", "ok": true, "comment": "Right. Since \\(E_3E_2E_1A = I\\), the product \\(E_3E_2E_1\\) is \\(A^{-1}\\). No inverses are needed for \\(A^{-1}\\)."}, {"html": "\\(\\begin{bmatrix}1 & 0 \\\\ -3 & 1\\end{bmatrix}\\begin{bmatrix}1 & 0 \\\\ 0 & \\tfrac{1}{2}\\end{bmatrix}\\begin{bmatrix}1 & -2 \\\\ 0 & 1\\end{bmatrix}\\)", "ok": false, "comment": "Those are the steps in the order they were done, which reverses the product. For \\(A^{-1}\\), the last step goes on the left."}, {"html": "\\(\\begin{bmatrix}1 & 0 \\\\ 3 & 1\\end{bmatrix}\\begin{bmatrix}1 & 0 \\\\ 0 & 2\\end{bmatrix}\\begin{bmatrix}1 & 2 \\\\ 0 & 1\\end{bmatrix}\\)", "ok": false, "comment": "That product is \\(A\\), not \\(A^{-1}\\). Inverting each step gives the factorization of \\(A\\)."}]}, {"phase": "Look back", "type": "essay", "text": "<p><strong>Reflect<\/strong> (1&ndash;3 sentences; full credit for a genuine answer). A classmate row-reduced \\(A\\) to \\(I\\) correctly and inverted each step, but multiplied the inverses in the reverse of the order the steps were done. What did they get wrong, and what habit from this problem would prevent it next time?<\/p>"}]};</script>
